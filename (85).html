<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"Comic Sans MS","Segoe UI",Verdana,sans-serif;
    background:linear-gradient(180deg,#fff8e0 0%,#fff0d0 100%);
    color:#4a3a2a;min-height:100vh;padding:16px 12px 50px;
  }
  .wrap{max-width:760px;margin:0 auto}

  /* ---------- СТЕНД ВЫСТАВКИ ---------- */
  .topbar{
    background:#8a5ac0;border-radius:14px;padding:16px 16px 18px;
    border:4px solid #6a3aa0;box-shadow:0 6px 0 rgba(106,58,160,.4);
    margin-bottom:20px;color:#fff;
  }
  .topbar h1{
    font-size:clamp(1.1rem,4vw,1.5rem);text-align:center;line-height:1.3;color:#fff;
    text-shadow:0 2px 0 #6a3aa0;
  }
  .topbar h1::before{content:'🎪 ';}
  .bar-wrap{margin-top:14px}
  .bar-label{
    display:flex;justify-content:space-between;align-items:center;
    font-size:.8rem;color:#e0d0f0;margin-bottom:6px;font-weight:700;letter-spacing:.4px;
  }
  /* стенд с витринами */
  .bar-track{
    height:28px;background:#d0b0f0;border-radius:6px;overflow:hidden;
    border:3px solid #8a5ac0;position:relative;
    background-image:repeating-linear-gradient(90deg, #8a5ac0 0 3px, transparent 3px 40px);
  }
  .bar-fill{
    height:100%;width:0%;
    background:linear-gradient(180deg, rgba(255,207,77,.9), rgba(255,159,67,.9));
    transition:width .5s cubic-bezier(.34,1.4,.64,1);
  }
  .bar-runner{
    position:absolute;top:-8px;left:0;font-size:1.5rem;
    transform:translateX(-50%);transition:left .5s cubic-bezier(.34,1.4,.64,1);
    filter:drop-shadow(0 2px 1px rgba(0,0,0,.3));
  }
  .stars{margin-top:9px;text-align:center;font-size:1.05rem;letter-spacing:3px;color:#ffcf4d}

  /* ---------- ВИТРИНА ---------- */
  .stage{
    background:#fff;border-radius:14px;padding:28px 18px 26px;
    border:3px solid #8a5ac0;box-shadow:0 6px 0 rgba(138,90,192,.4);
    animation:pop .35s ease;position:relative;
  }
  .stage::before{
    content:'';position:absolute;top:0;left:0;right:0;height:10px;
    background:linear-gradient(90deg, #8a5ac0 0%, #c0a0e0 50%, #8a5ac0 100%);
    border-radius:14px 14px 0 0;
  }
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .stage.shake{animation:shake .45s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-9px)}40%{transform:translateX(9px)}
    60%{transform:translateX(-6px)}80%{transform:translateX(6px)}
  }
  .step-tag{
    display:inline-block;background:#8a5ac0;color:#fff;
    font-size:.76rem;font-weight:700;padding:4px 14px;border-radius:999px;
    letter-spacing:.5px;margin-bottom:12px;
  }
  .mech-tag{
    display:inline-block;background:#fff8e0;color:#c06a10;
    font-size:.72rem;font-weight:700;padding:3px 11px;border-radius:999px;
    border:2px solid #ff9f43;margin-left:6px;margin-bottom:12px;letter-spacing:.3px;
  }
  .hero{font-size:3.1rem;text-align:center;display:block;margin:2px 0 10px;line-height:1.15}
  .stage h2{font-size:clamp(1.05rem,3.8vw,1.4rem);color:#6a3aa0;text-align:center;margin-bottom:10px;line-height:1.35}
  .task-text{font-size:1rem;line-height:1.6;color:#4a3a5a;text-align:center;margin-bottom:16px}
  .en-inline{font-weight:700;color:#6a3aa0}

  .speak-line{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0 18px}
  .speak-big{
    background:#8a5ac0;color:#fff;border:none;border-radius:999px;
    padding:12px 22px;font-size:1.02rem;font-weight:700;cursor:pointer;
    font-family:inherit;box-shadow:0 4px 0 #6a3aa0;transition:.15s;
    display:inline-flex;align-items:center;gap:9px;
  }
  .speak-big:hover{background:#7a4ab0;transform:translateY(-2px)}
  .speak-big:active{transform:translateY(1px);box-shadow:0 2px 0 #6a3aa0}
  .speak-mini{
    width:36px;height:24px;border-radius:6px;border:2px solid #8a5ac0;cursor:pointer;
    font-size:.7rem;font-weight:700;color:#8a5ac0;background:#fff8e0;
    box-shadow:0 2px 0 #6a3aa0;transition:.15s;
    display:inline-flex;align-items:center;justify-content:center;gap:3px;flex:0 0 auto;
  }
  .speak-mini::before{content:'🔊';}
  .speak-mini:hover{background:#ffefc0;transform:scale(1.05) rotate(-3deg)}
  .speak-mini:active{transform:scale(.95)}

  .opts{display:flex;flex-direction:column;gap:11px;margin-top:6px}
  .opts.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
  .opt{
    background:#fff;border:3px solid #e0d0f0;border-left:8px solid #8a5ac0;border-radius:12px;
    padding:13px 14px;cursor:pointer;font-family:inherit;font-size:1.02rem;
    color:#4a3a5a;text-align:left;display:flex;align-items:center;gap:10px;
    transition:.16s;font-weight:600;line-height:1.35;
  }
  .opt:hover{border-color:#8a5ac0;background:#f8f0ff;transform:translateX(3px)}
  .opt .mark{
    flex:0 0 30px;height:30px;border-radius:50%;background:#f4eaff;color:#8a5ac0;
    border:2px solid #8a5ac0;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem;
  }
  .opt.correct{background:#eafff0;border-color:#4ec97a;border-left-color:#4ec97a;animation:bounce .45s}
  .opt.wrong{background:#fff0f0;border-color:#f28b8b;border-left-color:#f28b8b;animation:shake .4s}
  @keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  .opt:disabled{cursor:default}

  .countbox{
    background:#fff8e0;border:3px dashed #ff9f43;border-radius:14px;
    padding:18px 12px;text-align:center;margin-bottom:16px;
  }
  .countbox .items{font-size:2.4rem;letter-spacing:7px;line-height:1.5;word-break:break-word}

  .match-area{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
  .mcol{display:flex;flex-direction:column;gap:10px}
  .mcol h4{text-align:center;font-size:.82rem;color:#7a6a8a;font-weight:700;margin-bottom:2px;letter-spacing:.5px}
  .mitem{
    background:#fff;border:3px solid #e0d0f0;border-radius:12px;padding:11px 8px;
    cursor:pointer;font-family:inherit;font-size:1rem;font-weight:700;color:#4a3a5a;
    text-align:center;transition:.16s;display:flex;align-items:center;justify-content:center;gap:7px;
    min-height:56px;
  }
  .mitem:hover{border-color:#8a5ac0;background:#f8f0ff}
  .mitem.sel{border-color:#8a5ac0;background:#f8f0ff;box-shadow:0 0 0 3px rgba(138,90,192,.25)}
  .mitem.done{background:#eafff0;border-color:#4ec97a;color:#1f6b41;cursor:default;opacity:.85}
  .mitem.bad{animation:shake .4s;border-color:#f28b8b;background:#fff0f0}
  .mitem .pic{font-size:1.7rem}

  .order-pool,.order-slots{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
  .order-slots{
    min-height:66px;background:#fff8e0;border:3px dashed #ff9f43;border-radius:14px;
    padding:11px 9px;margin-bottom:16px;align-items:center;
  }
  .order-slots.empty-pool::after{content:'нажимайте на витрины ниже ⬇️';color:#b09080;font-size:.88rem}
  .otile{
    background:#fff;border:3px solid #ff9f43;border-radius:12px;padding:10px 13px;
    cursor:pointer;font-family:inherit;font-size:.98rem;font-weight:700;color:#c06a10;
    transition:.15s;display:flex;align-items:center;gap:7px;box-shadow:0 3px 0 #a05a20;
  }
  .otile:hover{transform:translateY(-2px);background:#fff8e0}
  .otile.placed{border-color:#4ec97a;background:#eafff0;color:#1f6b41;box-shadow:0 3px 0 #35a85f}
  .otile.bad{animation:shake .4s;border-color:#f28b8b;background:#fff0f0}
  .otile.used{opacity:.3;pointer-events:none}
  .otile .num{font-size:1.4rem}

  .fb{
    margin-top:16px;padding:14px 16px;border-radius:12px;font-size:1rem;
    line-height:1.55;text-align:center;display:none;font-weight:600;
  }
  .fb.show{display:block;animation:pop .3s}
  .fb.good{background:#eafff0;border:3px solid #4ec97a;color:#256b3d}
  .fb.bad{background:#fff4f4;border:3px solid #f2b0b0;color:#9c3b3b}
  .fb .again{
    margin-top:10px;background:#fff;border:2px solid #f2b0b0;color:#9c3b3b;
    border-radius:999px;padding:7px 16px;font-family:inherit;font-weight:700;
    font-size:.9rem;cursor:pointer;
  }
  .fb .again:hover{background:#ffeaea}

  .nav{display:flex;gap:11px;justify-content:center;margin-top:20px;flex-wrap:wrap}
  .nav button{
    border:none;border-radius:999px;padding:13px 26px;font-family:inherit;
    font-size:1.02rem;font-weight:700;cursor:pointer;transition:.16s;
    display:inline-flex;align-items:center;gap:8px;
  }
  .btn-next{background:#8a5ac0;color:#fff;box-shadow:0 5px 0 #6a3aa0}
  .btn-next:hover{background:#7a4ab0;transform:translateY(-2px)}
  .btn-back{background:#fff;color:#8a5ac0;border:3px solid #e0d0f0 !important;box-shadow:0 5px 0 #e0d0f0}
  .btn-back:hover{background:#f8f0ff}
  .btn-back:disabled,.btn-next:disabled{opacity:.4;cursor:default;transform:none}
  .btn-replay{background:#ff9f43;color:#fff;box-shadow:0 5px 0 #c06a10}
  .btn-replay:hover{background:#ff8f33}

  .final{text-align:center}
  .final .big{font-size:4.2rem;display:block;margin-bottom:12px;animation:float 2.4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
  .final h2{font-size:clamp(1.25rem,4.5vw,1.8rem);color:#8a5ac0;margin-bottom:12px}
  .final p{font-size:1.02rem;line-height:1.65;color:#4a3a5a;margin-bottom:12px}
  .reward{
    background:#fff8e0;border:3px dashed #ff9f43;border-radius:14px;padding:18px 16px;margin:18px 0;
  }
  .reward .words{font-size:1.02rem;line-height:1.85;color:#6a5a3a;text-align:left}
  .reward .words b{color:#c06a10}
  .restart{background:#8a5ac0;color:#fff;box-shadow:0 5px 0 #6a3aa0}
  .restart:hover{background:#7a4ab0}

  .start-screen{text-align:center}
  .start-screen .cast{font-size:2.6rem;letter-spacing:6px;margin:14px 0 6px}
  .start-screen ul{
    list-style:none;text-align:left;margin:16px auto;max-width:430px;
    background:#f8f0ff;border:3px dashed #c0a0e0;border-radius:14px;padding:16px 18px;
  }
  .start-screen li{
    padding:7px 0 7px 30px;position:relative;font-size:.97rem;color:#4a3a5a;line-height:1.45;
    border-bottom:1px dotted #c0a0e0;
  }
  .start-screen li:last-child{border-bottom:none}
  .start-screen li::before{content:'🎪';position:absolute;left:0;top:7px;font-size:.95rem}
  .sound-note{
    background:#fff8e0;border:2px solid #ff9f43;border-radius:12px;padding:11px 14px;
    font-size:.88rem;color:#c06a10;margin-top:14px;line-height:1.5;
  }

  @media (max-width:520px){
    .match-area{grid-template-columns:1fr 1fr;gap:8px}
    .mitem{font-size:.88rem;min-height:50px;padding:9px 5px}
    .mitem .pic{font-size:1.4rem}
    .countbox .items{font-size:1.9rem;letter-spacing:4px}
    .hero{font-size:2.6rem}
    .nav button{padding:12px 19px;font-size:.95rem}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <h1>Выставка достижений</h1>
    <div class="bar-wrap">
      <div class="bar-label">
        <span id="stepLabel">Витрина 0 из 14</span>
        <span id="pctLabel">0%</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="barFill"></div>
        <div class="bar-runner" id="barRunner">🚶</div>
      </div>
      <div class="stars" id="stars"></div>
    </div>
  </div>

  <div id="stageHost"></div>

</div>

<script>
(function(){
  "use strict";

  var RATE = 0.85;
  var voices = [];

  function loadVoices(){
    if(!('speechSynthesis' in window)) return;
    voices = window.speechSynthesis.getVoices() || [];
  }
  loadVoices();
  if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = loadVoices;
    setTimeout(loadVoices, 350);
    setTimeout(loadVoices, 1400);
  }

  function pickVoice(){
    if(!voices.length) loadVoices();
    var v;
    v = voices.find(function(x){ return x.lang === 'en-GB'; });
    if(v) return v;
    v = voices.find(function(x){ return x.lang && x.lang.toLowerCase().indexOf('en-gb') === 0; });
    if(v) return v;
    v = voices.find(function(x){ return x.lang === 'en-US'; });
    if(v) return v;
    v = voices.find(function(x){ return x.lang && x.lang.toLowerCase().indexOf('en') === 0; });
    return v || null;
  }

  function speak(text, delay){
    if(!('speechSynthesis' in window)) return;
    var go = function(){
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      var v = pickVoice();
      if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'en-GB'; }
      u.rate = RATE; u.pitch = 1.06; u.volume = 1;
      window.speechSynthesis.speak(u);
    };
    if(delay){ setTimeout(go, delay); } else { go(); }
  }

  function speakSeq(arr){
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    arr.forEach(function(t, i){
      setTimeout(function(){
        var u = new SpeechSynthesisUtterance(t);
        var v = pickVoice();
        if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'en-GB'; }
        u.rate = RATE; u.pitch = 1.06;
        window.speechSynthesis.speak(u);
      }, i * 1500);
    });
  }

  var STEPS = [

  /* 1 */ {
    kind:'intro', emoji:'🎪', mech:'Вход на выставку',
    title:'Выставка достижений',
    text:'Ларри открыл выставку своей коллекции игрушек! Каждый экспонат имеет название, размер и владельца. Ты — почётный гость: осматривай витрины, сравнивай размеры и рассказывай, что есть у тебя и у Ларри.',
    say:"Welcome to the toy exhibition!",
    sayRu:'Добро пожаловать на выставку игрушек!',
    cta:'🎪 Войти на выставку!'
  },

  /* 2 */ {
    kind:'choice', emoji:'✈️', mech:'Выбор ответа',
    title:'Витрина 1: что это?',
    text:'Первый экспонат — нечто с крыльями, что летает по небу. Что это?',
    say:'plane',
    opts:[
      {t:'plane /pleɪn/ — самолёт', say:'plane'},
      {t:'train /treɪn/ — поезд', say:'train'},
      {t:'bus /bʌs/ — автобус', say:'bus'}
    ],
    correct:0,
    ok:'Верно! **plane** /pleɪn/ — самолёт. Первый экспонат осмотрен!',
    no:'Послушай все три слова и выбери подходящее к картинке.'
  },

  /* 3 */ {
    kind:'choice', emoji:'🎁', mech:'Выбор ответа',
    title:'Витрина 2: чей экспонат?',
    text:'Самолёт принадлежит Ларри. Как сказать это по-английски?',
    say:"Larry's got a plane.",
    opts:[
      {t:"Larry's got a plane. /ˈlæriz ɡɒt ə pleɪn/ — у Ларри есть самолёт", say:"Larry's got a plane."},
      {t:"I've got a plane. /aɪv ɡɒt ə pleɪn/ — у меня есть самолёт", say:"I've got a plane."},
      {t:"Larry's got a train. /ˈlæriz ɡɒt ə treɪn/ — у Ларри есть поезд", say:"Larry's got a train."}
    ],
    correct:0,
    ok:'Точно! **Larry\'s got a plane** /ˈlæriz ɡɒt ə pleɪn/ — у Ларри есть самолёт!',
    no:'Самолёт принадлежит ЛАРРИ, значит нужна фраза с Larry\'s got.'
  },

  /* 4 */ {
    kind:'count', emoji:'🚂', mech:'Считаем экспонаты',
    title:'Витрина 3: поезда на полке',
    text:'Посчитай, сколько поездов в коллекции Ларри.',
    ask:'How many trains?',
    items:'🚂🚂🚂',
    say:'How many trains? One, two, three. Three trains!',
    opts:[
      {t:'two /tuː/ — два', say:'two'},
      {t:'three /θriː/ — три', say:'three'},
      {t:'four /fɔː/ — четыре', say:'four'}
    ],
    correct:1,
    ok:'Молодец! **Three trains!** /θriː treɪnz/ — три поезда!',
    no:'Считаем по одному: one, two, three.'
  },

  /* 5 */ {
    kind:'match', emoji:'🎪', mech:'Найди пару',
    title:'Витрина 4: игрушки и слова',
    text:'Соедини слово с игрушкой.',
    say:'plane, train, bus, car, boat',
    pairs:[
      {left:'plane', say:'plane', right:'✈️'},
      {left:'train', say:'train', right:'🚂'},
      {left:'bus', say:'bus', right:'🚌'},
      {left:'car', say:'car', right:'🚗'},
      {left:'boat', say:'boat', right:'🛥️'}
    ],
    ok:'Все игрушки на своих местах: **plane, train, bus, car, boat**!',
    no:'Не та пара. Послушай слово и найди свою игрушку.'

  /* 6 */ {
    kind:'choice', emoji:'📏', mech:'Выбор ответа',
    title:'Витрина 5: какой размер?',
    text:'Этот мяч очень большой. Как сказать это по-английски?',
    say:'This is big.',
    opts:[
      {t:'This is big. /ðɪs ɪz bɪɡ/ — это большое', say:'This is big.'},
      {t:'This is small. /ðɪs ɪz smɔːl/ — это маленькое', say:'This is small.'},
      {t:'This is a ball. /ðɪs ɪz ə bɔːl/ — это мяч', say:'This is a ball.'}
    ],
    correct:0,
    ok:'Правильно! **This is big** /ðɪs ɪz bɪɡ/ — это большое. **big** /bɪɡ/ — большой.',
    no:'Мяч БОЛЬШОЙ, значит нужна фраза с big.'
  },

  /* 7 */ {
    kind:'count', emoji:'⚽', mech:'Считаем экспонаты',
    title:'Витрина 6: мячи в корзине',
    text:'Посчитай мячи разных размеров.',
    ask:'How many balls?',
    items:'⚽⚽⚽⚽⚽',
    say:'How many balls? One, two, three, four, five. Five balls!',
    opts:[
      {t:'four /fɔː/ — четыре', say:'four'},
      {t:'five /faɪv/ — пять', say:'five'},
      {t:'six /sɪks/ — шесть', say:'six'}
    ],
    correct:1,
    ok:'Верно! **Five balls!** /faɪv bɔːlz/ — пять мячей!',
    no:'Считаем по одному: one, two, three, four, five.'
  },

  /* 8 */ {
    kind:'match', emoji:'📏', mech:'Найди пару',
    title:'Витрина 7: размеры',
    text:'Соедини фразу с подходящей картинкой.',
    say:"I've got a big ball, I've got a small car, This is big, This is small",
    pairs:[
      {left:"I've got a big ball", say:"I've got a big ball", right:'⚽'},

  var TOTAL = STEPS.length;
  var idx = 0;
  var history = [];
  var score = 0;
  var stageHost = document.getElementById('stageHost');
  var barFill = document.getElementById('barFill');
  var barRunner = document.getElementById('barRunner');
  var stepLabel = document.getElementById('stepLabel');
  var pctLabel = document.getElementById('pctLabel');
  var starsBox = document.getElementById('stars');

  function bold(str){
    return String(str).replace(/\*\*(.+?)\*\*/g, '<span class="en-inline">$1</span>');
  }

  function updateBar(){
    var pct = Math.round((idx / (TOTAL - 1)) * 100);
    if(pct < 0) pct = 0; if(pct > 100) pct = 100;
    barFill.style.width = pct + '%';
    barRunner.style.left = pct + '%';
    stepLabel.textContent = idx === 0 ? 'Витрина 0 из ' + (TOTAL - 1) : ('Витрина ' + idx + ' из ' + (TOTAL - 1));
    pctLabel.textContent = pct + '%';
    var full = Math.floor(score / 3);
    var s = '';
    for(var i = 0; i < full && i < 6; i++){ s += '⭐'; }
    starsBox.textContent = s;
  }

  function shakeStage(){
    var st = stageHost.querySelector('.stage');
    if(!st) return;
    st.classList.remove('shake');
    void st.offsetWidth;
    st.classList.add('shake');
  }

  function speakerBtn(text, cls, title){
    var b = document.createElement('button');
    b.className = cls || 'speak-mini';
    b.title = title || 'Прослушать';
    b.setAttribute('aria-label','Прослушать: ' + text);
    b.addEventListener('click', function(ev){ ev.stopPropagation(); speak(text); });
    return b;
  }

  function nextBtn(label, fn, cls){
    var b = document.createElement('button');
    b.className = cls || 'btn-next';
    b.textContent = label;
    b.addEventListener('click', fn);
    return b;
  }

  function goNext(){
    if(idx < TOTAL - 1){
      history.push(idx);
      idx++;
      render();
    }
  }
  function goBack(){
    if(history.length){
      idx = history.pop();
      render();
    }
  }

  function render(){
    window.scrollTo({top:0, behavior:'smooth'});
    updateBar();
    stageHost.innerHTML = '';
    var s = STEPS[idx];

    var stage = document.createElement('div');
    stage.className = 'stage';
    stageHost.appendChild(stage);

    if(s.kind === 'intro')   return renderIntro(stage, s);
    if(s.kind === 'final')   return renderFinal(stage, s);
    if(s.kind === 'choice')  return renderChoice(stage, s);
    if(s.kind === 'count')   return renderCount(stage, s);
    if(s.kind === 'match')   return renderMatch(stage, s);
    if(s.kind === 'order')   return renderOrder(stage, s);
  }

  function header(stage, s){
    var tag = document.createElement('span');
    tag.className = 'step-tag';
    tag.textContent = 'ВИТРИНА ' + (idx + 1) + ' / ' + TOTAL;
    stage.appendChild(tag);

    if(s.mech){
      var m = document.createElement('span');
      m.className = 'mech-tag';
      m.textContent = s.mech;
      stage.appendChild(m);
    }
    var hero = document.createElement('span');
    hero.className = 'hero';
    hero.textContent = s.emoji || '🎪';
    stage.appendChild(hero);

    var h2 = document.createElement('h2');
    h2.textContent = s.title;
    stage.appendChild(h2);

    var p = document.createElement('div');
    p.className = 'task-text';
    p.innerHTML = bold(s.text);
    stage.appendChild(p);
  }

  function speakBlock(stage, s){
    if(!s.say) return;
    var line = document.createElement('div');
    line.className = 'speak-line';
    var big = document.createElement('button');
    big.className = 'speak-big';
    big.innerHTML = '🔊 ' + s.say;
    big.addEventListener('click', function(){ speak(s.say); });
    line.appendChild(big);
    stage.appendChild(line);
    if(s.sayRu){
      var r = document.createElement('div');
      r.className = 'task-text';
      r.style.marginTop = '-10px';
      r.textContent = s.sayRu;
      stage.appendChild(r);
    }
  }

  function feedback(stage, s, onWin){
    var fb = document.createElement('div');
    fb.className = 'fb';
    stage.appendChild(fb);

    var nav = document.createElement('div');
    nav.className = 'nav';

    var back = nextBtn('⬅️ Назад', goBack, 'btn-back');
    if(!history.length) back.disabled = true;
    nav.appendChild(back);

    var replay = nextBtn('🔁 Ещё раз', function(){ render(); }, 'btn-replay');
    nav.appendChild(replay);

    var next = nextBtn('Следующая витрина ➡️', goNext);
    next.style.display = 'none';
    nav.appendChild(next);

    stage.appendChild(nav);

    function showGood(){
      fb.className = 'fb good show';
      fb.innerHTML = bold(s.ok || 'Отлично!');
      next.style.display = '';
      speak('Well done!', 250);
      if(onWin) onWin();
    }
    function showBad(){
      fb.className = 'fb bad show';
      fb.innerHTML = bold(s.no || 'Попробуй ещё раз!') +
        '<br><button class="again" type="button">🔁 Попробовать снова</button>';
      var ag = fb.querySelector('.again');
      ag.addEventListener('click', function(){ render(); });
      shakeStage();
      speak('Try again!', 200);
    }
    return {good:showGood, bad:showBad, next:next, back:back};
  }

  function renderIntro(stage, s){
    header(stage, s);
    speakBlock(stage, s);

    var cast = document.createElement('div');
    cast.className = 'start-screen';
    cast.innerHTML = '<div class="cast">🎪 ✈️ 🚂 🚌 🏆</div>';
    stage.appendChild(cast);

    var list = document.createElement('ul');
    ['Называть игрушки: plane, train, bus, car',
     'Сравнивать размеры: big и small',
     'Говорить, что есть у тебя: I\'ve got a big...',
     'Говорить, что есть у Ларри: Larry\'s got a...',
     'Осмотреть все витрины выставки'
    ].forEach(function(t){
      var li = document.createElement('li');
      li.textContent = t;
      list.appendChild(li);
    });
    stage.appendChild(list);

    var note = document.createElement('div');
    note.className = 'sound-note';
    note.innerHTML = '🔈 Включите звук на устройстве. Все фразы озвучены британским голосом и звучат чуть медленнее обычной речи.';
    stage.appendChild(note);

    var nav = document.createElement('div');
    nav.className = 'nav';
    nav.appendChild(nextBtn(s.cta || 'Начать ➡️', goNext));
    stage.appendChild(nav);

    speak(s.say, 500);
  }

  function renderChoice(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score++; updateBar(); });
    speakBlock(stage, s);

    var box = document.createElement('div');
    box.className = 'opts' + (s.opts.length > 3 ? ' grid2' : '');
    var navEl = stage.querySelector('.nav');
    stage.insertBefore(box, navEl);

    var locked = false;
    s.opts.forEach(function(o, i){
      var b = document.createElement('button');
      b.className = 'opt';
      b.type = 'button';
      var mk = document.createElement('span');
      mk.className = 'mark';
      mk.textContent = String.fromCharCode(65 + i);
      b.appendChild(mk);
      var tx = document.createElement('span');
      tx.innerHTML = bold(o.t);
      b.appendChild(tx);
      b.appendChild(speakerBtn(o.say || o.t.replace(/\/.*?\//g,'').replace(/—.*$/,'').trim(), 'speak-mini'));

      b.addEventListener('click', function(){
        if(locked) return;
        if(i === s.correct){
          locked = true;
          b.classList.add('correct');
          Array.prototype.forEach.call(box.children, function(x){ x.disabled = true; });
          speak(o.say || o.t, 120);
          setTimeout(fb.good, 650);
        } else {
          b.classList.add('wrong');
          setTimeout(function(){ b.classList.remove('wrong'); }, 600);
          fb.bad();
        }
      });
      box.appendChild(b);
    });
  }

  function renderCount(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score++; updateBar(); });
    var navEl = stage.querySelector('.nav');

    var cb = document.createElement('div');
    cb.className = 'countbox';
    var q = document.createElement('div');
    q.className = 'task-text';
    q.style.marginBottom = '10px';
    q.innerHTML = '<span class="en-inline">' + s.ask + '</span>';
    cb.appendChild(q);
    var ql = document.createElement('div');
    ql.className = 'speak-line';
    ql.style.margin = '0 0 12px';
    ql.appendChild(speakerBtn(s.ask, 'speak-mini', 'Прослушать вопрос'));
    cb.appendChild(ql);
    var it = document.createElement('div');
    it.className = 'items';
    it.textContent = s.items;
    cb.appendChild(it);
    stage.insertBefore(cb, navEl);

    speak(s.say, 600);

    var box = document.createElement('div');
    box.className = 'opts grid2';
    stage.insertBefore(box, navEl);

    var locked = false;
    s.opts.forEach(function(o, i){
      var b = document.createElement('button');
      b.className = 'opt'; b.type = 'button';
      b.style.justifyContent = 'center';
      b.innerHTML = bold(o.t);
      b.appendChild(speakerBtn(o.say, 'speak-mini'));
      b.addEventListener('click', function(){
        if(locked) return;
        if(i === s.correct){
          locked = true;
          b.classList.add('correct');
          Array.prototype.forEach.call(box.children, function(x){ x.disabled = true; });
          speak(o.say, 120);
          setTimeout(fb.good, 650);
        } else {
          b.classList.add('wrong');
          setTimeout(function(){ b.classList.remove('wrong'); }, 600);
          fb.bad();
        }
      });
      box.appendChild(b);
    });
  }

  function renderMatch(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score += 2; updateBar(); });
    var navEl = stage.querySelector('.nav');

    speakBlock(stage, s);

    var area = document.createElement('div');
    area.className = 'match-area';
    stage.insertBefore(area, navEl);

    var leftCol = document.createElement('div');
    leftCol.className = 'mcol';
    leftCol.innerHTML = '<h4>ФРАЗА / СЛОВО</h4>';
    var rightCol = document.createElement('div');
    rightCol.className = 'mcol';
    rightCol.innerHTML = '<h4>КАРТИНКА / ОТВЕТ</h4>';
    area.appendChild(leftCol);
    area.appendChild(rightCol);

    var pairs = s.pairs.slice();
    var lefts  = pairs.map(function(p,i){ return {p:p, i:i}; });
    var rights = pairs.map(function(p,i){ return {p:p, i:i}; });
    rights.sort(function(){ return Math.random() - 0.5; });

    var selected = null;
    var matched = 0;
    var busy = false;

    lefts.forEach(function(o){
      var b = document.createElement('button');
      b.className = 'mitem'; b.type = 'button';
      b.textContent = o.p.left;
      b.appendChild(speakerBtn(o.p.say, 'speak-mini'));
      b.addEventListener('click', function(){
        if(busy || b.classList.contains('done') || b.classList.contains('sel')) return;
        if(selected && selected.side === 'left'){ selected.el.classList.remove('sel'); }
        selected = {side:'left', el:b, i:o.i};
        b.classList.add('sel');
        speak(o.p.say);
      });
      leftCol.appendChild(b);
      o.el = b;
    });

    rights.forEach(function(o){
      var b = document.createElement('button');
      b.className = 'mitem'; b.type = 'button';
      var pic = document.createElement('span');
      pic.className = 'pic';
      pic.textContent = o.p.right;
      b.appendChild(pic);
      b.appendChild(speakerBtn(o.p.say, 'speak-mini'));
      b.addEventListener('click', function(){
        if(busy || b.classList.contains('done')) return;
        speak(o.p.say);
        if(selected && selected.side === 'left'){
          busy = true;
          if(selected.i === o.i){
            selected.el.classList.remove('sel');
            selected.el.classList.add('done');
            b.classList.add('done');
            selected = null;
            matched++;
            speak('Yes!', 250);
            busy = false;
            if(matched === pairs.length){ setTimeout(fb.good, 900); }
          } else {
            selected.el.classList.add('bad');
            b.classList.add('bad');
            var a1 = selected.el, a2 = b;
            setTimeout(function(){
              a1.classList.remove('bad','sel');
              a2.classList.remove('bad');
              selected = null; busy = false;
            }, 650);
            fb.bad();
            shakeStage();
          }
        } else {
          if(selected && selected.side === 'right'){ selected.el.classList.remove('sel'); }
          selected = {side:'right', el:b, i:o.i};
          b.classList.add('sel');
        }
      });
      rightCol.appendChild(b);
      o.el = b;
    });
  }

  function renderOrder(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score += 2; updateBar(); });
    var navEl = stage.querySelector('.nav');

    speakBlock(stage, s);

    var slots = document.createElement('div');
    slots.className = 'order-slots empty-pool';
    stage.insertBefore(slots, navEl);

    var pool = s.items.map(function(it, i){ return {it:it, i:i}; });
    var shuffled = pool.slice();
    shuffled.sort(function(){ return Math.random() - 0.5; });

    var poolBox = document.createElement('div');
    poolBox.className = 'order-pool';
    stage.insertBefore(poolBox, navEl);

    var placed = [];
    var busy = false;
    var correctOrder = pool.map(function(o){ return o.i; });

    shuffled.forEach(function(o){
      var b = document.createElement('button');
      b.className = 'otile'; b.type = 'button';
      var n = document.createElement('span');
      n.className = 'num';
      n.textContent = o.it.n || '';
      b.appendChild(n);
      var t = document.createElement('span');
      t.innerHTML = bold(o.it.t);
      b.appendChild(t);
      b.appendChild(speakerBtn(o.it.say, 'speak-mini'));

      b.addEventListener('click', function(){
        if(busy || b.classList.contains('used')) return;
        speak(o.it.say);
        var expect = correctOrder[placed.length];
        if(o.i === expect){
          b.classList.add('used');
          var clone = document.createElement('button');
          clone.className = 'otile placed';
          clone.type = 'button';
          clone.innerHTML = '<span class="num">' + (o.it.n || '') + '</span><span>' + o.it.t + '</span>';
          slots.appendChild(clone);
          slots.classList.remove('empty-pool');
          placed.push(o.i);
          if(placed.length === pool.length){
            busy = true;
            speakSeq(s.items.map(function(x){ return x.say; }));
            setTimeout(fb.good, 1200);
          }
        } else {
          b.classList.add('bad');
          setTimeout(function(){ b.classList.remove('bad'); }, 550);
          fb.bad();
          shakeStage();
        }
      });
      poolBox.appendChild(b);
    });
  }

  function renderFinal(stage, s){
    stage.innerHTML = '';
    var box = document.createElement('div');
    box.className = 'final';
    stage.appendChild(box);

    var big = document.createElement('span');
    big.className = 'big';
    big.textContent = '🏆';
    box.appendChild(big);

    var h = document.createElement('h2');
    h.textContent = s.title;
    box.appendChild(h);

    var p = document.createElement('p');
    p.textContent = s.text;
    box.appendChild(p);

    var line = document.createElement('div');
    line.className = 'speak-line';
    var big2 = document.createElement('button');
    big2.className = 'speak-big';
    big2.innerHTML = '🔊 ' + s.say;
    big2.addEventListener('click', function(){ speakSeq(['Thank you for visiting!', 'Well done!']); });
    line.appendChild(big2);
    box.appendChild(line);

    var rw = document.createElement('div');
    rw.className = 'reward';
    var rt = document.createElement('div');
    rt.style.fontWeight = '700';
    rt.style.marginBottom = '10px';
    rt.style.color = '#c06a10';
    rt.textContent = '🎪 Каталог выставки — весь словарь урока:';
    rw.appendChild(rt);

    var wl = document.createElement('div');
    wl.className = 'words';
    s.allWords.forEach(function(w){
      var row = document.createElement('div');
      row.style.display = 'flex';
      row.style.alignItems = 'center';
      row.style.gap = '8px';
      row.style.padding = '3px 0';
      row.style.borderBottom = '1px dotted #e6d5a8';
      var tx = document.createElement('span');
      tx.innerHTML = '<b>' + w.en + '</b> ' + w.ipa + ' — ' + w.ru;
      tx.style.flex = '1';
      row.appendChild(tx);
      row.appendChild(speakerBtn(w.en, 'speak-mini'));
      wl.appendChild(row);
    });
    rw.appendChild(wl);
    box.appendChild(rw);

    var st = document.createElement('p');
    st.innerHTML = '⭐ Витрин осмотрено: <b>' + score + '</b><br>Выставку можно посетить ещё раз — хоть сегодня, хоть через неделю.';
    box.appendChild(st);

    var nav = document.createElement('div');
    nav.className = 'nav';
    var back = nextBtn('⬅️ Назад', goBack, 'btn-back');
    if(!history.length) back.disabled = true;
    nav.appendChild(back);
    nav.appendChild(nextBtn('🔁 Посетить заново', function(){
      idx = 0; history = []; score = 0; render();
    }, 'restart'));
    box.appendChild(nav);

    speakSeq(['Thank you for visiting!', 'Well done!']);
  }

  render();

  if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = function(){ loadVoices(); };
  }
  document.addEventListener('click', function once(){
    loadVoices();
    document.removeEventListener('click', once);
  });

})();
</script>
</body>
</html>

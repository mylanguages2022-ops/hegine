<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Квест-досье по уроку 5d Spotlight: 23 шага, десять механик, озвучка en-GB, прогресс-линейка с лупой и возврат при ошибке.">

<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"Comic Sans MS","Segoe UI",Verdana,sans-serif;
    background-color:#eef3f7;
    background-image:
      linear-gradient(rgba(44,93,143,.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(44,93,143,.08) 1px, transparent 1px);
    background-size:24px 24px;
    color:#3a3226;min-height:100vh;padding:16px 12px 50px;
  }
  .wrap{max-width:760px;margin:0 auto}

  /* ---------- ПАПКА ИНСПЕКТОРА ---------- */
  .folder{
    background:#e8d9b8;border:3px solid #b89a6a;border-radius:4px 14px 4px 4px;
    padding:0 16px 16px;margin-bottom:18px;position:relative;
    box-shadow:5px 6px 0 rgba(120,95,55,.3);
  }
  .folder-tab{
    position:relative;top:-16px;display:inline-block;
    background:#e8d9b8;border:3px solid #b89a6a;border-bottom:none;
    border-radius:10px 10px 0 0;padding:6px 22px 4px;
    font-weight:700;color:#5a4a30;font-size:.85rem;letter-spacing:1px;
  }
  .folder h1{
    font-size:clamp(1.1rem,4vw,1.5rem);color:#2c5d8f;text-align:center;line-height:1.3;margin-top:-6px;
  }
  .folder h1 .stamp{
    display:inline-block;border:3px double #c0392b;color:#c0392b;border-radius:8px;
    padding:1px 10px;font-size:.65em;transform:rotate(-3deg);vertical-align:middle;margin-left:8px;
  }
  .bar-wrap{margin-top:12px}
  .bar-label{
    display:flex;justify-content:space-between;align-items:center;
    font-size:.8rem;color:#6b6152;margin-bottom:6px;font-weight:700;
    font-family:"Courier New",monospace;letter-spacing:.5px;
  }
  .bar-track{
    height:22px;background:#fffdf8;border-radius:3px;overflow:hidden;
    border:2px solid #b89a6a;position:relative;
    background-image:repeating-linear-gradient(90deg, transparent 0 9%, rgba(184,154,106,.5) 9% 9.4%);
  }
  .bar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg, rgba(44,93,143,.55), rgba(192,57,43,.55));
    transition:width .5s cubic-bezier(.34,1.4,.64,1);
  }
  .bar-runner{
    position:absolute;top:-6px;left:0;font-size:1.5rem;
    transform:translateX(-50%);transition:left .5s cubic-bezier(.34,1.4,.64,1);
    filter:drop-shadow(0 2px 1px rgba(0,0,0,.25));
  }
  .stamps{margin-top:9px;text-align:center;font-size:1.05rem;letter-spacing:3px;color:#c0392b}

  /* ---------- ЛИСТ ДЕЛА ---------- */
  .stage{
    background:#fffdf8;border-radius:4px;padding:26px 18px 24px;
    border:2px solid #8a7d68;box-shadow:5px 6px 0 rgba(120,95,55,.25);
    position:relative;animation:pop .35s ease;
  }
  .stage::before,.stage::after{
    content:'';position:absolute;width:86px;height:26px;
    background:rgba(240,220,140,.75);border:1px solid rgba(200,180,100,.6);
    top:-12px;
  }
  .stage::before{left:14px;transform:rotate(-5deg)}
  .stage::after{right:14px;transform:rotate(4deg)}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .stage.shake{animation:shake .45s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-9px)}40%{transform:translateX(9px)}
    60%{transform:translateX(-6px)}80%{transform:translateX(6px)}
  }
  .step-tag{
    display:inline-block;background:#3a3226;color:#f5ecd8;
    font-family:"Courier New",monospace;font-size:.76rem;font-weight:700;
    padding:4px 12px;border-radius:3px;letter-spacing:1px;margin-bottom:12px;
  }
  .mech-tag{
    display:inline-block;background:#fff;border:2px dashed #c0392b;color:#c0392b;
    font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:3px;
    margin-left:6px;margin-bottom:12px;letter-spacing:.5px;text-transform:uppercase;
  }
  .hero{font-size:3.1rem;text-align:center;display:block;margin:2px 0 10px;line-height:1.15}
  .stage h2{font-size:clamp(1.05rem,3.8vw,1.4rem);color:#2c5d8f;text-align:center;margin-bottom:10px;line-height:1.35}
  .task-text{font-size:1rem;line-height:1.6;color:#5a4a30;text-align:center;margin-bottom:16px}
  .en-inline{font-weight:700;color:#2c5d8f}

  .speak-line{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0 18px}
  .speak-big{
    background:#c0392b;color:#fff;border:2px double #fff;outline:2px solid #c0392b;
    border-radius:6px;padding:11px 20px;font-size:1rem;font-weight:700;cursor:pointer;
    font-family:inherit;box-shadow:0 4px 0 #8e2a1f;transition:.15s;
    display:inline-flex;align-items:center;gap:9px;letter-spacing:.3px;
  }
  .speak-big:hover{background:#a93226;transform:translateY(-2px)}
  .speak-big:active{transform:translateY(1px);box-shadow:0 2px 0 #8e2a1f}
  .speak-mini{
    width:36px;height:36px;border-radius:50%;border:none;background:#2e8b57;color:#fff;
    font-size:1rem;cursor:pointer;box-shadow:0 3px 0 #1f6b41;transition:.15s;
    display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .speak-mini:hover{background:#27794c;transform:scale(1.1)}
  .speak-mini:active{transform:scale(.92)}

  /* ---------- ВАРИАНТЫ-СТРОКИ ФОРМЫ ---------- */
  .opts{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .opts.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .opt{
    background:#fff;border:2px solid #b8c9d9;border-left:6px solid #2c5d8f;border-radius:4px;
    padding:12px 14px;cursor:pointer;font-family:inherit;font-size:1.02rem;
    color:#3a3226;text-align:left;display:flex;align-items:center;gap:10px;
    transition:.16s;font-weight:600;line-height:1.35;
  }
  .opt:hover{border-color:#2c5d8f;background:#f2f7fb;transform:translateX(3px)}
  .opt .mark{
    flex:0 0 26px;height:26px;border:2px solid #2c5d8f;border-radius:3px;background:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;color:#2c5d8f;
  }
  .opt.correct{background:#f2fbf5;border-color:#2e8b57;border-left-color:#2e8b57;animation:bounce .45s;transform:rotate(-1deg)}
  .opt.wrong{background:#fdf2f2;border-color:#c0392b;border-left-color:#c0392b;animation:shake .4s}
  @keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  .opt:disabled{cursor:default}

  /* ---------- ВЕРНО / НЕВЕРНО ---------- */
  .yesno-scene{
    background:#f2f7fb;border:2px dashed #2c5d8f;border-radius:8px;
    padding:16px 10px;text-align:center;margin-bottom:16px;
  }
  .yesno-scene .big{font-size:3rem;letter-spacing:8px;display:block;margin-bottom:8px}
  .yesno-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .yesno-btn{
    flex:1 1 140px;max-width:220px;border-radius:6px;padding:14px 10px;
    font-family:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;transition:.15s;
    border:3px double;letter-spacing:.5px;
  }
  .yesno-btn.yes{background:#f2fbf5;border-color:#2e8b57;color:#1f6b41;box-shadow:0 4px 0 #1f6b41}
  .yesno-btn.no{background:#fdf2f2;border-color:#c0392b;color:#8e2a1f;box-shadow:0 4px 0 #8e2a1f}
  .yesno-btn:hover{transform:translateY(-2px)}
  .yesno-btn:active{transform:translateY(1px);box-shadow:none}
  .yesno-btn.correct{animation:bounce .45s;transform:rotate(-2deg)}
  .yesno-btn.wrong{animation:shake .4s}

  .countbox{
    background:#fffdf8;border:2px dashed #b89a6a;border-radius:8px;
    padding:18px 12px;text-align:center;margin-bottom:16px;
  }
  .countbox .items{font-size:2.4rem;letter-spacing:7px;line-height:1.5;word-break:break-word}

  .match-area{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
  .mcol{display:flex;flex-direction:column;gap:10px}
  .mcol h4{text-align:center;font-size:.8rem;color:#8a7d68;font-weight:700;margin-bottom:2px;font-family:"Courier New",monospace;letter-spacing:1px}
  .mitem{
    background:#fff;border:2px solid #b8c9d9;border-radius:4px;padding:11px 8px;
    cursor:pointer;font-family:inherit;font-size:1rem;font-weight:700;color:#3a3226;
    text-align:center;transition:.16s;display:flex;align-items:center;justify-content:center;gap:7px;
    min-height:56px;
  }
  .mitem:hover{border-color:#2c5d8f;background:#f2f7fb}
  .mitem.sel{border-color:#2c5d8f;background:#e3eef7;box-shadow:0 0 0 3px #cfe0ee}
  .mitem.done{background:#f2fbf5;border-color:#2e8b57;color:#1f6b41;cursor:default;opacity:.85}
  .mitem.bad{animation:shake .4s;border-color:#c0392b;background:#fdf2f2}
  .mitem .pic{font-size:1.7rem}

  .order-pool,.order-slots{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
  .order-slots{
    min-height:66px;background:#fffdf8;border:2px dashed #b89a6a;border-radius:8px;
    padding:11px 9px;margin-bottom:16px;align-items:center;
  }
  .order-slots.empty-pool::after{content:'нажимайте на карточки ниже ⬇️';color:#a99a80;font-size:.88rem}
  .otile{
    background:#fff;border:2px solid #8a5fd0;border-radius:4px;padding:10px 13px;
    cursor:pointer;font-family:inherit;font-size:.98rem;font-weight:700;color:#5a3a96;
    transition:.15s;display:flex;align-items:center;gap:7px;box-shadow:0 3px 0 #6a3fa8;
  }
  .otile:hover{transform:translateY(-2px);background:#f6f2ff}
  .otile.placed{border-color:#2e8b57;background:#f2fbf5;color:#1f6b41;box-shadow:0 3px 0 #1f6b41}
  .otile.bad{animation:shake .4s;border-color:#c0392b;background:#fdf2f2}
  .otile.used{opacity:.3;pointer-events:none}
  .otile .num{font-size:1.4rem}

  .spell-slots{display:flex;gap:9px;justify-content:center;margin:6px 0 18px;flex-wrap:wrap}
  .slot{
    width:52px;height:60px;border-radius:4px;background:#fffdf8;
    border:2px dashed #2c5d8f;display:flex;align-items:center;justify-content:center;
    font-size:1.75rem;font-weight:700;color:#2c5d8f;text-transform:uppercase;
  }
  .slot.filled{border-style:solid;border-color:#2e8b57;background:#f2fbf5}
  .slot.bad{border-color:#c0392b;background:#fdf2f2;animation:shake .4s}
  .letter-pool{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
  .letter{
    width:54px;height:60px;border-radius:4px;border:2px solid #2c5d8f;background:#f2f7fb;
    font-family:inherit;font-size:1.7rem;font-weight:700;color:#2c5d8f;cursor:pointer;
    text-transform:uppercase;box-shadow:0 4px 0 #1d4265;transition:.14s;
  }
  .letter:hover{transform:translateY(-3px);background:#e3eef7}
  .letter.used{opacity:.25;pointer-events:none;box-shadow:none;transform:none}

  .drag-zone{
    background:#fffdf8;border:2px dashed #b89a6a;border-radius:8px;
    padding:18px 12px;text-align:center;margin-bottom:16px;min-height:120px;
  }
  .drag-item{
    display:inline-block;background:#fff;border:2px solid #8a5fd0;border-radius:4px;
    padding:10px 16px;margin:5px;cursor:pointer;font-family:inherit;font-size:1.05rem;
    font-weight:700;color:#5a3a96;box-shadow:0 3px 0 #6a3fa8;transition:.15s;
  }
  .drag-item:hover{transform:translateY(-3px);background:#f6f2ff}
  .drag-item.chosen{background:#f2fbf5;border-color:#2e8b57;color:#1f6b41;box-shadow:0 3px 0 #1f6b41}
  .drag-item.bad{animation:shake .4s;border-color:#c0392b;background:#fdf2f2}

  .scene-box{
    background:#f2f7fb;border:2px dashed #2c5d8f;border-radius:8px;
    padding:18px 12px;text-align:center;margin-bottom:16px;min-height:130px;
  }
  .scene-box .big{font-size:3.2rem;letter-spacing:6px;display:block;margin-bottom:10px}

  .fb{
    margin-top:16px;padding:14px 16px;border-radius:6px;font-size:1rem;
    line-height:1.55;text-align:center;display:none;font-weight:600;
  }
  .fb.show{display:block;animation:pop .3s}
  .fb.good{
    background:#f2fbf5;border:3px double #2e8b57;color:#1f6b41;
    transform:rotate(-.6deg);
  }
  .fb.bad{background:#fdf2f2;border:3px double #c0392b;color:#8e2a1f}
  .fb .again{
    margin-top:10px;background:#fff;border:2px solid #c0392b;color:#8e2a1f;
    border-radius:4px;padding:7px 16px;font-family:inherit;font-weight:700;
    font-size:.9rem;cursor:pointer;
  }
  .fb .again:hover{background:#fdf2f2}

  .nav{display:flex;gap:11px;justify-content:center;margin-top:20px;flex-wrap:wrap}
  .nav button{
    border-radius:4px;padding:13px 24px;font-family:inherit;
    font-size:1rem;font-weight:700;cursor:pointer;transition:.16s;
    display:inline-flex;align-items:center;gap:8px;letter-spacing:.3px;
  }
  .btn-next{background:#2c5d8f;color:#fff;border:none;box-shadow:0 5px 0 #1d4265}
  .btn-next:hover{background:#24507c;transform:translateY(-2px)}
  .btn-back{background:#fffdf8;color:#5a4a30;border:2px solid #b89a6a !important;box-shadow:0 5px 0 #b89a6a}
  .btn-back:hover{background:#f3e8d2}
  .btn-back:disabled,.btn-next:disabled{opacity:.4;cursor:default;transform:none}
  .btn-replay{background:#e8d9b8;color:#5a4a30;border:none;box-shadow:0 5px 0 #b89a6a}
  .btn-replay:hover{background:#dfcfa8}

  .final{text-align:center}
  .final .big{
    font-size:3.4rem;display:inline-block;margin-bottom:12px;
    border:5px double #c0392b;color:#c0392b;border-radius:12px;padding:8px 22px;
    transform:rotate(-4deg);letter-spacing:3px;font-weight:700;
    animation:float 2.4s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(-4deg) translateY(-9px)}}
  .final h2{font-size:clamp(1.25rem,4.5vw,1.8rem);color:#2c5d8f;margin-bottom:12px}
  .final p{font-size:1.02rem;line-height:1.65;color:#5a4a30;margin-bottom:12px}
  .reward{
    background:#fffdf8;border:2px dashed #b89a6a;border-radius:8px;padding:18px 16px;margin:18px 0;
  }
  .reward .words{font-size:1.02rem;line-height:1.85;color:#5a4a30;text-align:left}
  .reward .words b{color:#2c5d8f}
  .restart{background:#c0392b;color:#fff;border:none;box-shadow:0 5px 0 #8e2a1f}
  .restart:hover{background:#a93226}

  .start-screen{text-align:center}
  .start-screen .cast{font-size:2.6rem;letter-spacing:6px;margin:14px 0 6px}
  .start-screen ul{
    list-style:none;text-align:left;margin:16px auto;max-width:430px;
    background:#fffdf8;border:2px dashed #b89a6a;border-radius:8px;padding:16px 18px;
  }
  .start-screen li{
    padding:7px 0 7px 30px;position:relative;font-size:.97rem;color:#5a4a30;line-height:1.45;
    border-bottom:1px dotted #d8c8a8;
  }
  .start-screen li:last-child{border-bottom:none}
  .start-screen li::before{content:'☑️';position:absolute;left:0;top:7px;font-size:.95rem}
  .sound-note{
    background:#f3e8d2;border:2px solid #b89a6a;border-radius:6px;padding:11px 14px;
    font-size:.88rem;color:#5a4a30;margin-top:14px;line-height:1.5;
  }

  @media (max-width:520px){
    .match-area{grid-template-columns:1fr 1fr;gap:8px}
    .mitem{font-size:.88rem;min-height:50px;padding:9px 5px}
    .mitem .pic{font-size:1.4rem}
    .slot,.letter{width:44px;height:52px;font-size:1.4rem}
    .countbox .items{font-size:1.9rem;letter-spacing:4px}
    .hero{font-size:2.6rem}
    .nav button{padding:12px 18px;font-size:.95rem}
    .stage::before,.stage::after{width:60px;height:20px}
  }
</style>

<body>
<div class="wrap">

  <div class="folder">
    <div class="folder-tab">ДЕЛО № 5-D</div>
    <h1>🕵️ Дело о классной переписи <span class="stamp">OPEN</span></h1>
    <div class="bar-wrap">
      <div class="bar-label">
        <span id="stepLabel">ЛИСТ 0 ИЗ 23</span>
        <span id="pctLabel">0%</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="barFill"></div>
        <div class="bar-runner" id="barRunner">🔍</div>
      </div>
      <div class="stamps" id="stamps"></div>
    </div>
  </div>

  <div id="stageHost"></div>

</div>

<script>
(function(){
  "use strict";

  var RATE = 0.85;
  var voices = [];

  function loadVoices(){
    if(!('speechSynthesis' in window)) return;
    voices = window.speechSynthesis.getVoices() || [];
  }
  loadVoices();
  if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = loadVoices;
    setTimeout(loadVoices, 350);
    setTimeout(loadVoices, 1400);
  }

  function pickVoice(){
    if(!voices.length) loadVoices();
    var v;
    v = voices.find(function(x){ return x.lang === 'en-GB'; });                       if(v) return v;
    v = voices.find(function(x){ return x.lang && x.lang.toLowerCase().indexOf('en-gb') === 0; }); if(v) return v;
    v = voices.find(function(x){ return x.lang === 'en-US'; });                       if(v) return v;
    v = voices.find(function(x){ return x.lang && x.lang.toLowerCase().indexOf('en') === 0; });
    return v || null;
  }

  function speak(text, delay){
    if(!('speechSynthesis' in window)) return;
    var go = function(){
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      var v = pickVoice();
      if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'en-GB'; }
      u.rate = RATE; u.pitch = 1.06; u.volume = 1;
      window.speechSynthesis.speak(u);
    };
    if(delay){ setTimeout(go, delay); } else { go(); }
  }

  function speakSeq(arr){
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    arr.forEach(function(t, i){
      setTimeout(function(){
        var u = new SpeechSynthesisUtterance(t);
        var v = pickVoice();
        if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'en-GB'; }
        u.rate = RATE; u.pitch = 1.06;
        window.speechSynthesis.speak(u);
      }, i * 1500);
    });
  }

  var STEPS = [

  /* 1 */ {
    kind:'intro', emoji:'🕵️', mech:'Открытие дела',
    title:'Дело о классной переписи',
    text:'Ларри назначил тебя главным инспектором класса! В папке — двадцать три листа: считай предметы, проверяй утверждения печатью «верно / неверно» и находи спрятанные вещи. В конце тебя ждёт большая красная печать APPROVED.',
    say:"Let's count our fingers! One, two, three...",
    sayRu:'Давай посчитаем наши пальцы! Раз, два, три…',
    cta:'🕵️ Открыть дело!'
  },

  /* 2 */ {

  var TOTAL = STEPS.length;
  var idx = 0;
  var history = [];
  var score = 0;
  var stageHost = document.getElementById('stageHost');
  var barFill = document.getElementById('barFill');
  var barRunner = document.getElementById('barRunner');
  var stepLabel = document.getElementById('stepLabel');
  var pctLabel = document.getElementById('pctLabel');
  var stampsBox = document.getElementById('stamps');

  function bold(str){
    return String(str).replace(/\*\*(.+?)\*\*/g, '<span class="en-inline">$1</span>');
  }

  function updateBar(){
    var pct = Math.round((idx / (TOTAL - 1)) * 100);
    if(pct < 0) pct = 0; if(pct > 100) pct = 100;
    barFill.style.width = pct + '%';
    barRunner.style.left = pct + '%';
    stepLabel.textContent = idx === 0 ? 'ЛИСТ 0 ИЗ ' + (TOTAL - 1) : ('ЛИСТ ' + idx + ' ИЗ ' + (TOTAL - 1));
    pctLabel.textContent = pct + '%';
    var full = Math.floor(score / 4);
    var s = '';
    for(var i = 0; i < full && i < 6; i++){ s += '🔴'; }
    stampsBox.textContent = s;
  }

  function shakeStage(){
    var st = stageHost.querySelector('.stage');
    if(!st) return;
    st.classList.remove('shake');
    void st.offsetWidth;
    st.classList.add('shake');
  }

  function speakerBtn(text, cls, title){
    var b = document.createElement('button');
    b.className = cls || 'speak-mini';
    b.innerHTML = '🔊';
    b.title = title || 'Прослушать';
    b.setAttribute('aria-label','Прослушать: ' + text);
    b.addEventListener('click', function(ev){ ev.stopPropagation(); speak(text); });
    return b;
  }

  function nextBtn(label, fn, cls){
    var b = document.createElement('button');
    b.className = cls || 'btn-next';
    b.textContent = label;
    b.addEventListener('click', fn);
    return b;
  }

  function goNext(){
    if(idx < TOTAL - 1){
      history.push(idx);
      idx++;
      render();
    }
  }
  function goBack(){
    if(history.length){
      idx = history.pop();
      render();
    }
  }

  function render(){
    window.scrollTo({top:0, behavior:'smooth'});
    updateBar();
    stageHost.innerHTML = '';
    var s = STEPS[idx];

    var stage = document.createElement('div');
    stage.className = 'stage';
    stageHost.appendChild(stage);

    if(s.kind === 'intro')   return renderIntro(stage, s);
    if(s.kind === 'final')   return renderFinal(stage, s);
    if(s.kind === 'scene')   return renderScene(stage, s);
    if(s.kind === 'yesno')   return renderYesNo(stage, s);
    if(s.kind === 'choice' || s.kind === 'listen') return renderChoice(stage, s);
    if(s.kind === 'count')   return renderCount(stage, s);
    if(s.kind === 'spell')   return renderSpell(stage, s);
    if(s.kind === 'match')   return renderMatch(stage, s);
    if(s.kind === 'order')   return renderOrder(stage, s);
    if(s.kind === 'pick')    return renderPick(stage, s);
  }

  function header(stage, s){
    var tag = document.createElement('span');
    tag.className = 'step-tag';
    tag.textContent = 'ДЕЛО 5-D · ЛИСТ ' + (idx + 1) + '/' + TOTAL;
    stage.appendChild(tag);

    if(s.mech){
      var m = document.createElement('span');
      m.className = 'mech-tag';
      m.textContent = s.mech;
      stage.appendChild(m);
    }
    var hero = document.createElement('span');
    hero.className = 'hero';
    hero.textContent = s.emoji || '📎';
    stage.appendChild(hero);

    var h2 = document.createElement('h2');
    h2.textContent = s.title;
    stage.appendChild(h2);

    var p = document.createElement('div');
    p.className = 'task-text';
    p.innerHTML = bold(s.text);
    stage.appendChild(p);
  }

  function speakBlock(stage, s){
    if(!s.say) return;
    var line = document.createElement('div');
    line.className = 'speak-line';
    var big = document.createElement('button');
    big.className = 'speak-big';
    big.innerHTML = '🔊 ' + s.say;
    big.addEventListener('click', function(){ speak(s.say); });
    line.appendChild(big);
    stage.appendChild(line);
    if(s.sayRu){
      var r = document.createElement('div');
      r.className = 'task-text';
      r.style.marginTop = '-10px';
      r.textContent = s.sayRu;
      stage.appendChild(r);
    }
  }

  function feedback(stage, s, onWin){
    var fb = document.createElement('div');
    fb.className = 'fb';
    stage.appendChild(fb);

    var nav = document.createElement('div');
    nav.className = 'nav';

    var back = nextBtn('⬅️ Назад', goBack, 'btn-back');
    if(!history.length) back.disabled = true;
    nav.appendChild(back);

    var replay = nextBtn('🔁 Ещё раз', function(){ render(); }, 'btn-replay');
    nav.appendChild(replay);

    var next = nextBtn('Дальше ➡️', goNext);
    next.style.display = 'none';
    nav.appendChild(next);

    stage.appendChild(nav);

    function showGood(){
      fb.className = 'fb good show';
      fb.innerHTML = bold(s.ok || 'Отлично!');
      next.style.display = '';
      speak('Well done!', 250);
      if(onWin) onWin();
    }
    function showBad(){
      fb.className = 'fb bad show';
      fb.innerHTML = bold(s.no || 'Попробуй ещё раз!') +
        '<br><button class="again" type="button">🔁 Попробовать снова</button>';
      var ag = fb.querySelector('.again');
      ag.addEventListener('click', function(){ render(); });
      shakeStage();
      speak('Try again!', 200);
    }
    return {good:showGood, bad:showBad, next:next, back:back};
  }

  /* ---------- ВЕРНО / НЕВЕРНО ---------- */
  function renderYesNo(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score++; updateBar(); });

    var box = document.createElement('div');
    box.className = 'yesno-scene';
    var big = document.createElement('span');
    big.className = 'big';
    big.textContent = s.scene || '❓';
    box.appendChild(big);
    stage.insertBefore(box, stage.querySelector('.nav'));

    var line = document.createElement('div');
    line.className = 'speak-line';
    var sb = document.createElement('button');
    sb.className = 'speak-big';
    sb.innerHTML = '🔊 ' + s.say;
    sb.addEventListener('click', function(){ speak(s.say); });
    line.appendChild(sb);
    stage.insertBefore(line, stage.querySelector('.nav'));
    speak(s.say, 600);

    var row = document.createElement('div');
    row.className = 'yesno-row';
    stage.insertBefore(row, stage.querySelector('.nav'));

    var locked = false;
    var mk = function(isYes){
      var b = document.createElement('button');
      b.className = 'yesno-btn ' + (isYes ? 'yes' : 'no');
      b.type = 'button';
      b.innerHTML = isYes ? '✔️ ВЕРНО' : '❌ НЕВЕРНО';
      b.addEventListener('click', function(){
        if(locked) return;
        if(isYes === s.answer){
          locked = true;
          b.classList.add('correct');
          speak(s.say, 100);
          setTimeout(fb.good, 600);
        } else {
          b.classList.add('wrong');
          setTimeout(function(){ b.classList.remove('wrong'); }, 600);
          fb.bad();
        }
      });
      row.appendChild(b);
    };
    mk(true);
    mk(false);
  }

  function renderChoice(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score++; updateBar(); });

    if(s.kind === 'listen'){
      var line = document.createElement('div');
      line.className = 'speak-line';
      var big = document.createElement('button');
      big.className = 'speak-big';
      big.innerHTML = '🔊 Прослушать';

      line.appendChild(big);
      stage.insertBefore(line, stage.querySelector('.nav'));
      speak(s.say, 600);
    } else {
      speakBlock(stage, s);
    }

    var box = document.createElement('div');
    box.className = 'opts' + (s.opts.length > 3 ? ' grid2' : '');
    var navEl = stage.querySelector('.nav');
    stage.insertBefore(box, navEl);

    var locked = false;
    s.opts.forEach(function(o, i){
      var b = document.createElement('button');
      b.className = 'opt';
      b.type = 'button';
      var mk = document.createElement('span');
      mk.className = 'mark';
      mk.textContent = String.fromCharCode(65 + i);
      b.appendChild(mk);
      var tx = document.createElement('span');
      tx.innerHTML = bold(o.t);
      b.appendChild(tx);
      b.appendChild(speakerBtn(o.say || o.t.replace(/\/.*?\//g,'').replace(/—.*$/,'').trim(), 'speak-mini'));

      b.addEventListener('click', function(){
        if(locked) return;
        if(i === s.correct){
          locked = true;
          b.classList.add('correct');
          Array.prototype.forEach.call(box.children, function(x){ x.disabled = true; });
          speak(o.say || o.t, 120);
          setTimeout(fb.good, 650);
        } else {
          b.classList.add('wrong');
          setTimeout(function(){ b.classList.remove('wrong'); }, 600);
          fb.bad();
        }
      });
      box.appendChild(b);

  function renderSpell(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score++; updateBar(); });
    var navEl = stage.querySelector('.nav');

    var hintLine = document.createElement('div');
    hintLine.className = 'speak-line';
    var hb = document.createElement('button');
    hb.className = 'speak-big';
    hb.innerHTML = s.hint + ' 🔊 Прослушать слово';
    hb.addEventListener('click', function(){ speak(s.word); });
    hintLine.appendChild(hb);
    stage.insertBefore(hintLine, navEl);
    speak(s.word, 600);

    var slots = document.createElement('div');
    slots.className = 'spell-slots';
    var slotEls = [];
    for(var i = 0; i < s.word.length; i++){
      var sl = document.createElement('div');
      sl.className = 'slot';
      slots.appendChild(sl);
      slotEls.push(sl);
    }
    stage.insertBefore(slots, navEl);

    var letters = s.word.split('');
    var extra = 'abcdefghijklmnopqrstuvwxyz'.split('');
    var pool = letters.slice();
    var need = Math.max(0, 6 - pool.length);
    for(var k = 0; k < need; k++){
      pool.push(extra[Math.floor(Math.random() * extra.length)]);
    }
    pool.sort(function(){ return Math.random() - 0.5; });

    var poolBox = document.createElement('div');
    poolBox.className = 'letter-pool';
    stage.insertBefore(poolBox, navEl);

    var pos = 0;
    var done = false;

    pool.forEach(function(ch){
      var b = document.createElement('button');
      b.className = 'letter'; b.type = 'button';
      b.textContent = ch;
      b.addEventListener('click', function(){
        if(done) return;
        if(ch === s.word[pos]){
          slotEls[pos].textContent = ch;
          slotEls[pos].classList.add('filled');
          b.classList.add('used');
          pos++;
          speak(ch, 0);
          if(pos === s.word.length){
            done = true;
            speak(s.word, 500);
            setTimeout(fb.good, 1200);
          }
        } else {
          slotEls[pos].classList.add('bad');
          b.classList.add('bad');
          (function(el, bt){
            setTimeout(function(){ el.classList.remove('bad'); bt.classList.remove('bad'); }, 500);
          })(slotEls[pos], b);
          fb.bad();
        }
      });
      poolBox.appendChild(b);
    });
  }

  function renderMatch(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score += 2; updateBar(); });
    var navEl = stage.querySelector('.nav');

    speakBlock(stage, s);

    var area = document.createElement('div');
    area.className = 'match-area';
    stage.insertBefore(area, navEl);

    var leftCol = document.createElement('div');
    leftCol.className = 'mcol';
    leftCol.innerHTML = '<h4>ЦИФРА / СЛОВО</h4>';
    var rightCol = document.createElement('div');
    rightCol.className = 'mcol';
    rightCol.innerHTML = '<h4>ПАРА</h4>';
    area.appendChild(leftCol);
    area.appendChild(rightCol);

    var pairs = s.pairs.slice();
    var lefts  = pairs.map(function(p,i){ return {p:p, i:i}; });
    var rights = pairs.map(function(p,i){ return {p:p, i:i}; });
    rights.sort(function(){ return Math.random() - 0.5; });

    var selected = null;
    var matched = 0;
    var busy = false;

    lefts.forEach(function(o){
      var b = document.createElement('button');
      b.className = 'mitem'; b.type = 'button';
      b.textContent = o.p.left;
      b.appendChild(speakerBtn(o.p.say, 'speak-mini'));
      b.addEventListener('click', function(){
        if(busy || b.classList.contains('done') || b.classList.contains('sel')) return;
        if(selected && selected.side === 'left'){ selected.el.classList.remove('sel'); }
        selected = {side:'left', el:b, i:o.i};
        b.classList.add('sel');
        speak(o.p.say);
      });
      leftCol.appendChild(b);
      o.el = b;
    });

    rights.forEach(function(o){
      var b = document.createElement('button');
      b.className = 'mitem'; b.type = 'button';
      var pic = document.createElement('span');
      pic.className = 'pic';
      pic.textContent = o.p.right;
      b.appendChild(pic);
      b.appendChild(speakerBtn(o.p.say, 'speak-mini'));
      b.addEventListener('click', function(){
        if(busy || b.classList.contains('done')) return;
        speak(o.p.say);
        if(selected && selected.side === 'left'){
          busy = true;
          if(selected.i === o.i){
            selected.el.classList.remove('sel');
            selected.el.classList.add('done');
            b.classList.add('done');
            selected = null;
            matched++;
            speak('Yes!', 250);
            busy = false;
            if(matched === pairs.length){ setTimeout(fb.good, 900); }
          } else {
            selected.el.classList.add('bad');
            b.classList.add('bad');
            var a1 = selected.el, a2 = b;
            setTimeout(function(){
              a1.classList.remove('bad','sel');
              a2.classList.remove('bad');
              selected = null; busy = false;
            }, 650);
            fb.bad();
            shakeStage();
          }
        } else {
          if(selected && selected.side === 'right'){ selected.el.classList.remove('sel'); }
          selected = {side:'right', el:b, i:o.i};
          b.classList.add('sel');
        }
      });
      rightCol.appendChild(b);
      o.el = b;
    });
  }

  function renderOrder(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score += 2; updateBar(); });
    var navEl = stage.querySelector('.nav');

    speakBlock(stage, s);

    var slots = document.createElement('div');
    slots.className = 'order-slots empty-pool';
    stage.insertBefore(slots, navEl);

    var pool = s.items.map(function(it, i){ return {it:it, i:i}; });
    var shuffled = pool.slice();
    shuffled.sort(function(){ return Math.random() - 0.5; });

    var poolBox = document.createElement('div');
    poolBox.className = 'order-pool';
    stage.insertBefore(poolBox, navEl);

    var placed = [];
    var busy = false;
    var correctOrder = pool.map(function(o){ return o.i; });

    shuffled.forEach(function(o){
      var b = document.createElement('button');
      b.className = 'otile'; b.type = 'button';
      var n = document.createElement('span');
      n.className = 'num';
      n.textContent = o.it.n || '';
      b.appendChild(n);
      var t = document.createElement('span');
      t.innerHTML = bold(o.it.t);
      b.appendChild(t);
      b.appendChild(speakerBtn(o.it.say, 'speak-mini'));

      b.addEventListener('click', function(){
        if(busy || b.classList.contains('used')) return;
        speak(o.it.say);
        var expect = correctOrder[placed.length];
        if(o.i === expect){
          b.classList.add('used');
          var clone = document.createElement('button');
          clone.className = 'otile placed';
          clone.type = 'button';
          clone.innerHTML = '<span class="num">' + (o.it.n || '') + '</span><span>' + o.it.t + '</span>';
          slots.appendChild(clone);
          slots.classList.remove('empty-pool');
          placed.push(o.i);
          if(placed.length === pool.length){
            busy = true;
            speakSeq(s.items.map(function(x){ return x.say; }));
            setTimeout(fb.good, 1200);
          }
        } else {
          b.classList.add('bad');
          setTimeout(function(){ b.classList.remove('bad'); }, 550);
          fb.bad();
          shakeStage();
        }
      });
      poolBox.appendChild(b);
    });
  }

  function renderPick(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score += 2; updateBar(); });
    var navEl = stage.querySelector('.nav');

    speakBlock(stage, s);

    var zone = document.createElement('div');
    zone.className = 'drag-zone';
    stage.insertBefore(zone, navEl);

    var chosenCount = 0;
    var correctCount = s.pool.filter(function(p){ return p.good; }).length;
    var busy = false;

    s.pool.forEach(function(item){
      var el = document.createElement('button');
      el.className = 'drag-item';
      el.type = 'button';
      el.innerHTML = bold(item.t);
      el.appendChild(speakerBtn(item.say, 'speak-mini'));

      el.addEventListener('click', function(){
        if(busy || el.classList.contains('chosen')) return;
        speak(item.say);
        if(item.good){
          el.classList.add('chosen');
          chosenCount++;
          if(chosenCount === correctCount){
            busy = true;
            setTimeout(fb.good, 800);
          }
        } else {
          el.classList.add('bad');
          setTimeout(function(){ el.classList.remove('bad'); }, 600);
          fb.bad();
          shakeStage();
        }
      });
      zone.appendChild(el);
    });
  }

    var box = document.createElement('div');

    stage.appendChild(box);

    p.textContent = s.text;
    box.appendChild(p);

    var line = document.createElement('div');
    line.className = 'speak-line';
    var big2 = document.createElement('button');
    big2.className = 'speak-big';
    big2.innerHTML = '🔊 ' + s.say;
    big2.addEventListener('click', function(){ speakSeq(['Approved!', 'Ten stars for the inspector!']); });
    line.appendChild(big2);
    box.appendChild(line);

    var rw = document.createElement('div');
    rw.className = 'reward';
    var rt = document.createElement('div');
    rt.style.fontWeight = '700';
    rt.style.marginBottom = '10px';
    rt.style.color = '#5a4a30';
    rt.textContent = '📋 Приложение к делу: весь словарь инспектора';
    rw.appendChild(rt);

    var wl = document.createElement('div');
    wl.className = 'words';
    s.allWords.forEach(function(w){
      var row = document.createElement('div');
      row.style.display = 'flex';
      row.style.alignItems = 'center';
      row.style.gap = '8px';
      row.style.padding = '3px 0';
      row.style.borderBottom = '1px dotted #d8c8a8';

      tx.style.flex = '1';
      row.appendChild(tx);
      row.appendChild(speakerBtn(w.en, 'speak-mini'));
      wl.appendChild(row);
    });
    rw.appendChild(wl);
    box.appendChild(rw);

    var st = document.createElement('p');
    st.innerHTML = '🔴 Печатей получено: <b>' + score + '</b><br>Дело можно открыть заново — хоть сегодня, хоть через неделю.';
    box.appendChild(st);

    var nav = document.createElement('div');
    nav.className = 'nav';
    var back = nextBtn('⬅️ Назад', goBack, 'btn-back');
    if(!history.length) back.disabled = true;
    nav.appendChild(back);
    nav.appendChild(nextBtn('🔁 Открыть дело заново', function(){
      idx = 0; history = []; score = 0; render();
    }, 'restart'));
    box.appendChild(nav);

    speakSeq(['Approved!', 'Ten stars for the inspector!']);
  }

  render();

  if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = function(){ loadVoices(); };
  }
  document.addEventListener('click', function once(){
    loadVoices();
    document.removeEventListener('click', once);
  });

})();

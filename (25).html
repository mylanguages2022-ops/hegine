<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Презентация: Lesson 1b - Hello Again!</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Презентация: Lesson 1b - Hello Again!" />
    <meta property="og:description" content="Презентация для урока английского языка Spotlight, Module 1, Lesson 1b. Повторение приветствий и знакомство с новым вопросом What's your name?" />
    <meta property="og:image" content="https://example.com/preview-presentation-1b.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://example.com/presentation-1b.html" />
    <meta property="og:locale" content="ru_RU" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }
        
        .presentation-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1200px;
            width: 100%;
            aspect-ratio: 16/9;
            position: relative;
            overflow: hidden;
        }
        
        .slide {
            display: none;
            width: 100%;
            height: 100%;
            animation: fadeIn 0.5s;
        }
        
        .slide.active {
            display: block;
        }
        
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        
        .btn:active {
            transform: translateY(-1px);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .slide-counter {
            color: white;
            font-size: 20px;
            font-weight: bold;
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 20px;
        }
        
        .progress-bar {
            width: 100%;
            max-width: 1200px;
            height: 8px;
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            margin-top: 15px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: white;
            transition: width 0.3s;
            border-radius: 10px;
        }
        
        .slide-number {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255,255,255,0.9);
            color: #667eea;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        @media (max-width: 768px) {
            .presentation-container {
                aspect-ratio: 4/3;
            }
            .btn {
                padding: 12px 20px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="presentation-container">
        <!-- Slide 1: Cover -->
        <div class="slide active" id="slide-1">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 675'%3E%3Crect fill='%2387CEEB' width='1200' height='675'/%3E%3Ctext x='600' y='337' font-family='Arial' font-size='48' fill='white' text-anchor='middle'%3EHello Again! Lesson 1b%3C/text%3E%3C/svg%3E" alt="Slide 1: Hello Again! Lesson 1b">
            <div class="slide-number">1 / 7</div>
        </div>
        
        <!-- Slide 2: Who's this? -->
        <div class="slide" id="slide-2">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 675'%3E%3Crect fill='%23FFE4E1' width='1200' height='675'/%3E%3Ctext x='600' y='337' font-family='Arial' font-size='48' fill='%23FF6B6B' text-anchor='middle'%3EWho's this?%3C/text%3E%3C/svg%3E" alt="Slide 2: Who's this?">
            <div class="slide-number">2 / 7</div>
        </div>
        
        <!-- Slide 3: Hello, Goodbye, I'm -->
        <div class="slide" id="slide-3">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 675'%3E%3Crect fill='%23E0F7FA' width='1200' height='675'/%3E%3Ctext x='600' y='337' font-family='Arial' font-size='48' fill='%2300BCD4' text-anchor='middle'%3EHello / Goodbye / I'm%3C/text%3E%3C/svg%3E" alt="Slide 3: Hello, Goodbye, I'm">
            <div class="slide-number">3 / 7</div>
        </div>
        
        <!-- Slide 4: What's your name? -->
        <div class="slide" id="slide-4">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 675'%3E%3Crect fill='%23E8F5E9' width='1200' height='675'/%3E%3Ctext x='600' y='337' font-family='Arial' font-size='48' fill='%234CAF50' text-anchor='middle'%3EWhat's your name?%3C/text%3E%3C/svg%3E" alt="Slide 4: What's your name?">
            <div class="slide-number">4 / 7</div>
        </div>
        
        <!-- Slide 5: Magic Microphone Game -->
        <div class="slide" id="slide-5">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 675'%3E%3Crect fill='%23F3E5F5' width='1200' height='675'/%3E%3Ctext x='600' y='337' font-family='Arial' font-size='48' fill='%239C27B0' text-anchor='middle'%3EMagic Microphone Game%3C/text%3E%3C/svg%3E" alt="Slide 5: Magic Microphone Game">
            <div class="slide-number">5 / 7</div>
        </div>
        
        <!-- Slide 6: Let's Move! -->
        <div class="slide" id="slide-6">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 675'%3E%3Crect fill='%23FFF3E0' width='1200' height='675'/%3E%3Ctext x='600' y='337' font-family='Arial' font-size='48' fill='%23FF9800' text-anchor='middle'%3ELet's Move!%3C/text%3E%3C/svg%3E" alt="Slide 6: Let's Move!">
            <div class="slide-number">6 / 7</div>
        </div>
        
        <!-- Slide 7: Great job! -->
        <div class="slide" id="slide-7">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 675'%3E%3Crect fill='%23FCE4EC' width='1200' height='675'/%3E%3Ctext x='600' y='337' font-family='Arial' font-size='48' fill='%23E91E63' text-anchor='middle'%3EGreat job! See you next time!%3C/text%3E%3C/svg%3E" alt="Slide 7: Great job!">
            <div class="slide-number">7 / 7</div>
        </div>
    </div>
    
    <div class="controls">
        <button class="btn" id="prev-btn" onclick="changeSlide(-1)">← Назад</button>
        <div class="slide-counter">Слайд <span id="current-slide">1</span> из 7</div>
        <button class="btn" id="next-btn" onclick="changeSlide(1)">Вперёд →</button>
    </div>
    
    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 14%"></div>
    </div>
    
    <script>
        let currentSlide = 1;
        const totalSlides = 7;
        
        function changeSlide(direction) {
            const newSlide = currentSlide + direction;
            
            if (newSlide >= 1 && newSlide <= totalSlides) {
                document.getElementById('slide-' + currentSlide).classList.remove('active');
                currentSlide = newSlide;
                document.getElementById('slide-' + currentSlide).classList.add('active');
                
                document.getElementById('current-slide').textContent = currentSlide;
                
                const progress = (currentSlide / totalSlides) * 100;
                document.getElementById('progress-fill').style.width = progress + '%';
                
                document.getElementById('prev-btn').disabled = currentSlide === 1;
                document.getElementById('next-btn').disabled = currentSlide === totalSlides;
            }
        }
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                changeSlide(1);
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                changeSlide(-1);
            }
        });
        
        // Touch support for mobile
        let touchStartX = 0;
        let touchEndX = 0;
        
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });
        
        document.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });
        
        function handleSwipe() {
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    changeSlide(1);
                } else {
                    changeSlide(-1);
                }
            }
        }
        
        // Initialize
        document.getElementById('prev-btn').disabled = true;
    </script>
</body>
</html>

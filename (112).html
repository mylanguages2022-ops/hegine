<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"Comic Sans MS","Segoe UI",Verdana,sans-serif;
    background:#f4f0e8;
    background-image:
      radial-gradient(rgba(139,90,43,.06) 1px, transparent 1.5px);
    background-size:100px 100px;
    color:#2c1810;min-height:100vh;padding:20px 12px 80px;
  }
  .wrap{max-width:780px;margin:0 auto}

  /* ---------- МУЗЕЙ ---------- */
  .topbar{
    background:#fffdf5;border-radius:14px;padding:18px 18px 22px;
    border:4px double #8b4513;
    box-shadow:0 10px 30px rgba(139,69,19,.3), inset 0 0 30px rgba(212,165,116,.1);
    margin-bottom:28px;position:relative;
  }
  .topbar::before,.topbar::after{
    content:'';position:absolute;top:0;bottom:0;width:40px;
    background:linear-gradient(180deg,#d4a574 0%,#8b4513 100%);
  }
  .topbar::before{left:0;border-radius:14px 0 0 14px}
  .topbar::after{right:0;border-radius:0 14px 14px 0}
  .topbar h1{
    font-size:clamp(1.05rem,4vw,1.45rem);color:#8b4513;text-align:center;line-height:1.35;
    letter-spacing:.5px;position:relative;z-index:1;
  }
  .topbar h1::before{content:'🏛️ ';}
  .bar-wrap{margin-top:16px;position:relative;z-index:1}
  .bar-label{
    display:flex;justify-content:space-between;align-items:center;
    font-size:.8rem;color:#8b4513;margin-bottom:8px;font-weight:700;letter-spacing:1px;
  }
  .bar-track{
    height:26px;background:#e8dcc8;border-radius:13px;overflow:hidden;
    border:3px solid #8b4513;position:relative;
    background-image:repeating-linear-gradient(90deg, transparent 0 48px, rgba(139,69,19,.15) 48px 50px);
  }
  .bar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,#d4a574,#8b4513);
    transition:width .5s cubic-bezier(.34,1.4,.64,1);
  }
  .bar-runner{
    position:absolute;top:-10px;left:0;font-size:1.5rem;
    transform:translateX(-50%);transition:left .5s cubic-bezier(.34,1.4,.64,1);
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));
  }
  .stars{margin-top:12px;text-align:center;font-size:1.05rem;letter-spacing:4px;color:#8b4513;position:relative;z-index:1}

  /* ---------- ЭКСПОНАТ ---------- */
  .stage{
    background:#fffdf5;border-radius:12px;padding:38px 22px 44px;position:relative;
    border:4px double #8b4513;color:#2c1810;
    box-shadow:0 10px 30px rgba(139,69,19,.3);
    animation:pop .35s ease;
  }
  .stage::before{
    content:'🎨';position:absolute;top:-18px;left:20px;font-size:1.6rem;
    background:#d4a574;padding:4px 8px;border-radius:10px;border:2px solid #8b4513;
  }
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .stage.shake{animation:shake .45s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-9px)}40%{transform:translateX(9px)}
    60%{transform:translateX(-6px)}80%{transform:translateX(6px)}
  }
  .step-tag{
    display:inline-block;background:#8b4513;color:#fff;
    font-size:.76rem;font-weight:700;padding:5px 14px;border-radius:999px;
    letter-spacing:1.5px;margin-bottom:14px;
  }
  .mech-tag{
    display:inline-block;background:#fff4d8;color:#8a5a10;
    font-size:.72rem;font-weight:700;padding:3px 11px;border-radius:999px;
    border:2px solid #d4a574;margin-left:6px;margin-bottom:14px;letter-spacing:.3px;
  }
  .hero{font-size:3.1rem;text-align:center;display:block;margin:4px 0 12px;line-height:1.15}
  .stage h2{font-size:clamp(1.05rem,3.8vw,1.4rem);color:#8b4513;text-align:center;margin-bottom:14px;line-height:1.35}

  .task-text{
    font-size:1rem;line-height:1.65;color:#4a3520;text-align:center;
    margin:0 auto 22px;max-width:540px;
  }
  .en-inline{font-weight:700;color:#5a2a08}

  .speak-line{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0 22px}
  .speak-big{
    background:#8b4513;color:#fff;border:none;border-radius:999px;
    padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer;
    font-family:inherit;box-shadow:0 4px 0 #5a2a08;transition:.15s;
    display:inline-flex;align-items:center;gap:9px;letter-spacing:.4px;
  }
  .speak-big:hover{background:#5a2a08;transform:translateY(-2px)}
  .speak-big:active{transform:translateY(1px);box-shadow:0 2px 0 #5a2a08}
  .speak-mini{
    width:36px;height:36px;border-radius:50%;border:2px solid #8b4513;
    background:#d4a574;color:#fff;font-size:.95rem;cursor:pointer;
    box-shadow:0 3px 0 #5a2a08;transition:.15s;
    display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .speak-mini:hover{transform:scale(1.1) rotate(-8deg);background:#8b4513}
  .speak-mini:active{transform:scale(.94)}

  .opts{display:flex;flex-direction:column;gap:12px;margin-top:8px}
  .opts.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .opt{
    background:#fffdf5;border:2px solid #d4a574;border-left:8px solid #8b4513;border-radius:10px;
    padding:14px 15px;cursor:pointer;font-family:inherit;font-size:1.02rem;
    color:#2c1810;text-align:left;display:flex;align-items:center;gap:10px;
    transition:.16s;font-weight:600;line-height:1.4;box-shadow:0 2px 0 rgba(139,69,19,.25);
  }
  .opt:hover{border-color:#8b4513;background:#fff4dc;transform:translateX(3px)}
  .opt .mark{
    flex:0 0 30px;height:30px;border-radius:50%;background:#8b4513;color:#d4a574;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem;
  }
  .opt.correct{background:#eafff0;border-color:#2e8b57;border-left-color:#2e8b57;animation:bounce .45s}
  .opt.wrong{background:#fff0f0;border-color:#c0392b;border-left-color:#c0392b;animation:shake .4s}
  @keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  .opt:disabled{cursor:default}

  .yesno-scene,.size-scene{
    background:#fff4dc;border:3px dashed #8b4513;border-radius:14px;
    padding:22px 14px;text-align:center;margin-bottom:20px;
  }
  .yesno-scene .big,.size-scene .big{font-size:2.6rem;letter-spacing:6px;display:block;margin-bottom:10px}
  .yesno-row,.size-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .yesno-btn,.size-btn{
    flex:1 1 160px;max-width:240px;border-radius:12px;padding:16px 12px;
    font-family:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;transition:.15s;
    border:3px solid;letter-spacing:.5px;
  }
  .yesno-btn.yes{background:#eafff0;border-color:#2e8b57;color:#1f6b41;box-shadow:0 4px 0 #1f6b41}
  .yesno-btn.no{background:#fff4f4;border-color:#c0392b;color:#8e2a1f;box-shadow:0 4px 0 #8e2a1f}
  .size-btn.big{background:#eaf4fa;border-color:#2980b9;color:#1a5080;box-shadow:0 4px 0 #1a5080}
  .size-btn.small{background:#fff4dc;border-color:#e67e22;color:#a05010;box-shadow:0 4px 0 #a05010}
  .yesno-btn:hover,.size-btn:hover{transform:translateY(-2px)}
  .yesno-btn.correct,.size-btn.correct{animation:bounce .45s}
  .yesno-btn.wrong,.size-btn.wrong{animation:shake .4s}

  .countbox{
    background:#fff4dc;border:3px dashed #8b4513;border-radius:14px;
    padding:22px 14px;text-align:center;margin-bottom:20px;
  }
  .countbox .items{font-size:2.4rem;letter-spacing:9px;line-height:1.6;word-break:break-word}

  .match-area{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
  .mcol{display:flex;flex-direction:column;gap:12px}
  .mcol h4{text-align:center;font-size:.82rem;color:#8b4513;font-weight:700;margin-bottom:2px;letter-spacing:1px}
  .mitem{
    background:#fffdf5;border:2px solid #d4a574;border-radius:10px;padding:12px 8px;
    cursor:pointer;font-family:inherit;font-size:1rem;font-weight:700;color:#2c1810;
    text-align:center;transition:.16s;display:flex;align-items:center;justify-content:center;gap:7px;
    min-height:58px;box-shadow:0 2px 0 rgba(139,69,19,.2);
  }
  .mitem:hover{border-color:#8b4513;background:#fff4dc}
  .mitem.sel{background:#fff4dc;box-shadow:0 0 0 3px rgba(139,69,19,.2)}
  .mitem.done{background:#eafff0;border-color:#2e8b57;color:#1f6b41;cursor:default;opacity:.85}
  .mitem.bad{animation:shake .4s;border-color:#c0392b;background:#fff0f0}
  .mitem .pic{font-size:1.6rem}

  .order-pool,.order-slots{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .order-slots{
    min-height:70px;background:#fff4dc;border:3px dashed #8b4513;border-radius:14px;
    padding:14px 10px;margin-bottom:20px;align-items:center;
  }
  .order-slots.empty-pool::after{content:'выкладывайте фразы ниже ⬇️';color:#8a7a6a;font-size:.88rem}
  .otile{
    background:#fffdf5;border:2px solid #8b4513;border-radius:10px;padding:10px 14px;
    cursor:pointer;font-family:inherit;font-size:.98rem;font-weight:700;color:#5a3a10;
    transition:.15s;display:flex;align-items:center;gap:7px;box-shadow:0 3px 0 #5a2a08;
  }
  .otile:hover{transform:translateY(-2px);background:#fff4dc}
  .otile.placed{border-color:#2e8b57;background:#eafff0;color:#1f6b41;box-shadow:0 3px 0 #1f6b41}
  .otile.bad{animation:shake .4s;border-color:#c0392b;background:#fff0f0}
  .otile.used{opacity:.3;pointer-events:none}
  .otile .num{font-size:1.4rem}

  .spell-slots{display:flex;gap:10px;justify-content:center;margin:8px 0 22px;flex-wrap:wrap}
  .slot{
    width:52px;height:60px;border-radius:10px;background:#fff4dc;
    border:3px dashed #8b4513;display:flex;align-items:center;justify-content:center;
    font-size:1.75rem;font-weight:700;color:#8b4513;text-transform:uppercase;
  }
  .slot.filled{border-style:solid;border-color:#2e8b57;background:#eafff0}
  .slot.bad{border-color:#c0392b;background:#fff0f0;animation:shake .4s}
  .letter-pool{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .letter{
    width:54px;height:60px;border-radius:10px;border:3px solid #d4a574;background:#fff4d8;
    font-family:inherit;font-size:1.7rem;font-weight:700;color:#8b4513;cursor:pointer;
    text-transform:uppercase;box-shadow:0 4px 0 #8b4513;transition:.14s;
  }
  .letter:hover{transform:translateY(-3px);background:#ffe4b8}
  .letter.used{opacity:.25;pointer-events:none;box-shadow:none;transform:none}

  .drag-zone{
    background:#fff4dc;border:3px dashed #8b4513;border-radius:14px;
    padding:22px 14px;text-align:center;margin-bottom:20px;min-height:130px;
  }
  .drag-item{
    display:inline-block;background:#fffdf5;border:2px solid #8b4513;border-radius:10px;
    padding:10px 16px;margin:6px;cursor:pointer;font-family:inherit;font-size:1.02rem;
    font-weight:700;color:#5a3a10;box-shadow:0 3px 0 #5a2a08;transition:.15s;
  }
  .drag-item:hover{transform:translateY(-3px);background:#fff4dc}
  .drag-item.chosen{background:#eafff0;border-color:#2e8b57;color:#1f6b41;box-shadow:0 3px 0 #1f6b41}
  .drag-item.bad{animation:shake .4s;border-color:#c0392b;background:#fff0f0}

  .fb{
    margin-top:24px;padding:18px 20px;border-radius:12px;font-size:1rem;
    line-height:1.6;text-align:center;display:none;font-weight:600;
  }
  .fb.show{display:block;animation:pop .3s}
  .fb.good{background:#eafff0;border:3px double #2e8b57;color:#1f6b41}
  .fb.bad{background:#fff4f4;border:3px double #c0392b;color:#8e2a1f}
  .fb .again{
    margin-top:12px;background:#fff;border:2px solid #c0392b;color:#8e2a1f;
    border-radius:999px;padding:7px 16px;font-family:inherit;font-weight:700;
    font-size:.9rem;cursor:pointer;
  }
  .fb .again:hover{background:#ffeaea}

  .nav{display:flex;gap:12px;justify-content:center;margin-top:30px;flex-wrap:wrap}
  .nav button{
    border:none;border-radius:999px;padding:13px 26px;font-family:inherit;
    font-size:1rem;font-weight:700;cursor:pointer;transition:.16s;
    display:inline-flex;align-items:center;gap:8px;letter-spacing:.3px;
  }
  .btn-next{background:#8b4513;color:#fff;box-shadow:0 5px 0 #5a2a08}
  .btn-next:hover{background:#5a2a08;transform:translateY(-2px)}
  .btn-back{background:#fffdf5;color:#8b4513;border:3px dashed #d4a574 !important;box-shadow:0 5px 0 #d4a574}
  .btn-back:hover{background:#fff4dc}
  .btn-back:disabled,.btn-next:disabled{opacity:.4;cursor:default;transform:none}
  .btn-replay{background:#d4a574;color:#fff;box-shadow:0 5px 0 #8b4513}
  .btn-replay:hover{background:#c09060}

  .final{text-align:center}
  .final .big{
    font-size:3.4rem;display:inline-block;margin-bottom:16px;
    background:linear-gradient(145deg,#d4a574 0%,#8b4513 50%,#5a2a08 100%);
    border-radius:50%;width:110px;height:110px;line-height:110px;
    border:5px double #8b4513;animation:float 2.4s ease-in-out infinite;
    box-shadow:0 8px 0 rgba(139,69,19,.4);
  }
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .final h2{font-size:clamp(1.25rem,4.5vw,1.8rem);color:#8b4513;margin-bottom:14px}
  .final p{font-size:1.02rem;line-height:1.7;color:#4a3520;margin-bottom:16px}
  .reward{
    background:#fff4dc;border:3px dashed #8b4513;border-radius:14px;
    padding:28px 22px 34px;margin:28px 0 32px;
  }
  .reward .head{font-weight:700;margin-bottom:14px;color:#8b4513;font-size:1.05rem}
  .reward .words{font-size:1.02rem;line-height:2;color:#4a3520;text-align:left;padding-bottom:6px}
  .reward .words b{color:#5a2a08}
  .reward .words div{padding:6px 0;border-bottom:1px dotted #d4a574;margin-bottom:5px}
  .reward .words div:last-child{border-bottom:none;margin-bottom:0}
  .restart{background:#8b4513;color:#fff;box-shadow:0 5px 0 #5a2a08}
  .restart:hover{background:#5a2a08}

  .start-screen{text-align:center}
  .start-screen .cast{font-size:2.6rem;letter-spacing:6px;margin:16px 0 8px}
  .start-screen ul{
    list-style:none;text-align:left;margin:18px auto;max-width:440px;
    background:#fff4dc;border:3px dashed #8b4513;border-radius:14px;padding:18px 20px;
  }
  .start-screen li{
    padding:8px 0 8px 32px;position:relative;font-size:.97rem;color:#4a3520;line-height:1.5;
    border-bottom:1px dotted #d4a574;
  }
  .start-screen li:last-child{border-bottom:none}
  .start-screen li::before{content:'🏛️';position:absolute;left:0;top:8px;font-size:.95rem}
  .sound-note{
    background:#fffdf5;border:2px solid #d4a574;border-radius:12px;padding:12px 16px;
    font-size:.88rem;color:#8b4513;margin-top:18px;line-height:1.55;
  }

  @media (max-width:560px){
    .match-area{grid-template-columns:1fr 1fr;gap:8px}
    .mitem{font-size:.88rem;min-height:52px;padding:9px 5px}
    .mitem .pic{font-size:1.3rem}
    .slot,.letter{width:44px;height:52px;font-size:1.4rem}
    .countbox .items{font-size:1.9rem;letter-spacing:5px}
    .hero{font-size:2.6rem}
    .nav button{padding:12px 18px;font-size:.95rem}
    .stage{padding:32px 14px 38px}
  }
</style>

<body>
<div class="wrap">

  <div class="topbar">
    <h1>Экскурсия по выставке</h1>
    <div class="bar-wrap">
      <div class="bar-label">
        <span id="stepLabel">ЭКСПОНАТ 0 ИЗ 16</span>
        <span id="pctLabel">0%</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="barFill"></div>
        <div class="bar-runner" id="barRunner">🎨</div>
      </div>
      <div class="stars" id="stars"></div>
    </div>
  </div>

  <div id="stageHost"></div>

</div>

<script>
(function(){
  "use strict";

  var RATE = 0.85;
  var voices = [];

  function loadVoices(){
    if(!('speechSynthesis' in window)) return;
    voices = window.speechSynthesis.getVoices() || [];
  }
  loadVoices();
  if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = loadVoices;
    setTimeout(loadVoices, 350);
    setTimeout(loadVoices, 1400);
  }

  function pickVoice(){
    if(!voices.length) loadVoices();
    var v;
    v = voices.find(function(x){ return x.lang === 'en-GB'; });
    if(v) return v;
    v = voices.find(function(x){ return x.lang && x.lang.toLowerCase().indexOf('en-gb') === 0; });
    if(v) return v;
    v = voices.find(function(x){ return x.lang === 'en-US'; });
    if(v) return v;
    v = voices.find(function(x){ return x.lang && x.lang.toLowerCase().indexOf('en') === 0; });
    return v || null;
  }

  function speak(text, delay){
    if(!('speechSynthesis' in window)) return;
    var go = function(){
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      var v = pickVoice();
      if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'en-GB'; }
      u.rate = RATE; u.pitch = 1.06; u.volume = 1;
      window.speechSynthesis.speak(u);
    };
    if(delay){ setTimeout(go, delay); } else { go(); }
  }

  function speakSeq(arr){
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    arr.forEach(function(t, i){
      setTimeout(function(){
        var u = new SpeechSynthesisUtterance(t);
        var v = pickVoice();
        if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'en-GB'; }
        u.rate = RATE; u.pitch = 1.06;
        window.speechSynthesis.speak(u);
      }, i * 1500);
    });
  }

  var STEPS = [

  /* 1 */ {
    kind:'intro', emoji:'🏛️', mech:'Начало экскурсии',
    title:'Выставка моих любимых',
    text:'Сегодня ты — куратор выставки питомцев. Перед тобой шестнадцать экспонатов: каждый со своей историей, описанием и умениями. Твоя задача — рассказать про каждого: **I\'ve got a rabbit! It has got big ears!** Шестнадцать экспонатов — и ты главный куратор выставки.',
    say:"I've got a rabbit! It has got big ears!",
    sayRu:'У меня есть кролик! У него большие уши!',
    cta:'🏛️ Начать экскурсию!'
  },

  /* 2 */ {
    kind:'listen', emoji:'👂', mech:'Аудирование',
    title:'Экспонат 1: первое описание',
    text:'Нажми на табличку и выбери фразу, которую услышал.',
    say:"I've got a cat. It has got small ears.",
    opts:[
      {t:"I've got a cat. It has got small ears. — у меня кошка. у неё маленькие уши", say:"I've got a cat. It has got small ears."},
      {t:"I've got a dog. It has got big ears. — у меня собака. у неё большие уши", say:"I've got a dog. It has got big ears."},
      {t:"I've got a rabbit. It has got long ears. — у меня кролик. у него длинные уши", say:"I've got a rabbit. It has got long ears."}
    ],
    correct:0,
    ok:'Да, это про кошку: **I\'ve got a cat. It has got small ears.**',
    no:'Послушай ещё раз: речь про кошку с маленькими ушами.'

  var TOTAL = STEPS.length;
  var idx = 0;
  var history = [];
  var score = 0;
  var stageHost = document.getElementById('stageHost');
  var barFill = document.getElementById('barFill');
  var barRunner = document.getElementById('barRunner');
  var stepLabel = document.getElementById('stepLabel');
  var pctLabel = document.getElementById('pctLabel');
  var starsBox = document.getElementById('stars');

  function bold(str){
    return String(str).replace(/\*\*(.+?)\*\*/g, '<span class="en-inline">$1</span>');
  }

  function updateBar(){
    var pct = Math.round((idx / (TOTAL - 1)) * 100);
    if(pct < 0) pct = 0; if(pct > 100) pct = 100;
    barFill.style.width = pct + '%';
    barRunner.style.left = pct + '%';
    stepLabel.textContent = idx === 0 ? 'ЭКСПОНАТ 0 ИЗ ' + (TOTAL - 1) : ('ЭКСПОНАТ ' + idx + ' ИЗ ' + (TOTAL - 1));
    pctLabel.textContent = pct + '%';
    var full = Math.floor(score / 3);
    var s = '';
    for(var i = 0; i < full && i < 6; i++){ s += '🏛️'; }
    starsBox.textContent = s;
  }

  function shakeStage(){
    var st = stageHost.querySelector('.stage');
    if(!st) return;
    st.classList.remove('shake');
    void st.offsetWidth;
    st.classList.add('shake');
  }

  function speakerBtn(text, cls, title){
    var b = document.createElement('button');
    b.className = cls || 'speak-mini';
    b.innerHTML = '🔊';
    b.title = title || 'Прослушать';
    b.setAttribute('aria-label','Прослушать: ' + text);
    b.addEventListener('click', function(ev){ ev.stopPropagation(); speak(text); });
    return b;
  }

  function nextBtn(label, fn, cls){
    var b = document.createElement('button');
    b.className = cls || 'btn-next';
    b.textContent = label;
    b.addEventListener('click', fn);
    return b;
  }

  function goNext(){
    if(idx < TOTAL - 1){
      history.push(idx);
      idx++;
      render();
    }
  }
  function goBack(){
    if(history.length){
      idx = history.pop();
      render();
    }
  }

  function render(){
    window.scrollTo({top:0, behavior:'smooth'});
    updateBar();
    stageHost.innerHTML = '';
    var s = STEPS[idx];

    var stage = document.createElement('div');
    stage.className = 'stage';
    stageHost.appendChild(stage);

    if(s.kind === 'intro')   return renderIntro(stage, s);
    if(s.kind === 'final')   return renderFinal(stage, s);
    if(s.kind === 'listen' || s.kind === 'choice') return renderChoice(stage, s);
    if(s.kind === 'yesno')   return renderYesNo(stage, s);
    if(s.kind === 'size')    return renderSize(stage, s);
    if(s.kind === 'count')   return renderCount(stage, s);
    if(s.kind === 'spell')   return renderSpell(stage, s);
    if(s.kind === 'match')   return renderMatch(stage, s);
    if(s.kind === 'order')   return renderOrder(stage, s);
    if(s.kind === 'pick')    return renderPick(stage, s);
  }

  function header(stage, s){
    var tag = document.createElement('span');
    tag.className = 'step-tag';
    tag.textContent = 'ЭКСПОНАТ ' + (idx + 1) + ' ИЗ ' + TOTAL;
    stage.appendChild(tag);

    if(s.mech){
      var m = document.createElement('span');
      m.className = 'mech-tag';
      m.textContent = s.mech;
      stage.appendChild(m);
    }
    var hero = document.createElement('span');
    hero.className = 'hero';
    hero.textContent = s.emoji || '🏛️';
    stage.appendChild(hero);

    var h2 = document.createElement('h2');
    h2.textContent = s.title;
    stage.appendChild(h2);

    var p = document.createElement('div');
    p.className = 'task-text';
    p.innerHTML = bold(s.text);
    stage.appendChild(p);
  }

  function speakBlock(stage, s){
    if(!s.say) return;
    var line = document.createElement('div');
    line.className = 'speak-line';
    var big = document.createElement('button');
    big.className = 'speak-big';
    big.innerHTML = '🔊 ' + s.say;
    big.addEventListener('click', function(){ speak(s.say); });
    line.appendChild(big);
    stage.appendChild(line);
    if(s.sayRu){
      var r = document.createElement('div');
      r.className = 'task-text';
      r.style.marginTop = '-8px';
      r.style.fontSize = '.92rem';
      r.textContent = s.sayRu;
      stage.appendChild(r);
    }
  }

  function feedback(stage, s, onWin){
    var fb = document.createElement('div');
    fb.className = 'fb';
    stage.appendChild(fb);

    var nav = document.createElement('div');
    nav.className = 'nav';

    var back = nextBtn('⬅️ Назад', goBack, 'btn-back');
    if(!history.length) back.disabled = true;
    nav.appendChild(back);

    var replay = nextBtn('🔁 Ещё раз', function(){ render(); }, 'btn-replay');
    nav.appendChild(replay);

    var next = nextBtn('Следующий экспонат ➡️', goNext);
    next.style.display = 'none';
    nav.appendChild(next);

    stage.appendChild(nav);

    function showGood(){
      fb.className = 'fb good show';
      fb.innerHTML = bold(s.ok || 'Экспонат описан!');
      next.style.display = '';
      speak('Well done!', 250);
      if(onWin) onWin();
    }
    function showBad(){
      fb.className = 'fb bad show';
      fb.innerHTML = bold(s.no || 'Попробуй ещё раз!') +
        '<br><button class="again" type="button">🔁 Попробовать снова</button>';
      var ag = fb.querySelector('.again');
      ag.addEventListener('click', function(){ render(); });
      shakeStage();
      speak('Try again!', 200);
    }
    return {good:showGood, bad:showBad, next:next, back:back};
  }

  function renderIntro(stage, s){
    header(stage, s);
    speakBlock(stage, s);

    var cast = document.createElement('div');
    cast.className = 'start-screen';
    cast.innerHTML = '<div class="cast">🏛️ 🐱 🐶 🐰 🎨</div>';
    stage.appendChild(cast);

    var list = document.createElement('ul');
    ['Называть питомцев: cat, dog, rabbit, mouse, duck, tortoise',
     'Описывать части тела: eyes, ears, nose, mouth',
     'Различать размер: big, small, long',
     'Рассказывать про умения: It can jump / It can\'t fly',
     'Провести экскурсию по шестнадцати экспонатам'
    ].forEach(function(t){
      var li = document.createElement('li');
      li.textContent = t;
      list.appendChild(li);
    });
    stage.appendChild(list);

    var note = document.createElement('div');
    note.className = 'sound-note';
    note.innerHTML = '🔈 Включите звук. Все фразы озвучены британским голосом. В задании «Big или small» — две кнопки: синяя BIG и оранжевая SMALL.';
    stage.appendChild(note);

    var nav = document.createElement('div');
    nav.className = 'nav';
    nav.appendChild(nextBtn(s.cta || 'Начать ➡️', goNext));
    stage.appendChild(nav);

    speak(s.say, 500);
  }

  function renderSize(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score++; updateBar(); });

    var scene = document.createElement('div');
    scene.className = 'size-scene';
    var big = document.createElement('span');
    big.className = 'big';
    big.textContent = s.scene || '❓';
    scene.appendChild(big);
    stage.insertBefore(scene, stage.querySelector('.nav'));

    var line = document.createElement('div');
    line.className = 'speak-line';
    var sb = document.createElement('button');
    sb.className = 'speak-big';
    sb.innerHTML = '🔊 ' + s.say;
    sb.addEventListener('click', function(){ speak(s.say); });
    line.appendChild(sb);
    stage.insertBefore(line, stage.querySelector('.nav'));
    speak(s.say, 600);

    var row = document.createElement('div');
    row.className = 'size-row';
    stage.insertBefore(row, stage.querySelector('.nav'));

    var locked = false;
    [['big','📏 BIG — большой'], ['small','🤏 SMALL — маленький']].forEach(function(pair){
      var val = pair[0];
      var b = document.createElement('button');
      b.className = 'size-btn ' + val;
      b.type = 'button';
      b.textContent = pair[1];
      b.addEventListener('click', function(){
        if(locked) return;
        if(val === s.answer){
          locked = true;
          b.classList.add('correct');
          speak(s.say, 100);
          setTimeout(fb.good, 600);
        } else {
          b.classList.add('wrong');
          setTimeout(function(){ b.classList.remove('wrong'); }, 600);
          fb.bad();
        }
      });
      row.appendChild(b);
    });
  }

  function renderChoice(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score++; updateBar(); });

    if(s.kind === 'listen'){
      var line = document.createElement('div');
      line.className = 'speak-line';
      var big = document.createElement('button');
      big.className = 'speak-big';
      big.innerHTML = '🔊 Прослушать';
      big.addEventListener('click', function(){ speak(s.say); });
      line.appendChild(big);
      stage.insertBefore(line, stage.querySelector('.nav'));
      speak(s.say, 600);
    } else {
      speakBlock(stage, s);
    }

    var box = document.createElement('div');
    box.className = 'opts' + (s.opts.length > 3 ? ' grid2' : '');
    var navEl = stage.querySelector('.nav');
    stage.insertBefore(box, navEl);

    var locked = false;
    s.opts.forEach(function(o, i){
      var b = document.createElement('button');
      b.className = 'opt';
      b.type = 'button';
      var mk = document.createElement('span');
      mk.className = 'mark';
      mk.textContent = String.fromCharCode(65 + i);
      b.appendChild(mk);
      var tx = document.createElement('span');
      tx.innerHTML = bold(o.t);
      b.appendChild(tx);
      b.appendChild(speakerBtn(o.say || o.t.replace(/\/.*?\//g,'').replace(/—.*$/,'').trim(), 'speak-mini'));

      b.addEventListener('click', function(){
        if(locked) return;
        if(i === s.correct){
          locked = true;
          b.classList.add('correct');
          Array.prototype.forEach.call(box.children, function(x){ x.disabled = true; });
          speak(o.say || o.t, 120);
          setTimeout(fb.good, 650);
        } else {
          b.classList.add('wrong');
          setTimeout(function(){ b.classList.remove('wrong'); }, 600);
          fb.bad();
        }
      });
      box.appendChild(b);
    });
  }

  function renderYesNo(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score++; updateBar(); });

    var box = document.createElement('div');
    box.className = 'yesno-scene';
    var big = document.createElement('span');
    big.className = 'big';
    big.textContent = s.scene || '❓';
    box.appendChild(big);
    stage.insertBefore(box,

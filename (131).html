<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Квест: Кулинарный пазл</title>
<meta name="description" content="Финальный квест к уроку Кулинарный пазл.">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Arial Rounded MT Bold', 'Comic Sans MS', sans-serif; background: #81d4fa; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
.top-bar { width: 100%; background: #0277bd; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); position: sticky; top: 0; z-index: 100; }
.title { font-size: 1.2em; font-weight: bold; }
.progress-wrap { flex: 1; margin: 0 20px; background: #01579b; height: 20px; border-radius: 10px; position: relative; overflow: hidden; }
.progress-bar { height: 100%; background: linear-gradient(90deg, #ffeb3b, #ff9800); width: 0%; transition: width 0.5s ease; }
.hero-run { position: absolute; top: -5px; left: 0; font-size: 1.5em; transition: left 0.5s ease; animation: heroRun 0.5s infinite alternate; }
.stats { font-size: 1em; font-weight: bold; min-width: 80px; text-align: right; }
.badges { display: flex; gap: 5px; margin-left: 10px; }
.badge { font-size: 1.2em; opacity: 0.3; transition: 0.3s; }
.badge.earned { opacity: 1; animation: starBurst 0.5s ease; }

.container { width: 100%; max-width: 600px; padding: 20px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
.scene-bg { position: fixed; bottom: 0; left: 0; width: 100%; height: 30%; background: #8d6e63; z-index: -1; border-top: 10px solid #5d4037; }
.truck { position: fixed; bottom: 15%; left: -200px; font-size: 5em; z-index: -1; animation: truckDrive 20s linear infinite; }
.wheel { display: inline-block; animation: wheelSpin 1s linear infinite; }
.smoke { position: absolute; top: -20px; left: 10px; font-size: 0.5em; animation: smokePuff 2s infinite; opacity: 0; }

.card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 100%; text-align: center; animation: fadeSlideIn 0.5s ease; border: 5px solid #ff9800; position: relative; }
.card.exit { animation: fadeSlideOut 0.3s ease forwards; }
.instruction { font-size: 1.5em; color: #3e2723; margin-bottom: 20px; line-height: 1.4; }
.sound-btn-main { background: #4caf50; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-size: 1.2em; cursor: pointer; margin-bottom: 20px; box-shadow: 0 5px 0 #2e7d32; transition: 0.1s; }
.sound-btn-main:active { transform: translateY(5px); box-shadow: none; }

.game-zone { min-height: 200px; display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; align-items: center; margin-bottom: 20px; }
.option-btn { background: #fff3e0; border: 3px solid #ff9800; padding: 15px 25px; border-radius: 15px; font-size: 1.3em; cursor: pointer; transition: 0.2s; min-width: 100px; }
.option-btn:hover { background: #ffe0b2; transform: scale(1.05); }
.option-btn.correct { background: #c8e6c9; border-color: #4caf50; animation: correctPop 0.5s ease; }
.option-btn.wrong { background: #ffcdd2; border-color: #f44336; animation: wrongShake 0.5s ease; }
.option-btn:disabled { cursor: default; opacity: 0.7; }

.letter-btn { width: 50px; height: 50px; font-size: 1.5em; font-weight: bold; border-radius: 10px; background: #e3f2fd; border: 2px solid #1976d2; }
.letter-btn.selected { background: #1976d2; color: white; }

.feedback { font-size: 1.5em; font-weight: bold; margin: 15px 0; min-height: 40px; }
.feedback.success { color: #2e7d32; }
.feedback.error { color: #c62828; }
.shake { animation: wrongShake 0.5s ease; }

.nav-btns { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
.nav-btn { padding: 12px 25px; border: none; border-radius: 10px; font-size: 1.1em; cursor: pointer; font-weight: bold; }
.btn-back { background: #bdbdbd; color: white; }
.btn-retry { background: #ff9800; color: white; display: none; }
.btn-next { background: #4caf50; color: white; display: none; }
.btn-start { background: #e91e63; color: white; font-size: 1.5em; padding: 20px 40px; border-radius: 50px; box-shadow: 0 8px 0 #880e4f; animation: fadeSlideIn 1s ease; }
.btn-start:active { transform: translateY(8px); box-shadow: none; }

.intro-screen { text-align: center; color: white; }
.intro-screen h1 { font-size: 3em; text-shadow: 3px 3px 0 #01579b; margin-bottom: 20px; }
.heroes { font-size: 4em; margin: 30px 0; }

.final-screen { background: white; padding: 30px; border-radius: 20px; text-align: center; border: 5px solid #ffeb3b; box-shadow: 0 0 50px rgba(255, 235, 59, 0.5); }
.final-screen h1 { font-size: 2.5em; color: #f57f17; margin-bottom: 10px; }
.reward { font-size: 5em; margin: 20px 0; animation: starBurst 1s infinite alternate; }
.word-list { text-align: left; background: #f5f5f5; padding: 20px; border-radius: 10px; margin: 20px 0; max-height: 300px; overflow-y: auto; }
.word-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #ddd; }
.word-row:last-child { border-bottom: none; }
.mini-sound { background: #4caf50; color: white; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 0.8em; }

.drag-zone { position: relative; width: 100%; height: 250px; background: #e0f7fa; border-radius: 15px; border: 3px dashed #00bcd4; }
.plate-target { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 5em; }
.drag-item { position: absolute; font-size: 3em; cursor: grab; user-select: none; touch-action: none; }
.drag-item:active { cursor: grabbing; }

.wheel-zone { position: relative; width: 250px; height: 250px; margin: 0 auto; }
.wheel-circle { width: 100%; height: 100%; border-radius: 50%; border: 10px solid #ff9800; position: relative; transition: transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99); background: white; display: flex; align-items: center; justify-content: center; font-size: 4em; }
.spin-btn { margin-top: 20px; background: #e91e63; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-size: 1.2em; cursor: pointer; }

@keyframes truckDrive { 0% { left: -200px; } 100% { left: 100%; } }
@keyframes wheelSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes smokePuff { 0% { opacity: 0; transform: translateY(0) scale(1); } 50% { opacity: 0.8; } 100% { opacity: 0; transform: translateY(-30px) scale(1.5); } }
@keyframes starBurst { 0% { transform: scale(1); } 100% { transform: scale(1.2); } }
@keyframes heroRun { 0% { transform: translateY(0); } 100% { transform: translateY(-5px); } }
@keyframes fadeSlideIn { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
@keyframes fadeSlideOut { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-20px); } }
@keyframes correctPop { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
@keyframes wrongShake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
@keyframes progressGlow { 0% { box-shadow: 0 0 5px #ffeb3b; } 100% { box-shadow: 0 0 20px #ffeb3b; } }
@keyframes buttonHover { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }
@keyframes buttonActive { 0% { transform: translateY(0); } 100% { transform: translateY(5px); } }
@keyframes confettiFall { 0% { transform: translateY(-100vh) rotate(0); } 100% { transform: translateY(100vh) rotate(360deg); } }
@keyframes spotlightSweep { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

.confetti { position: fixed; top: -50px; font-size: 2em; z-index: 1000; animation: confettiFall 3s linear forwards; pointer-events: none; }

@media (max-width: 600px) {
  .instruction { font-size: 1.2em; }
  .option-btn { padding: 10px 15px; font-size: 1.1em; min-width: 80px; }
  .title { font-size: 1em; }
  .stats { font-size: 0.8em; min-width: 60px; }
  .truck { font-size: 3em; }
  .card { padding: 20px; }
}
</style>
</head>
<body>
<div class="scene-bg"></div>
<div class="truck">🚚<span class="smoke">💨</span><span class="wheel">⚙️</span></div>

<div class="top-bar" id="topBar" style="display:none;">
  <div class="title">🍔 Кулинарный пазл</div>
  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar"></div>
    <div class="hero-run" id="heroRun">🏃‍♂️</div>
  </div>
  <div class="stats" id="stats">0/20</div>
  <div class="badges" id="badges">
    <span class="badge">🏆</span><span class="badge">🏆</span><span class="badge">🏆</span><span class="badge">🏆</span><span class="badge">🏆</span>
  </div>
</div>

<div class="container" id="container"></div>

<script>
var steps = [
  { type: 'intro' },
  { type: 'listen', text: 'Послушай и выбери картинку', audio: 'Put the cheese on the plate', answer: '🧀' },
  { type: 'choice', text: 'Что мы кладём на тарелку?', options: ['🍎', '🧀', '🥛'], answer: '🧀' },
  { type: 'spell', text: 'Собери слово PLATE', word: 'PLATE' },
  { type: 'yesno', text: 'Do you like biscuits?', audio: 'I like biscuits', answer: 'yes' },
  { type: 'count', text: 'Сколько яиц на картинке? 🥚🥚🥚', options: ['2', '3', '4'], answer: '3' },
  { type: 'match', text: 'Соедини слово и картинку', pairs: [['apple', '🍎'], ['milk', '🥛'], ['banana', '🍌']] },
  { type: 'order', text: 'Расставь слова по порядку', words: ['I', 'like', 'apples'], answer: 'I like apples' },
  { type: 'pick', text: 'Что здесь лишнее?', options: ['🍎', '🍌', '🚗'], answer: '🚗' },
  { type: 'drag_food_to_plate', text: 'Перетащи сыр на тарелку!', target: '🧀' },
  { type: 'spin_wheel', text: 'Крути колесо и назови продукт!', items: ['🍎', '🍌', '🧀', '🍫', '🍪'] },
  { type: 'listen', text: 'Послушай и выбери предмет', audio: 'Put the milk in the basket', answer: '🧺' },
  { type: 'choice', text: 'Куда мы кладём молоко?', options: ['🍽️', '🧺', '📖'], answer: '🧺' },
  { type: 'spell', text: 'Собери слово MILK', word: 'MILK' },
  { type: 'yesno', text: 'Is it an apple? (🍌)', answer: 'no' },
  { type: 'count', text: 'Сколько яблок? 🍎🍎', options: ['1', '2', '3'], answer: '2' },
  { type: 'match', text: 'Соедини фразу и картинку', pairs: [['Put on plate', '🍽️'], ['In the basket', '🧺']] },
  { type: 'order', text: 'Расставь слова', words: ['Put', 'the', 'cheese'], answer: 'Put the cheese' },
  { type: 'pick', text: 'Что мы кладём IN the basket?', options: ['🥛', '🍽️', '🍎'], answer: '🥛' },
  { type: 'final' }
];

var currentStep = 0;
var score = 0;
var history = [];
var container = document.getElementById('container');
var topBar = document.getElementById('topBar');
var progressBar = document.getElementById('progressBar');
var heroRun = document.getElementById('heroRun');
var statsEl = document.getElementById('stats');
var badgesEl = document.getElementById('badges').children;
var currentAudio = null;

function speak(text) {
  if (currentAudio) speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-GB';
  u.rate = 0.85;
  speechSynthesis.speak(u);
  currentAudio = u;
}

function updateProgress() {
  var p = (currentStep / (steps.length - 1)) * 100;
  progressBar.style.width = p + '%';
  heroRun.style.left = 'calc(' + p + '% - 15px)';
  statsEl.innerText = currentStep + '/' + (steps.length - 1);
  var badgeCount = Math.floor(score / 3);
  for (var i = 0; i < badgesEl.length; i++) {
    if (i < badgeCount) badgesEl[i].classList.add('earned');
  }
}

function showCard(html, onRender) {
  container.innerHTML = '<div class="card">' + html + '</div>';
  if (onRender) onRender();
}

function confetti() {
  var emojis = ['🎉', '🎊', '✨', '🌟', '🍎', '🧀'];
  for (var i = 0; i < 30; i++) {
    var c = document.createElement('div');
    c.className = 'confetti';
    c.innerText = emojis[Math.floor(Math.random() * emojis.length)];
    c.style.left = Math.random() * 100 + 'vw';
    c.style.animationDuration = (2 + Math.random() * 2) + 's';
    document.body.appendChild(c);
    setTimeout(function(el) { el.remove(); }.bind(null, c), 4000);
  }
}

function renderStep() {
  if (currentStep >= steps.length) return;
  var step = steps[currentStep];
  updateProgress();

  if (step.type === 'intro') {
    topBar.style.display = 'none';
    container.innerHTML = 
      '<div class="intro-screen">' +
      '<h1>🍔 Кулинарный пазл</h1>' +
      '<div class="heroes">👦👧🐒</div>' +
      '<button class="btn-start" id="startBtn">Старт!</button>' +
      '</div>';
    document.getElementById('startBtn').onclick = function() {
      currentStep++;
      topBar.style.display = 'flex';
      renderStep();
    };
    return;
  }

  if (step.type === 'final') {
    topBar.style.display = 'none';
    confetti();
    var listHtml = '';
    var wordsFinal = [
      {en: 'apple', ipa: '/ˈæp(ə)l/', ru: 'яблоко'},
      {en: 'banana', ipa: '/bəˈnɑːnə/', ru: 'банан'},
      {en: 'cheese', ipa: '/tʃiːz/', ru: 'сыр'},
      {en: 'plate', ipa: '/pleɪt/', ru: 'тарелка'},
      {en: 'basket', ipa: '/ˈbɑːskɪt/', ru: 'корзина'},
      {en: 'Put the cheese on the plate', ipa: '/pʊt ðə tʃiːz ɒn ðə pleɪt/', ru: 'Положи сыр на тарелку'}
    ];
    wordsFinal.forEach(function(w) {
      listHtml += '<div class="word-row"><span><b>' + w.en + '</b> ' + w.ipa + ' - ' + w.ru + '</span><button class="mini-sound" data-word="' + w.en + '">🔊</button></div>';
    });
    
    container.innerHTML = 
      '<div class="final-screen">' +
      '<h1>Отличная работа!</h1>' +
      '<div class="reward">🏆</div>' +
      '<p>Ты собрал все ингредиенты и помог Ларри и Лулу!</p>' +
      '<button class="sound-btn-main" id="finalAudio">🔊 Well done!</button>' +
      '<div class="word-list">' + listHtml + '</div>' +
      '<p>Очки: ' + score + '</p>' +
      '<div class="nav-btns">' +
      '<button class="nav-btn btn-back" id="backBtn">Назад</button>' +
      '<button class="nav-btn btn-start" id="restartBtn" style="font-size:1.2em; padding:15px 30px;">Пройти ещё раз</button>' +
      '</div></div>';
      
    document.getElementById('finalAudio').onclick = function() { speak('Well done!'); };
    document.getElementById('backBtn').onclick = function() { currentStep--; renderStep(); };
    document.getElementById('restartBtn').onclick = function() { currentStep = 0; score = 0; renderStep(); };
    document.querySelectorAll('.mini-sound').forEach(function(b) {
      b.onclick = function() { speak(b.getAttribute('data-word')); };
    });
    return;
  }

  var html = '<div class="instruction">' + step.text + '</div>';
  if (step.audio) html += '<button class="sound-btn-main" id="mainAudio">🔊 ' + step.audio + '</button>';
  html += '<div class="game-zone" id="gameZone"></div>';
  html += '<div class="feedback" id="feedback"></div>';
  html += '<div class="nav-btns">' +
          '<button class="nav-btn btn-back" id="backBtn">Назад</button>' +
          '<button class="nav-btn btn-retry" id="retryBtn">Ещё раз</button>' +
          '<button class="nav-btn btn-next" id="nextBtn">Дальше</button>' +
          '</div>';

  showCard(html, function() {
    if (step.audio) {
      document.getElementById('mainAudio').onclick = function() { speak(step.audio); };
    }
    document.getElementById('backBtn').onclick = function() {
      if (currentStep > 1) { currentStep--; renderStep(); }
    };
    document.getElementById('retryBtn').onclick = function() { renderStep(); };
    document.getElementById('nextBtn').onclick = function() {
      currentStep++;
      renderStep();
    };

    var zone = document.getElementById('gameZone');
    var fb = document.getElementById('feedback');
    var retryBtn = document.getElementById('retryBtn');
    var nextBtn = document.getElementById('nextBtn');

    function correct() {
      fb.innerText = '✅ Верно!';
      fb.className = 'feedback success';
      speak('Well done!');
      score++;
      nextBtn.style.display = 'inline-block';
      retryBtn.style.display = 'none';
    }
    function wrong(el) {
      fb.innerText = '❌ Попробуй ещё!';
      fb.className = 'feedback error shake';
      speak('Try again!');
      if (el) el.classList.add('wrong');
      retryBtn.style.display = 'inline-block';
      setTimeout(function() { fb.classList.remove('shake'); if(el) el.classList.remove('wrong'); }, 500);
    }

    if (step.type === 'listen' || step.type === 'choice' || step.type === 'yesno' || step.type === 'count' || step.type === 'pick') {
      var opts = step.options || (step.type === 'yesno' ? ['Yes', 'No'] : []);
      if (step.type === 'listen') opts = ['🍎', '🧀', '🥛', '🍌', '🧺'];
      opts.forEach(function(opt) {
        var b = document.createElement('button');
        b.className = 'option-btn';
        b.innerText = opt;
        b.onclick = function() {
          var ans = step.answer;
          if (step.type === 'yesno') ans = step.answer === 'yes' ? 'Yes' : 'No';
          if (opt === ans || (step.type === 'listen' && opt === ans)) {
            b.classList.add('correct');
            correct();
            document.querySelectorAll('.option-btn').forEach(function(x) { x.disabled = true; });
          } else {
            wrong(b);
          }
        };
        zone.appendChild(b);
      });
    }

    if (step.type === 'spell') {
      var letters = step.word.split('');
      var shuffled = letters.slice().sort(function() { return 0.5 - Math.random(); });
      var selected = [];
      var display = document.createElement('div');
      display.style.cssText = 'font-size:2em; margin-bottom:20px; min-height:50px; letter-spacing:5px;';
      zone.appendChild(display);
      
      shuffled.forEach(function(l) {
        var b = document.createElement('button');
        b.className = 'letter-btn option-btn';
        b.innerText = l;
        b.onclick = function() {
          if (b.disabled) return;
          selected.push(l);
          b.disabled = true;
          b.classList.add('selected');
          display.innerText = selected.join('');
          if (selected.length === letters.length) {
            if (selected.join('') === step.word) {
              correct();
            } else {
              wrong(display);
              setTimeout(function() {
                selected = [];
                display.innerText = '';
                document.querySelectorAll('.letter-btn').forEach(function(x) { x.disabled = false; x.classList.remove('selected'); });
              }, 600);
            }
          }
        };
        zone.appendChild(b);
      });
    }

    if (step.type === 'order') {
      var words = step.words.slice().sort(function() { return 0.5 - Math.random(); });
      var ordered = [];
      var display = document.createElement('div');
      display.style.cssText = 'font-size:1.5em; margin-bottom:20px; min-height:50px; background:#f5f5f5; padding:10px; border-radius:10px; width:100%;';
      zone.appendChild(display);
      
      words.forEach(function(w) {
        var b = document.createElement('button');
        b.className = 'option-btn';
        b.innerText = w;
        b.onclick = function() {
          if (b.disabled) return;
          ordered.push(w);
          b.disabled = true;
          display.innerText = ordered.join(' ');
          if (ordered.length === step.words.length) {
            if (ordered.join(' ') === step.answer) {
              correct();
            } else {
              wrong(display);
              setTimeout(function() {
                ordered = [];
                display.innerText = '';
                document.querySelectorAll('.option-btn').forEach(function(x) { x.disabled = false; });
              }, 600);
            }
          }
        };
        zone.appendChild(b);
      });
    }

    if (step.type === 'match') {
      var pairs = step.pairs;
      var leftCol = document.createElement('div');
      leftCol.style.cssText = 'display:flex; flex-direction:column; gap:10px;';
      var rightCol = document.createElement('div');
      rightCol.style.cssText = 'display:flex; flex-direction:column; gap:10px;';
      zone.appendChild(leftCol);
      zone.appendChild(rightCol);
      
      var selectedLeft = null;
      var matched = 0;
      
      pairs.forEach(function(p) {
        var bL = document.createElement('button');
        bL.className = 'option-btn';
        bL.innerText = p[0];
        bL.onclick = function() {
          if (bL.disabled) return;
          if (selectedLeft) selectedLeft.style.background = '#fff3e0';
          selectedLeft = bL;
          bL.style.background = '#ffe0b2';
        };
        leftCol.appendChild(bL);
      });
      
      var rightShuffled = pairs.slice().sort(function() { return 0.5 - Math.random(); });
      rightShuffled.forEach(function(p) {
        var bR = document.createElement('button');
        bR.className = 'option-btn';
        bR.innerText = p[1];
        bR.onclick = function() {
          if (!selectedLeft || bR.disabled) return;
          var pair = pairs.find(function(x) { return x[0] === selectedLeft.innerText; });
          if (pair && pair[1] === p[1]) {
            selectedLeft.classList.add('correct');
            bR.classList.add('correct');
            selectedLeft.disabled = true;
            bR.disabled = true;
            selectedLeft = null;
            matched++;
            if (matched === pairs.length) correct();
          } else {
            wrong(bR);
          }
        };
        rightCol.appendChild(bR);
      });
    }

    if (step.type === 'drag_food_to_plate') {
      zone.innerHTML = '<div class="drag-zone" id="dragZone"><div class="plate-target">🍽️</div></div>';
      var dZone = document.getElementById('dragZone');
      var items = ['🍎', '🧀', '🍌'];
      items.forEach(function(it, i) {
        var d = document.createElement('div');
        d.className = 'drag-item';
        d.innerText = it;
        d.style.left = (20 + i * 80) + 'px';
        d.style.top = '20px';
        dZone.appendChild(d);
        
        var startX, startY, initialX, initialY;
        function dragStart(e) {
          startX = e.touches ? e.touches[0].clientX : e.clientX;
          startY = e.touches ? e.touches[0].clientY : e.clientY;
          initialX = d.offsetLeft;
          initialY = d.offsetTop;
          document.addEventListener('mousemove', drag);
          document.addEventListener('touchmove', drag);
          document.addEventListener('mouseup', dragEnd);
          document.addEventListener('touchend', dragEnd);
        }
        function drag(e) {
          e.preventDefault();
          var cx = e.touches ? e.touches[0].clientX : e.clientX;
          var cy = e.touches ? e.touches[0].clientY : e.clientY;
          d.style.left = (initialX + cx - startX) + 'px';
          d.style.top = (initialY + cy - startY) + 'px';
        }
        function dragEnd() {
          document.removeEventListener('mousemove', drag);
          document.removeEventListener('touchmove', drag);
          document.removeEventListener('mouseup', dragEnd);
          document.removeEventListener('touchend', dragEnd);
          var rect = d.getBoundingClientRect();
          var pRect = dZone.querySelector('.plate-target').getBoundingClientRect();
          if (d.innerText === step.target && rect.left < pRect.right && rect.right > pRect.left && rect.top < pRect.bottom && rect.bottom > pRect.top) {
            correct();
            d.style.pointerEvents = 'none';
          } else {
            wrong(d);
            d.style.left = (20 + items.indexOf(d.innerText) * 80) + 'px';
            d.style.top = '20px';
          }
        }
        d.addEventListener('mousedown', dragStart);
        d.addEventListener('touchstart', dragStart);
      });
    }

    if (step.type === 'spin_wheel') {
      zone.innerHTML = '<div class="wheel-zone"><div class="wheel-circle" id="wheelCircle">❓</div></div><button class="spin-btn" id="spinBtn">Крутить!</button>';
      var wheel = document.getElementById('wheelCircle');
      var spinBtn = document.getElementById('spinBtn');
      var rotation = 0;
      spinBtn.onclick = function() {
        spinBtn.disabled = true;
        var r = 1440 + Math.random() * 720;
        rotation += r;
        wheel.style.transform = 'rotate(' + rotation + 'deg)';
        setTimeout(function() {
          wheel.innerText = step.items[Math.floor(Math.random() * step.items.length)];
          correct();
        }, 3100);
      };
    }
  });
}

renderStep();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 5 Lesson 2 Dictionary</title>
<meta name="description" content="Interactive dictionary for Spotlight Starter Module 5 Lesson 2 - sandwich kitchen vocabulary">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Comic Sans MS', 'Marker Felt', sans-serif;
  background: linear-gradient(180deg, #fff8e7 0%, #ffecb3 50%, #ffe082 100%);
  min-height: 100vh;
  padding: 20px;
  color: #3e2723;
}
.container { max-width: 1200px; margin: 0 auto; }
.header {
  text-align: center;
  margin-bottom: 26px;
  padding: 22px 20px;
  background: #fff;
  border-radius: 22px;
  box-shadow: 0 6px 18px rgba(62, 39, 35, 0.2);
  border: 4px solid #d84315;
}
.header h1 {
  font-size: 2.1em;
  color: #bf360c;
  margin-bottom: 8px;
}
.header .subtitle {
  font-size: 1.05em;
  color: #6d4c41;
  font-style: italic;
}
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin-bottom: 26px;
}
.filter-btn {
  padding: 10px 18px;
  border: 3px solid #bf360c;
  background: #ffffff;
  color: #bf360c;
  font-family: inherit;
  font-size: 1em;
  font-weight: bold;
  border-radius: 24px;
  cursor: pointer;
  transition: all 0.3s ease;
}
.filter-btn:hover, .filter-btn.active {
  background: #bf360c;
  color: #ffffff;
  transform: translateY(-2px);
}
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 22px;
  margin-bottom: 30px;
}
.card {
  background: linear-gradient(135deg, #a1887f 0%, #795548 50%, #5d4037 100%);
  border-radius: 14px 14px 4px 4px;
  padding: 24px 16px 20px;
  text-align: center;
  box-shadow: 0 6px 14px rgba(62, 39, 35, 0.35);
  border: 3px solid #4e342e;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 8px;
  background: repeating-linear-gradient(
    90deg,
    #4e342e,
    #4e342e 6px,
    #795548 6px,
    #795548 12px
  );
}
.card::after {
  content: '';
  position: absolute;
  top: 18px;
  right: -10px;
  width: 20px;
  height: 30px;
  background: #4e342e;
  transform: rotate(-20deg);
  border-radius: 0 4px 4px 0;
}
.card.speaking {
  border-color: #ffc107;
  box-shadow: 0 0 22px rgba(255, 193, 7, 0.75);
  transform: scale(1.04);
}
.card-emoji {
  font-size: 2.8em;
  margin-bottom: 8px;
  display: block;
  margin-top: 8px;
}
.card-en {
  font-size: 1.3em;
  font-weight: bold;
  color: #fff;
  margin-bottom: 5px;
  text-shadow: 1px 1px 0 #4e342e;
}
.card-ipa {
  font-size: 0.9em;
  color: #ffecb3;
  font-family: 'Segoe UI', sans-serif;
  margin-bottom: 5px;
}
.card-ru {
  font-size: 1em;
  color: #fff;
  margin-bottom: 12px;
}
.sound-btn {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #ffca28, #ff8f00);
  color: #3e2723;
  font-size: 1.5em;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 3px 8px rgba(255, 143, 0, 0.5);
}
.sound-btn:hover { transform: scale(1.1) rotate(6deg); }
.sound-btn:active { transform: scale(0.94); }
.footer {
  text-align: center;
  padding: 14px;
  color: #6d4c41;
  font-style: italic;
  font-size: 0.95em;
}
@media (max-width: 600px) {
  .header h1 { font-size: 1.55em; }
  .cards-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .card { padding: 20px 10px 16px; }
  .card-emoji { font-size: 2.2em; }
  .card-en { font-size: 1.05em; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🔪 Chef's Cutting Boards</h1>
    <div class="subtitle">Module 5 · Lesson 2 · Sandwich kitchen</div>
  </div>
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="food">Food</button>
    <button class="filter-btn" data-filter="tool">Tools</button>
    <button class="filter-btn" data-filter="phrase">Phrases</button>
  </div>
  <div class="cards-grid" id="cardsGrid"></div>
  <div class="footer">Spotlight Starter · Module 5 · Lesson 2</div>
</div>
<script>
var vocabulary = [
  { emoji: '🍞', en: 'bread', ipa: '/bred/', ru: 'хлеб', cat: 'food' },
  { emoji: '🥚', en: 'egg', ipa: '/eɡ/', ru: 'яйцо', cat: 'food' },
  { emoji: '🧀', en: 'cheese', ipa: '/tʃiːz/', ru: 'сыр', cat: 'food' },
  { emoji: '🍫', en: 'chocolate', ipa: '/ˈtʃɒklət/', ru: 'шоколад', cat: 'food' },
  { emoji: '🥪', en: 'sandwich', ipa: '/ˈsænwɪdʒ/', ru: 'сэндвич', cat: 'food' },
  { emoji: '🍽️', en: 'plate', ipa: '/pleɪt/', ru: 'тарелка', cat: 'tool' },
  { emoji: '🤲', en: 'please', ipa: '/pliːz/', ru: 'пожалуйста', cat: 'tool' },
  { emoji: '👨🍳', en: 'cook', ipa: '/kʊk/', ru: 'готовить', cat: 'tool' },
  { emoji: '🥪', en: "Let's make a sandwich!", ipa: '/lets meɪk ə ˈsænwɪdʒ/', ru: 'давай сделаем сэндвич!', cat: 'phrase' },
  { emoji: '🍞', en: 'Bring the bread.', ipa: '/brɪŋ ðə bred/', ru: 'принеси хлеб.', cat: 'phrase' },
  { emoji: '🧀', en: 'Bring me the cheese, please.', ipa: '/brɪŋ miː ðə tʃiːz pliːz/', ru: 'принеси мне сыр, пожалуйста.', cat: 'phrase' },
  { emoji: '🍽️', en: "Let's eat!", ipa: '/lets iːt/', ru: 'давай есть!', cat: 'phrase' },
  { emoji: '👨‍', en: "Let's cook!", ipa: '/lets kʊk/', ru: 'давай готовить!', cat: 'phrase' },
  { emoji: '🥚', en: 'Bring the egg.', ipa: '/brɪŋ ði eɡ/', ru: 'принеси яйцо.', cat: 'phrase' },
  { emoji: '🍫', en: 'Bring me the chocolate.', ipa: '/brɪŋ miː ðə ˈtʃɒklət/', ru: 'принеси мне шоколад.', cat: 'phrase' },
  { emoji: '😊', en: 'Yummy!', ipa: '/ˈjʌmi/', ru: 'вкусно!', cat: 'phrase' }
];
var synth = window.speechSynthesis;
var currentCard = null;
function speak(text, card) {
  if (synth.speaking) synth.cancel();
  if (currentCard) currentCard.classList.remove('speaking');
  var utter = new SpeechSynthesisUtterance(text);
  var voices = synth.getVoices();
  var gbVoice = null;
  for (var i = 0; i < voices.length; i++) {
    if (voices[i].lang === 'en-GB') { gbVoice = voices[i]; break; }
  }
  if (gbVoice) utter.voice = gbVoice;
  utter.rate = 0.85;
  utter.onstart = function() { card.classList.add('speaking'); currentCard = card; };
  utter.onend = function() { card.classList.remove('speaking'); currentCard = null; };
  utter.onerror = function() { card.classList.remove('speaking'); };
  synth.speak(utter);
}
function renderCards(filter) {
  var grid = document.getElementById('cardsGrid');
  grid.innerHTML = '';
  var items = filter === 'all' ? vocabulary : vocabulary.filter(function(v) { return v.cat === filter; });
  items.forEach(function(item) {
    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<span class="card-emoji">' + item.emoji + '</span>' +
      '<div class="card-en">' + item.en + '</div>' +
      '<div class="card-ipa">' + item.ipa + '</div>' +
      '<div class="card-ru">' + item.ru + '</div>' +
      '<button class="sound-btn">🔊</button>';
    var btn = card.querySelector('.sound-btn');
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      speak(item.en, card);
    });
    card.addEventListener('click', function() { speak(item.en, card); });
    grid.appendChild(card);
  });
}
var filterBtns = document.querySelectorAll('.filter-btn');
filterBtns.forEach(function(btn) {
  btn.addEventListener('click', function() {
    filterBtns.forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    renderCards(btn.getAttribute('data-filter'));
  });
});
if (synth.onvoiceschanged !== undefined) {
  synth.onvoiceschanged = function() {};
}
renderCards('all');
</script>
</body>
</html>

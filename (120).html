*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",Arial,sans-serif;background:linear-gradient(180deg,#0a1628 0%,#132744 100%);min-height:100vh;padding:28px 16px 60px}
h1{text-align:center;color:#f5d67b;font-size:1.8rem;margin-bottom:8px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.subtitle{text-align:center;color:#a8c8e8;font-size:1rem;margin-bottom:32px}
.filters{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:36px}
.filters button{border:2px solid #f5d67b;background:transparent;color:#f5d67b;padding:9px 20px;border-radius:22px;font-size:.92rem;cursor:pointer;transition:all .25s;font-weight:600}
.filters button.active,.filters button:hover{background:#f5d67b;color:#0a1628;box-shadow:0 4px 14px rgba(245,214,123,.4)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;max-width:1200px;margin:0 auto}
.card{background:radial-gradient(ellipse at 30% 20%,#1e3a5f,#0f2440);border:2px solid #3a6a9a;border-radius:20px;padding:24px 20px 20px;position:relative;transition:transform .25s,box-shadow .25s,border-color .25s;overflow:hidden}
.card::before{content:"";position:absolute;top:-40px;right:-40px;width:110px;height:110px;background:radial-gradient(circle,rgba(245,214,123,.12),transparent 70%);border-radius:50%;pointer-events:none}
.card.speaking{transform:scale(1.06);box-shadow:0 0 30px rgba(245,214,123,.6);border-color:#f5d67b}
.card-emoji{font-size:2.4rem;margin-bottom:10px}
.card-en{font-size:1.3rem;font-weight:700;color:#fff;margin-bottom:3px}
.card-ipa{font-size:.87rem;color:#a8c8e8;margin-bottom:5px}
.card-ru{font-size:.97rem;color:#c8ddf0}
.speak-btn{margin-top:16px;width:46px;height:46px;border-radius:50%;border:none;background:radial-gradient(circle at 35% 35%,#fdf6e3,#e8c56a);cursor:pointer;font-size:1.35rem;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(245,214,123,.4);transition:transform .15s}
.speak-btn:hover{transform:scale(1.15)}
.speak-btn:active{transform:scale(.92)}
.hidden{display:none}
@media(max-width:600px){
.grid{grid-template-columns:1fr 1fr;gap:14px}
.card{padding:18px 14px 16px}
h1{font-size:1.4rem}
.filters button{padding:7px 14px;font-size:.82rem}
.card-en{font-size:1.1rem}
}
@media(max-width:400px){
.grid{grid-template-columns:1fr}
}

var grid=document.getElementById("grid");
function render(cat){
grid.innerHTML="";
cards.forEach(function(c,i){
if(cat!=="all"&&c.cat!==cat)return;
var div=document.createElement("div");
div.className="card";
div.setAttribute("data-idx",String(i));
div.innerHTML="<div class=\"card-emoji\">"+c.emoji+"</div>"
+"<div class=\"card-en\">"+c.en+"</div>"
+"<div class=\"card-ipa\">"+c.ipa+"</div>"
+"<div class=\"card-ru\">"+c.ru+"</div>"
+"<button class=\"speak-btn\" title=\"Послушать\">🫧</button>";
div.querySelector(".speak-btn").addEventListener("click",function(){speakWord(c.en,div)});
grid.appendChild(div);
});
}
function speakWord(text,card){
if(!window.speechSynthesis)return;
window.speechSynthesis.cancel();
var u=new SpeechSynthesisUtterance(text);
u.lang="en-GB";
u.rate=0.85;
u.pitch=1.0;
if(!voicesReady){loadVoices();}
if(voicesList.length>0){
var gb=null;
var us=null;
for(var i=0;i<voicesList.length;i++){
if(voicesList[i].lang==="en-GB"&&!gb){gb=voicesList[i];}
if(voicesList[i].lang==="en-US"&&!us){us=voicesList[i];}
}
if(gb){u.voice=gb;}
else if(us){u.voice=us;}
}
u.onstart=function(){card.classList.add("speaking");};
u.onend=function(){card.classList.remove("speaking");};
u.onerror=function(){card.classList.remove("speaking");};
window.speechSynthesis.speak(u);
}
document.querySelectorAll(".filters button").forEach(function(btn){
btn.addEventListener("click",function(){
document.querySelectorAll(".filters button").forEach(function(b){b.classList.remove("active");});
btn.classList.add("active");
render(btn.getAttribute("data-cat"));
});
});
render("all");
</script>

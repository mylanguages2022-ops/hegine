<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"Comic Sans MS","Segoe UI",Verdana,sans-serif;
    background-color:#141c2e;
    background-image:
      radial-gradient(rgba(255,255,255,.5) 1px, transparent 1.6px),
      radial-gradient(rgba(255,255,255,.28) 1.4px, transparent 2px),
      linear-gradient(180deg,#141c2e 0%,#0e1522 100%);
    background-size:160px 160px, 260px 260px, 100% 100%;
    background-position:20px 30px, 90px 120px, 0 0;
    color:#dfe6f0;min-height:100vh;padding:20px 12px 90px;
  }
  .wrap{max-width:780px;margin:0 auto}

  /* ---------- ТРОПА ---------- */
  .topbar{
    background:rgba(255,244,222,.06);border-radius:16px;padding:18px 18px 22px;
    border:2px solid rgba(255,214,150,.35);
    box-shadow:0 10px 30px rgba(0,0,0,.5), inset 0 0 40px rgba(255,190,110,.06);
    margin-bottom:28px;
  }
  .topbar h1{
    font-size:clamp(1.05rem,4vw,1.45rem);color:#ffd696;text-align:center;line-height:1.35;
    letter-spacing:.5px;
  }
  .topbar h1::before{content:'🏮 ';}
  .bar-wrap{margin-top:16px}
  .bar-label{
    display:flex;justify-content:space-between;align-items:center;
    font-size:.8rem;color:#b8a888;margin-bottom:8px;font-weight:700;letter-spacing:1px;
  }
  .bar-track{
    height:24px;background:#0a0f1a;border-radius:12px;overflow:hidden;
    border:2px solid #3a4a66;position:relative;
    background-image:radial-gradient(circle, rgba(255,214,150,.35) 1.6px, transparent 2.4px);
    background-size:34px 24px;background-position:6px 50%;
  }
  .bar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg, rgba(255,190,110,.55), rgba(255,214,150,.8));
    transition:width .5s cubic-bezier(.34,1.4,.64,1);
  }
  .bar-runner{
    position:absolute;top:-10px;left:0;font-size:1.5rem;
    transform:translateX(-50%);transition:left .5s cubic-bezier(.34,1.4,.64,1);
    filter:drop-shadow(0 0 8px rgba(255,190,110,.8));
  }
  .stars{margin-top:12px;text-align:center;font-size:1.05rem;letter-spacing:4px;color:#ffd696}

  /* ---------- ЛИСТ В КРУГУ СВЕТА ---------- */
  .stage{
    background:#fff8ec;border-radius:14px;padding:44px 24px 52px;position:relative;
    border:2px solid #d8b070;color:#3a2c18;
    box-shadow:
      0 0 0 6px rgba(255,214,150,.12),
      0 0 60px 12px rgba(255,190,110,.22),
      0 14px 30px rgba(0,0,0,.55);

  }
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .stage.shake{animation:shake .45s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-9px)}40%{transform:translateX(9px)}
    60%{transform:translateX(-6px)}80%{transform:translateX(6px)}
  }
  .step-tag{
    display:inline-block;background:#3a2c18;color:#ffd696;
    font-size:.76rem;font-weight:700;padding:5px 14px;border-radius:4px;
    letter-spacing:2px;margin-bottom:14px;
  }
  .mech-tag{
    display:inline-block;background:#fff;color:#8a5a10;
    font-size:.72rem;font-weight:700;padding:3px 11px;border-radius:999px;

  }
  .hero{font-size:3.1rem;text-align:center;display:block;margin:4px 0 12px;line-height:1.15}
  .stage h2{font-size:clamp(1.05rem,3.8vw,1.4rem);color:#7a4a18;text-align:center;margin-bottom:16px;line-height:1.35}

  /* ---------- НОВАЯ ИНСТРУКЦИЯ: ЗАПИСКА С ФОНАРИКОМ ---------- */
  .brief{

  .opts{display:flex;flex-direction:column;gap:12px;margin-top:8px;max-width:560px;margin-left:auto;margin-right:auto}
  .opts.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .opt{
    background:#fffdf6;border:2px solid #d8b070;border-left:8px solid #e07830;border-radius:6px;
    padding:14px 15px;cursor:pointer;font-family:inherit;font-size:1.02rem;

  .opt:hover{border-color:#a07038;background:#fff4dc;transform:translateX(3px)}

  .opt.wrong{background:#fff0f0;border-color:#c0392b;border-left-color:#c0392b;animation:shake .4s}
  @keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}

  .yesno-scene{
    background:#fff4dc;border:2px dashed #c09050;border-radius:10px;
    padding:20px 14px;text-align:center;margin:0 auto 20px;max-width:560px;
  }
  .yesno-scene .big{font-size:2.6rem;letter-spacing:6px;display:block;margin-bottom:8px}
  .yesno-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .yesno-btn{
    flex:1 1 140px;max-width:220px;border-radius:8px;padding:14px 10px;

  .yesno-btn:hover{transform:translateY(-2px)}
  .yesno-btn.correct{animation:bounce .45s}
  .yesno-btn.wrong{animation:shake .4s}

  .countbox{
    background:#fff4dc;border:2px dashed #c09050;border-radius:10px;
    padding:22px 14px;text-align:center;margin:0 auto 20px;max-width:560px;
  }
  .countbox .items{font-size:2.4rem;letter-spacing:9px;line-height:1.6;word-break:break-word}

  .match-area{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px;max-width:600px;margin-left:auto;margin-right:auto}
  .mcol{display:flex;flex-direction:column;gap:12px}
  .mcol h4{text-align:left;font-size:.78rem;color:#8a6a40;font-weight:700;margin-bottom:2px;letter-spacing:2px;text-transform:uppercase}
  .mitem{
    background:#fffdf6;border:2px solid #d8b070;border-radius:6px;padding:12px 8px;
    cursor:pointer;font-family:inherit;font-size:.98rem;font-weight:700;color:#3a2c18;
    text-align:left;transition:.16s;display:flex;align-items:center;justify-content:flex-start;gap:7px;
    min-height:58px;box-shadow:0 2px 0 rgba(120,70,20,.2);padding-left:12px;
  }
  .mitem:hover{border-color:#a07038;background:#fff4dc}
  .mitem.sel{background:#fff4dc;box-shadow:0 0 0 3px rgba(224,120,48,.3)}
  .mitem.done{background:#eafff0;border-color:#2e8b57;color:#1f6b41;cursor:default;opacity:.85}
  .mitem.bad{animation:shake .4s;border-color:#c0392b;background:#fff0f0}
  .mitem .pic{font-size:1.5rem}

  .order-pool,.order-slots{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .order-slots{
    min-height:70px;background:#fff4dc;border:2px dashed #c09050;border-radius:10px;

  }
  .order-slots.empty-pool::after{content:'выкладывайте реплики ниже ⬇️';color:#a08860;font-size:.88rem}
  .otile{
    background:#fffdf6;border:2px solid #7a4a18;border-radius:6px;padding:10px 14px;
    cursor:pointer;font-family:inherit;font-size:.96rem;font-weight:700;color:#5a3a10;
    transition:.15s;display:flex;align-items:center;gap:7px;box-shadow:0 3px 0 #a07038;
  }
  .otile:hover{transform:translateY(-2px);background:#fff4dc}
  .otile.placed{border-color:#2e8b57;background:#eafff0;color:#1f6b41;box-shadow:0 3px 0 #1f6b41}
  .otile.bad{animation:shake .4s;border-color:#c0392b;background:#fff0f0}
  .otile.used{opacity:.3;pointer-events:none}
  .otile .num{font-size:1.3rem}

  .spell-slots{display:flex;gap:10px;justify-content:center;margin:8px 0 22px;flex-wrap:wrap}
  .slot{
    width:52px;height:60px;border-radius:6px;background:#fff4dc;
    border:3px dashed #7a4a18;display:flex;align-items:center;justify-content:center;
    font-size:1.75rem;font-weight:700;color:#5a3a10;text-transform:uppercase;
  }
  .slot.filled{border-style:solid;border-color:#2e8b57;background:#eafff0}
  .slot.bad{border-color:#c0392b;background:#fff0f0;animation:shake .4s}
  .letter-pool{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .letter{
    width:54px;height:60px;border-radius:6px;border:3px solid #e0a040;background:#ffd696;
    font-family:inherit;font-size:1.7rem;font-weight:700;color:#5a3a10;cursor:pointer;
    text-transform:uppercase;box-shadow:0 4px 0 #a07038;transition:.14s;
  }
  .letter:hover{transform:translateY(-3px);background:#ffe4b8}
  .letter.used{opacity:.25;pointer-events:none;box-shadow:none;transform:none}

  .drag-zone{
    background:#fff4dc;border:2px dashed #c09050;border-radius:10px;
    padding:22px 14px;text-align:center;margin:0 auto 20px;min-height:130px;max-width:600px;
  }
  .drag-item{
    display:inline-block;background:#fffdf6;border:2px solid #7a4a18;border-radius:6px;
    padding:10px 16px;margin:6px;cursor:pointer;font-family:inherit;font-size:1rem;
    font-weight:700;color:#5a3a10;box-shadow:0 3px 0 #a07038;transition:.15s;
  }
  .drag-item:hover{transform:translateY(-3px);background:#fff4dc}
  .drag-item.chosen{background:#eafff0;border-color:#2e8b57;color:#1f6b41;box-shadow:0 3px 0 #1f6b41}
  .drag-item.bad{animation:shake .4s;border-color:#c0392b;background:#fff0f0}

  .fb{
    margin-top:26px;padding:18px 20px;border-radius:10px;font-size:1rem;
    line-height:1.6;text-align:left;display:none;font-weight:600;
    max-width:560px;margin-left:auto;margin-right:auto;

  .fb.show{display:block;animation:pop .3s}
  .fb.good{background:#eafff0;border:2px solid #2e8b57;color:#1f6b41}
  .fb.bad{background:#fff4f4;border:2px solid #c0392b;color:#8e2a1f}
  .fb .again{
    margin-top:12px;background:#fff;border:2px solid #c0392b;color:#8e2a1f;
    border-radius:6px;padding:7px 16px;font-family:inherit;font-weight:700;
    font-size:.9rem;cursor:pointer;
  }
  .fb .again:hover{background:#ffeaea}

  .nav{display:flex;gap:12px;justify-content:center;margin-top:32px;flex-wrap:wrap}
  .nav button{
    border:none;border-radius:6px;padding:13px 26px;font-family:inherit;
    font-size:1rem;font-weight:700;cursor:pointer;transition:.16s;
    display:inline-flex;align-items:center;gap:8px;letter-spacing:.3px;
  }
  .btn-next{background:#7a4a18;color:#ffd696;box-shadow:0 5px 0 #4a2c0c}
  .btn-next:hover{background:#5a3610;transform:translateY(-2px)}
  .btn-back{background:#fffdf6;color:#7a4a18;border:2px dashed #c09050 !important;box-shadow:0 5px 0 #d8b070}
  .btn-back:hover{background:#fff4dc}
  .btn-back:disabled,.btn-next:disabled{opacity:.4;cursor:default;transform:none}
  .btn-replay{background:#e0a040;color:#4a2c0c;box-shadow:0 5px 0 #a07038}
  .btn-replay:hover{background:#f0b050}

  .final{text-align:left;max-width:600px;margin:0 auto}
  .final .big{
    font-size:3.2rem;display:block;text-align:center;margin-bottom:18px;
    background:#ffd696;border-radius:50%;width:110px;height:110px;line-height:110px;
    border:5px double #7a4a18;margin-left:auto;margin-right:auto;
    animation:float 2.4s ease-in-out infinite;
    box-shadow:0 0 40px rgba(255,190,110,.6);
  }
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .final h2{font-size:clamp(1.25rem,4.5vw,1.8rem);color:#7a4a18;margin-bottom:14px;text-align:center}
  .final p{font-size:1.02rem;line-height:1.7;color:#4a3520;margin-bottom:16px}
  .reward{
    background:#fff4dc;border:2px dashed #c09050;border-radius:10px;
    padding:26px 22px 32px;margin:26px 0 32px;
  }
  .reward .head{font-weight:700;margin-bottom:14px;color:#7a4a18;font-size:1.05rem}
  .reward .words{font-size:1.02rem;line-height:2;color:#4a3520;text-align:left;padding-bottom:6px}
  .reward .words b{color:#8a3a10}
  .reward .words div{padding:6px 0;border-bottom:1px dotted #c09050;margin-bottom:5px}
  .reward .words div:last-child{border-bottom:none;margin-bottom:0}
  .restart{background:#7a4a18;color:#ffd696;box-shadow:0 5px 0 #4a2c0c}
  .restart:hover{background:#5a3610}

  .start-screen{text-align:center}
  .start-screen .cast{font-size:2.6rem;letter-spacing:6px;margin:16px 0 8px}
  .start-screen ul{
    list-style:none;text-align:left;margin:18px auto;max-width:460px;
    background:#fff4dc;border:2px dashed #c09050;border-radius:10px;padding:18px 20px;
  }
  .start-screen li{
    padding:8px 0 8px 32px;position:relative;font-size:.97rem;color:#4a3520;line-height:1.5;
    border-bottom:1px dotted #c09050;
  }
  .start-screen li:last-child{border-bottom:none}
  .start-screen li::before{content:'🏮';position:absolute;left:0;top:8px;font-size:.95rem}
  .sound-note{
    background:#fffdf6;border:2px solid #e0a040;border-radius:8px;padding:12px 16px;
    font-size:.88rem;color:#8a5a10;margin-top:18px;line-height:1.55;text-align:left;
  }

  @media (max-width:560px){
    .match-area{grid-template-columns:1fr 1fr;gap:8px}
    .mitem{font-size:.86rem;min-height:52px;padding:9px 6px}
    .mitem .pic{font-size:1.3rem}
    .slot,.letter{width:44px;height:52px;font-size:1.4rem}
    .countbox .items{font-size:1.9rem;letter-spacing:5px}
    .hero{font-size:2.6rem}
    .nav button{padding:12px 18px;font-size:.95rem}
    .stage{padding:36px 14px 44px}
    .brief{padding:16px 14px 14px}
  }
</style>

<body>
<div class="wrap">

  <div class="topbar">
    <h1>Ночной обход с фонарём</h1>
    <div class="bar-wrap">
      <div class="bar-label">
        <span id="stepLabel">ОГОНЁК 0 ИЗ 16</span>
        <span id="pctLabel">0%</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="barFill"></div>
        <div class="bar-runner" id="barRunner">🏮</div>
      </div>
      <div class="stars" id="stars"></div>
    </div>
  </div>

  <div id="stageHost"></div>

</div>

<script>
(function(){
  "use strict";

  var RATE = 0.85;
  var voices = [];

  function loadVoices(){
    if(!('speechSynthesis' in window)) return;
    voices = window.speechSynthesis.getVoices() || [];
  }
  loadVoices();
  if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = loadVoices;
    setTimeout(loadVoices, 350);
    setTimeout(loadVoices, 1400);
  }

  function pickVoice(){
    if(!voices.length) loadVoices();
    var v;
    v = voices.find(function(x){ return x.lang === 'en-GB'; });
    if(v) return v;
    v = voices.find(function(x){ return x.lang && x.lang.toLowerCase().indexOf('en-gb') === 0; });
    if(v) return v;
    v = voices.find(function(x){ return x.lang === 'en-US'; });
    if(v) return v;
    v = voices.find(function(x){ return x.lang && x.lang.toLowerCase().indexOf('en') === 0; });
    return v || null;
  }

  function speak(text, delay){
    if(!('speechSynthesis' in window)) return;
    var go = function(){
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      var v = pickVoice();
      if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'en-GB'; }
      u.rate = RATE; u.pitch = 1.06; u.volume = 1;
      window.speechSynthesis.speak(u);
    };
    if(delay){ setTimeout(go, delay); } else { go(); }
  }

  function speakSeq(arr){
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    arr.forEach(function(t, i){
      setTimeout(function(){
        var u = new SpeechSynthesisUtterance(t);
        var v = pickVoice();
        if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'en-GB'; }
        u.rate = RATE; u.pitch = 1.06;
        window.speechSynthesis.speak(u);
      }, i * 1500);
    });
  }

  var STEPS = [

  /* 1 */ {
    kind:'intro', emoji:'🏮', mech:'Первый огонёк',
    title:'Ночной обход',
    text:'На пруду ночь и снег, а у калитки дома Няни Шайн горит фонарь. Ты выходишь в обход с этим фонарём: по дороге тебе встретится утёнок, который замёрз и потерял своих, и тебе нужно будет спросить, позвать, согреть. Шестнадцать огоньков — и обход закончен.',
    say:"Where's your mum? You look so cold.",
    sayRu:'Где твоя мама? Ты совсем замёрз.',
    cta:'🏮 Выйти в обход!'
  },

  /* 2 */ {
    kind:'listen', emoji:'👂', mech:'Аудирование',
    title:'Огонёк 1: первый вопрос',
    text:'Нажми на фонарик и выбери вопрос, который прозвучал.',

  var TOTAL = STEPS.length;
  var idx = 0;
  var history = [];
  var score = 0;
  var stageHost = document.getElementById('stageHost');
  var barFill = document.getElementById('barFill');
  var barRunner = document.getElementById('barRunner');
  var stepLabel = document.getElementById('stepLabel');
  var pctLabel = document.getElementById('pctLabel');
  var starsBox = document.getElementById('stars');

  function bold(str){
    return String(str).replace(/\*\*(.+?)\*\*/g, '<span class="en-inline">$1</span>');
  }

  function updateBar(){
    var pct = Math.round((idx / (TOTAL - 1)) * 100);
    if(pct < 0) pct = 0; if(pct > 100) pct = 100;
    barFill.style.width = pct + '%';
    barRunner.style.left = pct + '%';
    stepLabel.textContent = idx === 0 ? 'ОГОНЁК 0 ИЗ ' + (TOTAL - 1) : ('ОГОНЁК ' + idx + ' ИЗ ' + (TOTAL - 1));
    pctLabel.textContent = pct + '%';
    var full = Math.floor(score / 3);
    var s = '';
    for(var i = 0; i < full && i < 6; i++){ s += '🏮'; }
    starsBox.textContent = s;
  }

  function shakeStage(){
    var st = stageHost.querySelector('.stage');
    if(!st) return;
    st.classList.remove('shake');
    void st.offsetWidth;
    st.classList.add('shake');
  }

  function speakerBtn(text, cls, title){
    var b = document.createElement('button');
    b.className = cls || 'speak-mini';
    b.innerHTML = '🔊';
    b.title = title || 'Прослушать';
    b.setAttribute('aria-label','Прослушать: ' + text);
    b.addEventListener('click', function(ev){ ev.stopPropagation(); speak(text); });
    return b;
  }

  function nextBtn(label, fn, cls){
    var b = document.createElement('button');
    b.className = cls || 'btn-next';
    b.textContent = label;
    b.addEventListener('click', fn);
    return b;
  }

  function goNext(){
    if(idx < TOTAL - 1){
      history.push(idx);
      idx++;
      render();
    }
  }
  function goBack(){
    if(history.length){
      idx = history.pop();
      render();
    }
  }

  function render(){
    window.scrollTo({top:0, behavior:'smooth'});
    updateBar();
    stageHost.innerHTML = '';
    var s = STEPS[idx];

    var stage = document.createElement('div');
    stage.className = 'stage';
    stageHost.appendChild(stage);

    if(s.kind === 'intro')   return renderIntro(stage, s);
    if(s.kind === 'final')   return renderFinal(stage, s);
    if(s.kind === 'listen' || s.kind === 'choice') return renderChoice(stage, s);
    if(s.kind === 'yesno')   return renderYesNo(stage, s);
    if(s.kind === 'count')   return renderCount(stage, s);
    if(s.kind === 'spell')   return renderSpell(stage, s);
    if(s.kind === 'match')   return renderMatch(stage, s);
    if(s.kind === 'order')   return renderOrder(stage, s);
    if(s.kind === 'pick')    return renderPick(stage, s);
  }

  function header(stage, s){
    var tag = document.createElement('span');
    tag.className = 'step-tag';
    tag.textContent = 'ОГОНЁК ' + (idx + 1) + ' ИЗ ' + TOTAL;
    stage.appendChild(tag);

    if(s.mech){
      var m = document.createElement('span');
      m.className = 'mech-tag';
      m.textContent = s.mech;
      stage.appendChild(m);
    }
    var hero = document.createElement('span');
    hero.className = 'hero';
    hero.textContent = s.emoji || '🏮';
    stage.appendChild(hero);

    var h2 = document.createElement('h2');
    h2.textContent = s.title;
    stage.appendChild(h2);

    /* новая инструкция-записка */
    var p = document.createElement('div');
    p.className = 'brief';
    var lbl = document.createElement('span');
    lbl.className = 'blabel';
    lbl.textContent = 'Задание огонька';
    p.appendChild(lbl);
    var txt = document.createElement('span');
    txt.innerHTML = bold(s.text);
    p.appendChild(txt);
    stage.appendChild(p);
  }

  function speakBlock(stage, s){
    if(!s.say) return;
    var line = document.createElement('div');
    line.className = 'speak-line';
    var big = document.createElement('button');
    big.className = 'speak-big';
    big.innerHTML = '🔊 ' + s.say;
    big.addEventListener('click', function(){ speak(s.say); });
    line.appendChild(big);
    stage.appendChild(line);
    if(s.sayRu){
      var r = document.createElement('div');
      r.className = 'brief';
      r.style.marginBottom = '20px';
      r.style.fontSize = '.92rem';
      r.textContent = s.sayRu;
      stage.appendChild(r);
    }
  }

  function feedback(stage, s, onWin){
    var fb = document.createElement('div');
    fb.className = 'fb';
    stage.appendChild(fb);

    var nav = document.createElement('div');
    nav.className = 'nav';

    var back = nextBtn('⬅️ Назад', goBack, 'btn-back');
    if(!history.length) back.disabled = true;
    nav.appendChild(back);

    var replay = nextBtn('🔁 Ещё раз', function(){ render(); }, 'btn-replay');
    nav.appendChild(replay);

    var next = nextBtn('Следующий огонёк ➡️', goNext);
    next.style.display = 'none';
    nav.appendChild(next);

    stage.appendChild(nav);

    function showGood(){
      fb.className = 'fb good show';
      fb.innerHTML = bold(s.ok || 'Огонёк засчитан!');
      next.style.display = '';
      speak('Well done!', 250);
      if(onWin) onWin();
    }
    function showBad(){
      fb.className = 'fb bad show';
      fb.innerHTML = bold(s.no || 'Попробуй ещё раз!') +
        '<br><button class="again" type="button">🔁 Попробовать снова</button>';
      var ag = fb.querySelector('.again');
      ag.addEventListener('click', function(){ render(); });
      shakeStage();
      speak('Try again!', 200);
    }
    return {good:showGood, bad:showBad, next:next, back:back};
  }

  function renderIntro(stage, s){
    header(stage, s);
    speakBlock(stage, s);

    var cast = document.createElement('div');
    cast.className = 'start-screen';
    cast.innerHTML = '<div class="cast">🏮 🦆 ❄️ 🧣</div>';
    stage.appendChild(cast);

    var list = document.createElement('ul');
    ['Спрашивать Where\'s your mum? и Where\'s your dad?',
     'Замечать состояние героя: cold, sad, alone',
     'Отвечать заботой: You look so cold. I am with you.',
     'Отличать греющие фразы от колючих',
     'Пройти ночной обход до рассвета'
    ].forEach(function(t){
      var li = document.createElement('li');
      li.textContent = t;
      list.appendChild(li);
    });
    stage.appendChild(list);

    var note = document.createElement('div');
    note.className = 'sound-note';
    note.innerHTML = '🔈 Включите звук. Все фразы озвучены британским голосом. Сцена грустная: держите рядом плед и что-нибудь тёплое пить — после квеста они пригодятся обоим.';
    stage.appendChild(note);

    var nav = document.createElement('div');
    nav.className = 'nav';
    nav.appendChild(nextBtn(s.cta || 'Начать ➡️', goNext));
    stage.appendChild(nav);

    speak(s.say, 500);
  }

  function renderChoice(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score++; updateBar(); });

    if(s.kind === 'listen'){
      var line = document.createElement('div');
      line.className = 'speak-line';
      var big = document.createElement('button');
      big.className = 'speak-big';
      big.innerHTML = '🔊 Прослушать';
      big.addEventListener('click', function(){ speak(s.say); });
      line.appendChild(big);
      stage.insertBefore(line, stage.querySelector('.nav'));
      speak(s.say, 600);
    } else {
      speakBlock(stage, s);
    }

    var box = document.createElement('div');
    box.className = 'opts' + (s.opts.length > 3 ? ' grid2' : '');
    var navEl = stage.querySelector('.nav');
    stage.insertBefore(box, navEl);

    var locked = false;
    s.opts.forEach(function(o, i){
      var b = document.createElement('button');
      b.className = 'opt';
      b.type = 'button';
      var mk = document.createElement('span');
      mk.className = 'mark';
      mk.textContent = String.fromCharCode(65 + i);
      b.appendChild(mk);
      var tx = document.createElement('span');
      tx.innerHTML = bold(o.t);
      b.appendChild(tx);
      b.appendChild(speakerBtn(o.say || o.t.replace(/\/.*?\//g,'').replace(/—.*$/,'').trim(), 'speak-mini'));

      b.addEventListener('click', function(){
        if(locked) return;
        if(i === s.correct){
          locked = true;
          b.classList.add('correct');
          Array.prototype.forEach.call(box.children, function(x){ x.disabled = true; });
          speak(o.say || o.t, 120);
          setTimeout(fb.good, 650);
        } else {
          b.classList.add('wrong');
          setTimeout(function(){ b.classList.remove('wrong'); }, 600);
          fb.bad();
        }
      });
      box.appendChild(b);
    });
  }

  function renderYesNo(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score++; updateBar(); });

    var box = document.createElement('div');
    box.className = 'yesno-scene';
    var big = document.createElement('span');
    big.className = 'big';
    big.textContent = s.scene || '❓';
    box.appendChild(big);
    stage.insertBefore(box, stage.querySelector('.nav'));

    var line = document.createElement('div');
    line.className = 'speak-line';
    line.style.justifyContent = 'center';
    var sb = document.createElement('button');
    sb.className = 'speak-big';
    sb.innerHTML = '🔊 ' + s.say;
    sb.addEventListener('click', function(){ speak(s.say); });
    line.appendChild(sb);
    stage.insertBefore(line, stage.querySelector('.nav'));
    speak(s.say, 600);

    var row = document.createElement('div');
    row.className = 'yesno-row';
    stage.insertBefore(row, stage.querySelector('.nav'));

    var locked = false;
    [true, false].forEach(function(val){
      var b = document.createElement('button');
      b.className = 'yesno-btn ' + (val ? 'yes' : 'no');
      b.type = 'button';
      b.innerHTML = val ? '✔️ СОВПАДАЕТ' : '❌ НЕ СОВПАДАЕТ';
      b.addEventListener('click', function(){
        if(locked) return;
        if(val === s.answer){
          locked = true;
          b.classList.add('correct');
          speak(s.say, 100);
          setTimeout(fb.good, 600);
        } else {
          b.classList.add('wrong');
          setTimeout(function(){ b.classList.remove('wrong'); }, 600);
          fb.bad();
        }
      });
      row.appendChild(b);
    });
  }

  function renderCount(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score++; updateBar(); });
    var navEl = stage.querySelector('.nav');

    var cb = document.createElement('div');
    cb.className = 'countbox';
    var q = document.createElement('div');
    q.className = 'task-text';
    q.style.marginBottom = '12px';
    q.style.textAlign = 'center';
    q.innerHTML = '<span class="en-inline">' + s.ask + '</span>';
    cb.appendChild(q);
    var ql = document.createElement('div');
    ql.className = 'speak-line';
    ql.style.justifyContent = 'center';
    ql.style.margin = '0 0 14px';
    ql.appendChild(speakerBtn(s.ask, 'speak-mini', 'Прослушать вопрос'));
    cb.appendChild(ql);
    var it = document.createElement('div');
    it.className = 'items';
    it.textContent = s.items;
    cb.appendChild(it);
    stage.insertBefore(cb, navEl);

    speak(s.say, 600);

    var box = document.createElement('div');
    box.className = 'opts grid2';
    stage.insertBefore(box, navEl);

    var locked = false;
    s.opts.forEach(function(o, i){
      var b = document.createElement('button');
      b.className = 'opt'; b.type = 'button';
      b.style.justifyContent = 'center';
      b.innerHTML = bold(o.t);
      b.appendChild(speakerBtn(o.say, 'speak-mini'));
      b.addEventListener('click', function(){
        if(locked) return;
        if(i === s.correct){
          locked = true;
          b.classList.add('correct');
          Array.prototype.forEach.call(box.children, function(x){ x.disabled = true; });
          speak(o.say, 120);
          setTimeout(fb.good, 650);
        } else {
          b.classList.add('wrong');
          setTimeout(function(){ b.classList.remove('wrong'); }, 600);
          fb.bad();
        }
      });
      box.appendChild(b);
    });
  }

  function renderSpell(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score++; updateBar(); });
    var navEl = stage.querySelector('.nav');

    var hintLine = document.createElement('div');
    hintLine.className = 'speak-line';
    hintLine.style.justifyContent = 'center';
    var hb = document.createElement('button');
    hb.className = 'speak-big';
    hb.innerHTML = s.hint + ' 🔊 Прослушать слово';
    hb.addEventListener('click', function(){ speak(s.word); });
    hintLine.appendChild(hb);
    stage.insertBefore(hintLine, navEl);
    speak(s.word, 600);

    var slots = document.createElement('div');
    slots.className = 'spell-slots';
    var slotEls = [];
    for(var i = 0; i < s.word.length; i++){
      var sl = document.createElement('div');
      sl.className = 'slot';
      slots.appendChild(sl);
      slotEls.push(sl);
    }
    stage.insertBefore(slots, navEl);

    var letters = s.word.split('');
    var extra = 'abcdefghijklmnopqrstuvwxyz'.split('');
    var pool = letters.slice();
    var need = Math.max(0, 6 - pool.length);
    for(var k = 0; k < need; k++){
      pool.push(extra[Math.floor(Math.random() * extra.length)]);
    }
    pool.sort(function(){ return Math.random() - 0.5; });

    var poolBox = document.createElement('div');
    poolBox.className = 'letter-pool';
    stage.insertBefore(poolBox, navEl);

    var pos = 0;
    var done = false;

    pool.forEach(function(ch){
      var b = document.createElement('button');
      b.className = 'letter'; b.type = 'button';
      b.textContent = ch;
      b.addEventListener('click', function(){
        if(done) return;
        if(ch === s.word[pos]){
          slotEls[pos].textContent = ch;
          slotEls[pos].classList.add('filled');
          b.classList.add('used');
          pos++;
          speak(ch, 0);
          if(pos === s.word.length){
            done = true;
            speak(s.word, 500);
            setTimeout(fb.good, 1200);
          }
        } else {
          slotEls[pos].classList.add('bad');
          b.classList.add('bad');
          (function(el, bt){
            setTimeout(function(){ el.classList.remove('bad'); bt.classList.remove('bad'); }, 500);
          })(slotEls[pos], b);
          fb.bad();
        }
      });
      poolBox.appendChild(b);
    });
  }

  function renderMatch(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score += 2; updateBar(); });
    var navEl = stage.querySelector('.nav');

    speakBlock(stage, s);

    var area = document.createElement('div');
    area.className = 'match-area';
    stage.insertBefore(area, navEl);

    var leftCol = document.createElement('div');
    leftCol.className = 'mcol';
    leftCol.innerHTML = '<h4>Вопрос / слово</h4>';
    var rightCol = document.createElement('div');
    rightCol.className = 'mcol';
    rightCol.innerHTML = '<h4>Ответ / лицо</h4>';
    area.appendChild(leftCol);
    area.appendChild(rightCol);

    var pairs = s.pairs.slice();
    var lefts  = pairs.map(function(p,i){ return {p:p, i:i}; });
    var rights = pairs.map(function(p,i){ return {p:p, i:i}; });
    rights.sort(function(){ return Math.random() - 0.5; });

    var selected = null;
    var matched = 0;
    var busy = false;

    lefts.forEach(function(o){
      var b = document.createElement('button');
      b.className = 'mitem'; b.type = 'button';
      var tx = document.createElement('span');
      tx.textContent = o.p.left;
      b.appendChild(tx);
      b.appendChild(speakerBtn(o.p.say, 'speak-mini'));
      b.addEventListener('click', function(){
        if(busy || b.classList.contains('done') || b.classList.contains('sel')) return;
        if(selected && selected.side === 'left'){ selected.el.classList.remove('sel'); }
        selected = {side:'left', el:b, i:o.i};
        b.classList.add('sel');
        speak(o.p.say);
      });
      leftCol.appendChild(b);
      o.el = b;
    });

    rights.forEach(function(o){
      var b = document.createElement('button');
      b.className = 'mitem'; b.type = 'button';
      var pic = document.createElement('span');
      pic.className = 'pic';
      pic.textContent = o.p.right;
      b.appendChild(pic);
      b.appendChild(speakerBtn(o.p.say, 'speak-mini'));
      b.addEventListener('click', function(){
        if(busy || b.classList.contains('done')) return;
        speak(o.p.say);
        if(selected && selected.side === 'left'){
          busy = true;
          if(selected.i === o.i){
            selected.el.classList.remove('sel');
            selected.el.classList.add('done');
            b.classList.add('done');
            selected = null;
            matched++;
            speak('Yes!', 250);
            busy = false;
            if(matched === pairs.length){ setTimeout(fb.good, 900); }
          } else {
            selected.el.classList.add('bad');
            b.classList.add('bad');
            var a1 = selected.el, a2 = b;
            setTimeout(function(){
              a1.classList.remove('bad','sel');
              a2.classList.remove('bad');
              selected = null; busy = false;
            }, 650);
            fb.bad();
            shakeStage();
          }
        } else {
          if(selected && selected.side === 'right'){ selected.el.classList.remove('sel'); }
          selected = {side:'right', el:b, i:o.i};
          b.classList.add('sel');
        }
      });
      rightCol.appendChild(b);
      o.el = b;
    });
  }

  function renderOrder(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score += 2; updateBar(); });
    var navEl = stage.querySelector('.nav');

    speakBlock(stage, s);

    var slots = document.createElement('div');
    slots.className = 'order-slots empty-pool';
    stage.insertBefore(slots, navEl);

    var pool = s.items.map(function(it, i){ return {it:it, i:i}; });
    var shuffled = pool.slice();
    shuffled.sort(function(){ return Math.random() - 0.5; });

    var poolBox = document.createElement('div');
    poolBox.className = 'order-pool';
    stage.insertBefore(poolBox, navEl);

    var placed = [];
    var busy = false;
    var correctOrder = pool.map(function(o){ return o.i; });

    shuffled.forEach(function(o){
      var b = document.createElement('button');
      b.className = 'otile'; b.type = 'button';
      var n = document.createElement('span');
      n.className = 'num';
      n.textContent = o.it.n || '';
      b.appendChild(n);
      var t = document.createElement('span');
      t.innerHTML = bold(o.it.t);
      b.appendChild(t);
      b.appendChild(speakerBtn(o.it.say, 'speak-mini'));

      b.addEventListener('click', function(){
        if(busy || b.classList.contains('used')) return;
        speak(o.it.say);
        var expect = correctOrder[placed.length];
        if(o.i === expect){
          b.classList.add('used');
          var clone = document.createElement('button');
          clone.className = 'otile placed';
          clone.type = 'button';
          clone.innerHTML = '<span class="num">' + (o.it.n || '') + '</span><span>' + o.it.t + '</span>';
          slots.appendChild(clone);
          slots.classList.remove('empty-pool');
          placed.push(o.i);
          if(placed.length === pool.length){
            busy = true;
            speakSeq(s.items.map(function(x){ return x.say; }));
            setTimeout(fb.good, 1200);
          }
        } else {
          b.classList.add('bad');
          setTimeout(function(){ b.classList.remove('bad'); }, 550);
          fb.bad();
          shakeStage();
        }
      });
      poolBox.appendChild(b);
    });
  }

  function renderPick(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score += 2; updateBar(); });
    var navEl = stage.querySelector('.nav');

    speakBlock(stage, s);

    var zone = document.createElement('div');
    zone.className = 'drag-zone';
    stage.insertBefore(zone, navEl);

    var chosenCount = 0;
    var correctCount = s.pool.filter(function(p){ return p.good; }).length;
    var busy = false;

    s.pool.forEach(function(item){
      var el = document.createElement('button');
      el.className = 'drag-item';
      el.type = 'button';
      el.innerHTML = bold(item.t);
      el.appendChild(speakerBtn(item.say, 'speak-mini'));

      el.addEventListener('click', function(){
        if(busy || el.classList.contains('chosen')) return;
        speak(item.say);
        if(item.good){
          el.classList.add('chosen');
          chosenCount++;
          if(chosenCount === correctCount){
            busy = true;
            setTimeout(fb.good, 800);
          }
        } else {
          el.classList.add('bad');
          setTimeout(function(){ el.classList.remove('bad'); }, 600);
          fb.bad();
          shakeStage();
        }
      });
      zone.appendChild(el);
    });
  }

  function renderFinal(stage, s){
    stage.innerHTML = '';
    var box = document.createElement('div');
    box.className = 'final';
    stage.appendChild(box);

    var big = document.createElement('span');
    big.className = 'big';
    big.textContent = '🌅';
    box.appendChild(big);

    var h = document.createElement('h2');
    h.textContent = s.title;
    box.appendChild(h);

    var p = document.createElement('p');
    p.textContent = s.text;
    box.appendChild(p);

    var line = document.createElement('div');
    line.className = 'speak-line';
    line.style.justifyContent = 'center';
    var big2 = document.createElement('button');
    big2.className = 'speak-big';
    big2.innerHTML = '🔊 ' + s.say;
    big2.addEventListener('click', function(){ speakSeq(['I am with you.', 'You are not alone.']); });
    line.appendChild(big2);
    box.appendChild(line);

    var rw = document.createElement('div');
    rw.className = 'reward';
    var rt = document.createElement('div');
    rt.className = 'head';
    rt.textContent = '🏮 Журнал обхода — все слова ночи:';
    rw.appendChild(rt);

    var wl = document.createElement('div');
    wl.className = 'words';
    s.allWords.forEach(function(w){
      var row = document.createElement('div');
      row.style.display = 'flex';
      row.style.alignItems = 'center';
      row.style.gap = '8px';
      var tx = document.createElement('span');
      tx.innerHTML = '<b>' + w.en + '</b> ' + w.ipa + ' — ' + w.ru;
      tx.style.flex = '1';
      row.appendChild(tx);
      row.appendChild(speakerBtn(w.en, 'speak-mini'));
      wl.appendChild(row);
    });
    rw.appendChild(wl);
    box.appendChild(rw);

    var st = document.createElement('p');
    st.innerHTML = '🏮 Огоньков пройдено: <b>' + score + '</b><br>Обход можно повторить в любой вечер: фонарь заводится с пол-оборота.';
    box.appendChild(st);

    var nav = document.createElement('div');
    nav.className = 'nav';
    var back = nextBtn('⬅️ Назад', goBack, 'btn-back');
    if(!history.length) back.disabled = true;
    nav.appendChild(back);
    nav.appendChild(nextBtn('🔁 Новый обход', function(){
      idx = 0; history = []; score = 0; render();
    }, 'restart'));
    box.appendChild(nav);

    speakSeq(['I am with you.', 'You are not alone.']);
  }

  render();

  if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = function(){ loadVoices(); };
  }
  document.addEventListener('click', function once(){
    loadVoices();
    document.removeEventListener('click', once);
  });

})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Larry's Kitchen Quest</title>
<meta name="description" content="Interactive quest game for Spotlight 2 Module 3 Lesson 5 - food and basket adventure">
<style>
:root {
  --kitchen-bg: #fff8e7;
  --wood-dark: #8b4513;
  --wood-light: #d2b48c;
  --wood-medium: #a0522d;
  --orange-accent: #ff6b35;
  --orange-light: #f7931e;
  --green-accent: #7cb342;
  --green-light: #aed581;
  --red-accent: #e53935;
  --red-light: #ef5350;
  --yellow-accent: #fdd835;
  --blue-accent: #42a5f5;
  --text-dark: #3a2e1f;
  --text-medium: #5d4037;
  --shadow-soft: 0 4px 12px rgba(139, 69, 19, 0.15);
  --shadow-medium: 0 6px 20px rgba(139, 69, 19, 0.2);
  --shadow-hard: 0 8px 30px rgba(139, 69, 19, 0.25);
  --gradient-wood: linear-gradient(135deg, #d2b48c 0%, #a0522d 100%);
  --gradient-orange: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
  --gradient-green: linear-gradient(135deg, #7cb342 0%, #aed581 100%);
  --gradient-kitchen: linear-gradient(180deg, #fff8e7 0%, #ffe4b5 100%);
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 22px;
  --radius-xl: 32px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif;
  background: var(--gradient-kitchen);
  background-attachment: fixed;
  min-height: 100vh;
  color: var(--text-dark);
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image: 
    radial-gradient(circle at 20% 30%, rgba(255, 215, 0, 0.05) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(255, 107, 53, 0.05) 0%, transparent 50%),
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 40px,
      rgba(139, 69, 19, 0.02) 40px,
      rgba(139, 69, 19, 0.02) 41px
    );
  pointer-events: none;
  z-index: 0;
}
.app-container {
  position: relative;
  z-index: 1;
  max-width: 900px;
  margin: 0 auto;
  padding: 16px;
  min-height: 100vh;
}
.top-bar {
  background: white;
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-medium);
  border: 3px solid var(--wood-light);
}
.quest-title {
  font-size: 1.5em;
  color: var(--wood-dark);
  text-align: center;
  margin-bottom: 14px;
  text-shadow: 2px 2px 0 #fff;
}
.progress-container {
  position: relative;
  height: 32px;
  background: #f5e6d3;
  border-radius: 16px;
  margin-bottom: 12px;
  overflow: hidden;
  border: 3px solid var(--wood-medium);
  cursor: pointer;
}
.progress-fill {
  height: 100%;
  background: var(--gradient-green);
  border-radius: 12px;
  transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}
.progress-hero {
  position: absolute;
  right: -18px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1.6em;
  animation: heroBounce 1s ease-in-out infinite;
}
.progress-stats {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.95em;
  color: var(--text-medium);
  font-weight: bold;
  margin-bottom: 10px;
}
.rewards-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  min-height: 32px;
}
.reward-badge {
  width: 32px;
  height: 32px;
  background: var(--gradient-orange);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2em;
  animation: badgePop 0.5s ease-out;
  box-shadow: 0 3px 8px rgba(255, 107, 53, 0.4);
}
.game-screen {
  background: white;
  border-radius: var(--radius-xl);
  padding: 24px 20px;
  box-shadow: var(--shadow-hard);
  border: 4px solid var(--wood-light);
  min-height: 500px;
  position: relative;
  animation: screenFadeIn 0.5s ease-out;
}
.screen-intro {
  text-align: center;
  padding: 30px 10px;
}
.intro-heroes {
  font-size: 4em;
  margin-bottom: 20px;
  animation: heroesWave 2s ease-in-out infinite;
}
.intro-title {
  font-size: 2em;
  color: var(--wood-dark);
  margin-bottom: 15px;
}
.intro-text {
  font-size: 1.15em;
  color: var(--text-medium);
  margin-bottom: 30px;
  line-height: 1.6;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 28px;
  border: none;
  border-radius: var(--radius-lg);
  font-family: inherit;
  font-size: 1.1em;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.25s ease;
  box-shadow: var(--shadow-soft);
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.btn-primary {
  background: var(--gradient-orange);
  color: white;
  border: 3px solid var(--orange-accent);
}
.btn-primary:hover {
  transform: translateY(-3px) scale(1.03);
  box-shadow: var(--shadow-medium);
}
.btn-primary:active {
  transform: translateY(0) scale(0.98);
}
.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}
.btn-secondary {
  background: white;
  color: var(--wood-dark);
  border: 3px solid var(--wood-light);
}
.btn-secondary:hover {
  background: #f5e6d3;
  transform: translateY(-2px);
}
.btn-secondary:active {
  transform: translateY(0);
}
.btn-secondary:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.step-header {
  text-align: center;
  margin-bottom: 24px;
}
.step-hero {
  font-size: 3.2em;
  margin-bottom: 12px;
  display: block;
  animation: heroFloat 2.5s ease-in-out infinite;
}
.step-instruction {
  font-size: 1.3em;
  color: var(--text-dark);
  line-height: 1.5;
  margin-bottom: 16px;
  min-height: 60px;
}
.speak-btn {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: none;
  background: var(--gradient-orange);
  color: white;
  font-size: 1.6em;
  cursor: pointer;
  margin: 0 auto 20px;
  display: block;
  box-shadow: 0 4px 12px rgba(255, 107, 53, 0.4);
  transition: all 0.2s ease;
}
.speak-btn:hover {
  transform: scale(1.1) rotate(8deg);
}
.speak-btn:active {
  transform: scale(0.95);
}
.speak-btn.speaking {
  animation: pulseSpeak 1s ease-in-out infinite;
}
.game-zone {
  margin: 20px 0;
  min-height: 200px;
}
.choice-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  margin: 20px 0;
}
.choice-btn {
  background: #faf3e7;
  border: 4px solid var(--wood-light);
  border-radius: var(--radius-md);
  padding: 18px 14px;
  font-family: inherit;
  font-size: 1.1em;
  font-weight: bold;
  color: var(--text-dark);
  cursor: pointer;
  transition: all 0.25s ease;
  text-align: center;
  min-height: 90px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.choice-btn .choice-emoji {
  font-size: 2.4em;
}
.choice-btn:hover:not(:disabled) {
  border-color: var(--orange-accent);
  background: #fff0d9;
  transform: translateY(-3px);
  box-shadow: var(--shadow-soft);
}
.choice-btn:active:not(:disabled) {
  transform: translateY(0);
}
.choice-btn:disabled {
  cursor: not-allowed;
}
.choice-btn.correct {
  background: linear-gradient(135deg, #c8e6c9 0%, #a5d6a7 100%);
  border-color: var(--green-accent);
  animation: correctPop 0.6s ease-out;
}
.choice-btn.wrong {
  background: linear-gradient(135deg, #ffcdd2 0%, #ef9a9a 100%);
  border-color: var(--red-accent);
  animation: wrongShake 0.5s ease-in-out;
}
.choice-btn.selected {
  border-color: var(--blue-accent);
  background: #e3f2fd;
}
.spell-zone {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  margin: 20px 0;
}
.spell-target {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  min-height: 60px;
  padding: 12px;
  background: #faf3e7;
  border: 3px dashed var(--wood-light);
  border-radius: var(--radius-md);
  width: 100%;
}
.spell-slot {
  width: 44px;
  height: 52px;
  background: white;
  border: 3px solid var(--wood-medium);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6em;
  font-weight: bold;
  color: var(--wood-dark);
  transition: all 0.2s ease;
}
.spell-slot.filled {
  background: var(--gradient-green);
  color: white;
  border-color: var(--green-accent);
  animation: slotFill 0.3s ease-out;
}
.spell-slot.wrong {
  background: linear-gradient(135deg, #ffcdd2 0%, #ef9a9a 100%);
  border-color: var(--red-accent);
  animation: wrongShake 0.4s ease-in-out;
}
.letters-bank {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  padding: 12px;
  background: #f5e6d3;
  border-radius: var(--radius-md);
  min-height: 60px;
}
.letter-btn {
  width: 46px;
  height: 46px;
  border-radius: var(--radius-sm);
  border: 3px solid var(--wood-medium);
  background: white;
  font-family: inherit;
  font-size: 1.4em;
  font-weight: bold;
  color: var(--wood-dark);
  cursor: pointer;
  transition: all 0.2s ease;
  text-transform: uppercase;
}
.letter-btn:hover:not(:disabled) {
  background: var(--gradient-orange);
  color: white;
  border-color: var(--orange-accent);
  transform: translateY(-3px) rotate(-2deg);
}
.letter-btn:active:not(:disabled) {
  transform: translateY(0) rotate(0);
}
.letter-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}
.letter-btn.used {
  background: #d7ccc8;
  color: #8d6e63;
  border-color: #bcaaa4;
}
.yesno-zone {
  display: flex;
  gap: 16px;
  justify-content: center;
  margin: 30px 0;
}
.yesno-btn {
  flex: 1;
  max-width: 180px;
  padding: 24px;
  border-radius: var(--radius-lg);
  border: 4px solid;
  font-family: inherit;
  font-size: 1.4em;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.25s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  min-height: 120px;
}
.yesno-btn .yn-emoji {
  font-size: 2.8em;
}
.yesno-btn.yes {
  background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
  border-color: var(--green-accent);
  color: var(--green-accent);
}
.yesno-btn.no {
  background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%);
  border-color: var(--red-accent);
  color: var(--red-accent);
}
.yesno-btn:hover:not(:disabled) {
  transform: translateY(-4px) scale(1.05);
  box-shadow: var(--shadow-medium);
}
.yesno-btn:active:not(:disabled) {
  transform: translateY(0) scale(0.98);
}
.yesno-btn.correct {
  animation: correctPop 0.6s ease-out;
  box-shadow: 0 0 30px rgba(124, 179, 66, 0.5);
}
.yesno-btn.wrong {
  animation: wrongShake 0.5s ease-in-out;
  box-shadow: 0 0 30px rgba(229, 57, 53, 0.5);
}
.count-zone {
  text-align: center;
  margin: 20px 0;
}
.count-items {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  justify-content: center;
  margin: 20px 0;
  padding: 20px;
  background: #faf3e7;
  border-radius: var(--radius-md);
  min-height: 100px;
}
.count-item {
  font-size: 3em;
  animation: itemAppear 0.4s ease-out;
  cursor: pointer;
  transition: transform 0.2s ease;
}
.count-item:hover {
  transform: scale(1.2) rotate(8deg);
}
.count-item.counted {
  filter: grayscale(30%);
  transform: scale(0.9);
}
.count-options {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin: 20px 0;
}
.count-opt-btn {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  border: 4px solid var(--wood-medium);
  background: white;
  font-family: inherit;
  font-size: 1.8em;
  font-weight: bold;
  color: var(--wood-dark);
  cursor: pointer;
  transition: all 0.2s ease;
}
.count-opt-btn:hover:not(:disabled) {
  background: var(--gradient-orange);
  color: white;
  border-color: var(--orange-accent);
  transform: scale(1.1);
}
.count-opt-btn.correct {
  background: var(--gradient-green);
  color: white;
  border-color: var(--green-accent);
  animation: correctPop 0.6s ease-out;
}
.count-opt-btn.wrong {
  background: linear-gradient(135deg, #ffcdd2 0%, #ef9a9a 100%);
  border-color: var(--red-accent);
  animation: wrongShake 0.5s ease-in-out;
}
.match-zone {
  margin: 20px 0;
}
.match-columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  align-items: start;
}
.match-column {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.match-item {
  padding: 14px;
  background: #faf3e7;
  border: 3px solid var(--wood-light);
  border-radius: var(--radius-md);
  text-align: center;
  font-size: 1.1em;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.2s ease;
  min-height: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.match-item .match-emoji {
  font-size: 1.8em;
}
.match-item:hover:not(.matched):not(:disabled) {
  border-color: var(--orange-accent);
  background: #fff0d9;
  transform: scale(1.03);
}
.match-item.selected {
  border-color: var(--blue-accent);
  background: #e3f2fd;
  transform: scale(1.03);
}
.match-item.matched {
  background: linear-gradient(135deg, #c8e6c9 0%, #a5d6a7 100%);
  border-color: var(--green-accent);
  cursor: default;
  opacity: 0.85;
}
.match-item.wrong-match {
  animation: wrongShake 0.5s ease-in-out;
  border-color: var(--red-accent);
  background: #ffcdd2;
}
.order-zone {
  margin: 20px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}
.order-target {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  padding: 16px;
  background: #faf3e7;
  border: 3px dashed var(--wood-light);
  border-radius: var(--radius-md);
  min-height: 70px;
  min-width: 280px;
}
.order-word {
  padding: 10px 16px;
  background: var(--gradient-green);
  color: white;
  border-radius: var(--radius-sm);
  font-weight: bold;
  font-size: 1.1em;
  animation: slotFill 0.3s ease-out;
}
.order-bank {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  padding: 16px;
  background: #f5e6d3;
  border-radius: var(--radius-md);
  min-height: 70px;
}
.order-btn {
  padding: 10px 16px;
  border: 3px solid var(--wood-medium);
  background: white;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 1.1em;
  font-weight: bold;
  color: var(--wood-dark);
  cursor: pointer;
  transition: all 0.2s ease;
}
.order-btn:hover:not(:disabled) {
  background: var(--gradient-orange);
  color: white;
  border-color: var(--orange-accent);
  transform: translateY(-3px);
}
.order-btn:active:not(:disabled) {
  transform: translateY(0);
}
.order-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}
.pick-zone {
  margin: 20px 0;
}
.pick-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin: 20px 0;
}
.pick-item {
  background: #faf3e7;
  border: 4px solid var(--wood-light);
  border-radius: var(--radius-md);
  padding: 16px 8px;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.pick-item .pick-emoji {
  font-size: 2.6em;
}
.pick-item .pick-label {
  font-size: 0.95em;
  font-weight: bold;
  color: var(--text-dark);
}
.pick-item:hover:not(.picked) {
  border-color: var(--orange-accent);
  background: #fff0d9;
  transform: translateY(-3px);
}
.pick-item.picked {
  background: linear-gradient(135deg, #c8e6c9 0%, #a5d6a7 100%);
  border-color: var(--green-accent);
}
.pick-item.wrong-pick {
  animation: wrongShake 0.5s ease-in-out;
  border-color: var(--red-accent);
  background: #ffcdd2;
}
.basket-zone {
  text-align: center;
  margin: 20px 0;
}
.big-basket {
  font-size: 6em;
  margin: 20px 0;
  cursor: pointer;
  transition: transform 0.2s ease;
  display: inline-block;
}
.big-basket:hover {
  transform: scale(1.1) rotate(-3deg);
}
.big-basket:active {
  transform: scale(0.95);
}
.big-basket.shake {
  animation: basketShake 0.6s ease-in-out;
}
.basket-items {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  margin: 20px 0;
  min-height: 80px;
  padding: 16px;
  background: #faf3e7;
  border-radius: var(--radius-md);
}
.basket-found {
  font-size: 2.4em;
  animation: itemFound 0.5s ease-out;
}
.drag-zone {
  margin: 20px 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  align-items: start;
}
.drag-source, .drag-target {
  padding: 16px;
  border-radius: var(--radius-md);
  min-height: 200px;
}
.drag-source {
  background: #f5e6d3;
  border: 3px dashed var(--wood-medium);
}
.drag-target {
  background: #faf3e7;
  border: 4px solid var(--wood-light);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
.drag-target.highlight {
  border-color: var(--orange-accent);
  background: #fff0d9;
}
.target-basket {
  font-size: 4em;
}
.drag-items {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
}
.drag-item {
  padding: 12px;
  background: white;
  border: 3px solid var(--wood-medium);
  border-radius: var(--radius-md);
  cursor: grab;
  transition: all 0.2s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  user-select: none;
  touch-action: none;
}
.drag-item .drag-emoji {
  font-size: 2.2em;
}
.drag-item .drag-label {
  font-size: 0.9em;
  font-weight: bold;
  color: var(--text-dark);
}
.drag-item:hover {
  transform: translateY(-3px) scale(1.05);
  box-shadow: var(--shadow-soft);
}
.drag-item.dragging {
  opacity: 0.6;
  cursor: grabbing;
}
.drag-item.placed {
  background: linear-gradient(135deg, #c8e6c9 0%, #a5d6a7 100%);
  border-color: var(--green-accent);
  cursor: default;
}
.drag-item.wrong-drag {
  animation: wrongShake 0.5s ease-in-out;
  border-color: var(--red-accent);
  background: #ffcdd2;
}
.feedback {
  text-align: center;
  padding: 18px;
  border-radius: var(--radius-md);
  margin: 20px 0;
  font-size: 1.2em;
  font-weight: bold;
  animation: feedbackAppear 0.4s ease-out;
  display: none;
}
.feedback.visible { display: block; }
.feedback.correct {
  background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
  color: var(--green-accent);
  border: 3px solid var(--green-accent);
}
.feedback.wrong {
  background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%);
  color: var(--red-accent);
  border: 3px solid var(--red-accent);
  animation: wrongShake 0.5s ease-in-out;
}
.feedback-emoji {
  font-size: 2.2em;
  display: block;
  margin-bottom: 8px;
}
.nav-buttons {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 24px;
  flex-wrap: wrap;
}
.screen-final {
  text-align: center;
  padding: 30px 10px;
}

<script>
(function() {

  var score = 0;

  var vocabulary = {

    milk: { en: 'milk', ipa: '/mɪlk/', ru: 'молоко', emoji: '🥛' },
    juice: { en: 'juice', ipa: '/dʒuːs/', ru: 'сок', emoji: '🧃' },
    basket: { en: 'basket', ipa: '/ˈbɑːskɪt/', ru: 'корзинка', emoji: '🧺' },
    yummy: { en: 'yummy', ipa: '/ˈjʌmi/', ru: 'вкусно', emoji: '😋' }
  };

  var phrases = {
    whatsInBasket: { en: "What's in your basket?", ipa: '/wɒts ɪn jɔː ˈbɑːskɪt/' },
    iVeGotApples: { en: "I've got apples.", ipa: '/aɪv ɡɒt ˈæp(ə)lz/' },
    iLikeBiscuits: { en: 'I like biscuits.', ipa: '/aɪ laɪk ˈbɪskɪts/' },
    yesIDo: { en: 'Yes, I do.', ipa: '/jɛs aɪ duː/' },
    noIDont: { en: "No, I don't.", ipa: '/nəʊ aɪ dəʊnt/' },
    doYouLike: { en: 'Do you like...?', ipa: '/duː juː laɪk/' },
    letsEat: { en: "Let's eat!", ipa: '/lɛts iːt/' },
    thankYou: { en: 'Thank you!', ipa: '/θæŋk juː/' },
    look: { en: 'Look!', ipa: '/lʊk/' }
  };

  var steps = [
    {
      type: 'listen',
      hero: '👦',
      instruction: 'Listen and choose what Larry has!',
      speakText: "I've got apples!",
      correctKey: 'apple',
      options: [
        { key: 'apple', label: vocabulary.apple.en, emoji: vocabulary.apple.emoji },
        { key: 'banana', label: vocabulary.banana.en, emoji: vocabulary.banana.emoji },
        { key: 'milk', label: vocabulary.milk.en, emoji: vocabulary.milk.emoji },
        { key: 'juice', label: vocabulary.juice.en, emoji: vocabulary.juice.emoji }
      ]
    },
    {
      type: 'choice',
      hero: '👧',
      instruction: 'Choose the correct word for the picture!',
      speakText: 'biscuits',
      picture: vocabulary.biscuits.emoji,
      correctKey: 'biscuits',
      options: [
        { key: 'apple', label: vocabulary.apple.en },
        { key: 'biscuits', label: vocabulary.biscuits.en },
        { key: 'milk', label: vocabulary.milk.en },
        { key: 'juice', label: vocabulary.juice.en }
      ]
    },
    {
      type: 'spell',
      hero: '👩',
      instruction: 'Spell the word! Tap the letters in order.',
      speakText: 'milk',
      targetWord: 'milk',
      scramble: 'kilm'
    },
    {
      type: 'yesno',
      hero: '🐵',
      instruction: 'Is this a banana?',
      speakText: 'Is this a banana?',
      picture: vocabulary.banana.emoji,
      correctAnswer: true
    },
    {
      type: 'count',
      hero: '👦',
      instruction: 'How many apples? Tap to count!',
      speakText: 'How many apples?',
      itemEmoji: '🍎',
      count: 4,
      options: [2, 3, 4, 5]
    },
    {
      type: 'match',
      hero: '👧',
      instruction: 'Match the word with the picture!',
      speakText: 'Match the words!',
      pairs: [
        { word: 'apple', emoji: '🍎', wordLabel: vocabulary.apple.en },
        { word: 'banana', emoji: '🍌', wordLabel: vocabulary.banana.en },
        { word: 'milk', emoji: '🥛', wordLabel: vocabulary.milk.en },
        { word: 'juice', emoji: '🧃', wordLabel: vocabulary.juice.en }
      ]
    },
    {
      type: 'order',
      hero: '👩',
      instruction: 'Put the words in the right order!',
      speakText: "I've got apples.",
      correctOrder: ["I've", 'got', 'apples'],
      scramble: ['apples', "I've", 'got']
    },
    {
      type: 'pick',
      hero: '🐵',
      instruction: 'Pick all the FRUITS! 🍎🍌',
      speakText: 'Pick the fruits!',
      items: [
        { key: 'apple', label: vocabulary.apple.en, emoji: vocabulary.apple.emoji, isCorrect: true },
        { key: 'banana', label: vocabulary.banana.en, emoji: vocabulary.banana.emoji, isCorrect: true },
        { key: 'milk', label: vocabulary.milk.en, emoji: vocabulary.milk.emoji, isCorrect: false },
        { key: 'biscuits', label: vocabulary.biscuits.en, emoji: vocabulary.biscuits.emoji, isCorrect: false },
        { key: 'juice', label: vocabulary.juice.en, emoji: vocabulary.juice.emoji, isCorrect: false }
      ],
      requiredCorrect: 2
    },
    {
      type: 'basket',
      hero: '👦',
      instruction: 'Tap the basket to find a yummy surprise!',
      speakText: 'What is in the basket?',
      findItems: [
        { key: 'biscuits', emoji: vocabulary.biscuits.emoji, label: vocabulary.biscuits.en },
        { key: 'apple', emoji: vocabulary.apple.emoji, label: vocabulary.apple.en },
        { key: 'banana', emoji: vocabulary.banana.emoji, label: vocabulary.banana.en },
        { key: 'milk', emoji: vocabulary.milk.emoji, label: vocabulary.milk.en }
      ],
      target: 'biscuits'
    },
    {
      type: 'listen',
      hero: '👧',
      instruction: 'Listen and choose the right phrase!',
      speakText: 'Do you like biscuits?',
      correctKey: 'yes',
      options: [
        { key: 'yes', label: 'Yes, I do.', emoji: '😊' },
        { key: 'no', label: "No, I don't.", emoji: '😕' },
        { key: 'yummy', label: 'Yummy!', emoji: '😋' },
        { key: 'look', label: 'Look!', emoji: '👀' }
      ]
    },
    {
      type: 'choice',
      hero: '👩',
      instruction: 'Choose the correct word!',
      speakText: 'juice',
      picture: vocabulary.juice.emoji,
      correctKey: 'juice',
      options: [
        { key: 'basket', label: vocabulary.basket.en },
        { key: 'yummy', label: vocabulary.yummy.en },
        { key: 'juice', label: vocabulary.juice.en },
        { key: 'milk', label: vocabulary.milk.en }
      ]
    },
    {
      type: 'spell',
      hero: '🐵',
      instruction: 'Spell the word! Tap the letters in order.',
      speakText: 'basket',
      targetWord: 'basket',
      scramble: 'teksab'
    },
    {
      type: 'yesno',
      hero: '👦',
      instruction: 'Is this milk?',
      speakText: 'Is this milk?',
      picture: vocabulary.juice.emoji,
      correctAnswer: false
    },
    {
      type: 'count',
      hero: '👧',
      instruction: 'How many biscuits? Tap to count!',
      speakText: 'How many biscuits?',
      itemEmoji: '🍪',
      count: 3,
      options: [1, 2, 3, 4]
    },
    {
      type: 'match',
      hero: '👩',
      instruction: 'Match the phrase with the picture!',
      speakText: 'Match!',
      pairs: [
        { word: 'I like biscuits', emoji: '🍪', wordLabel: 'I like biscuits' },
        { word: "I've got apples", emoji: '🍎', wordLabel: "I've got apples" },
        { word: 'Yummy!', emoji: '😋', wordLabel: 'Yummy!' },
        { word: 'Look!', emoji: '👀', wordLabel: 'Look!' }
      ]
    },
    {
      type: 'drag',
      hero: '🐵',
      instruction: 'Drag the yummy food into the basket!',
      speakText: 'Put the food in the basket!',
      items: [
        { key: 'apple', label: vocabulary.apple.en, emoji: vocabulary.apple.emoji, correct: true },
        { key: 'banana', label: vocabulary.banana.en, emoji: vocabulary.banana.emoji, correct: true },
        { key: 'book', label: 'book', emoji: '📚', correct: false },
        { key: 'ball', label: 'ball', emoji: '⚽', correct: false }
      ]
    },
    {
      type: 'order',
      hero: '👦',
      instruction: 'Put the words in the right order!',
      speakText: 'I like biscuits.',
      correctOrder: ['I', 'like', 'biscuits'],
      scramble: ['biscuits', 'I', 'like']
    },
    {
      type: 'choice',
      hero: '👧',
      instruction: "What's in your basket? Choose the right answer!",
      speakText: "What's in your basket?",
      picture: '🧺',
      correctKey: 'ivegot',
      options: [
        { key: 'ivegot', label: "I've got milk." },
        { key: 'yesdo', label: 'Yes, I do.' },
        { key: 'yummy', label: 'Yummy!' },
        { key: 'thankyou', label: 'Thank you!' }
      ]
    }
  ];

  totalSteps = steps.length;

  function speakText(text, callback) {
    if (synth.speaking) synth.cancel();
    var utter = new SpeechSynthesisUtterance(text);
    var voices = synth.getVoices();
    var gbVoice = null;
    for (var i = 0; i < voices.length; i++) {
      if (voices[i].lang === 'en-GB') { gbVoice = voices[i]; break; }
    }
    if (gbVoice) utter.voice = gbVoice;
    utter.rate = 0.85;
    if (callback) utter.onend = callback;
    currentUtterance = utter;
    synth.speak(utter);
  }

  function speakWord(text) {
    if (synth.speaking) synth.cancel();
    var utter = new SpeechSynthesisUtterance(text);
    var voices = synth.getVoices();
    var gbVoice = null;
    for (var i = 0; i < voices.length; i++) {
      if (voices[i].lang === 'en-GB') { gbVoice = voices[i]; break; }
    }
    if (gbVoice) utter.voice = gbVoice;
    utter.rate = 0.85;
    synth.speak(utter);
  }

  function updateProgress() {
    var percent = Math.round((currentStepIndex / totalSteps) * 100);
    document.getElementById('progressFill').style.width = percent + '%';
    document.getElementById('progressPercent').textContent = percent + '%';
    document.getElementById('progressText').textContent = 
      'Step ' + (currentStepIndex + 1) + ' of ' + totalSteps;
  }

  function addReward() {
    rewardsCount++;
    if (rewardsCount % 3 === 0) {
      var row = document.getElementById('rewardsRow');
      var badge = document.createElement('div');
      badge.className = 'reward-badge';
      badge.textContent = '⭐';
      row.appendChild(badge);
    }
  }

  function increaseScore() {
    score++;
    addReward();
  }

  function showFeedback(container, isCorrect, message) {
    var fb = container.querySelector('.feedback');
    if (!fb) {
      fb = document.createElement('div');
      fb.className = 'feedback';
      container.appendChild(fb);
    }
    fb.className = 'feedback visible ' + (isCorrect ? 'correct' : 'wrong');
    fb.innerHTML = 
      '<span class="feedback-emoji">' + (isCorrect ? '🎉' : '🤔') + '</span>' +
      (isCorrect ? 'Well done! ' + message : 'Try again! ' + message);
    if (isCorrect) {
      speakText('Well done! ' + message);
    } else {
      speakText('Try again!');
    }
  }

  function createNavButtons(container, onCorrect) {
    var nav = document.createElement('div');
    nav.className = 'nav-buttons';

    var backBtn = document.createElement('button');
    backBtn.className = 'btn btn-secondary';
    backBtn.textContent = '⬅ Back';
    backBtn.disabled = currentStepIndex === 0;
    backBtn.addEventListener('click', function() {
      if (currentStepIndex > 0) {
        currentStepIndex--;
        renderStep(currentStepIndex);
      }
    });

    var retryBtn = document.createElement('button');
    retryBtn.className = 'btn btn-secondary';
    retryBtn.textContent = '🔄 Try again';
    retryBtn.addEventListener('click', function() {
      renderStep(currentStepIndex);
    });

    var nextBtn = document.createElement('button');
    nextBtn.className = 'btn btn-primary';
    nextBtn.textContent = 'Next ➡';
    nextBtn.style.display = 'none';
    nextBtn.addEventListener('click', function() {
      if (currentStepIndex < totalSteps - 1) {
        currentStepIndex++;
        renderStep(currentStepIndex);
      } else {
        showFinalScreen();
      }
    });

    nav.appendChild(backBtn);
    nav.appendChild(retryBtn);
    nav.appendChild(nextBtn);
    container.appendChild(nav);

    return nextBtn;
  }

  function renderListenStep(step, container) {
    var header = document.createElement('div');
    header.className = 'step-header';
    header.innerHTML = 
      '<span class="step-hero">' + step.hero + '</span>' +
      '<div class="step-instruction">' + step.instruction + '</div>';
    container.appendChild(header);

    var speakBtn = document.createElement('button');
    speakBtn.className = 'speak-btn';
    speakBtn.textContent = '🔊';
    speakBtn.addEventListener('click', function() {
      speakText(step.speakText);
    });
    container.appendChild(speakBtn);

    var zone = document.createElement('div');
    zone.className = 'game-zone';

    var grid = document.createElement('div');
    grid.className = 'choice-grid';

  function renderDragStep(step, container) {
    var header = document.createElement('div');
    header.className = 'step-header';
    header.innerHTML = 
      '<span class="step-hero">' + step.hero + '</span>' +
      '<div class="step-instruction">' + step.instruction + '</div>';
    container.appendChild(header);

    var speakBtn = document.createElement('button');
    speakBtn.className = 'speak-btn';
    speakBtn.textContent = '🔊';
    speakBtn.addEventListener('click', function() {
      speakText(step.speakText);
    });
    container.appendChild(speakBtn);

    var zone = document.createElement('div');
    zone.className = 'game-zone';
    var dragZone = document.createElement('div');
    dragZone.className = 'drag-zone';

    var source = document.createElement('div');
    source.className = 'drag-source';
    var sourceItems = document.createElement('div');
    sourceItems.className = 'drag-items';
    source.appendChild(sourceItems);

    var targetArea = document.createElement('div');
    targetArea.className = 'drag-target';
    targetArea.innerHTML = '<span class="target-basket">🧺</span><div style="font-weight: bold;">Drop food here!</div>';

    var correctPlaced = 0;
    var answered = false;
    var nextBtn = null;
    var totalCorrect = 0;

    step.items.forEach(function(item) {
      if (item.correct) totalCorrect++;
    });

    step.items.forEach(function(item) {
      var el = document.createElement('div');
      el.className = 'drag-item';
      el.setAttribute('data-key', item.key);
      el.setAttribute('data-correct', item.correct);
      el.innerHTML = 
        '<span class="drag-emoji">' + item.emoji + '</span>' +
        '<span class="drag-label">' + item.label + '</span>';

      var isDragging = false;
      var startX = 0, startY = 0;
      var origX = 0, origY = 0;

      el.addEventListener('mousedown', startDrag);
      el.addEventListener('touchstart', startDrag, { passive: false });

      function startDrag(e) {
        if (answered || el.classList.contains('placed')) return;
        if (e.type === 'touchstart') e.preventDefault();
        isDragging = true;
        el.classList.add('dragging');
        var rect = el.getBoundingClientRect();
        startX = (e.touches ? e.touches[0].clientX : e.clientX);
        startY = (e.touches ? e.touches[0].clientY : e.clientY);
        origX = rect.left;
        origY = rect.top;
        el.style.position = 'fixed';
        el.style.left = origX + 'px';
        el.style.top = origY + 'px';
        el.style.zIndex = '1000';
        document.addEventListener('mousemove', onDrag);
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchmove', onDrag, { passive: false });
        document.addEventListener('touchend', endDrag);
      }

      function onDrag(e) {
        if (!isDragging) return;
        if (e.type === 'touchmove') e.preventDefault();
        var cx = (e.touches ? e.touches[0].clientX : e.clientX);
        var cy = (e.touches ? e.touches[0].clientY : e.clientY);
        var dx = cx - startX;
        var dy = cy - startY;
        el.style.left = (origX + dx) + 'px';
        el.style.top = (origY + dy) + 'px';
        var targetRect = targetArea.getBoundingClientRect();
        if (cx >= targetRect.left && cx <= targetRect.right && cy >= targetRect.top && cy <= targetRect.bottom) {
          targetArea.classList.add('highlight');
        } else {
          targetArea.classList.remove('highlight');
        }
      }

      function endDrag(e) {
        if (!isDragging) return;
        isDragging = false;
        el.classList.remove('dragging');
        document.removeEventListener('mousemove', onDrag);
        document.removeEventListener('mouseup', endDrag);
        document.removeEventListener('touchmove', onDrag);
        document.removeEventListener('touchend', endDrag);
        var cx = (e.changedTouches ? e.changedTouches[0].clientX : e.clientX);
        var cy = (e.changedTouches ? e.changedTouches[0].clientY : e.clientY);
        var targetRect = targetArea.getBoundingClientRect();
        var dropped = cx >= targetRect.left && cx <= targetRect.right && cy >= targetRect.top && cy <= targetRect.bottom;
        targetArea.classList.remove('highlight');
        el.style.position = '';
        el.style.left = '';
        el.style.top = '';
        el.style.zIndex = '';

        if (dropped) {
          if (item.correct) {
            el.classList.add('placed');
            correctPlaced++;
            speakText(item.label);
            if (correctPlaced === totalCorrect) {
              answered = true;
              increaseScore();
              showFeedback(container, true, 'Basket is full!');
              if (nextBtn) nextBtn.style.display = 'inline-flex';
            }
          } else {
            el.classList.add('wrong-drag');
            showFeedback(container, false, 'Not food!');
            setTimeout(function() { el.classList.remove('wrong-drag'); }, 600);
          }
        }
      }

      sourceItems.appendChild(el);
    });

    dragZone.appendChild(source);
    dragZone.appendChild(targetArea);
    zone.appendChild(dragZone);
    container.appendChild(zone);

    var fb = document.createElement('div');
    fb.className = 'feedback';
    container.appendChild(fb);

    nextBtn = createNavButtons(container);
  }

  function renderStep(idx) {
    if (idx >= totalSteps) {
      showFinalScreen();
      return;
    }
    var screen = document.getElementById('gameScreen');
    screen.innerHTML = '';
    var step = steps[idx];
    updateProgress();

    switch (step.type) {
      case 'listen': renderListenStep(step, screen); break;
      case 'choice': renderChoiceStep(step, screen); break;
      case 'spell': renderSpellStep(step, screen); break;
      case 'yesno': renderYesNoStep(step, screen); break;
      case 'count': renderCountStep(step, screen); break;
      case 'match': renderMatchStep(step, screen); break;
      case 'order': renderOrderStep(step, screen); break;
      case 'pick': renderPickStep(step, screen); break;
      case 'basket': renderBasketStep(step, screen); break;
      case 'drag': renderDragStep(step, screen); break;
    }
  }

  function showFinalScreen() {
    var screen = document.getElementById('gameScreen');
    screen.innerHTML = '';
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('progressPercent').textContent = '100%';
    document.getElementById('progressText').textContent = 'Quest complete!';

    var final = document.createElement('div');
    final.className = 'screen-final';

    var allVocab = [];
    Object.keys(vocabulary).forEach(function(k) {
      var v = vocabulary[k];
      allVocab.push({ en: v.en, ipa: v.ipa, ru: v.ru, emoji: v.emoji });
    });
    Object.keys(phrases).forEach(function(k) {
      var p = phrases[k];
      allVocab.push({ en: p.en, ipa: p.ipa, ru: '', emoji: '' });
    });

    final.innerHTML = 
      '<div class="final-reward">🏆</div>' +
      '<div class="final-title">You did it, Chef!</div>' +
      '<div class="final-text">' +
        'Larry and Lulu packed a yummy basket!<br>' +
        'You helped them find all the food.<br>' +
        'Click any word to hear it again.' +
      '</div>' +
      '<div class="final-score">⭐ Your score: ' + score + ' out of ' + totalSteps + '</div>' +
      '<button class="btn btn-primary" id="finalSpeak">🔊 Hear the final phrase</button>';

    screen.appendChild(final);

    var vocabList = document.createElement('div');
    vocabList.className = 'final-vocab';
    var vocabTitle = document.createElement('div');
    vocabTitle.style.cssText = 'font-size: 1.3em; font-weight: bold; color: var(--wood-dark); margin-bottom: 12px; text-align: center;';
    vocabTitle.textContent = '📖 All words from the lesson';
    vocabList.appendChild(vocabTitle);

    allVocab.forEach(function(item) {
      var row = document.createElement('div');
      row.className = 'vocab-item';
      row.innerHTML = 
        '<div class="vocab-text">' +
          '<div class="vocab-en">' + (item.emoji ? item.emoji + ' ' : '') + item.en + '</div>' +
          (item.ipa ? '<div class="vocab-ipa">' + item.ipa + '</div>' : '') +
          (item.ru ? '<div class="vocab-ru">' + item.ru + '</div>' : '') +
        '</div>' +
        '<button class="vocab-speak">🔊</button>';
      var btn = row.querySelector('.vocab-speak');
      btn.addEventListener('click', function() {
        speakWord(item.en);
      });
      vocabList.appendChild(row);
    });
    screen.appendChild(vocabList);

    var nav = document.createElement('div');
    nav.className = 'nav-buttons';

    var backBtn = document.createElement('button');
    backBtn.className = 'btn btn-secondary';
    backBtn.textContent = '⬅ Back';
    backBtn.addEventListener('click', function() {
      if (currentStepIndex > 0) {
        currentStepIndex--;
        renderStep(currentStepIndex);
      }
    });

    var restartBtn = document.createElement('button');
    restartBtn.className = 'btn btn-primary';
    restartBtn.textContent = '🔄 Play again';
    restartBtn.addEventListener('click', function() {
      currentStepIndex = 0;
      score = 0;
      rewardsCount = 0;
      document.getElementById('rewardsRow').innerHTML = '';
      renderStep(0);
    });

    nav.appendChild(backBtn);
    nav.appendChild(restartBtn);
    screen.appendChild(nav);

    document.getElementById('finalSpeak').addEventListener('click', function() {
      speakText('Well done! Larry and Lulu are happy! Yummy picnic!');
    });
  }

  document.getElementById('startBtn').addEventListener('click', function() {
    renderStep(0);
  });

  document.getElementById('progressContainer').addEventListener('click', function(e) {
    var rect = this.getBoundingClientRect();
    var x = e.clientX - rect.left;
    var percent = x / rect.width;
    var targetStep = Math.floor(percent * totalSteps);
    if (targetStep >= 0 && targetStep < totalSteps) {
      currentStepIndex = targetStep;
      renderStep(currentStepIndex);
    }
  });

  if (synth.onvoiceschanged !== undefined) {
    synth.onvoiceschanged = function() {};
  }
})();
</script>
</body>
</html>

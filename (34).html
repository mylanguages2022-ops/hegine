<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotlight Starter: Квест Утята</title>
    <meta property="og:title" content="Spotlight Starter: Солнечная прогулка утят">
    <meta property="og:description" content="Максимально большой интерактивный квест из 30 шагов для закрепления лексики урока о утятах и погоде.">
    <meta property="og:image" content="https://example.com/og-image-ducklings-quest.jpg">
    <meta property="og:url" content="https://example.com/spotlight-ducklings-quest">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ru_RU">
    <style>
        body { font-family: 'Comic Sans MS', 'Arial', sans-serif; background-color: #fffde7; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 700px; margin: 20px auto; background: white; padding: 30px; border-radius: 20px; border: 4px solid #fbc02d; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
        h1 { color: #f57f17; font-size: 26px; margin-bottom: 10px; }
        p { font-size: 20px; color: #333; line-height: 1.5; margin-bottom: 25px; }
        .btn { display: inline-block; margin: 8px; padding: 15px 25px; font-size: 18px; border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; color: white; font-weight: bold; min-width: 140px; }
        .btn:hover { opacity: 0.9; transform: scale(1.03); }
        .hidden { display: none; }
        .success { color: #2e7d32; font-size: 24px; font-weight: bold; }
        .progress { font-size: 16px; color: #555; margin-bottom: 15px; font-weight: bold; background: #fff9c4; padding: 10px; border-radius: 10px; }
        .emoji { font-size: 50px; margin: 10px 0; }
        .bg-yellow { background-color: #fbc02d; color: #333; }
        .bg-blue { background-color: #03a9f4; }
        .bg-green { background-color: #4caf50; }
        .bg-orange { background-color: #ff9800; }
        .bg-pink { background-color: #e91e63; }
    </style>
</head>
<body>
    <div class="container">
        <div class="progress" id="progress">Шаг 1 из 30</div>
        <div id="game-area"></div>
    </div>
    <script>
        const steps = [
            { emoji: "🌅", text: "Доброе утро! Утята проснулись в гнезде. Мама-утка смотрит в окно. Какая там погода?", options: [{t: "Sunny day!", c: true}, {t: "Sad day!", c: false}] },
            { emoji: "🦆", text: "Отлично! Солнце светит ярко. Мама-утка улыбается. Какое у неё настроение?", options: [{t: "Happy", c: true}, {t: "Sad", c: false}] },
            { emoji: "🗣️", text: "Мама-утка говорит деткам, что пора выходить. Что она говорит?", options: [{t: "Go on now, go and play!", c: true}, {t: "Sit down!", c: false}] },
            { emoji: "👏", text: "Утята рады! Давай похлопаем в ладоши, как они!", options: [{t: "Clap your hands!", c: true}, {t: "Go to sleep!", c: false}] },
            { emoji: "🐥", text: "Первый утёнок вышел из гнезда. Сколько это утят?", options: [{t: "One", c: true}, {t: "Three", c: false}] },
            { emoji: "🐥🐥", text: "К нему присоединился ещё один. Сколько теперь утят?", options: [{t: "Two", c: true}, {t: "One", c: false}] },
            { emoji: "🐥🐥🐥", text: "И вот вышел третий! Сколько всего утят?", options: [{t: "Three", c: true}, {t: "Two", c: false}] },
            { emoji: "🐤", text: "А вот и самый маленький утёнок! Кто это?", options: [{t: "The little duckling", c: true}, {t: "Mummy Duck", c: false}] },
            { emoji: "🤔", text: "Маленький утёнок немного растерялся. Он happy или sad?", options: [{t: "Sad", c: true}, {t: "Happy", c: false}] },
            { emoji: "💛", text: "Мама-утка подбадривает его. Посмотри на небо. Что там светит?", options: [{t: "Yellow sun", c: true}, {t: "Green grass", c: false}] },
            { emoji: "💚", text: "Утята ступают на землю. Какого она цвета?", options: [{t: "Green grass", c: true}, {t: "Blue sky", c: false}] },
            { emoji: "💙", text: "Посмотри выше! Какого цвета небо?", options: [{t: "Blue sky", c: true}, {t: "Yellow sun", c: false}] },
            { emoji: "🌻", text: "Какой чудесный день! Как сказать по-английски 'Чудесный солнечный день'?", options: [{t: "Lovely sunny day!", c: true}, {t: "Sad day!", c: false}] },
            { emoji: "🚶‍♂️", text: "Утята идут гулять. Покажи жестом 'Идите играть!'", options: [{t: "Go and play!", c: true}, {t: "Sit down!", c: false}] },
            { emoji: "🦆", text: "Мама-утка спрашивает: 'Сколько утят?' (How many ducklings?). Посчитай пальцами!", options: [{t: "One, two, three", c: true}, {t: "Happy, sad", c: false}] },
            { emoji: "😊", text: "Маленький утёнок увидел бабочку и улыбнулся. Теперь он...", options: [{t: "Happy", c: true}, {t: "Sad", c: false}] },
            { emoji: "🌼", text: "Утята нашли красивый жёлтый цветок. Какой это цвет?", options: [{t: "Yellow", c: true}, {t: "Blue", c: false}] },
            { emoji: "💧", text: "Они подошли к пруду. Вода в пруду какого цвета?", options: [{t: "Blue", c: true}, {t: "Yellow", c: false}] },
            { emoji: "🦆", text: "Мама-утка говорит: 'Who's this?' (Кто это?), указывая на самого маленького.", options: [{t: "The little duckling", c: true}, {t: "Mummy Duck", c: false}] },
            { emoji: "🎶", text: "Утята начинают весело крякать! Давай похлопаем в ритм!", options: [{t: "Clap your hands!", c: true}, {t: "Go to sleep!", c: false}] },
            { emoji: "🏃‍♂️", text: "Один утёнок побежал вперёд. Мама говорит ему...", options: [{t: "Go on now!", c: true}, {t: "Sit down!", c: false}] },
            { emoji: "🌳", text: "Они спрятались в тени дерева. Там прохладно. Но день всё равно...", options: [{t: "Sunny", c: true}, {t: "Sad", c: false}] },
            { emoji: "🐛", text: "Маленький утёнок нашёл червячка. Он очень рад! Он...", options: [{t: "Happy", c: true}, {t: "Sad", c: false}] },
            { emoji: "👀", text: "Давай проверим. Это мама-утка грустит?", options: [{t: "No", c: true}, {t: "Yes", c: false}] },
            { emoji: "👀", text: "А маленький утёнок сейчас плачет?", options: [{t: "No", c: true}, {t: "Yes", c: false}] },
            { emoji: "🦋", text: "Сколько бабочек летает над утятами? (Представь, что их три)", options: [{t: "Three", c: true}, {t: "One", c: false}] },
            { emoji: "🎨", text: "Пора раскрашивать нашу картинку! Какой карандаш возьмём для солнца?", options: [{t: "Yellow", c: true}, {t: "Blue", c: false}] },
            { emoji: "🎨", text: "А для травки?", options: [{t: "Green", c: true}, {t: "Red", c: false}] },
            { emoji: "🏡", text: "Прогулка окончена, пора домой. Утята говорят маме...", options: [{t: "Thank you!", c: true}, {t: "Go away!", c: false}] },
            { emoji: "🎉", text: "Утята благополучно вернулись в гнездо. Ты отлично справился с прогулкой!", options: [{t: "Ура!", c: true}, {t: "Ещё раз!", c: true}] }
        ];

        let currentStep = 0;
        const gameArea = document.getElementById('game-area');
        const progress = document.getElementById('progress');

        function renderStep() {
            if (currentStep >= steps.length) {
                gameArea.innerHTML = `<div class="emoji">🏆</div><h1>Ты прошёл весь огромный квест!</h1><p class="success">Мама-утка и все утята, включая самого маленького, говорят тебе спасибо! Ты знаешь все цвета, счёт, эмоции и солнечные фразы. Ты настоящий друг утят!</p><button class="btn bg-green" onclick="location.reload()">Пройти ещё раз</button>`;
                progress.classList.add('hidden');
                return;
            }
            const step = steps[currentStep];
            progress.textContent = `Шаг ${currentStep + 1} из ${steps.length}`;
            
            let buttonsHtml = step.options.map((opt, index) => 
                `<button class="btn ${index === 0 ? 'bg-blue' : 'bg-orange'}" onclick="handleAnswer(${opt.c})">${opt.t}</button>`
            ).join('');

            gameArea.innerHTML = `
                <div class="emoji">${step.emoji}</div>
                <h1>${currentStep === 0 ? 'Начинаем прогулку!' : 'Отличная работа!'}</h1>
                <p>${step.text}</p>
                <div>${buttonsHtml}</div>
            `;
        }

        function handleAnswer(isCorrect) {
            if (isCorrect) {
                currentStep++;
                renderStep();
            } else {
                gameArea.innerHTML = `<div class="emoji">🤔</div><p>Почти угадал! Попробуй ещё раз, подумай внимательно.</p><button class="btn bg-yellow" onclick="renderStep()">Назад</button>`;
            }
        }

        renderStep();
    </script>
</body>
</html>

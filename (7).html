<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Puppet Theatre Quest</title>
<meta name="description" content="Большой финальный квест по английскому языку: Playtime! Surprise.">
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  min-height: 100vh;
  font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", sans-serif;
  background: linear-gradient(to bottom, #8e0000 0%, #c62828 36%, #ffe082 74%, #ffcc80 100%);
  color: #3e2723;
  overflow-x: hidden;
}

body {
  display: flex;
  flex-direction: column;
}

button {
  font-family: inherit;
}

.scene-bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
}

.curtain-left,
.curtain-right {
  position: absolute;
  top: 0;
  bottom: 16%;
  width: 12%;
  background: linear-gradient(to bottom, #d32f2f, #7f0000);
  box-shadow: inset 0 0 30px rgba(0,0,0,.3);
}

.curtain-left {
  left: 0;
  border-radius: 0 0 90px 0;
  animation: curtainSwayLeft 5s ease-in-out infinite alternate;
}

.curtain-right {
  right: 0;
  border-radius: 0 0 0 90px;
  animation: curtainSwayRight 6s ease-in-out infinite alternate;
}

.stage-glow {
  position: absolute;
  left: 50%;
  top: 22%;
  transform: translateX(-50%);
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.42) 0%, rgba(255,255,255,0) 72%);
  animation: glowPulse 3s ease-in-out infinite;
}

.floating-star {
  position: absolute;
  font-size: 2.2em;
  opacity: .75;
  animation: starFloat 7s ease-in-out infinite;
  filter: drop-shadow(2px 3px 0 rgba(0,0,0,.15));
}

.star-one {
  left: 16%;
  top: 16%;
}

.star-two {
  right: 18%;
  top: 22%;
  font-size: 2.7em;
  animation-delay: -2s;
}

.star-three {
  left: 34%;
  top: 9%;
  font-size: 1.8em;
  animation-delay: -4s;
}

.stage-floor {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 20%;
  background: linear-gradient(to top, #6d4c41, #8d6e63);
  border-top: 8px solid #4e342e;
}

.top-bar {
  width: 100%;
  background: #c62828;
  color: #fff;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 6px 18px rgba(0,0,0,.26);
  border-bottom: 5px solid #8e0000;
  min-height: 66px;
}

.title-quest {
  font-size: 1.28em;
  font-weight: bold;
  text-shadow: 2px 2px 0 #8e0000;
  white-space: nowrap;
}

.progress-wrap {
  flex: 1;
  height: 28px;
  background: #8e0000;
  border-radius: 14px;
  overflow: hidden;
  position: relative;
  border: 2px solid #5d0000;
  box-shadow: inset 0 3px 8px rgba(0,0,0,.32);
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #ffee58 0%, #fbc02d 100%);
  position: relative;
  transition: width .65s cubic-bezier(.4,0,.2,1);
}

.progress-bar::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    45deg,
    rgba(255,255,255,.3) 25%,
    transparent 25%,
    transparent 50%,
    rgba(255,255,255,.3) 50%,
    rgba(255,255,255,.3) 75%,
    transparent 75%
  );
  background-size: 28px 28px;
  animation: moveStripes 1s linear infinite;
}

.hero-move {
  position: absolute;
  top: 50%;
  left: 0;
  transform: translateY(-50%);
  font-size: 1.95em;
  transition: left .65s cubic-bezier(.4,0,.2,1);
  animation: heroBounce .45s infinite alternate;
  filter: drop-shadow(2px 2px 0 rgba(0,0,0,.3));
  z-index: 6;
}

.stats-panel {
  text-align: right;
  min-width: 100px;
  font-weight: bold;
  font-size: .96em;
  text-shadow: 1px 1px 0 #8e0000;
}

.badges-row {
  display: flex;
  gap: 3px;
  justify-content: flex-end;
  margin-top: 3px;
}

.badge-icon {
  opacity: .28;
  filter: grayscale(1);
  transition: all .55s cubic-bezier(.18,.89,.32,1.28);
  font-size: 1.16em;
}

.badge-icon.earned {
  opacity: 1;
  filter: grayscale(0);
  transform: scale(1.22);
  animation: starBurst .65s ease;
}

.container {
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
  padding: 22px;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  width: 100%;
  background: #fffdf6;
  border: 6px solid #fbc02d;
  border-radius: 30px;
  box-shadow: 0 18px 38px rgba(0,0,0,.24);
  padding: 30px 18px;
  text-align: center;
  animation: cardEnter .55s cubic-bezier(.18,.89,.32,1.28);
  position: relative;
  overflow: hidden;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 12px;
  background: repeating-linear-gradient(
    90deg,
    #c62828 0 24px,
    #fbc02d 24px 48px,
    #7c4dff 48px 72px
  );
  opacity: .88;
}

.card.exit {
  animation: cardExit .32s ease forwards;
}

.hero-face {
  font-size: 3.4em;
  margin: 10px 0 12px;
  animation: heroWave 2.2s ease-in-out infinite;
  display: inline-block;
  filter: drop-shadow(3px 3px 0 rgba(0,0,0,.15));
}

.instruction-text {
  font-size: 1.56em;
  font-weight: bold;
  line-height: 1.36;
  margin-bottom: 22px;
  color: #8e0000;
}

.sound-btn-main {
  background: #4caf50;
  color: #fff;
  border: none;
  padding: 16px 34px;
  border-radius: 42px;
  font-size: 1.28em;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 7px 0 #2e7d32;
  margin-bottom: 22px;
  transition: transform .12s, box-shadow .12s, background .18s;
}

.sound-btn-main:hover {
  transform: translateY(-2px);
  background: #43a047;
}

.sound-btn-main:active {
  transform: translateY(7px);
  box-shadow: none;
}

.sound-btn-main:focus {
  outline: 3px solid #1b5e20;
  outline-offset: 2px;
}

.sound-btn-main:disabled {
  opacity: .55;
  cursor: default;
  transform: none;
  box-shadow: none;
}

.sound-btn-main::after {
  content: " 🔊";
}

.game-zone {
  min-height: 245px;
  background: #fff3e0;
  border: 3px dashed #fbc02d;
  border-radius: 20px;
  padding: 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 15px;
  margin-bottom: 18px;
  position: relative;
}

.option-btn {
  background: #ffebee;
  color: #8e0000;
  border: 4px solid #ef5350;
  border-radius: 18px;
  padding: 15px 24px;
  font-size: 1.38em;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 6px 0 #c62828;
  transition: transform .16s, box-shadow .16s, background .2s, border-color .2s;
  min-width: 88px;
}

.option-btn:hover {
  transform: translateY(-3px) scale(1.04);
  background: #ffcdd2;
}

.option-btn:active {
  transform: translateY(6px);
  box-shadow: none;
}

.option-btn:focus {
  outline: 3px solid #fbc02d;
  outline-offset: 2px;
}

.option-btn:disabled {
  cursor: default;
  opacity: .64;
  transform: none;
  box-shadow: none;
}

.option-btn.correct {
  background: #c8e6c9;
  border-color: #4caf50;
  color: #1b5e20;
  animation: correctPop .55s ease;
}

.option-btn.wrong {
  background: #ffcdd2;
  border-color: #f44336;
  color: #b71c1c;
  animation: wrongShake .55s ease;
}

.option-btn.selected {
  background: #ede7f6;
  outline: 3px solid #7c4dff;
}

.letter-btn {
  width: 60px;
  height: 60px;
  font-size: 1.88em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 16px;
  background: #fff9c4;
  border-color: #fbc02d;
  box-shadow: 0 6px 0 #f57f17;
  color: #f57f17;
  text-transform: uppercase;
}

.letter-btn:hover {
  background: #fff59d;
  transform: translateY(-3px) scale(1.05);
}

.letter-btn:active {
  transform: translateY(6px);
  box-shadow: none;
}

.letter-btn:focus {
  outline: 3px solid #f57f17;
  outline-offset: 2px;
}

.letter-btn:disabled {
  cursor: default;
  opacity: .62;
  transform: none;
  box-shadow: none;
}

.letter-btn.selected {
  background: #fbc02d;
  color: #fff;
  transform: translateY(6px);
  box-shadow: none;
}

.word-display {
  min-width: 230px;
  min-height: 70px;
  background: #fff;
  border-radius: 16px;
  border-bottom: 6px solid #b0bec5;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 2.25em;
  font-weight: bold;
  letter-spacing: .18em;
  padding: 8px 20px;
  margin-bottom: 16px;
  text-transform: uppercase;
  color: #37474f;
}

.match-col {
  display: flex;
  flex-direction: column;
  gap: 13px;
  flex: 1;
  min-width: 185px;
}

.feedback {
  min-height: 52px;
  font-size: 1.56em;
  font-weight: bold;
  margin: 13px 0 18px;
}

.feedback.success {
  color: #2e7d32;
  animation: feedbackSlide .42s ease;
}

.feedback.error {
  color: #c62828;
  animation: feedbackShake .42s ease;
}

.nav-btns {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 13px;
}

.nav-btn {
  border: none;
  border-radius: 38px;
  padding: 13px 28px;
  font-size: 1.18em;
  font-weight: bold;
  cursor: pointer;
  color: #fff;
  box-shadow: 0 6px 0 rgba(0,0,0,.26);
  transition: transform .12s, box-shadow .12s, background .18s, opacity .18s;
}

.nav-btn:hover {
  transform: translateY(-2px);
}

.nav-btn:active {
  transform: translateY(6px);
  box-shadow: none;
}

.nav-btn:focus {
  outline: 3px solid #3e2723;
  outline-offset: 2px;
}

.nav-btn:disabled {
  opacity: .5;
  cursor: default;
  transform: none;
  box-shadow: none;
}

.btn-back {
  background: #90a4ae;
}

.btn-back:hover {
  background: #78909c;
}

.btn-retry {
  background: #ff7043;
  display: none;
}

.btn-retry:hover {
  background: #f4511e;
}

.btn-next {
  background: #4caf50;
  display: none;
}

.btn-next:hover {
  background: #43a047;
}

.btn-start {
  background: #e91e63;
  color: #fff;
  border: none;
  padding: 21px 46px;
  border-radius: 48px;
  font-size: 1.9em;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 10px 0 #880e4f;
  animation: pulseStart 2s infinite;
  letter-spacing: .06em;
}

.btn-start:hover {
  transform: translateY(-3px);
  background: #d81b60;
}

.btn-start:active {
  transform: translateY(10px);
  box-shadow: none;
}

.btn-start:focus {
  outline: 4px solid #880e4f;
  outline-offset: 3px;
}

.btn-start:disabled {
  opacity: .6;
  cursor: default;
  transform: none;
  box-shadow: none;
  animation: none;
}

.intro-screen {
  text-align: center;
  color: #fff;
  padding: 26px;
}

.intro-screen h1 {
  font-size: 3.2em;
  text-shadow: 4px 4px 0 #8e0000;
  animation: titleFloat 3s ease-in-out infinite;
  margin-bottom: 12px;
}

.intro-subtitle {
  font-size: 1.55em;
  text-shadow: 2px 2px 0 #8e0000;
  margin-bottom: 18px;
}

.heroes-row {
  font-size: 5em;
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 30px 0;
  filter: drop-shadow(4px 4px 0 rgba(0,0,0,.25));
}

.heroes-row span {
  animation: heroWave 2s ease-in-out infinite;
  display: inline-block;
}

.heroes-row span:nth-child(2) {
  animation-delay: .25s;
}

.heroes-row span:nth-child(3) {
  animation-delay: .5s;
}

.final-screen {
  background: #fffdf6;
  border: 8px solid #fbc02d;
  border-radius: 30px;
  padding: 30px 16px;
  text-align: center;
  box-shadow: 0 0 60px rgba(251,192,45,.5), 0 20px 42px rgba(0,0,0,.26);
}

.final-screen h1 {
  color: #c62828;
  font-size: 2.6em;
  margin-bottom: 14px;
  text-shadow: 2px 2px 0 #ffe082;
}

.reward-icon {
  font-size: 6em;
  display: inline-block;
  margin: 20px 0;
  animation: rotateReward 5s linear infinite;
  filter: drop-shadow(0 9px 18px rgba(0,0,0,.22));
}

.word-list-final {
  text-align: left;
  background: #fff3e0;
  border: 2px solid #fbc02d;
  border-radius: 18px;
  padding: 18px;
  margin: 24px 0;
  max-height: 340px;
  overflow-y: auto;
}

.word-row-final {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px dashed #ffcc80;
  font-size: 1.06em;
}

.word-row-final:last-child {
  border-bottom: none;
}

.mini-sound-btn {
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 50%;
  background: #4caf50;
  color: #fff;
  font-size: 1.05em;
  cursor: pointer;
  box-shadow: 0 4px 0 #2e7d32;
  flex: 0 0 auto;
  transition: transform .12s, box-shadow .12s, background .18s;
}

.mini-sound-btn:hover {
  transform: translateY(-2px);
  background: #43a047;
}

.mini-sound-btn:active {
  transform: translateY(4px);
  box-shadow: none;
}

.mini-sound-btn:focus {
  outline: 3px solid #2e7d32;
  outline-offset: 2px;
}

.mini-sound-btn:disabled {
  opacity: .55;
  cursor: default;
  transform: none;
  box-shadow: none;
}

.sequence-box {
  font-size: 2.4em;
  background: #fff;
  border-radius: 18px;
  padding: 10px 22px;
  border: 3px solid #fbc02d;
  letter-spacing: .14em;
  box-shadow: 0 6px 0 #f57f17;
}

.stage-zone {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.box-row {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  justify-content: center;
}

.box-btn {
  font-size: 3em;
  background: #fff;
  border: 4px solid #fbc02d;
  border-radius: 20px;
  width: 96px;
  height: 96px;
  cursor: pointer;
  transition: transform .16s, box-shadow .16s, background .2s, border-color .2s;
  box-shadow: 0 7px 0 #f57f17;
}

.box-btn:hover {
  transform: translateY(-4px) scale(1.06);
  background: #fff9c4;
}

.box-btn:active {
  transform: translateY(7px);
  box-shadow: none;
}

.box-btn:focus {
  outline: 3px solid #f57f17;
  outline-offset: 2px;
}

.box-btn:disabled {
  opacity: .5;
  cursor: default;
  transform: none;
  box-shadow: none;
}

.box-btn.correct {
  background: #c8e6c9;
  border-color: #4caf50;
  box-shadow: 0 7px 0 #2e7d32;
}

.box-btn.wrong {
  background: #ffcdd2;
  border-color: #f44336;
  box-shadow: 0 7px 0 #c62828;
  animation: wrongShake .55s ease;
}

.puppet-btn {
  font-size: 3em;
  background: #fff;
  border: 4px solid #ef5350;
  border-radius: 24px;
  width: 92px;
  height: 92px;
  cursor: pointer;
  transition: transform .16s, box-shadow .16s, background .2s, border-color .2s;
  box-shadow: 0 7px 0 #c62828;
}

.puppet-btn:hover {
  transform: translateY(-4px) scale(1.06);
  background: #ffebee;
}

.puppet-btn:active {
  transform: translateY(7px);
  box-shadow: none;
}

.puppet-btn:focus {
  outline: 3px solid #c62828;
  outline-offset: 2px;
}

.puppet-btn:disabled {
  opacity: .5;
  cursor: default;
  transform: none;
  box-shadow: none;
}

.puppet-btn.correct {
  background: #c8e6c9;
  border-color: #4caf50;
  box-shadow: 0 7px 0 #2e7d32;
}

.puppet-btn.wrong {
  background: #ffcdd2;
  border-color: #f44336;
  box-shadow: 0 7px 0 #c62828;
  animation: wrongShake .55s ease;
}

.puppet-btn.flash {
  animation: patternFlash .45s ease;
}

@media (max-width: 600px) {
  .container {
    padding: 14px;
  }

  .card {
    padding: 22px 12px;
    border-radius: 22px;
  }

  .instruction-text {
    font-size: 1.28em;
  }

  .option-btn {
    padding: 13px 17px;
    font-size: 1.18em;
    min-width: 74px;
  }

  .word-display {
    min-width: 175px;
    font-size: 1.85em;
    letter-spacing: .1em;
  }

  .letter-btn {
    width: 50px;
    height: 50px;
    font-size: 1.55em;
  }

  .intro-screen h1 {
    font-size: 2.25em;
  }

  .heroes-row {
    font-size: 3.5em;
    gap: 12px;
  }

  .btn-start {
    font-size: 1.5em;
    padding: 17px 30px;
  }

  .title-quest {
    font-size: 1em;
  }

  .stats-panel {
    min-width: 80px;
    font-size: .82em;
  }

  .box-btn,
  .puppet-btn {
    width: 76px;
    height: 76px;
    font-size: 2.4em;
  }
}

@media (min-width: 601px) and (max-width: 900px) {
  .container {
    max-width: 760px;
  }

  .instruction-text {
    font-size: 1.44em;
  }
}

@media (min-width: 901px) {
  .container {
    max-width: 820px;
  }

  .card {
    padding: 36px 30px;
  }

  .instruction-text {
    font-size: 1.68em;
  }

  .game-zone {
    min-height: 290px;
  }
}

@media (prefers-color-scheme: dark) {
  body {
    background: #263238;
    color: #eceff1;
  }

  .scene-bg {
    display: none;
  }

  .card,
  .final-screen {
    background: #37474f;
    border-color: #fbc02d;
    color: #eceff1;
  }

  .instruction-text {
    color: #ffcc80;
  }

  .game-zone {
    background: #455a64;
    border-color: #fbc02d;
  }

  .option-btn {
    background: #546e7a;
    color: #eceff1;
    border-color: #ef5350;
    box-shadow: 0 6px 0 #8e0000;
  }

  .option-btn:hover {
    background: #607d8b;
  }

  .option-btn.correct {
    background: #2e7d32;
    border-color: #4caf50;
    color: #fff;
  }

  .option-btn.wrong {
    background: #c62828;
    border-color: #ef5350;
    color: #fff;
  }

  .letter-btn {
    background: #455a64;
    color: #fbc02d;
    border-color: #f57f17;
    box-shadow: 0 6px 0 #e65100;
  }

  .letter-btn.selected {
    background: #fbc02d;
    color: #fff;
  }

  .word-display {
    background: #263238;
    color: #eceff1;
    border-color: #78909c;
  }

  .word-list-final {
    background: #455a64;
    border-color: #fbc02d;
  }

  .word-row-final {
    border-color: #546e7a;
  }

  .sequence-box {
    background: #263238;
    color: #eceff1;
    border-color: #fbc02d;
    box-shadow: 0 6px 0 #e65100;
  }

  .box-btn,
  .puppet-btn {
    background: #546e7a;
    border-color: #90a4ae;
    box-shadow: 0 7px 0 #263238;
  }

  .box-btn:hover,
  .puppet-btn:hover {
    background: #607d8b;
  }

  .box-btn.correct,
  .puppet-btn.correct {
    background: #2e7d32;
    border-color: #4caf50;
  }

  .box-btn.wrong,
  .puppet-btn.wrong {
    background: #c62828;
    border-color: #ef5350;
  }
}

@keyframes curtainSwayLeft {
  0% {
    transform: skewY(0deg) translateX(0);
  }
  100% {
    transform: skewY(1.5deg) translateX(-5px);
  }
}

@keyframes curtainSwayRight {
  0% {
    transform: skewY(0deg) translateX(0);
  }
  100% {
    transform: skewY(-1.5deg) translateX(5px);
  }
}

@keyframes glowPulse {
  0%,
  100% {
    opacity: .45;
    transform: translateX(-50%) scale(1);
  }
  50% {
    opacity: .8;
    transform: translateX(-50%) scale(1.1);
  }
}

@keyframes starFloat {
  0%,
  100% {
    transform: translateY(0) rotate(0);
  }
  50% {
    transform: translateY(-18px) rotate(10deg);
  }
}

@keyframes moveStripes {
  from {
    background-position: 0 0;
  }
  to {
    background-position: 28px 0;
  }
}

@keyframes heroBounce {
  0% {
    transform: translateY(-50%) translateY(0);
  }
  100% {
    transform: translateY(-50%) translateY(-8px);
  }
}

@keyframes starBurst {
  0% {
    transform: scale(.4) rotate(-32deg);
    opacity: 0;
  }
  60% {
    transform: scale(1.42) rotate(9deg);
    opacity: 1;
  }
  100% {
    transform: scale(1.22) rotate(0);
    opacity: 1;
  }
}

@keyframes cardEnter {
  from {
    opacity: 0;
    transform: translateY(38px) scale(.93);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes cardExit {
  from {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  to {
    opacity: 0;
    transform: translateY(-32px) scale(.93);
  }
}

@keyframes heroWave {
  0%,
  100% {
    transform: translateY(0) rotate(0);
  }
  30% {
    transform: translateY(-11px) rotate(-5deg);
  }
  70% {
    transform: translateY(-5px) rotate(5deg);
  }
}

@keyframes correctPop {
  0% {
    transform: scale(1);
  }
  45% {
    transform: scale(1.13);
  }
  100% {
    transform: scale(1);
  }
}

@keyframes wrongShake {
  0%,
  100% {
    transform: translateX(0);
  }
  20% {
    transform: translateX(-9px);
  }
  40% {
    transform: translateX(9px);
  }
  60% {
    transform: translateX(-7px);
  }
  80% {
    transform: translateX(7px);
  }
}

@keyframes feedbackSlide {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes feedbackShake {
  0%,
  100% {
    transform: translateX(0);
  }
  25% {
    transform: translateX(-9px);
  }
  75% {
    transform: translateX(9px);
  }
}

@keyframes pulseStart {
  0%,
  100% {
    box-shadow: 0 10px 0 #880e4f, 0 0 26px rgba(233,30,99,.35);
  }
  50% {
    box-shadow: 0 10px 0 #880e4f, 0 0 48px rgba(233,30,99,.68);
  }
}

@keyframes titleFloat {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-11px);
  }
}

@keyframes rotateReward {
  from {
    transform: rotate(0) scale(1);
  }
  50% {
    transform: rotate(180deg) scale(1.13);
  }
  to {
    transform: rotate(360deg) scale(1);
  }
}

@keyframes confettiFall {
  0% {
    transform: translateY(-100vh) rotate(0);
    opacity: 1;
  }
  100% {
    transform: translateY(100vh) rotate(720deg);
    opacity: 0;
  }
}

@keyframes patternFlash {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.18);
  }
  100% {
    transform: scale(1);
  }
}
</style>
</head>
<body>
<div class="scene-bg" id="sceneBg">
  <div class="curtain-left"></div>
  <div class="curtain-right"></div>
  <div class="stage-glow"></div>
  <div class="floating-star star-one">⭐</div>
  <div class="floating-star star-two">✨</div>
  <div class="floating-star star-three">⭐</div>
  <div class="stage-floor"></div>
</div>

<header class="top-bar" id="topBar" style="display:none;">
  <div class="title-quest">🎭 Puppet Theatre</div>
  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar"></div>
    <div class="hero-move" id="heroMove">🐒</div>
  </div>
  <div class="stats-panel">
    <div id="statsText">0/24 • 0%</div>
    <div class="badges-row" id="badgesRow">
      <span class="badge-icon">🎁</span>
      <span class="badge-icon">🎁</span>
      <span class="badge-icon">🎁</span>
      <span class="badge-icon">🎁</span>
      <span class="badge-icon">🎁</span>
      <span class="badge-icon">🎁</span>
      <span class="badge-icon">🎁</span>
      <span class="badge-icon">🎁</span>
    </div>
  </div>
</header>

<main class="container" id="container"></main>

<script>
var PuppetTheatreBigQuest = {
  steps: [
    { type: "intro" },
    { type: "listen", hero: "🐒", text: "Послушай и выбери картинку", audio: "I've got a surprise", say: "I've got a surprise", answer: "🎁" },
    { type: "choice", hero: "🤡", text: "Что у меня есть?", options: ["🎁", "🥪", "🎺"], say: "I've got a surprise", answer: "🎁" },
    { type: "spell", hero: "🎁", text: "Собери слово", word: "SURPRISE", say: "surprise" },
    { type: "yesno", hero: "🎁", text: "Is it a surprise?", say: "surprise", answer: "yes" },
    { type: "count", hero: "🎁", text: "Сколько сюрпризов? 🎁🎁🎁", options: ["2", "3", "4"], say: "I've got a surprise", answer: "3" },
    { type: "match", hero: "🎭", text: "Соедини слово и картинку", pairs: [["Punch", "🤡"], ["Judy", "👧"], ["surprise", "🎁"], ["say", "💬"]], say: "Punch, Judy, surprise, say" },
    { type: "order", hero: "🎁", text: "Расставь слова по порядку", words: ["I've", "got", "a", "surprise"], answer: "I've got a surprise", say: "I've got a surprise" },
    { type: "pick", hero: "🤡", text: "Что делает Панч?", options: ["💬", "🍽️", "🛏️"], say: "What does Punch say?", answer: "💬" },
    { type: "puppet_show", hero: "🎭", text: "Кто говорит? Нажми по порядку", sequence: ["🤡", "👧", "🤡"], say: "What does Punch say?" },
    { type: "surprise_box", hero: "🎁", text: "Найди сюрприз", boxes: ["📦", "📦", "📦"], correctIndex: 1, say: "I've got a surprise" },
    { type: "listen", hero: "👉", text: "Послушай и выбери картинку", audio: "For you", say: "For you", answer: "👉" },
    { type: "choice", hero: "👧", text: "Кто говорит: For me?", options: ["👧", "🤡", "🎁"], say: "For me?", answer: "👧" },
    { type: "spell", hero: "🤡", text: "Собери слово", word: "PUNCH", say: "Punch" },
    { type: "yesno", hero: "👧", text: "Is it Judy?", say: "Judy", answer: "yes" },
    { type: "count", hero: "🎭", text: "Сколько кукол? 🤡👧", options: ["1", "2", "3"], say: "Punch and Judy", answer: "2" },
    { type: "match", hero: "🎉", text: "Соедини фразу и картинку", pairs: [["I've got", "🎁"], ["for you", "👉"], ["What does Punch say?", "🤡"], ["Ta-daa", "🎉"]], say: "I've got a surprise for you" },
    { type: "order", hero: "👉", text: "Расставь слова по порядку", words: ["for", "you"], answer: "for you", say: "for you" },
    { type: "pick", hero: "🎁", text: "Что лишнее?", options: ["🎁", "🎉", "🥪"], say: "I've got a surprise", answer: "🥪" },
    { type: "listen", hero: "🤡", text: "Послушай и выбери картинку", audio: "What does Punch say?", say: "What does Punch say?", answer: "🤡" },
    { type: "spell", hero: "👧", text: "Собери слово", word: "JUDY", say: "Judy" },
    { type: "listen", hero: "🎉", text: "Послушай и выбери картинку", audio: "Ta-daa", say: "Ta-daa", answer: "🎉" },
    { type: "choice", hero: "🎁", text: "Что такое сюрприз?", options: ["🎁", "🥪", "🛏️"], say: "surprise", answer: "🎁" },
    { type: "final" }
  ],

  currentStep: 0,
  score: 0,
  currentAudio: null,

  container: document.getElementById("container"),
  topBar: document.getElementById("topBar"),
  progressBar: document.getElementById("progressBar"),
  heroMove: document.getElementById("heroMove"),
  statsText: document.getElementById("statsText"),
  badgesRow: document.getElementById("badgesRow").children,

  init: function() {
    this.renderStep();
  },

  speak: function(textToSpeak) {
    if (!textToSpeak) {
      return;
    }
    if (this.currentAudio) {
      speechSynthesis.cancel();
    }
    var utterance = new SpeechSynthesisUtterance(textToSpeak);
    utterance.lang = "en-GB";
    utterance.rate = 0.85;
    speechSynthesis.speak(utterance);
    this.currentAudio = utterance;
  },

  updateHud: function() {
    var totalSteps = this.steps.length - 1;
    var progressPercent = Math.round((this.currentStep / totalSteps) * 100);
    this.progressBar.style.width = progressPercent + "%";
    this.heroMove.style.left = "calc(" + progressPercent + "% - 20px)";
    this.statsText.innerText = this.currentStep + "/" + totalSteps + " • " + progressPercent + "%";

    var badgeCount = Math.floor(this.score / 3);
    for (var badgeIndex = 0; badgeIndex < this.badgesRow.length; badgeIndex++) {
      if (badgeIndex < badgeCount && !this.badgesRow[badgeIndex].classList.contains("earned")) {
        this.badgesRow[badgeIndex].classList.add("earned");
      }
    }
  },

  showConfetti: function() {
    var confettiEmojis = ["🎉", "✨", "🌟", "🎁", "🎭", "🤡", "👧", "🎪"];
    for (var confettiIndex = 0; confettiIndex < 60; confettiIndex++) {
      var confettiPiece = document.createElement("div");
      confettiPiece.innerText = confettiEmojis[Math.floor(Math.random() * confettiEmojis.length)];
      confettiPiece.style.position = "fixed";
      confettiPiece.style.top = "-70px";
      confettiPiece.style.left = Math.random() * 100 + "vw";
      confettiPiece.style.fontSize = (1.2 + Math.random() * 2.4) + "em";
      confettiPiece.style.zIndex = "1200";
      confettiPiece.style.pointerEvents = "none";
      confettiPiece.style.animation = "confettiFall " + (2.1 + Math.random() * 3.2) + "s linear forwards";
      document.body.appendChild(confettiPiece);
      setTimeout(function(pieceToRemove) {
        return function() {
          if (pieceToRemove.parentNode) {
            pieceToRemove.parentNode.removeChild(pieceToRemove);
          }
        };
      }(confettiPiece), 5600);
    }
  },

  buildIntro: function() {
    var app = this;
    app.topBar.style.display = "none";
    app.container.innerHTML =
      '<div class="intro-screen">' +
      "<h1>🎭 Puppet Theatre Quest</h1>" +
      '<div class="intro-subtitle">Playtime! Surprise</div>' +
      '<div class="heroes-row"><span>🤡</span><span>👧</span><span>🐒</span></div>' +
      '<button class="btn-start" id="startBtn">Start!</button>' +
      "</div>";

    document.getElementById("startBtn").onclick = function() {
      app.currentStep++;
      app.topBar.style.display = "flex";
      app.renderStep();
    };
  },

  buildFinal: function() {
    var app = this;
    app.topBar.style.display = "none";
    app.showConfetti();

    var finalWords = [
      { en: "surprise", ipa: "/səˈpraɪz/", ru: "сюрприз" },
      { en: "Punch", ipa: "/pʌntʃ/", ru: "Панч" },
      { en: "Judy", ipa: "/ˈdʒuːdi/", ru: "Джуди" },
      { en: "say", ipa: "/seɪ/", ru: "говорить" },
      { en: "for you", ipa: "/fɔː juː/", ru: "для тебя" },
      { en: "for me?", ipa: "/fɔː miː/", ru: "для меня?" },
      { en: "I've got a surprise", ipa: "/aɪv ɡɒt ə səˈpraɪz/", ru: "У меня есть сюрприз" },
      { en: "I've got a surprise for you", ipa: "/aɪv ɡɒt ə səˈpraɪz fɔː juː/", ru: "У меня есть для тебя сюрприз" },
      { en: "What does Punch say?", ipa: "/wɒt dʌz pʌntʃ seɪ/", ru: "Что говорит Панч?" },
      { en: "Ta-daa!", ipa: "/tɑːˈdɑː/", ru: "Та-даа!" }
    ];

    var wordListHtml = "";
    for (var wordIndex = 0; wordIndex < finalWords.length; wordIndex++) {
      wordListHtml +=
        '<div class="word-row-final">' +
        "<span><b>" + finalWords[wordIndex].en + "</b> " + finalWords[wordIndex].ipa + " — " + finalWords[wordIndex].ru + "</span>" +
        '<button class="mini-sound-btn" data-word="' + finalWords[wordIndex].en + '">🔊</button>' +
        "</div>";
    }

    app.container.innerHTML =
      '<div class="final-screen">' +
      "<h1>Great Job!</h1>" +
      '<div class="reward-icon">🎁</div>' +
      '<p style="font-size:1.3em; margin-bottom:18px;">The puppets are ready, the box is open, and the surprise is for you!</p>' +
      '<button class="sound-btn-main" id="finalAudio">I\'ve got a surprise for you!</button>' +
      '<div class="word-list-final">' + wordListHtml + "</div>" +
      '<p style="font-size:1.4em; font-weight:bold;">Score: ' + app.score + "</p>" +
      '<div class="nav-btns">' +
      '<button class="nav-btn btn-back" id="finalBackBtn">⬅️ Back</button>' +
      '<button class="nav-btn btn-start" id="restartBtn" style="font-size:1.25em; padding:17px 30px;">🔄 Play Again</button>' +
      "</div>" +
      "</div>";

    document.getElementById("finalAudio").onclick = function() {
      app.speak("I've got a surprise for you! Well done!");
    };

    document.getElementById("finalBackBtn").onclick = function() {
      app.currentStep--;
      app.renderStep();
    };

    document.getElementById("restartBtn").onclick = function() {
      app.currentStep = 0;
      app.score = 0;
      app.renderStep();
    };

    var miniSoundButtons = document.querySelectorAll(".mini-sound-btn");
    for (var miniSoundIndex = 0; miniSoundIndex < miniSoundButtons.length; miniSoundIndex++) {
      (function(buttonElement) {
        buttonElement.onclick = function() {
          app.speak(buttonElement.getAttribute("data-word"));
        };
      })(miniSoundButtons[miniSoundIndex]);
    }
  },

  buildShell: function(step) {
    var audioPhrase = step.audio || step.say || step.word || "";
    var shellHtml = '<div class="hero-face">' + (step.hero || "🐒") + "</div>";
    shellHtml += '<div class="instruction-text">' + step.text + "</div>";

    if (audioPhrase) {
      shellHtml += '<button class="sound-btn-main" id="mainAudio">' + audioPhrase + "</button>";
    }

    shellHtml += '<div class="game-zone" id="gameZone"></div>';
    shellHtml += '<div class="feedback" id="feedback"></div>';
    shellHtml +=
      '<div class="nav-btns">' +
      '<button class="nav-btn btn-back" id="backBtn">⬅️</button>' +
      '<button class="nav-btn btn-retry" id="retryBtn">🔄</button>' +
      '<button class="nav-btn btn-next" id="nextBtn">➡️</button>' +
      "</div>";

    this.container.innerHTML = '<div class="card">' + shellHtml + "</div>";

    return {
      audioPhrase: audioPhrase,
      zone: document.getElementById("gameZone"),
      feedback: document.getElementById("feedback"),
      backButton: document.getElementById("backBtn"),
      retryButton: document.getElementById("retryBtn"),
      nextButton: document.getElementById("nextBtn"),
      mainAudioButton: document.getElementById("mainAudio")
    };
  },

  makeCorrectHandler: function(step, shell) {
    var app = this;
    return function() {
      shell.feedback.innerText = "✅ Correct!";
      shell.feedback.className = "feedback success";
      var successPhrase = step.say || step.audio || step.word || "";
      if (successPhrase) {
        app.speak(successPhrase + ", Well done!");
      } else {
        app.speak("Well done!");
      }
      app.score++;
      shell.nextButton.style.display = "inline-block";
      shell.retryButton.style.display = "none";
      app.updateHud();
    };
  },

  makeWrongHandler: function(shell) {
    var app = this;
    return function(elementToShake) {
      shell.feedback.innerText = "❌ Try again!";
      shell.feedback.className = "feedback error";
      app.speak("Try again!");
      if (elementToShake) {
        elementToShake.classList.add("wrong");
      }
      shell.retryButton.style.display = "inline-block";
      setTimeout(function() {
        shell.feedback.className = "feedback";
        if (elementToShake) {
          elementToShake.classList.remove("wrong");
        }
      }, 680);
    };
  },

  attachNavigation: function(shell) {
    var app = this;

    if (shell.mainAudioButton && shell.audioPhrase) {
      shell.mainAudioButton.onclick = function() {
        app.speak(shell.audioPhrase);
      };
    }

    shell.backButton.onclick = function() {
      if (app.currentStep > 1) {
        app.currentStep--;
        app.renderStep();
      }
    };

    shell.retryButton.onclick = function() {
      app.renderStep();
    };

    shell.nextButton.onclick = function() {
      app.currentStep++;
      app.renderStep();
    };
  },

  buildChoice: function(step, shell, correctHandler, wrongHandler) {
    var optionsList = [];
    var correctAnswer = "";

    if (step.type === "listen") {
      optionsList = step.options || ["🎁", "🤡", "👧", "💬", "🎉"];
      correctAnswer = step.answer;
    } else if (step.type === "yesno") {
      optionsList = ["Yes", "No"];
      correctAnswer = step.answer === "yes" ? "Yes" : "No";
    } else {
      optionsList = step.options || [];
      correctAnswer = step.answer;
    }

    optionsList.forEach(function(optionValue) {
      var optionButton = document.createElement("button");
      optionButton.className = "option-btn";
      optionButton.innerText = optionValue;

      optionButton.onclick = function() {
        if (optionValue === correctAnswer) {
          optionButton.classList.add("correct");
          correctHandler();
          var allOptionButtons = shell.zone.querySelectorAll(".option-btn");
          for (var optionIndex = 0; optionIndex < allOptionButtons.length; optionIndex++) {
            allOptionButtons[optionIndex].disabled = true;
          }
        } else {
          wrongHandler(optionButton);
        }
      };

      shell.zone.appendChild(optionButton);
    });
  },

  buildSpell: function(step, shell, correctHandler, wrongHandler) {
    var targetLetters = step.word.split("");
    var shuffledLetters = targetLetters.slice().sort(function() {
      return 0.5 - Math.random();
    });
    var selectedLetters = [];

    var wordDisplay = document.createElement("div");
    wordDisplay.className = "word-display";
    shell.zone.appendChild(wordDisplay);

    shuffledLetters.forEach(function(letterValue) {
      var letterButton = document.createElement("button");
      letterButton.className = "letter-btn option-btn";
      letterButton.innerText = letterValue;

      letterButton.onclick = function() {
        if (letterButton.disabled) {
          return;
        }

        selectedLetters.push(letterValue);
        letterButton.disabled = true;
        letterButton.classList.add("selected");
        wordDisplay.innerText = selectedLetters.join("");

        if (selectedLetters.length === targetLetters.length) {
          if (selectedLetters.join("") === step.word) {
            correctHandler();
          } else {
            wrongHandler(wordDisplay);
            setTimeout(function() {
              selectedLetters = [];
              wordDisplay.innerText = "";
              var letterButtons = shell.zone.querySelectorAll(".letter-btn");
              for (var letterIndex = 0; letterIndex < letterButtons.length; letterIndex++) {
                letterButtons[letterIndex].disabled = false;
                letterButtons[letterIndex].classList.remove("selected");
              }
            }, 720);
          }
        }
      };

      shell.zone.appendChild(letterButton);
    });
  },

  buildOrder: function(step, shell, correctHandler, wrongHandler) {
    var targetWords = step.words.slice();
    var shuffledWords = targetWords.slice().sort(function() {
      return 0.5 - Math.random();
    });
    var selectedWords = [];

    var sentenceDisplay = document.createElement("div");
    sentenceDisplay.className = "word-display";
    sentenceDisplay.style.fontSize = "1.85em";
    sentenceDisplay.style.letterSpacing = "normal";
    shell.zone.appendChild(sentenceDisplay);

    shuffledWords.forEach(function(wordValue) {
      var wordButton = document.createElement("button");
      wordButton.className = "option-btn";
      wordButton.innerText = wordValue;

      wordButton.onclick = function() {
        if (wordButton.disabled) {
          return;
        }

        selectedWords.push(wordValue);
        wordButton.disabled = true;
        sentenceDisplay.innerText = selectedWords.join(" ");

        if (selectedWords.length === targetWords.length) {
          if (selectedWords.join(" ") === step.answer) {
            correctHandler();
          } else {
            wrongHandler(sentenceDisplay);
            setTimeout(function() {
              selectedWords = [];
              sentenceDisplay.innerText = "";
              var wordButtons = shell.zone.querySelectorAll(".option-btn");
              for (var wordIndex = 0; wordIndex < wordButtons.length; wordIndex++) {
                wordButtons[wordIndex].disabled = false;
              }
            }, 720);
          }
        }
      };

      shell.zone.appendChild(wordButton);
    });
  },

  buildMatch: function(step, shell, correctHandler, wrongHandler) {
    var matchPairs = step.pairs;

    var leftColumn = document.createElement("div");
    var rightColumn = document.createElement("div");
    leftColumn.className = "match-col";
    rightColumn.className = "match-col";
    shell.zone.appendChild(leftColumn);
    shell.zone.appendChild(rightColumn);

    var selectedLeftButton = null;
    var matchedCount = 0;

    matchPairs.forEach(function(pairItem) {
      var leftButton = document.createElement("button");
      leftButton.className = "option-btn";
      leftButton.style.width = "100%";
      leftButton.innerText = pairItem[0];

      leftButton.onclick = function() {
        if (leftButton.disabled) {
          return;
        }
        if (selectedLeftButton) {
          selectedLeftButton.classList.remove("selected");
        }
        selectedLeftButton = leftButton;
        leftButton.classList.add("selected");
      };

      leftColumn.appendChild(leftButton);
    });

    var rightPairs = matchPairs.slice().sort(function() {
      return 0.5 - Math.random();
    });

    rightPairs.forEach(function(pairItem) {
      var rightButton = document.createElement("button");
      rightButton.className = "option-btn";
      rightButton.style.width = "100%";
      rightButton.innerText = pairItem[1];

      rightButton.onclick = function() {
        if (!selectedLeftButton || rightButton.disabled) {
          return;
        }

        var matchingPair = null;
        for (var pairIndex = 0; pairIndex < matchPairs.length; pairIndex++) {
          if (matchPairs[pairIndex][0] === selectedLeftButton.innerText) {
            matchingPair = matchPairs[pairIndex];
            break;
          }
        }

        if (matchingPair && matchingPair[1] === pairItem[1]) {
          selectedLeftButton.classList.add("correct");
          rightButton.classList.add("correct");
          selectedLeftButton.disabled = true;
          rightButton.disabled = true;
          selectedLeftButton = null;
          matchedCount++;

          if (matchedCount === matchPairs.length) {
            correctHandler();
          }
        } else {
          wrongHandler(rightButton);
        }
      };

      rightColumn.appendChild(rightButton);
    });
  },

  buildPuppetShow: function(step, shell, correctHandler, wrongHandler) {
    shell.zone.innerHTML =
      '<div class="stage-zone">' +
      '<div class="sequence-box" id="sequenceBox">' + step.sequence.join("") + "</div>" +
      '<div class="box-row" id="puppetButtons"></div>' +
      "</div>";

    var puppetButtons = document.getElementById("puppetButtons");
    var sequenceIndex = 0;
    var puppetOptions = ["🤡", "👧", "🎁"];

    puppetOptions.forEach(function(puppetEmoji) {
      var puppetButton = document.createElement("button");
      puppetButton.className = "puppet-btn";
      puppetButton.innerText = puppetEmoji;

      puppetButton.onclick = function() {
        if (sequenceIndex >= step.sequence.length) {
          return;
        }

        if (puppetEmoji === step.sequence[sequenceIndex]) {
          sequenceIndex++;
          puppetButton.classList.remove("flash");
          void puppetButton.offsetWidth;
          puppetButton.classList.add("flash");

          if (sequenceIndex === step.sequence.length) {
            setTimeout(correctHandler, 460);
            var allPuppetButtons = puppetButtons.querySelectorAll(".puppet-btn");
            for (var puppetIndex = 0; puppetIndex < allPuppetButtons.length; puppetIndex++) {
              allPuppetButtons[puppetIndex].disabled = true;
            }
          }
        } else {
          wrongHandler(puppetButton);
        }
      };

      puppetButtons.appendChild(puppetButton);
    });
  },

  buildSurpriseBox: function(step, shell, correctHandler, wrongHandler) {
    shell.zone.innerHTML =
      '<div class="stage-zone">' +
      '<div class="sequence-box">🎁?</div>' +
      '<div class="box-row" id="boxButtons"></div>' +
      "</div>";

    var boxButtons = document.getElementById("boxButtons");
    var boxes = step.boxes || ["📦", "📦", "📦"];
    var correctIndex = step.correctIndex || 0;

    boxes.forEach(function(boxEmoji, boxIndex) {
      var boxButton = document.createElement("button");
      boxButton.className = "box-btn";
      boxButton.innerText = boxEmoji;

      boxButton.onclick = function() {
        if (boxButton.disabled) {
          return;
        }

        if (boxIndex === correctIndex) {
          boxButton.innerText = "🎁";
          boxButton.classList.add("correct");
          var allBoxButtons = boxButtons.querySelectorAll(".box-btn");
          for (var allBoxIndex = 0; allBoxIndex < allBoxButtons.length; allBoxIndex++) {
            allBoxButtons[allBoxIndex].disabled = true;
          }
          setTimeout(correctHandler, 420);
        } else {
          wrongHandler(boxButton);
        }
      };

      boxButtons.appendChild(boxButton);
    });
  },

  renderStep: function() {
    var app = this;

    if (app.currentStep >= app.steps.length) {
      return;
    }

    var step = app.steps[app.currentStep];
    app.updateHud();

    if (step.type === "intro") {
      app.buildIntro();
      return;
    }

    if (step.type === "final") {
      app.buildFinal();
      return;
    }

    var shell = app.buildShell(step);
    app.attachNavigation(shell);

    var correctHandler = app.makeCorrectHandler(step, shell);
    var wrongHandler = app.makeWrongHandler(shell);

    if (step.type === "listen" || step.type === "choice" || step.type === "yesno" || step.type === "count" || step.type === "pick") {
      app.buildChoice(step, shell, correctHandler, wrongHandler);
      return;
    }

    if (step.type === "spell") {
      app.buildSpell(step, shell, correctHandler, wrongHandler);
      return;
    }

    if (step.type === "order") {
      app.buildOrder(step, shell, correctHandler, wrongHandler);
      return;
    }

    if (step.type === "match") {
      app.buildMatch(step, shell, correctHandler, wrongHandler);
      return;
    }

    if (step.type === "puppet_show") {
      app.buildPuppetShow(step, shell, correctHandler, wrongHandler);
      return;
    }

    if (step.type === "surprise_box") {
      app.buildSurpriseBox(step, shell, correctHandler, wrongHandler);
      return;
    }
  }
};

PuppetTheatreBigQuest.init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lighthouse Swan Quest</title>
<meta name="description" content="Большой финальный квест по английскому языку: The Ugly Duckling.">
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  min-height: 100vh;
  font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", sans-serif;
  background: linear-gradient(to bottom, #0d1b2a 0%, #1b263b 28%, #415a77 58%, #ffcf87 100%);
  color: #3e2723;
  overflow-x: hidden;
}

body {
  display: flex;
  flex-direction: column;
}

button {
  font-family: inherit;
}

.scene-bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
}

.beacon {
  position: absolute;
  left: 50%;
  bottom: 18%;
  transform: translateX(-50%);
  width: 90px;
  height: 220px;
  background: linear-gradient(to bottom, #ef5350 0 18%, #fffde7 18% 36%, #ef5350 36% 54%, #fffde7 54% 72%, #455a64 72% 100%);
  border-radius: 18px 18px 8px 8px;
  box-shadow: 0 12px 28px rgba(0,0,0,.32);
}

.beacon-light {
  position: absolute;
  left: 50%;
  top: 12%;
  transform: translateX(-50%);
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff59d 0%, #fbc02d 45%, rgba(251,192,45,0) 72%);
  animation: beaconPulse 2.4s ease-in-out infinite;
}

.light-beam-left,
.light-beam-right {
  position: absolute;
  top: 14%;
  width: 44vw;
  height: 90px;
  background: linear-gradient(to right, rgba(255,245,157,.42), rgba(255,245,157,0));
  transform-origin: right center;
  border-radius: 50%;
  opacity: .72;
}

.light-beam-left {
  left: 2%;
  animation: beamSweepLeft 7s ease-in-out infinite alternate;
}

.light-beam-right {
  right: 2%;
  transform-origin: left center;
  background: linear-gradient(to left, rgba(255,245,157,.42), rgba(255,245,157,0));
  animation: beamSweepRight 8s ease-in-out infinite alternate;
}

.wave {
  position: absolute;
  left: -10%;
  width: 130%;
  height: 70px;
  background: radial-gradient(circle at 20% 50%, #4fc3f7 0 18px, transparent 19px),
              radial-gradient(circle at 50% 50%, #29b6f6 0 22px, transparent 23px),
              radial-gradient(circle at 80% 50%, #4fc3f7 0 18px, transparent 19px);
  background-size: 120px 70px;
  opacity: .55;
}

.wave-one {
  bottom: 8%;
  animation: waveRoll 9s linear infinite;
}

.wave-two {
  bottom: 3%;
  animation: waveRoll 13s linear infinite reverse;
  opacity: .38;
}

.feather-float {
  position: absolute;
  font-size: 2.4em;
  opacity: .72;
  filter: drop-shadow(2px 3px 0 rgba(0,0,0,.18));
  animation: featherDrift 12s linear infinite;
}

.feather-one {
  left: 12%;
  top: 20%;
}

.feather-two {
  right: 16%;
  top: 28%;
  font-size: 2em;
  animation-delay: -4s;
}

.feather-three {
  left: 38%;
  top: 12%;
  font-size: 1.7em;
  animation-delay: -8s;
}

.star-twinkle {
  position: absolute;
  font-size: 1.6em;
  color: #fff59d;
  opacity: .8;
  animation: starTwinkle 3s ease-in-out infinite;
}

.star-one {
  left: 18%;
  top: 8%;
}

.star-two {
  right: 24%;
  top: 12%;
  animation-delay: -1s;
}

.star-three {
  left: 48%;
  top: 6%;
  animation-delay: -2s;
}

.top-bar {
  width: 100%;
  background: #ff7043;
  color: #fff;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 6px 18px rgba(0,0,0,.28);
  border-bottom: 5px solid #d84315;
  min-height: 66px;
}

.title-quest {
  font-size: 1.28em;
  font-weight: bold;
  text-shadow: 2px 2px 0 #bf360c;
  white-space: nowrap;
}

.progress-wrap {
  flex: 1;
  height: 28px;
  background: #bf360c;
  border-radius: 14px;
  overflow: hidden;
  position: relative;
  border: 2px solid #8e0000;
  box-shadow: inset 0 3px 8px rgba(0,0,0,.34);
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #fff59d 0%, #fbc02d 100%);
  position: relative;
  transition: width .65s cubic-bezier(.4,0,.2,1);
}

.progress-bar::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    45deg,
    rgba(255,255,255,.3) 25%,
    transparent 25%,
    transparent 50%,
    rgba(255,255,255,.3) 50%,
    rgba(255,255,255,.3) 75%,
    transparent 75%
  );
  background-size: 28px 28px;
  animation: moveStripes 1s linear infinite;
}

.hero-move {
  position: absolute;
  top: 50%;
  left: 0;
  font-size: 1.95em;
  transition: left .65s cubic-bezier(.4,0,.2,1);
  animation: heroFlyRight .45s infinite alternate;
  filter: drop-shadow(2px 2px 0 rgba(0,0,0,.3));
  z-index: 6;
}

.stats-panel {
  text-align: right;
  min-width: 100px;
  font-weight: bold;
  font-size: .96em;
  text-shadow: 1px 1px 0 #bf360c;
}

.badges-row {
  display: flex;
  gap: 3px;
  justify-content: flex-end;
  margin-top: 3px;
}

.badge-icon {
  opacity: .28;
  filter: grayscale(1);
  transition: all .55s cubic-bezier(.18,.89,.32,1.28);
  font-size: 1.16em;
}

.badge-icon.earned {
  opacity: 1;
  filter: grayscale(0);
  transform: scale(1.22);
  animation: starBurst .65s ease;
}

.container {
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
  padding: 22px;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  width: 100%;
  background: #fffdf6;
  border: 6px solid #fbc02d;
  border-radius: 30px;
  box-shadow: 0 18px 38px rgba(0,0,0,.26);
  padding: 30px 18px;
  text-align: center;
  animation: cardEnter .55s cubic-bezier(.18,.89,.32,1.28);
  position: relative;
  overflow: hidden;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 12px;
  background: repeating-linear-gradient(
    90deg,
    #ef5350 0 24px,
    #fbc02d 24px 48px,
    #4fc3f7 48px 72px
  );
  opacity: .88;
}

.card.exit {
  animation: cardExit .32s ease forwards;
}

.hero-face {
  font-size: 3.4em;
  margin: 10px 0 12px;
  animation: heroWave 2.2s ease-in-out infinite;
  display: inline-block;
  filter: drop-shadow(3px 3px 0 rgba(0,0,0,.15));
}

.instruction-text {
  font-size: 1.56em;
  font-weight: bold;
  line-height: 1.36;
  margin-bottom: 22px;
  color: #0d47a1;
}

.sound-btn-main {
  background: #4caf50;
  color: #fff;
  border: none;
  padding: 16px 34px;
  border-radius: 42px;
  font-size: 1.28em;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 7px 0 #2e7d32;
  margin-bottom: 22px;
  transition: transform .12s, box-shadow .12s, background .18s;
}

.sound-btn-main:hover {
  transform: translateY(-2px);
  background: #43a047;
}

.sound-btn-main:active {
  transform: translateY(7px);
  box-shadow: none;
}

.sound-btn-main:focus {
  outline: 3px solid #1b5e20;
  outline-offset: 2px;
}

.sound-btn-main:disabled {
  opacity: .55;
  cursor: default;
  transform: none;
  box-shadow: none;
}

.sound-btn-main::after {
  content: " 🔊";
}

.game-zone {
  min-height: 245px;
  background: #e3f2fd;
  border: 3px dashed #4fc3f7;
  border-radius: 20px;
  padding: 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 15px;
  margin-bottom: 18px;
  position: relative;
}

.option-btn {
  background: #fff8e1;
  color: #0d47a1;
  border: 4px solid #fbc02d;
  border-radius: 18px;
  padding: 15px 24px;
  font-size: 1.38em;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 6px 0 #f57f17;
  transition: transform .16s, box-shadow .16s, background .2s, border-color .2s;
  min-width: 88px;
}

.option-btn:hover {
  transform: translateY(-3px) scale(1.04);
  background: #ffecb3;
}

.option-btn:active {
  transform: translateY(6px);
  box-shadow: none;
}

.option-btn:focus {
  outline: 3px solid #4fc3f7;
  outline-offset: 2px;
}

.option-btn:disabled {
  cursor: default;
  opacity: .64;
  transform: none;
  box-shadow: none;
}

.option-btn.correct {
  background: #c8e6c9;
  border-color: #4caf50;
  color: #1b5e20;
  animation: correctPop .55s ease;
}

.option-btn.wrong {
  background: #ffcdd2;
  border-color: #f44336;
  color: #b71c1c;
  animation: wrongShake .55s ease;
}

.option-btn.selected {
  background: #b3e5fc;
  outline: 3px solid #0288d1;
}

.letter-btn {
  width: 60px;
  height: 60px;
  font-size: 1.88em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 16px;
  background: #e3f2fd;
  border-color: #4fc3f7;
  box-shadow: 0 6px 0 #0288d1;
  color: #01579b;
  text-transform: uppercase;
}

.letter-btn:hover {
  background: #b3e5fc;
  transform: translateY(-3px) scale(1.05);
}

.letter-btn:active {
  transform: translateY(6px);
  box-shadow: none;
}

.letter-btn:focus {
  outline: 3px solid #0288d1;
  outline-offset: 2px;
}

.letter-btn:disabled {
  cursor: default;
  opacity: .62;
  transform: none;
  box-shadow: none;
}

.letter-btn.selected {
  background: #4fc3f7;
  color: #fff;
  transform: translateY(6px);
  box-shadow: none;
}

.word-display {
  min-width: 230px;
  min-height: 70px;
  background: #fff;
  border-radius: 16px;
  border-bottom: 6px solid #90a4ae;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 2.25em;
  font-weight: bold;
  letter-spacing: .18em;
  padding: 8px 20px;
  margin-bottom: 16px;
  text-transform: uppercase;
  color: #0d47a1;
}

.match-col {
  display: flex;
  flex-direction: column;
  gap: 13px;
  flex: 1;
  min-width: 185px;
}

.feedback {
  min-height: 52px;
  font-size: 1.56em;
  font-weight: bold;
  margin: 13px 0 18px;
}

.feedback.success {
  color: #2e7d32;
  animation: feedbackSlide .42s ease;
}

.feedback.error {
  color: #c62828;
  animation: feedbackShake .42s ease;
}

.nav-btns {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 13px;
}

.nav-btn {
  border: none;
  border-radius: 38px;
  padding: 13px 28px;
  font-size: 1.18em;
  font-weight: bold;
  cursor: pointer;
  color: #fff;
  box-shadow: 0 6px 0 rgba(0,0,0,.26);
  transition: transform .12s, box-shadow .12s, background .18s, opacity .18s;
}

.nav-btn:hover {
  transform: translateY(-2px);
}

.nav-btn:active {
  transform: translateY(6px);
  box-shadow: none;
}

.nav-btn:focus {
  outline: 3px solid #3e2723;
  outline-offset: 2px;
}

.nav-btn:disabled {
  opacity: .5;
  cursor: default;
  transform: none;
  box-shadow: none;
}

.btn-back {
  background: #78909c;
}

.btn-back:hover {
  background: #607d8b;
}

.btn-retry {
  background: #ff7043;
  display: none;
}

.btn-retry:hover {
  background: #f4511e;
}

.btn-next {
  background: #4caf50;
  display: none;
}

.btn-next:hover {
  background: #43a047;
}

.btn-start {
  background: #e91e63;
  color: #fff;
  border: none;
  padding: 21px 46px;
  border-radius: 48px;
  font-size: 1.9em;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 10px 0 #880e4f;
  animation: pulseStart 2s infinite;
  letter-spacing: .06em;
}

.btn-start:hover {
  transform: translateY(-3px);
  background: #d81b60;
}

.btn-start:active {
  transform: translateY(10px);
  box-shadow: none;
}

.btn-start:focus {
  outline: 4px solid #880e4f;
  outline-offset: 3px;
}

.btn-start:disabled {
  opacity: .6;
  cursor: default;
  transform: none;
  box-shadow: none;
  animation: none;
}

.intro-screen {
  text-align: center;
  color: #fff;
  padding: 26px;
}

.intro-screen h1 {
  font-size: 3.2em;
  text-shadow: 4px 4px 0 #0d47a1;
  animation: titleFloat 3s ease-in-out infinite;
  margin-bottom: 12px;
}

.intro-subtitle {
  font-size: 1.55em;
  text-shadow: 2px 2px 0 #0d47a1;
  margin-bottom: 18px;
}

.heroes-row {
  font-size: 5em;
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 30px 0;
  filter: drop-shadow(4px 4px 0 rgba(0,0,0,.25));
}

.heroes-row span {
  animation: heroWave 2s ease-in-out infinite;
  display: inline-block;
}

.heroes-row span:nth-child(2) {
  animation-delay: .25s;
}

.heroes-row span:nth-child(3) {
  animation-delay: .5s;
}

.final-screen {
  background: #fffdf6;
  border: 8px solid #fbc02d;
  border-radius: 30px;
  padding: 30px 16px;
  text-align: center;
  box-shadow: 0 0 60px rgba(251,192,45,.5), 0 20px 42px rgba(0,0,0,.28);
}

.final-screen h1 {
  color: #d84315;
  font-size: 2.6em;
  margin-bottom: 14px;
  text-shadow: 2px 2px 0 #ffe082;
}

.reward-icon {
  font-size: 6em;
  display: inline-block;
  margin: 20px 0;
  animation: rotateReward 5s linear infinite;
  filter: drop-shadow(0 9px 18px rgba(0,0,0,.22));
}

.word-list-final {
  text-align: left;
  background: #e3f2fd;
  border: 2px solid #4fc3f7;
  border-radius: 18px;
  padding: 18px;
  margin: 24px 0;
  max-height: 340px;
  overflow-y: auto;
}

.word-row-final {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px dashed #90caf9;
  font-size: 1.06em;
}

.word-row-final:last-child {
  border-bottom: none;
}

.mini-sound-btn {
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 50%;
  background: #4caf50;
  color: #fff;
  font-size: 1.05em;
  cursor: pointer;
  box-shadow: 0 4px 0 #2e7d32;
  flex: 0 0 auto;
  transition: transform .12s, box-shadow .12s, background .18s;
}

.mini-sound-btn:hover {
  transform: translateY(-2px);
  background: #43a047;
}

.mini-sound-btn:active {
  transform: translateY(4px);
  box-shadow: none;
}

.mini-sound-btn:focus {
  outline: 3px solid #2e7d32;
  outline-offset: 2px;
}

.mini-sound-btn:disabled {
  opacity: .55;
  cursor: default;
  transform: none;
  box-shadow: none;
}

.sequence-box {
  font-size: 2.4em;
  background: #fff;
  border-radius: 18px;
  padding: 10px 22px;
  border: 3px solid #fbc02d;
  letter-spacing: .14em;
  box-shadow: 0 6px 0 #f57f17;
}

.stage-zone {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.path-stage {
  width: 100%;
  height: 280px;
  position: relative;
  background: linear-gradient(to bottom, #1a237e 0%, #3949ab 45%, #81d4fa 100%);
  border-radius: 20px;
  border: 4px solid #fbc02d;
  overflow: hidden;
  box-shadow: inset 0 0 28px rgba(0,0,0,.18);
}

.path-target {
  position: absolute;
  font-size: 3.6em;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 0 16px rgba(255,245,157,.8));
  animation: targetPulse 2s ease-in-out infinite;
  pointer-events: none;
}

.path-swan {
  position: absolute;
  font-size: 3.4em;
  transform: translate(-50%, -50%) scaleX(-1);
  transition: left .45s ease, top .45s ease;
  filter: drop-shadow(3px 4px 0 rgba(0,0,0,.22));
  z-index: 5;
}

.path-buttons {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: center;
}

.path-btn {
  font-size: 2.3em;
  background: #fff;
  border: 4px solid #4fc3f7;
  border-radius: 18px;
  width: 78px;
  height: 78px;
  cursor: pointer;
  box-shadow: 0 6px 0 #0288d1;
  transition: transform .15s, box-shadow .15s, background .2s;
}

.path-btn:hover {
  transform: translateY(-3px) scale(1.05);
  background: #e1f5fe;
}

.path-btn:active {
  transform: translateY(6px);
  box-shadow: none;
}

.path-btn:focus {
  outline: 3px solid #0288d1;
  outline-offset: 2px;
}

.path-btn:disabled {
  opacity: .45;
  cursor: default;
  transform: none;
  box-shadow: none;
}

.path-btn.correct {
  background: #c8e6c9;
  border-color: #4caf50;
  box-shadow: 0 6px 0 #2e7d32;
}

.path-btn.wrong {
  background: #ffcdd2;
  border-color: #f44336;
  box-shadow: 0 6px 0 #c62828;
  animation: wrongShake .55s ease;
}

.pose-stage {
  width: 100%;
  min-height: 160px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle, #fff9c4 0%, #e3f2fd 72%);
  border-radius: 20px;
  border: 3px solid #fbc02d;
  margin-bottom: 8px;
}

.pose-figure {
  font-size: 5.4em;
  animation: poseGlow 2.2s ease-in-out infinite;
  filter: drop-shadow(0 0 14px rgba(251,192,45,.55));
}

.pose-options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
}

.pose-option {
  width: 100%;
  font-size: 1.25em;
  white-space: normal;
}

@media (max-width: 600px) {
  .container {
    padding: 14px;
  }

  .card {
    padding: 22px 12px;
    border-radius: 22px;
  }

  .instruction-text {
    font-size: 1.28em;
  }

  .option-btn {
    padding: 13px 17px;
    font-size: 1.18em;
    min-width: 74px;
  }

  .word-display {
    min-width: 175px;
    font-size: 1.85em;
    letter-spacing: .1em;
  }

  .letter-btn {
    width: 50px;
    height: 50px;
    font-size: 1.55em;
  }

  .intro-screen h1 {
    font-size: 2.25em;
  }

  .heroes-row {
    font-size: 3.5em;
    gap: 12px;
  }

  .btn-start {
    font-size: 1.5em;
    padding: 17px 30px;
  }

  .title-quest {
    font-size: 1em;
  }

  .stats-panel {
    min-width: 80px;
    font-size: .82em;
  }

  .path-stage {
    height: 230px;
  }

  .path-swan,
  .path-target {
    font-size: 2.7em;
  }

  .path-btn {
    width: 66px;
    height: 66px;
    font-size: 1.9em;
  }

  .pose-figure {
    font-size: 4.2em;
  }

  .pose-option {
    font-size: 1.08em;
  }
}

@media (min-width: 601px) and (max-width: 900px) {
  .container {
    max-width: 760px;
  }

  .instruction-text {
    font-size: 1.44em;
  }
}

@media (min-width: 901px) {
  .container {
    max-width: 820px;
  }

  .card {
    padding: 36px 30px;
  }

  .instruction-text {
    font-size: 1.68em;
  }

  .game-zone {
    min-height: 290px;
  }
}

@media (prefers-color-scheme: dark) {
  body {
    background: #101820;
    color: #eceff1;
  }

  .scene-bg {
    display: none;
  }

  .card,
  .final-screen {
    background: #263238;
    border-color: #fbc02d;
    color: #eceff1;
  }

  .instruction-text {
    color: #81d4fa;
  }

  .game-zone {
    background: #37474f;
    border-color: #4fc3f7;
  }

  .option-btn {
    background: #455a64;

<body>
<div class="scene-bg" id="sceneBg">
  <div class="star-twinkle star-one">✦</div>
  <div class="star-twinkle star-two">✧</div>
  <div class="star-twinkle star-three">✦</div>
  <div class="light-beam-left"></div>
  <div class="light-beam-right"></div>
  <div class="beacon">
    <div class="beacon-light"></div>
  </div>
  <div class="feather-float feather-one">🪶</div>
  <div class="feather-float feather-two">🪶</div>
  <div class="feather-float feather-three">🪶</div>
  <div class="wave wave-one"></div>
  <div class="wave wave-two"></div>
</div>

<header class="top-bar" id="topBar" style="display:none;">
  <div class="title-quest">🗼 Lighthouse Swan</div>
  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar"></div>
    <div class="hero-move" id="heroMove">🦢</div>
  </div>
  <div class="stats-panel">
    <div id="statsText">0/23 • 0%</div>
    <div class="badges-row" id="badgesRow">
      <span class="badge-icon">🌟</span>
      <span class="badge-icon">🌟</span>
      <span class="badge-icon">🌟</span>
      <span class="badge-icon">🌟</span>
      <span class="badge-icon">🌟</span>
      <span class="badge-icon">🌟</span>
      <span class="badge-icon">🌟</span>
      <span class="badge-icon">🌟</span>
    </div>
  </div>
</header>

<main class="container" id="container"></main>

<script>
var LighthouseSwanQuest = {
  steps: [
    { type: "intro" },
    { type: "listen", hero: "🦢", text: "Послушай и выбери картинку", audio: "I can fly in the sky", say: "I can fly in the sky", answer: "🦢" },
    { type: "choice", hero: "🪽", text: "Что умеет лебедь?", options: ["🪽", "🏊", "🏃"], say: "I can fly", answer: "🪽" },
    { type: "spell", hero: "☁️", text: "Собери слово", word: "SKY", say: "sky" },
    { type: "yesno", hero: "✨", text: "Are you a beautiful swan?", say: "I'm a beautiful swan", answer: "yes" },
    { type: "count", hero: "🦢", text: "Сколько лебедей? 🦢🦢🦢", options: ["2", "3", "4"], say: "I'm a beautiful swan", answer: "3" },
    { type: "match", hero: "👀", text: "Соедини слово и картинку", pairs: [["fly", "🪽"], ["sky", "☁️"], ["beautiful", "✨"], ["look", "👀"]], say: "I can fly" },
    { type: "order", hero: "🕊️", text: "Расставь слова по порядку", words: ["I", "can", "fly"], answer: "I can fly", say: "I can fly" },
    { type: "pick", hero: "☁️", text: "Что лишнее?", options: ["🦢", "☁️", "🚗"], say: "in the sky", answer: "🚗" },
    { type: "flight_path", hero: "🦢", text: "Проведи лебедя к рассвету", sequence: ["up", "right", "up"], points: [[12, 74], [12, 56], [36, 56], [36, 34]], say: "I can fly in the sky" },
    { type: "swan_pose", hero: "🦢", text: "Выбери фразу для лебедя", pose: "🦢", options: ["I'm a beautiful swan.", "I can fly in the sky.", "Look at me everyone!"], answer: "I'm a beautiful swan.", say: "I'm a beautiful swan" },
    { type: "listen", hero: "🙌", text: "Послушай и выбери картинку", audio: "Look at me everyone", say: "Look at me everyone", answer: "🙌" },
    { type: "choice", hero: "🦢", text: "Кто зовёт всех посмотреть?", options: ["🦢", "🐒", "☁️"], say: "Look at me everyone", answer: "🦢" },
    { type: "spell", hero: "👀", text: "Собери слово", word: "LOOK", say: "look" },
    { type: "yesno", hero: "🕊️", text: "Can you fly in the sky?", say: "I can fly in the sky", answer: "yes" },
    { type: "count", hero: "☁️", text: "Сколько облаков? ☁️☁️☁️☁️", options: ["3", "4", "5"], say: "in the sky", answer: "4" },
    { type: "match", hero: "🙌", text: "Соедини фразу и картинку", pairs: [["I can fly", "🪽"], ["in the sky", "☁️"], ["Look at me", "👀"], ["everyone", "🙌"]], say: "Look at me everyone" },
    { type: "order", hero: "👀", text: "Расставь слова по порядку", words: ["Look", "at", "me"], answer: "Look at me", say: "Look at me" },
    { type: "pick", hero: "✨", text: "Что лишнее?", options: ["☁️", "🦢", "🍔"], say: "beautiful swan", answer: "🍔" },
    { type: "flight_path", hero: "🌅", text: "Проведи лебедя над волнами", sequence: ["right", "up", "right"], points: [[10, 70], [34, 70], [34, 48], [68, 48]], say: "Look at me everyone" },
    { type: "swan_pose", hero: "👀", text: "Выбери фразу для взгляда", pose: "👀", options: ["Look at me everyone!", "I can fly in the sky.", "I'm a beautiful swan."], answer: "Look at me everyone!", say: "Look at me everyone" },
    { type: "listen", hero: "✨", text: "Послушай и выбери картинку", audio: "I'm a beautiful swan", say: "I'm a beautiful swan", answer: "✨" },
    { type: "spell", hero: "🪽", text: "Собери слово", word: "FLY", say: "fly" },
    { type: "final" }
  ],

  currentStep: 0,
  score: 0,
  history: [],
  currentAudio: null,

  container: document.getElementById("container"),
  topBar: document.getElementById("topBar"),
  progressBar: document.getElementById("progressBar"),
  heroMove: document.getElementById("heroMove"),
  statsText: document.getElementById("statsText"),
  badgesRow: document.getElementById("badgesRow").children,

  init: function() {
    this.renderStep();
  },

  speak: function(textToSpeak) {
    if (!textToSpeak) {
      return;
    }
    if (this.currentAudio) {
      speechSynthesis.cancel();
    }
    var utterance = new SpeechSynthesisUtterance(textToSpeak);
    utterance.lang = "en-GB";
    utterance.rate = 0.85;
    speechSynthesis.speak(utterance);
    this.currentAudio = utterance;
  },

  updateHud: function() {
    var totalSteps = this.steps.length - 1;
    var progressPercent = Math.round((this.currentStep / totalSteps) * 100);
    this.progressBar.style.width = progressPercent + "%";
    this.heroMove.style.left = "calc(" + progressPercent + "% - 20px)";
    this.statsText.innerText = this.currentStep + "/" + totalSteps + " • " + progressPercent + "%";

    var badgeCount = Math.floor(this.score / 3);
    for (var badgeIndex = 0; badgeIndex < this.badgesRow.length; badgeIndex++) {
      if (badgeIndex < badgeCount && !this.badgesRow[badgeIndex].classList.contains("earned")) {
        this.badgesRow[badgeIndex].classList.add("earned");
      }
    }
  },

  showConfetti: function() {
    var confettiEmojis = ["🎉", "✨", "🌟", "🦢", "️", "🪽", "🪶", ""];
    for (var confettiIndex = 0; confettiIndex < 60; confettiIndex++) {
      var confettiPiece = document.createElement("div");
      confettiPiece.innerText = confettiEmojis[Math.floor(Math.random() * confettiEmojis.length)];
      confettiPiece.style.position = "fixed";
      confettiPiece.style.top = "-70px";
      confettiPiece.style.left = Math.random() * 100 + "vw";
      confettiPiece.style.fontSize = (1.2 + Math.random() * 2.4) + "em";
      confettiPiece.style.zIndex = "1200";
      confettiPiece.style.pointerEvents = "none";
      confettiPiece.style.animation = "confettiFall " + (2.1 + Math.random() * 3.2) + "s linear forwards";
      document.body.appendChild(confettiPiece);
      setTimeout(function(pieceToRemove) {
        return function() {
          if (pieceToRemove.parentNode) {
            pieceToRemove.parentNode.removeChild(pieceToRemove);
          }
        };
      }(confettiPiece), 5600);
    }
  },

  buildIntro: function() {
    var app = this;
    app.topBar.style.display = "none";
    app.container.innerHTML =
      '<div class="intro-screen">' +
      "<h1>🗼 Lighthouse Swan Quest</h1>" +
      '<div class="intro-subtitle">The Ugly Duckling — полёт</div>' +
      '<div class="heroes-row"><span>🦢</span><span>👦</span><span>👧</span></div>' +
      '<button class="btn-start" id="startBtn">Start!</button>' +
      "</div>";

    document.getElementById("startBtn").onclick = function() {
      app.history = [];
      app.currentStep++;
      app.topBar.style.display = "flex";
      app.renderStep();
    };
  },

  buildFinal: function() {
    var app = this;
    app.topBar.style.display = "none";
    app.showConfetti();

    var finalWords = [
      { en: "swan", ipa: "/swɒn/", ru: "лебедь" },
      { en: "fly", ipa: "/flaɪ/", ru: "летать" },
      { en: "sky", ipa: "/skaɪ/", ru: "небо" },
      { en: "beautiful", ipa: "/ˈbjuːtɪf(ə)l/", ru: "красивый" },
      { en: "look", ipa: "/lʊk/", ru: "смотреть" },
      { en: "everyone", ipa: "/ˈevriwʌn/", ru: "все" },
      { en: "me", ipa: "/miː/", ru: "меня" },
      { en: "I can fly in the sky", ipa: "/aɪ kæn flaɪ ɪn ðə skaɪ/", ru: "Я могу летать в небе" },
      { en: "I'm a beautiful swan", ipa: "/aɪm ə ˈbjuːtɪf(ə)l swɒn/", ru: "Я красивый лебедь" },
      { en: "Look at me everyone", ipa: "/lʊk æt miː ˈevriwʌn/", ru: "Посмотрите на меня все" }
    ];

    var wordListHtml = "";
    for (var wordIndex = 0; wordIndex < finalWords.length; wordIndex++) {
      wordListHtml +=
        '<div class="word-row-final">' +
        "<span><b>" + finalWords[wordIndex].en + "</b> " + finalWords[wordIndex].ipa + " — " + finalWords[wordIndex].ru + "</span>" +
        '<button class="mini-sound-btn" data-word="' + finalWords[wordIndex].en + '">🔊</button>' +
        "</div>";
    }

    app.container.innerHTML =
      '<div class="final-screen">' +
      "<h1>Great Job!</h1>" +
      '<div class="reward-icon">🦢</div>' +
      '<p style="font-size:1.3em; margin-bottom:18px;">The swan flies. You say the words. The sky is ready.</p>' +
      '<button class="sound-btn-main" id="finalAudio">I can fly in the sky!</button>' +
      '<div class="word-list-final">' + wordListHtml + "</div>" +
      '<p style="font-size:1.4em; font-weight:bold;">Score: ' + app.score + "</p>" +
      '<div class="nav-btns">' +
      '<button class="nav-btn btn-back" id="finalBackBtn">⬅️ Back</button>' +
      '<button class="nav-btn btn-start" id="restartBtn" style="font-size:1.25em; padding:17px 30px;">🔄 Play Again</button>' +
      "</div>" +
      "</div>";

    document.getElementById("finalAudio").onclick = function() {
      app.speak("I can fly in the sky! Well done!");
    };

    document.getElementById("finalBackBtn").onclick = function() {
      if (app.history.length) {
        app.currentStep = app.history.pop();
        app.renderStep();
      }
    };

    document.getElementById("restartBtn").onclick = function() {
      app.history = [];
      app.currentStep = 0;
      app.score = 0;
      app.renderStep();
    };

    var miniSoundButtons = document.querySelectorAll(".mini-sound-btn");
    for (var miniSoundIndex = 0; miniSoundIndex < miniSoundButtons.length; miniSoundIndex++) {
      (function(buttonElement) {
        buttonElement.onclick = function() {
          app.speak(buttonElement.getAttribute("data-word"));
        };
      })(miniSoundButtons[miniSoundIndex]);
    }
  },

  buildShell: function(step) {
    var audioPhrase = step.audio || step.say || step.word || "";
    var shellHtml = '<div class="hero-face">' + (step.hero || "🦢") + "</div>";
    shellHtml += '<div class="instruction-text">' + step.text + "</div>";

    if (audioPhrase) {
      shellHtml += '<button class="sound-btn-main" id="mainAudio">' + audioPhrase + "</button>";
    }

    shellHtml += '<div class="game-zone" id="gameZone"></div>';
    shellHtml += '<div class="feedback" id="feedback"></div>';
    shellHtml +=
      '<div class="nav-btns">' +
      '<button class="nav-btn btn-back" id="backBtn">⬅️</button>' +
      '<button class="nav-btn btn-retry" id="retryBtn">🔄</button>' +
      '<button class="nav-btn btn-next" id="nextBtn">➡️</button>' +
      "</div>";

    this.container.innerHTML = '<div class="card">' + shellHtml + "</div>";

    return {
      audioPhrase: audioPhrase,
      zone: document.getElementById("gameZone"),
      feedback: document.getElementById("feedback"),
      backButton: document.getElementById("backBtn"),
      retryButton: document.getElementById("retryBtn"),
      nextButton: document.getElementById("nextBtn"),
      mainAudioButton: document.getElementById("mainAudio")
    };
  },

  makeCorrectHandler: function(step, shell) {
    var app = this;
    return function() {
      shell.feedback.innerText = "✅ Correct!";
      shell.feedback.className = "feedback success";
      var successPhrase = step.say || step.audio || step.word || "";
      if (successPhrase) {
        app.speak(successPhrase + ", Well done!");
      } else {
        app.speak("Well done!");
      }
      app.score++;
      shell.nextButton.style.display = "inline-block";
      shell.retryButton.style.display = "none";
      app.updateHud();
    };
  },

  makeWrongHandler: function(shell) {
    var app = this;
    return function(elementToShake) {
      shell.feedback.innerText = "❌ Try again!";
      shell.feedback.className = "feedback error";
      app.speak("Try again!");
      if (elementToShake) {
        elementToShake.classList.add("wrong");
      }
      shell.retryButton.style.display = "inline-block";
      setTimeout(function() {
        shell.feedback.className = "feedback";
        if (elementToShake) {
          elementToShake.classList.remove("wrong");
        }
      }, 680);
    };
  },

  attachNavigation: function(shell) {
    var app = this;

    if (shell.mainAudioButton && shell.audioPhrase) {
      shell.mainAudioButton.onclick = function() {
        app.speak(shell.audioPhrase);
      };
    }

    shell.backButton.onclick = function() {
      if (app.history.length) {
        app.currentStep = app.history.pop();
        app.renderStep();
      }
    };

    shell.retryButton.onclick = function() {
      app.renderStep();
    };

    shell.nextButton.onclick = function() {
      app.history.push(app.currentStep);
      app.currentStep++;
      app.renderStep();
    };
  },

  buildChoice: function(step, shell, correctHandler, wrongHandler) {
    var optionsList = [];
    var correctAnswer = "";

    if (step.type === "listen") {
      optionsList = step.options || ["🦢", "️", "👀", "🙌", "🪽", "✨"];
      correctAnswer = step.answer;
    } else if (step.type === "yesno") {
      optionsList = ["Yes", "No"];
      correctAnswer = step.answer === "yes" ? "Yes" : "No";
    } else {
      optionsList = step.options || [];
      correctAnswer = step.answer;
    }

    optionsList.forEach(function(optionValue) {
      var optionButton = document.createElement("button");
      optionButton.className = "option-btn";
      optionButton.innerText = optionValue;

      optionButton.onclick = function() {
        if (optionValue === correctAnswer) {
          optionButton.classList.add("correct");
          correctHandler();
          var allOptionButtons = shell.zone.querySelectorAll(".option-btn");
          for (var optionIndex = 0; optionIndex < allOptionButtons.length; optionIndex++) {
            allOptionButtons[optionIndex].disabled = true;
          }
        } else {
          wrongHandler(optionButton);
        }
      };

      shell.zone.appendChild(optionButton);
    });
  },

  buildSpell: function(step, shell, correctHandler, wrongHandler) {
    var targetLetters = step.word.split("");
    var shuffledLetters = targetLetters.slice().sort(function() {
      return 0.5 - Math.random();
    });
    var selectedLetters = [];

    var wordDisplay = document.createElement("div");
    wordDisplay.className = "word-display";
    shell.zone.appendChild(wordDisplay);

    shuffledLetters.forEach(function(letterValue) {
      var letterButton = document.createElement("button");
      letterButton.className = "letter-btn option-btn";
      letterButton.innerText = letterValue;

      letterButton.onclick = function() {
        if (letterButton.disabled) {
          return;
        }

        selectedLetters.push(letterValue);
        letterButton.disabled = true;
        letterButton.classList.add("selected");
        wordDisplay.innerText = selectedLetters.join("");

        if (selectedLetters.length === targetLetters.length) {
          if (selectedLetters.join("") === step.word) {
            correctHandler();
          } else {
            wrongHandler(wordDisplay);
            setTimeout(function() {
              selectedLetters = [];
              wordDisplay.innerText = "";
              var letterButtons = shell.zone.querySelectorAll(".letter-btn");
              for (var letterIndex = 0; letterIndex < letterButtons.length; letterIndex++) {
                letterButtons[letterIndex].disabled = false;
                letterButtons[letterIndex].classList.remove("selected");
              }
            }, 720);
          }
        }
      };

      shell.zone.appendChild(letterButton);
    });
  },

  buildOrder: function(step, shell, correctHandler, wrongHandler) {
    var targetWords = step.words.slice();
    var shuffledWords = targetWords.slice().sort(function() {
      return 0.5 - Math.random();
    });
    var selectedWords = [];

    var sentenceDisplay = document.createElement("div");
    sentenceDisplay.className = "word-display";
    sentenceDisplay.style.fontSize = "1.85em";
    sentenceDisplay.style.letterSpacing = "normal";
    shell.zone.appendChild(sentenceDisplay);

    shuffledWords.forEach(function(wordValue) {
      var wordButton = document.createElement("button");
      wordButton.className = "option-btn";
      wordButton.innerText = wordValue;

      wordButton.onclick = function() {
        if (wordButton.disabled) {
          return;
        }

        selectedWords.push(wordValue);
        wordButton.disabled = true;
        sentenceDisplay.innerText = selectedWords.join(" ");

        if (selectedWords.length === targetWords.length) {
          if (selectedWords.join(" ") === step.answer) {
            correctHandler();
          } else {
            wrongHandler(sentenceDisplay);
            setTimeout(function() {
              selectedWords = [];
              sentenceDisplay.innerText = "";
              var wordButtons = shell.zone.querySelectorAll(".option-btn");
              for (var wordIndex = 0; wordIndex < wordButtons.length; wordIndex++) {
                wordButtons[wordIndex].disabled = false;
              }
            }, 720);
          }
        }
      };

      shell.zone.appendChild(wordButton);
    });
  },

  buildMatch: function(step, shell, correctHandler, wrongHandler) {
    var matchPairs = step.pairs;

    var leftColumn = document.createElement("div");
    var rightColumn = document.createElement("div");
    leftColumn.className = "match-col";
    rightColumn.className = "match-col";
    shell.zone.appendChild(leftColumn);
    shell.zone.appendChild(rightColumn);

    var selectedLeftButton = null;
    var matchedCount = 0;

    matchPairs.forEach(function(pairItem) {
      var leftButton = document.createElement("button");
      leftButton.className = "option-btn";
      leftButton.style.width = "100%";
      leftButton.innerText = pairItem[0];

      leftButton.onclick = function() {
        if (leftButton.disabled) {
          return;
        }
        if (selectedLeftButton) {
          selectedLeftButton.classList.remove("selected");
        }
        selectedLeftButton = leftButton;
        leftButton.classList.add("selected");
      };

      leftColumn.appendChild(leftButton);
    });

    var rightPairs = matchPairs.slice().sort(function() {
      return 0.5 - Math.random();
    });

    rightPairs.forEach(function(pairItem) {
      var rightButton = document.createElement("button");
      rightButton.className = "option-btn";
      rightButton.style.width = "100%";
      rightButton.innerText = pairItem[1];

      rightButton.onclick = function() {
        if (!selectedLeftButton || rightButton.disabled) {
          return;
        }

        var matchingPair = null;
        for (var pairIndex = 0; pairIndex < matchPairs.length; pairIndex++) {
          if (matchPairs[pairIndex][0] === selectedLeftButton.innerText) {
            matchingPair = matchPairs[pairIndex];
            break;
          }
        }

        if (matchingPair && matchingPair[1] === pairItem[1]) {
          selectedLeftButton.classList.add("correct");
          rightButton.classList.add("correct");
          selectedLeftButton.disabled = true;
          rightButton.disabled = true;
          selectedLeftButton = null;
          matchedCount++;

          if (matchedCount === matchPairs.length) {
            correctHandler();
          }
        } else {
          wrongHandler(rightButton);
        }
      };

      rightColumn.appendChild(rightButton);
    });
  },

  buildFlightPath: function(step, shell, correctHandler, wrongHandler) {
    shell.zone.innerHTML =
      '<div class="stage-zone">' +
      '<div class="path-stage" id="pathStage">' +
      '<div class="path-target" id="pathTarget">🌅</div>' +
      '<div class="path-swan" id="pathSwan">🦢</div>' +
      "</div>" +
      '<div class="path-buttons" id="pathButtons"></div>' +
      "</div>";

    var pathSwan = document.getElementById("pathSwan");
    var pathTarget = document.getElementById("pathTarget");
    var pathButtons = document.getElementById("pathButtons");
    var points = step.points;
    var sequence = step.sequence;
    var sequenceIndex = 0;

    pathSwan.style.left = points[0][0] + "%";
    pathSwan.style.top = points[0][1] + "%";
    pathTarget.style.left = points[points.length - 1][0] + "%";
    pathTarget.style.top = points[points.length - 1][1] + "%";

    var directionSymbols = {
      up: "⬆️",
      right: "➡️",
      down: "⬇️",
      left: "⬅️"
    };

    ["up", "right", "down", "left"].forEach(function(directionName) {
      var pathButton = document.createElement("button");
      pathButton.className = "path-btn";
      pathButton.innerText = directionSymbols[directionName];

      pathButton.onclick = function() {
        if (sequenceIndex >= sequence.length) {
          return;
        }

        if (directionName === sequence[sequenceIndex]) {
          sequenceIndex++;
          pathSwan.style.left = points[sequenceIndex][0] + "%";
          pathSwan.style.top = points[sequenceIndex][1] + "%";
          pathButton.classList.remove("correct");
          void pathButton.offsetWidth;
          pathButton.classList.add("correct");

          if (sequenceIndex === sequence.length) {
            setTimeout(correctHandler, 460);
            var allPathButtons = pathButtons.querySelectorAll(".path-btn");
            for (var buttonIndex = 0; buttonIndex < allPathButtons.length; buttonIndex++) {
              allPathButtons[buttonIndex].disabled = true;
            }
          }
        } else {
          wrongHandler(pathButton);
        }
      };

      pathButtons.appendChild(pathButton);
    });
  },

  buildSwanPose: function(step, shell, correctHandler, wrongHandler) {
    shell.zone.innerHTML =
      '<div class="stage-zone">' +
      '<div class="pose-stage">' +
      '<div class="pose-figure">' + step.pose + "</div>" +
      "</div>" +
      '<div class="pose-options" id="poseOptions"></div>' +
      "</div>";

    var poseOptions = document.getElementById("poseOptions");

    step.options.forEach(function(optionText) {
      var optionButton = document.createElement("button");
      optionButton.className = "option-btn pose-option";
      optionButton.innerText = optionText;

      optionButton.onclick = function() {
        if (optionText === step.answer) {
          optionButton.classList.add("correct");
          correctHandler();
          var allPoseButtons = poseOptions.querySelectorAll(".option-btn");
          for (var buttonIndex = 0; buttonIndex < allPoseButtons.length; buttonIndex++) {
            allPoseButtons[buttonIndex].disabled = true;
          }
        } else {
          wrongHandler(optionButton);
        }
      };

      poseOptions.appendChild(optionButton);
    });
  },

  renderStep: function() {
    var app = this;

    if (app.currentStep >= app.steps.length) {
      return;
    }

    var step = app.steps[app.currentStep];
    app.updateHud();

    if (step.type === "intro") {
      app.buildIntro();
      return;
    }

    if (step.type === "final") {
      app.buildFinal();
      return;
    }

    var shell = app.buildShell(step);
    app.attachNavigation(shell);

    var correctHandler = app.makeCorrectHandler(step, shell);
    var wrongHandler = app.makeWrongHandler(shell);

    if (step.type === "listen" || step.type === "choice" || step.type === "yesno" || step.type === "count" || step.type === "pick") {
      app.buildChoice(step, shell, correctHandler, wrongHandler);
      return;
    }

    if (step.type === "spell") {
      app.buildSpell(step, shell, correctHandler, wrongHandler);
      return;
    }

    if (step.type === "order") {
      app.buildOrder(step, shell, correctHandler, wrongHandler);
      return;
    }

    if (step.type === "match") {
      app.buildMatch(step, shell, correctHandler, wrongHandler);
      return;
    }

    if (step.type === "flight_path") {
      app.buildFlightPath(step, shell, correctHandler, wrongHandler);
      return;
    }

    if (step.type === "swan_pose") {
      app.buildSwanPose(step, shell, correctHandler, wrongHandler);
      return;
    }
  }
};

LighthouseSwanQuest.init();
</script>
</body>
</html>

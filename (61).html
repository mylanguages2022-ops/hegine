<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Словарь: Now I know!</title>
<meta property="og:title" content="Интерактивный словарь: Now I know! — Модуль 2">
<meta property="og:description" content="Словарь с озвучкой для повторения всего модуля 2 Spotlight: цвета, семья, чаепитие, фразы.">
<meta property="og:image" content="https://via.placeholder.com/1200x630.png?text=Now+I+Know+Dictionary+Module+2">
<meta property="og:url" content="https://example.com/dict-module2-review">
<meta property="og:type" content="website">
<meta property="og:locale" content="ru_RU">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#fdf6ec;color:#2c3e50;padding:16px;text-align:center}
h1{color:#d35400;margin-bottom:6px;font-size:1.6em}
.sub{color:#7f8c8d;margin-bottom:18px;font-size:.95em}
.tabs{display:flex;justify-content:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tab{padding:8px 16px;border:2px solid #f39c12;border-radius:20px;background:#fff;cursor:pointer;font-size:.95em;transition:.2s}
.tab.active{background:#f39c12;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;max-width:820px;margin:0 auto}
.card{background:#fff;border:2px solid #f0d9b5;border-radius:14px;padding:14px 10px;cursor:pointer;transition:.2s;display:flex;flex-direction:column;align-items:center}
.card:hover{transform:translateY(-4px);box-shadow:0 6px 14px rgba(0,0,0,.1)}
.card .em{font-size:2.4em;margin-bottom:6px}
.card .w{font-size:1.2em;font-weight:700;color:#2c3e50}
.card .tr{font-size:.8em;color:#95a5a6;margin:3px 0}
.card .ru{font-size:.95em;color:#d35400}
.spk{background:#3498db;color:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:1.1em;cursor:pointer;margin-top:8px;transition:.2s}
.spk:hover{background:#2980b9}
</style>
</head>
<body>
<h1>🎲 Now I know! Словарь модуля 2</h1>
<p class="sub">Нажми на карточку или на 🔊, чтобы послушать</p>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<script>
const data={
"🎨 Цвета":[
{em:"🔴",w:"red",tr:"/red/",ru:"красный"},
{em:"🔵",w:"blue",tr:"/bluː/",ru:"синий"},
{em:"🟢",w:"green",tr:"/ɡriːn/",ru:"зелёный"},
{em:"🟡",w:"yellow",tr:"/ˈjeləʊ/",ru:"жёлтый"},
{em:"🩷",w:"pink",tr:"/pɪŋk/",ru:"розовый"},
{em:"🟣",w:"purple",tr:"/ˈpɜːpl/",ru:"фиолетовый"},
{em:"🟠",w:"orange",tr:"/ˈɒrɪndʒ/",ru:"оранжевый"},
{em:"🟤",w:"brown",tr:"/braʊn/",ru:"коричневый"},
{em:"⚫",w:"black",tr:"/blæk/",ru:"чёрный"},
{em:"⚪",w:"white",tr:"/waɪt/",ru:"белый"}
],
"👨‍👩‍👧‍👦 Семья":[
{em:"👩",w:"mum",tr:"/mʌm/",ru:"мама"},
{em:"👨",w:"dad",tr:"/dæd/",ru:"папа"},
{em:"👦",w:"brother",tr:"/ˈbrʌðə/",ru:"брат"},
{em:"👧",w:"sister",tr:"/ˈsɪstə/",ru:"сестра"},
{em:"👵",w:"grandma",tr:"/ˈɡrænmɑː/",ru:"бабушка"},
{em:"👴",w:"grandpa",tr:"/ˈɡrænpɑː/",ru:"дедушка"},
{em:"👨‍👩‍👧‍👦",w:"family",tr:"/ˈfæmɪli/",ru:"семья"}
],
"🍰 Чаепитие":[
{em:"🍵",w:"tea",tr:"/tiː/",ru:"чай"},
{em:"☕",w:"cup",tr:"/kʌp/",ru:"чашка"},
{em:"🍰",w:"cake",tr:"/keɪk/",ru:"торт"},
{em:"🍓",w:"jam",tr:"/dʒæm/",ru:"джем"},
{em:"🍋",w:"lemon",tr:"/ˈlemən/",ru:"лимон"},
{em:"🥛",w:"milk",tr:"/mɪlk/",ru:"молоко"}
],
"💬 Фразы":[
{em:"👉",w:"This is…",tr:"/ðɪs ɪz/",ru:"Это…"},
{em:"👍",w:"I like…",tr:"/aɪ laɪk/",ru:"Мне нравится…"},
{em:"👎",w:"I don't like…",tr:"/aɪ dəʊnt laɪk/",ru:"Мне не нравится…"},
{em:"❓",w:"Do you like…?",tr:"/duː juː laɪk/",ru:"Ты любишь…?"},
{em:"🎨",w:"What colour is it?",tr:"/wɒt ˈkʌlə ɪz ɪt/",ru:"Какого это цвета?"},
{em:"👂",w:"Who's this?",tr:"/huːz ðɪs/",ru:"Кто это?"}
]
};
const tabsEl=document.getElementById('tabs');
const gridEl=document.getElementById('grid');
const cats=Object.keys(data);
let activeCat=cats[0];
cats.forEach((c,i)=>{
const b=document.createElement('button');
b.className='tab'+(i===0?' active':'');
b.textContent=c;
b.onclick=()=>{
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
b.classList.add('active');
activeCat=c;render();
};
tabsEl.appendChild(b);
});
function render(){
gridEl.innerHTML='';
data[activeCat].forEach(item=>{
const d=document.createElement('div');
d.className='card';
d.innerHTML=`<div class="em">${item.em}</div><div class="w">${item.w}</div><div class="tr">${item.tr}</div><div class="ru">${item.ru}</div><button class="spk" onclick="event.stopPropagation();speak('${item.w.replace(/'/g,"\\'")}')">🔊</button>`;
d.onclick=()=>speak(item.w);
gridEl.appendChild(d);
});
}
function speak(t){
if('speechSynthesis' in window){
window.speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(t);
const v=window.speechSynthesis.getVoices();
let g=v.find(x=>x.lang==='en-GB');
if(!g)g=v.find(x=>x.lang.startsWith('en'));
if(g)u.voice=g;
u.lang='en-GB';u.rate=0.85;
window.speechSynthesis.speak(u);
}}
if('speechSynthesis' in window)window.speechSynthesis.onvoiceschanged=()=>{};
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Словарик-корзинка — Корзинка Ларри</title>
<meta name="description" content="Говорящая корзинка с продуктами урока 13 Spotlight: apple, banana, milk, biscuit, фразы I like / I don't like. Британское произношение по клику.">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Comic Sans MS","Segoe UI",Verdana,sans-serif;
    background:linear-gradient(180deg,#fff5e6 0%,#ffe8c8 60%,#ffd9a8 100%);
    color:#5a3a18;padding:30px 14px 70px;min-height:100vh;
  }
  .wrap{max-width:940px;margin:0 auto}
  header{text-align:center;margin-bottom:26px}
  header h1{
    font-size:clamp(1.5rem,4.5vw,2.3rem);color:#c04820;letter-spacing:.3px;
  }
  header h1::before{content:'🧺 ';}
  header p{margin-top:8px;font-size:1rem;color:#7a4a28;line-height:1.5}
  .filters{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-bottom:36px}
  .filters button{
    border:2px solid #c04820;background:#fff;color:#c04820;
    padding:9px 18px;border-radius:999px;font-size:.92rem;font-weight:700;
    cursor:pointer;font-family:inherit;transition:.18s;
  }
  .filters button:hover{background:#fff0e0;transform:translateY(-2px)}
  .filters button.active{background:#c04820;border-color:#c04820;color:#fff;box-shadow:0 4px 0 #7a2810}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:34px 20px}

  .card{
    background:#fffdf5;border-radius:14px;
    padding:16px 12px 14px;cursor:pointer;position:relative;
    transition:.18s;box-shadow:0 7px 0 rgba(122,40,16,.28);
    border:3px solid #c04820;
    display:flex;flex-direction:column;align-items:center;
  }
  .card::before{
    content:'';position:absolute;top:-10px;left:50%;transform:translateX(-50%);
    width:50px;height:12px;background:#8b5a2a;border-radius:6px;
    box-shadow:inset -2px -2px 3px rgba(0,0,0,.3);
  }
  .card:hover{transform:translateY(-5px);box-shadow:0 11px 0 rgba(122,40,16,.28)}
  .card:active{transform:translateY(0)}
  .card.playing{animation:wiggle .55s}
  @keyframes wiggle{0%,100%{transform:rotate(0)}30%{transform:rotate(-4deg)}70%{transform:rotate(3deg)}}
  .card .emoji{font-size:2.8rem;line-height:1;text-align:center;display:block;margin:4px 0 10px}
  .card .en{
    font-size:1.1rem;font-weight:700;color:#c04820;text-align:center;
    display:block;line-height:1.3;word-break:break-word;
  }
  .card .tr{
    display:block;text-align:center;font-size:.84rem;color:#8a7a5a;margin-top:3px;
    font-family:"Segoe UI",Arial,sans-serif;letter-spacing:.2px;
  }
  .card .ru{
    display:block;text-align:center;font-size:1rem;color:#4a2c18;margin-top:7px;font-weight:600;
  }
  .speak-btn{
    position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;
    border:2px solid #c04820;background:#fff4e0;color:#c04820;font-size:1rem;cursor:pointer;
    box-shadow:0 3px 0 #7a2810;transition:.15s;z-index:2;
    display:flex;align-items:center;justify-content:center;
  }
  .speak-btn:hover{background:#c04820;color:#fff;transform:scale(1.1) rotate(-8deg)}
  .speak-btn:active{transform:scale(.94)}
  .cat-fruit{border-color:#e67e22;box-shadow:0 7px 0 rgba(170,80,10,.3)}
  .cat-fruit .en{color:#c05010}
  .cat-drink{border-color:#2980b9;box-shadow:0 7px 0 rgba(30,80,130,.3)}
  .cat-drink .en{color:#1a5080}
  .cat-snack{border-color:#8b4513;box-shadow:0 7px 0 rgba(100,50,20,.3)}
  .cat-snack .en{color:#5a2a08}
  .cat-phrase{border-color:#27ae60;box-shadow:0 7px 0 rgba(30,100,50,.3)}
  .cat-phrase .en{color:#1a6a38}
  .empty{
    text-align:center;padding:40px 20px;color:#7a6a5a;font-size:1.05rem;
    background:#fffdf5;border-radius:14px;border:3px dashed #c04820;
  }
  footer{text-align:center;margin-top:46px;font-size:.9rem;color:#7a6a5a;line-height:1.6}
  @media (max-width:560px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:30px 12px}
    .card .emoji{font-size:2.2rem}
    .card .en{font-size:.98rem}
    .speak-btn{width:30px;height:30px;font-size:.88rem;top:8px;right:8px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Корзинка Ларри</h1>
    <p>словарик-корзинка · продукты и фразы I like / I don't like</p>
  </header>

  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">В корзинке пока пусто.</div>

  <footer>
    Spotlight · Module 13 · Food & Likes<br>
    Корзинка всегда полна: заглядывайте в неё когда угодно.
  </footer>

</div>

<script>
(function(){
  "use strict";

  var RATE = 0.85;
  var voices = [];

  function loadVoices(){
    if(!('speechSynthesis' in window)) return;
    voices = window.speechSynthesis.getVoices() || [];
  }
  loadVoices();
  if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = loadVoices;
    setTimeout(loadVoices, 300);
    setTimeout(loadVoices, 1200);
  }

  function pickVoice(){
    if(!voices.length) loadVoices();
    var v;
    v = voices.find(function(x){ return x.lang === 'en-GB'; });
    if(v) return v;
    v = voices.find(function(x){ return x.lang && x.lang.toLowerCase().indexOf('en-gb') === 0; });
    if(v) return v;
    v = voices.find(function(x){ return x.lang === 'en-US'; });
    if(v) return v;
    v = voices.find(function(x){ return x.lang && x.lang.toLowerCase().indexOf('en') === 0; });
    return v || null;
  }

  var speakingCard = null;

  function speak(text, cardEl){
    if(!('speechSynthesis' in window)){
      if(cardEl) flash(cardEl);
      return;
    }
    window.speechSynthesis.cancel();
    if(speakingCard){ speakingCard.classList.remove('playing'); speakingCard = null; }

    var u = new SpeechSynthesisUtterance(text);
    var v = pickVoice();
    if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'en-GB'; }
    u.rate = RATE;
    u.pitch = 1.05;
    u.volume = 1;

    if(cardEl){
      cardEl.classList.add('playing');
      speakingCard = cardEl;
      u.onend = function(){ cardEl.classList.remove('playing'); if(speakingCard===cardEl) speakingCard=null; };
      u.onerror = function(){ cardEl.classList.remove('playing'); if(speakingCard===cardEl) speakingCard=null; };
    }
    window.speechSynthesis.speak(u);
  }

  function flash(el){
    el.classList.add('playing');
    setTimeout(function(){ el.classList.remove('playing'); }, 600);
  }

  var CATS = {
    all:    '🧺 Вся корзинка',
    fruit:  '🍎 Фрукты',
    drink:  '🥛 Напитки',
    snack:  '🍪 Еда',
    phrase: '😋 Фразы'
  };

  var WORDS = [
    {c:'fruit', e:'🍎', en:'apple',        ipa:'/ˈæpl/',         ru:'яблоко'},
    {c:'fruit', e:'🍌', en:'banana',       ipa:'/bəˈnɑːnə/',    ru:'банан'},
    {c:'fruit', e:'🍊', en:'orange',       ipa:'/ˈɒrɪndʒ/',     ru:'апельсин'},

    {c:'drink', e:'🥛', en:'milk',         ipa:'/mɪlk/',         ru:'молоко'},
    {c:'drink', e:'🧃', en:'orange juice', ipa:'/ˌɒrɪndʒ ˈdʒuːs/', ru:'апельсиновый сок'},

    {c:'snack', e:'🍪', en:'biscuit',      ipa:'/ˈbɪskɪt/',      ru:'печенье'},
    {c:'snack', e:'🍞', en:'bread',        ipa:'/bred/',         ru:'хлеб'},
    {c:'snack', e:'🧀', en:'cheese',       ipa:'/tʃiːz/',        ru:'сыр'},
    {c:'snack', e:'🍫', en:'chocolate',    ipa:'/ˈtʃɒklət/',     ru:'шоколад'},

    {c:'phrase', e:'😋', en:'I like apples.',       ipa:'/aɪ laɪk ˈæplz/',      ru:'я люблю яблоки'},
    {c:'phrase', e:'😋', en:'I like milk.',         ipa:'/aɪ laɪk mɪlk/',       ru:'я люблю молоко'},
    {c:'phrase', e:'😋', en:'I like biscuits.',     ipa:'/aɪ laɪk ˈbɪskɪts/',   ru:'я люблю печенье'},
    {c:'phrase', e:'🙅', en:"I don't like bananas.", ipa:'/aɪ dəʊnt laɪk bəˈnɑːnəz/', ru:'я не люблю бананы'},
    {c:'phrase', e:'❓', en:'What is it?',          ipa:'/wɒt ɪz ɪt/',         ru:'что это?'},
    {c:'phrase', e:'🍎', en:"It's an apple.",       ipa:'/ɪts ən ˈæpl/',       ru:'это яблоко'},
    {c:'phrase', e:'🥛', en:"It's milk.",           ipa:'/ɪts mɪlk/',          ru:'это молоко'},
    {c:'phrase', e:'❓', en:'Do you like cheese?',  ipa:'/duː ju laɪk tʃiːz/', ru:'ты любишь сыр?'}
  ];

  var filtersBox = document.getElementById('filters');
  var current = 'all';

  Object.keys(CATS).forEach(function(key){
    var b = document.createElement('button');
    b.textContent = CATS[key];
    b.dataset.cat = key;
    if(key === 'all') b.classList.add('active');
    b.addEventListener('click', function(){
      current = key;
      Array.prototype.forEach.call(filtersBox.children, function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      render();
    });
    filtersBox.appendChild(b);
  });

  var grid  = document.getElementById('grid');
  var empty = document.getElementById('empty');

  function render(){
    grid.innerHTML = '';
    var list = WORDS.filter(function(w){ return current === 'all' || w.c === current; });
    empty.style.display = list.length ? 'none' : 'block';

    list.forEach(function(w){
      var card = document.createElement('div');
      card.className = 'card cat-' + w.c;
      card.setAttribute('role','button');
      card.setAttribute('tabindex','0');

      var sp = document.createElement('button');
      sp.className = 'speak-btn';
      sp.innerHTML = '🔊';
      sp.title = 'Прослушать произношение';
      sp.setAttribute('aria-label','Прослушать ' + w.en);
      sp.addEventListener('click', function(ev){
        ev.stopPropagation();
        speak(w.en, card);
      });

      var emoji = document.createElement('span');
      emoji.className = 'emoji';
      emoji.textContent = w.e;

      var en = document.createElement('span');
      en.className = 'en';
      en.textContent = w.en;

      var tr = document.createElement('span');
      tr.className = 'tr';
      tr.textContent = w.ipa;

      var ru = document.createElement('span');
      ru.className = 'ru';
      ru.textContent = w.ru;

      card.appendChild(sp);
      card.appendChild(emoji);
      card.appendChild(en);
      card.appendChild(tr);
      card.appendChild(ru);

      card.addEventListener('click', function(){ speak(w.en, card); });
      card.addEventListener('keydown', function(ev){
        if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); speak(w.en, card); }
      });

      grid.appendChild(card);
    });
  }

  render();

  if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = function(){ loadVoices(); };
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Seaside Quest</title>
<meta name="description" content="Квест по английскому языку: The Seaside.">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; min-height: 100vh; font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", sans-serif; background: linear-gradient(to bottom, #4fc3f7 0%, #81d4fa 40%, #ffe082 60%, #ffcc80 100%); color: #3e2723; }
body { display: flex; flex-direction: column; }
.scene-bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.sun { position: absolute; top: 5%; right: 10%; font-size: 6em; animation: sunPulse 4s infinite alternate; filter: drop-shadow(0 0 20px rgba(255,235,59,0.8)); }
.wave { position: absolute; bottom: 38%; left: 0; width: 200%; height: 40px; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 20"><path d="M0,10 Q25,0 50,10 T100,10 L100,20 L0,20 Z" fill="%2329b6f6"/></svg>') repeat-x; background-size: 100px 40px; animation: waveMove 8s linear infinite; opacity: 0.8; }
.wave:nth-child(3) { bottom: 35%; animation-duration: 12s; opacity: 0.5; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 20"><path d="M0,10 Q25,20 50,10 T100,10 L100,20 L0,20 Z" fill="%230288d1"/></svg>') repeat-x; background-size: 120px 40px; }
.top-bar { width: 100%; background: #ff7043; color: white; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: 0; z-index: 100; box-shadow: 0 5px 15px rgba(0,0,0,.25); border-bottom: 5px solid #d84315; min-height: 64px; }
.title-quest { font-size: 1.25em; font-weight: bold; text-shadow: 2px 2px 0 #d84315; white-space: nowrap; }
.progress-wrap { flex: 1; height: 24px; background: #d84315; border-radius: 12px; overflow: hidden; position: relative; border: 2px solid #bf360c; box-shadow: inset 0 2px 6px rgba(0,0,0,.3); }
.progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #ffee58, #fdd835); position: relative; transition: width .6s ease; }
.progress-bar::after { content: ""; position: absolute; inset: 0; background: linear-gradient(45deg, rgba(255,255,255,.3) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.3) 50%, rgba(255,255,255,.3) 75%, transparent 75%); background-size: 24px 24px; animation: moveStripes 1s linear infinite; }
.hero-walk { position: absolute; top: 50%; left: 0; font-size: 1.9em; transition: left .6s ease; animation: walkBounce .4s infinite alternate; filter: drop-shadow(2px 2px 0 rgba(0,0,0,.3)); z-index: 5; }
.stats-panel { text-align: right; min-width: 72px; font-weight: bold; font-size: .95em; text-shadow: 1px 1px 0 #d84315; }
.badges-row { display: flex; gap: 3px; justify-content: flex-end; margin-top: 2px; }
.badge-icon { opacity: .3; filter: grayscale(1); transition: all .5s ease; font-size: 1.15em; }
.badge-icon.earned { opacity: 1; filter: grayscale(0); transform: scale(1.2); animation: starBurst .6s ease; }
.container { width: 100%; max-width: 640px; margin: 0 auto; padding: 22px; flex: 1; display: flex; align-items: center; justify-content: center; }
.card { width: 100%; background: white; border: 6px solid #29b6f6; border-radius: 26px; box-shadow: 0 16px 35px rgba(0,0,0,.22); padding: 28px 18px; text-align: center; animation: cardEnter .5s ease; position: relative; overflow: hidden; }
.card::before { content: ""; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 60px; height: 60px; background: #ff7043; border-radius: 50%; border: 4px solid #d84315; z-index: -1; }
.card.exit { animation: cardExit .3s ease forwards; }
.instruction-text { font-size: 1.5em; font-weight: bold; line-height: 1.35; margin-bottom: 22px; color: #01579b; }
.sound-btn-main { background: #4caf50; color: white; border: none; padding: 15px 32px; border-radius: 40px; font-size: 1.25em; font-weight: bold; cursor: pointer; box-shadow: 0 6px 0 #2e7d32; margin-bottom: 22px; font-family: inherit; transition: transform .1s, box-shadow .1s; }
.sound-btn-main:hover { transform: translateY(-2px); }
.sound-btn-main:active { transform: translateY(6px); box-shadow: none; }
.sound-btn-main::after { content: " 🔊"; }
.game-zone { min-height: 230px; background: #fff9c4; border: 3px dashed #fbc02d; border-radius: 18px; padding: 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px; margin-bottom: 18px; position: relative; }
.option-btn { background: #e1f5fe; color: #01579b; border: 4px solid #29b6f6; border-radius: 16px; padding: 14px 22px; font-size: 1.35em; font-weight: bold; cursor: pointer; box-shadow: 0 5px 0 #0288d1; transition: transform .15s, box-shadow .15s, background .2s; font-family: inherit; min-width: 86px; }
.option-btn:hover { transform: translateY(-3px) scale(1.04); background: #b3e5fc; }
.option-btn:active { transform: translateY(5px); box-shadow: none; }
.option-btn:focus { outline: 3px solid #ff7043; outline-offset: 2px; }
.option-btn:disabled { cursor: default; opacity: .65; transform: none; box-shadow: none; }
.option-btn.correct { background: #c8e6c9; border-color: #4caf50; color: #1b5e20; animation: correctPop .5s ease; }
.option-btn.wrong { background: #ffcdd2; border-color: #f44336; color: #b71c1c; animation: wrongShake .5s ease; }
.option-btn.selected { background: #81d4fa; outline: 3px solid #0277bd; }
.letter-btn { width: 56px; height: 56px; font-size: 1.8em; display: inline-flex; align-items: center; justify-content: center; border-radius: 14px; background: #fff9c4; border-color: #fbc02d; box-shadow: 0 5px 0 #f57f17; color: #f57f17; text-transform: uppercase; }
.letter-btn.selected { background: #fbc02d; color: white; transform: translateY(5px); box-shadow: none; }
.word-display { min-width: 220px; min-height: 64px; background: white; border-radius: 14px; border-bottom: 5px solid #b0bec5; display: inline-flex; align-items: center; justify-content: center; font-size: 2.2em; font-weight: bold; letter-spacing: .18em; padding: 8px 18px; margin-bottom: 16px; text-transform: uppercase; color: #37474f; }
.match-col { display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 180px; }
.feedback { min-height: 46px; font-size: 1.5em; font-weight: bold; margin: 12px 0 18px; }
.feedback.success { color: #2e7d32; animation: feedbackSlide .4s ease; }
.feedback.error { color: #c62828; animation: feedbackShake .4s ease; }
.nav-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.nav-btn { border: none; border-radius: 35px; padding: 12px 26px; font-size: 1.15em; font-weight: bold; cursor: pointer; color: white; font-family: inherit; box-shadow: 0 5px 0 rgba(0,0,0,.25); transition: transform .1s, box-shadow .1s; }
.nav-btn:hover { transform: translateY(-2px); }
.nav-btn:active { transform: translateY(5px); box-shadow: none; }
.nav-btn:focus { outline: 3px solid #3e2723; outline-offset: 2px; }
.nav-btn:disabled { opacity: .5; cursor: default; transform: none; box-shadow: none; }
.btn-back { background: #90a4ae; }
.btn-retry { background: #ff7043; display: none; }
.btn-next { background: #4caf50; display: none; }
.btn-start { background: #e91e63; color: white; border: none; padding: 20px 42px; border-radius: 45px; font-size: 1.8em; font-weight: bold; cursor: pointer; box-shadow: 0 9px 0 #880e4f; animation: pulseStart 2s infinite; font-family: inherit; letter-spacing: .06em; }
.btn-start:hover { transform: translateY(-3px); }
.btn-start:active { transform: translateY(9px); box-shadow: none; }
.intro-screen { text-align: center; color: white; padding: 24px; }
.intro-screen h1 { font-size: 3.1em; text-shadow: 4px 4px 0 #01579b; animation: titleFloat 3s ease-in-out infinite; margin-bottom: 10px; }
.intro-subtitle { font-size: 1.5em; text-shadow: 2px 2px 0 #01579b; margin-bottom: 18px; }
.heroes-row { font-size: 4.8em; display: flex; justify-content: center; gap: 18px; margin: 28px 0; filter: drop-shadow(4px 4px 0 rgba(0,0,0,.25)); }
.heroes-row span { animation: heroWave 2s ease-in-out infinite; display: inline-block; }
.heroes-row span:nth-child(2) { animation-delay: .25s; }
.heroes-row span:nth-child(3) { animation-delay: .5s; }
.final-screen { background: white; border: 8px solid #ff7043; border-radius: 28px; padding: 28px 16px; text-align: center; box-shadow: 0 0 55px rgba(255,112,67,.45), 0 18px 40px rgba(0,0,0,.25); }
.final-screen h1 { color: #d84315; font-size: 2.5em; margin-bottom: 12px; text-shadow: 2px 2px 0 #ffe0b2; }
.reward-icon { font-size: 5.8em; display: inline-block; margin: 18px 0; animation: rotateReward 5s linear infinite; filter: drop-shadow(0 8px 16px rgba(0,0,0,.2)); }
.word-list-final { text-align: left; background: #e1f5fe; border: 2px solid #29b6f6; border-radius: 16px; padding: 16px; margin: 22px 0; max-height: 320px; overflow-y: auto; }
.word-row-final { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px dashed #81d4fa; font-size: 1.05em; }
.word-row-final:last-child { border-bottom: none; }
.mini-sound-btn { width: 38px; height: 38px; border: none; border-radius: 50%; background: #4caf50; color: white; font-size: 1em; cursor: pointer; box-shadow: 0 4px 0 #2e7d32; flex: 0 0 auto; }
.mini-sound-btn:hover { transform: translateY(-2px); }
.mini-sound-btn:active { transform: translateY(4px); box-shadow: none; }
.mini-sound-btn:focus { outline: 3px solid #2e7d32; outline-offset: 2px; }
.drag-zone { width: 100%; height: 300px; position: relative; background: linear-gradient(to bottom, #81d4fa, #ffe082); border-radius: 18px; border: 4px dashed #fbc02d; overflow: hidden; touch-action: none; }
.target-zone { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); font-size: 5.8em; animation: targetPulse 2s infinite; pointer-events: none; }
.drag-item { position: absolute; font-size: 3.4em; cursor: grab; user-select: none; touch-action: none; z-index: 20; filter: drop-shadow(3px 3px 4px rgba(0,0,0,.25)); }
.drag-item:active { cursor: grabbing; transform: scale(1.2); }
.icecream-zone { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px; }
.cone-base { font-size: 6em; position: relative; }
.scoop-btn { font-size: 3em; background: none; border: none; cursor: pointer; transition: transform .2s; filter: drop-shadow(2px 2px 4px rgba(0,0,0,.2)); }
.scoop-btn:hover { transform: scale(1.15) rotate(10deg); }
.scoop-btn:active { transform: scale(0.95); }
.scoop-btn.disabled { opacity: 0.4; cursor: default; pointer-events: none; }
.added-scoop { position: absolute; left: 50%; transform: translateX(-50%); font-size: 0.8em; animation: scoopDrop .4s ease; }
@media (max-width: 600px) {
  .container { padding: 14px; }
  .card { padding: 20px 12px; border-radius: 20px; }
  .instruction-text { font-size: 1.25em; }
  .option-btn { padding: 12px 16px; font-size: 1.15em; min-width: 72px; }
  .word-display { min-width: 170px; font-size: 1.8em; letter-spacing: .1em; }
  .letter-btn { width: 48px; height: 48px; font-size: 1.5em; }
  .intro-screen h1 { font-size: 2.2em; }
  .heroes-row { font-size: 3.4em; gap: 12px; }
  .btn-start { font-size: 1.45em; padding: 16px 28px; }
  .title-quest { font-size: 1em; }
  .stats-panel { min-width: 58px; font-size: .82em; }
  .drag-item { font-size: 2.8em; }
  .target-zone { font-size: 4.8em; }
}
@media (min-width: 601px) and (max-width: 900px) {
  .container { max-width: 720px; }
  .instruction-text { font-size: 1.4em; }
}
@media (prefers-color-scheme: dark) {
  body { background: #263238; color: #eceff1; }
  .scene-bg { display: none; }
  .card, .final-screen { background: #37474f; border-color: #ff7043; color: #eceff1; }
  .instruction-text { color: #81d4fa; }
  .game-zone { background: #455a64; border-color: #fbc02d; }
  .option-btn { background: #546e7a; color: #eceff1; border-color: #29b6f6; box-shadow: 0 5px 0 #01579b; }
  .option-btn:hover { background: #607d8b; }
  .option-btn.correct { background: #2e7d32; border-color: #4caf50; color: white; }
  .option-btn.wrong { background: #c62828; border-color: #ef5350; color: white; }
  .letter-btn { background: #455a64; color: #fbc02d; border-color: #f57f17; box-shadow: 0 5px 0 #e65100; }
  .letter-btn.selected { background: #fbc02d; color: white; }
  .word-display { background: #263238; color: #eceff1; border-color: #78909c; }
  .word-list-final { background: #455a64; border-color: #29b6f6; }
  .word-row-final { border-color: #546e7a; }
  .drag-zone { background: #37474f; border-color: #fbc02d; }
}
@keyframes sunPulse { 0% { transform: scale(1) rotate(0); filter: drop-shadow(0 0 20px rgba(255,235,59,0.8)); } 100% { transform: scale(1.1) rotate(15deg); filter: drop-shadow(0 0 40px rgba(255,152,0,1)); } }
@keyframes waveMove { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@keyframes moveStripes { from { background-position: 0 0; } to { background-position: 24px 0; } }
@keyframes walkBounce { 0% { transform: translateY(-50%) translateY(0); } 100% { transform: translateY(-50%) translateY(-6px); } }
@keyframes starBurst { 0% { transform: scale(.4) rotate(-30deg); opacity: 0; } 60% { transform: scale(1.4) rotate(8deg); opacity: 1; } 100% { transform: scale(1.2) rotate(0); opacity: 1; } }
@keyframes cardEnter { from { opacity: 0; transform: translateY(35px) scale(.94); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes cardExit { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(-30px) scale(.94); } }
@keyframes correctPop { 0% { transform: scale(1); } 45% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes wrongShake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
@keyframes feedbackSlide { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes feedbackShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes pulseStart { 0%, 100% { box-shadow: 0 9px 0 #880e4f, 0 0 25px rgba(233,30,99,.35); } 50% { box-shadow: 0 9px 0 #880e4f, 0 0 45px rgba(233,30,99,.65); } }
@keyframes titleFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes heroWave { 0%, 100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-12px) rotate(-6deg); } 70% { transform: translateY(-6px) rotate(6deg); } }
@keyframes rotateReward { from { transform: rotate(0) scale(1); } 50% { transform: rotate(180deg) scale(1.12); } to { transform: rotate(360deg) scale(1); } }
@keyframes targetPulse { 0%, 100% { transform: translateX(-50%) scale(1); opacity: 1; } 50% { transform: translateX(-50%) scale(1.12); opacity: .82; } }
@keyframes confettiFall { 0% { transform: translateY(-100vh) rotate(0); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
@keyframes scoopDrop { 0% { transform: translateX(-50%) translateY(-50px) scale(0.5); opacity: 0; } 100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; } }
</style>
</head>
<body>
<div class="scene-bg">
  <div class="sun">☀️</div>
  <div class="wave"></div>
  <div class="wave"></div>
</div>
<div class="top-bar" id="topBar" style="display:none;">
  <div class="title-quest">🏖️ Seaside Quest</div>
  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar"></div>
    <div class="hero-walk" id="heroWalk">🚶</div>
  </div>
  <div class="stats-panel">
    <div id="statsText">0/20</div>
    <div class="badges-row" id="badgesRow">
      <span class="badge-icon">🍦</span><span class="badge-icon">🍦</span><span class="badge-icon">🍦</span><span class="badge-icon">🍦</span><span class="badge-icon">🍦</span>
    </div>
  </div>
</div>
<div class="container" id="container"></div>
<script>
var SeasideQuestApp = {
  steps: [
    { type: 'intro' },
    { type: 'listen', text: 'Послушай и выбери картинку', audio: 'I like ice cream', answer: '🍦' },
    { type: 'choice', text: 'Что мы любим есть на пляже?', options: ['🏖️', '🍦', '🌊'], answer: '🍦' },
    { type: 'spell', text: 'Собери слово', word: 'EAT' },
    { type: 'yesno', text: 'Do you like sand in your shoes?', answer: 'no' },
    { type: 'count', text: 'Сколько мороженого? 🍦🍦🍦', options: ['2', '3', '4'], answer: '3' },
    { type: 'match', text: 'Соедини слово и картинку', pairs: [['eat', '🥄'], ['drink', '🥤'], ['play', '🤸']] },
    { type: 'order', text: 'Расставь слова по порядку', words: ['I', 'like', 'ice', 'cream'], answer: 'I like ice cream' },
    { type: 'pick', text: 'Что лишнее?', options: ['🍦', '🧃', '👟'], answer: '👟' },
    { type: 'drag', text: 'Перетащи мороженое в ведёрко', target: '🍦' },
    { type: 'build_icecream', text: 'Собери мороженое! Добавь 2 шарика', scoops: 2 },
    { type: 'listen', text: 'Послушай и выбери действие', audio: 'Drink your juice', answer: '🥤' },
    { type: 'choice', text: 'Что нужно пить на солнце?', options: ['🏖️', '🧃', '🌊'], answer: '🧃' },
    { type: 'spell', text: 'Собери слово', word: 'SAND' },
    { type: 'yesno', text: 'Do you like the seaside?', answer: 'yes' },
    { type: 'count', text: 'Сколько стаканов сока? 🧃🧃', options: ['1', '2', '3'], answer: '2' },
    { type: 'match', text: 'Соедини фразу и картинку', pairs: [['I don\'t like', '🙅'], ['Drink your', '🥤']] },
    { type: 'order', text: 'Расставь слова по порядку', words: ['Drink', 'your', 'juice'], answer: 'Drink your juice' },
    { type: 'pick', text: 'Что мы НЕ любим?', options: ['🍦', '🧃', '🏖️ (sand in shoes)'], answer: '🏖️ (sand in shoes)' },
    { type: 'final' }
  ],
  currentStep: 0,
  score: 0,
  container: document.getElementById('container'),
  topBar: document.getElementById('topBar'),
  progressBar: document.getElementById('progressBar'),
  heroWalk: document.getElementById('heroWalk'),
  statsText: document.getElementById('statsText'),
  badgesRow: document.getElementById('badgesRow').children,
  currentAudio: null,
  init: function() {
    this.renderStep();
  },
  speak: function(textToSpeak) {
    if (this.currentAudio) {
      speechSynthesis.cancel();
    }
    var speechUtterance = new SpeechSynthesisUtterance(textToSpeak);
    speechUtterance.lang = 'en-GB';
    speechUtterance.rate = 0.85;
    speechSynthesis.speak(speechUtterance);
    this.currentAudio = speechUtterance;
  },
  updateProgress: function() {
    var totalSteps = this.steps.length - 1;
    var progressPercent = (this.currentStep / totalSteps) * 100;
    this.progressBar.style.width = progressPercent + '%';
    this.heroWalk.style.left = 'calc(' + progressPercent + '% - 18px)';
    this.statsText.innerText = this.currentStep + '/' + totalSteps;
    var badgeCount = Math.floor(this.score / 3);
    for (var badgeIndex = 0; badgeIndex < this.badgesRow.length; badgeIndex++) {
      if (badgeIndex < badgeCount && !this.badgesRow[badgeIndex].classList.contains('earned')) {
        this.badgesRow[badgeIndex].classList.add('earned');
      }
    }
  },
  confetti: function() {
    var confettiEmojis = ['🎉', '✨', '🌟', '🍦', '🏖️', '🧃', '☀️'];
    for (var confettiIndex = 0; confettiIndex < 40; confettiIndex++) {
      var confettiPiece = document.createElement('div');
      confettiPiece.innerText = confettiEmojis[Math.floor(Math.random() * confettiEmojis.length)];
      confettiPiece.style.position = 'fixed';
      confettiPiece.style.top = '-60px';
      confettiPiece.style.left = Math.random() * 100 + 'vw';
      confettiPiece.style.fontSize = (1.3 + Math.random() * 2) + 'em';
      confettiPiece.style.zIndex = '1200';
      confettiPiece.style.pointerEvents = 'none';
      confettiPiece.style.animation = 'confettiFall ' + (2.3 + Math.random() * 2.8) + 's linear forwards';
      document.body.appendChild(confettiPiece);
      setTimeout(function(pieceToRemove) {
        return function() {
          if (pieceToRemove.parentNode) {
            pieceToRemove.parentNode.removeChild(pieceToRemove);
          }
        };
      }(confettiPiece), 5300);
    }
  },
  renderStep: function() {
    var app = this;
    if (app.currentStep >= app.steps.length) {
      return;
    }
    var step = app.steps[app.currentStep];
    app.updateProgress();
    if (step.type === 'intro') {
      app.topBar.style.display = 'none';
      app.container.innerHTML =
        '<div class="intro-screen">' +
        '<h1>🏖️ Seaside Quest</h1>' +
        '<div class="intro-subtitle">The Seaside!</div>' +
        '<div class="heroes-row"><span>👦</span><span>👧</span><span>🐒</span></div>' +
        '<button class="btn-start" id="startBtn">Start!</button>' +
        '</div>';
      document.getElementById('startBtn').onclick = function() {
        app.currentStep++;
        app.topBar.style.display = 'flex';
        app.renderStep();
      };
      return;
    }
    if (step.type === 'final') {
      app.topBar.style.display = 'none';
      app.confetti();
      var finalWords = [
        { en: 'eat', ipa: '/iːt/', ru: 'есть' },
        { en: 'drink', ipa: '/drɪŋk/', ru: 'пить' },
        { en: 'ice cream', ipa: '/ˌaɪs ˈkriːm/', ru: 'мороженое' },
        { en: 'sand', ipa: '/sænd/', ru: 'песок' },
        { en: 'I like', ipa: '/aɪ laɪk/', ru: 'я люблю' },
        { en: 'I don\'t like', ipa: '/aɪ dəʊnt laɪk/', ru: 'я не люблю' },
        { en: 'Drink your juice', ipa: '/drɪŋk jɔː dʒuːs/', ru: 'Пей свой сок' }
      ];
      var wordListHtml = '';
      for (var wordIndex = 0; wordIndex < finalWords.length; wordIndex++) {
        wordListHtml +=
          '<div class="word-row-final">' +
          '<span><b>' + finalWords[wordIndex].en + '</b> ' + finalWords[wordIndex].ipa + ' — ' + finalWords[wordIndex].ru + '</span>' +
          '<button class="mini-sound-btn" data-word="' + finalWords[wordIndex].en + '">🔊</button>' +
          '</div>';
      }
      app.container.innerHTML =
        '<div class="final-screen">' +
        '<h1>Great Job!</h1>' +
        '<div class="reward-icon">🍦</div>' +
        '<p style="font-size:1.25em; margin-bottom:18px;">You had a perfect beach day!</p>' +
        '<button class="sound-btn-main" id="finalAudio">Well done!</button>' +
        '<div class="word-list-final">' + wordListHtml + '</div>' +
        '<p style="font-size:1.35em; font-weight:bold;">Score: ' + app.score + '</p>' +
        '<div class="nav-btns">' +
        '<button class="nav-btn btn-back" id="backBtn">⬅️ Back</button>' +
        '<button class="nav-btn btn-start" id="restartBtn" style="font-size:1.2em; padding:16px 28px;">🔄 Play Again</button>' +
        '</div>' +
        '</div>';
      document.getElementById('finalAudio').onclick = function() {
        app.speak('Well done!');
      };
      document.getElementById('backBtn').onclick = function() {
        app.currentStep--;
        app.renderStep();
      };
      document.getElementById('restartBtn').onclick = function() {
        app.currentStep = 0;
        app.score = 0;
        app.renderStep();
      };
      var miniSoundButtons = document.querySelectorAll('.mini-sound-btn');
      for (var miniSoundIndex = 0; miniSoundIndex < miniSoundButtons.length; miniSoundIndex++) {
        (function(buttonElement) {
          buttonElement.onclick = function() {
            app.speak(buttonElement.getAttribute('data-word'));
          };
        })(miniSoundButtons[miniSoundIndex]);
      }
      return;
    }
    var cardHtml = '<div class="instruction-text">' + step.text + '</div>';
    if (step.audio) {
      cardHtml += '<button class="sound-btn-main" id="mainAudio">' + step.audio + '</button>';
    }
    cardHtml += '<div class="game-zone" id="gameZone"></div>';
    cardHtml += '<div class="feedback" id="feedback"></div>';
    cardHtml +=
      '<div class="nav-btns">' +
      '<button class="nav-btn btn-back" id="backBtn">⬅️</button>' +
      '<button class="nav-btn btn-retry" id="retryBtn">🔄</button>' +
      '<button class="nav-btn btn-next" id="nextBtn">➡️</button>' +
      '</div>';
    app.container.innerHTML = '<div class="card">' + cardHtml + '</div>';
    var zone = document.getElementById('gameZone');
    var feedbackArea = document.getElementById('feedback');
    var retryButton = document.getElementById('retryBtn');
    var nextButton = document.getElementById('nextBtn');
    if (step.audio) {
      document.getElementById('mainAudio').onclick = function() {
        app.speak(step.audio);
      };
    }
    document.getElementById('backBtn').onclick = function() {
      if (app.currentStep > 1) {
        app.currentStep--;
        app.renderStep();
      }
    };
    retryButton.onclick = function() {
      app.renderStep();
    };
    nextButton.onclick = function() {
      app.currentStep++;
      app.renderStep();
    };
    var correct = function() {
      feedbackArea.innerText = '✅ Correct!';
      feedbackArea.className = 'feedback success';
      app.speak('Well done!');
      app.score++;
      nextButton.style.display = 'inline-block';
      retryButton.style.display = 'none';
      app.updateProgress();
    };
    var wrong = function(elementToShake) {
      feedbackArea.innerText = '❌ Try again!';
      feedbackArea.className = 'feedback error';
      app.speak('Try again!');
      if (elementToShake) {
        elementToShake.classList.add('wrong');
      }
      retryButton.style.display = 'inline-block';
      setTimeout(function() {
        feedbackArea.className = 'feedback';
        if (elementToShake) {
          elementToShake.classList.remove('wrong');
        }
      }, 650);
    };
    if (step.type === 'listen' || step.type === 'choice' || step.type === 'yesno' || step.type === 'count' || step.type === 'pick') {
      var optionsList = [];
      var correctAnswer = '';
      if (step.type === 'listen') {
        optionsList = step.options || ['🍦', '🏖️', '🥤', '🌊', '👟'];
        correctAnswer = step.answer;
      } else if (step.type === 'yesno') {
        optionsList = ['Yes', 'No'];
        correctAnswer = step.answer === 'yes' ? 'Yes' : 'No';
      } else {
        optionsList = step.options || [];
        correctAnswer = step.answer;
      }
      optionsList.forEach(function(optionValue) {
        var optionButton = document.createElement('button');
        optionButton.className = 'option-btn';
        optionButton.innerText = optionValue;
        optionButton.onclick = function() {
          if (optionValue === correctAnswer) {
            optionButton.classList.add('correct');
            correct();
            var allOptionButtons = zone.querySelectorAll('.option-btn');
            for (var optionIndex = 0; optionIndex < allOptionButtons.length; optionIndex++) {
              allOptionButtons[optionIndex].disabled = true;
            }
          } else {
            wrong(optionButton);
          }
        };
        zone.appendChild(optionButton);
      });
    }
    if (step.type === 'spell') {
      var targetLetters = step.word.split('');
      var shuffledLetters = targetLetters.slice().sort(function() {
        return 0.5 - Math.random();
      });
      var selectedLetters = [];
      var wordDisplay = document.createElement('div');
      wordDisplay.className = 'word-display';
      zone.appendChild(wordDisplay);
      shuffledLetters.forEach(function(letterValue) {
        var letterButton = document.createElement('button');
        letterButton.className = 'letter-btn option-btn';
        letterButton.innerText = letterValue;
        letterButton.onclick = function() {
          if (letterButton.disabled) {
            return;
          }
          selectedLetters.push(letterValue);
          letterButton.disabled = true;
          letterButton.classList.add('selected');
          wordDisplay.innerText = selectedLetters.join('');
          if (selectedLetters.length === targetLetters.length) {
            if (selectedLetters.join('') === step.word) {
              correct();
            } else {
              wrong(wordDisplay);
              setTimeout(function() {
                selectedLetters = [];
                wordDisplay.innerText = '';
                var letterButtons = zone.querySelectorAll('.letter-btn');
                for (var letterIndex = 0; letterIndex < letterButtons.length; letterIndex++) {
                  letterButtons[letterIndex].disabled = false;
                  letterButtons[letterIndex].classList.remove('selected');
                }
              }, 700);
            }
          }
        };
        zone.appendChild(letterButton);
      });
    }
    if (step.type === 'order') {
      var targetWords = step.words.slice();
      var shuffledWords = targetWords.slice().sort(function() {
        return 0.5 - Math.random();
      });
      var selectedWords = [];
      var sentenceDisplay = document.createElement('div');
      sentenceDisplay.className = 'word-display';
      sentenceDisplay.style.fontSize = '1.8em';
      sentenceDisplay.style.letterSpacing = 'normal';
      zone.appendChild(sentenceDisplay);
      shuffledWords.forEach(function(wordValue) {
        var wordButton = document.createElement('button');
        wordButton.className = 'option-btn';
        wordButton.innerText = wordValue;
        wordButton.onclick = function() {
          if (wordButton.disabled) {
            return;
          }
          selectedWords.push(wordValue);
          wordButton.disabled = true;
          sentenceDisplay.innerText = selectedWords.join(' ');
          if (selectedWords.length === targetWords.length) {
            if (selectedWords.join(' ') === step.answer) {
              correct();
            } else {
              wrong(sentenceDisplay);
              setTimeout(function() {
                selectedWords = [];
                sentenceDisplay.innerText = '';
                var wordButtons = zone.querySelectorAll('.option-btn');
                for (var wordIndex = 0; wordIndex < wordButtons.length; wordIndex++) {
                  wordButtons[wordIndex].disabled = false;
                }
              }, 700);
            }
          }
        };
        zone.appendChild(wordButton);
      });
    }
    if (step.type === 'match') {
      var matchPairs = step.pairs;
      var leftColumn = document.createElement('div');
      var rightColumn = document.createElement('div');
      leftColumn.className = 'match-col';
      rightColumn.className = 'match-col';
      zone.appendChild(leftColumn);
      zone.appendChild(rightColumn);
      var selectedLeftButton = null;
      var matchedCount = 0;
      matchPairs.forEach(function(pairItem) {
        var leftButton = document.createElement('button');
        leftButton.className = 'option-btn';
        leftButton.style.width = '100%';
        leftButton.innerText = pairItem[0];
        leftButton.onclick = function() {
          if (leftButton.disabled) {
            return;
          }
          if (selectedLeftButton) {
            selectedLeftButton.classList.remove('selected');
          }
          selectedLeftButton = leftButton;
          leftButton.classList.add('selected');
        };
        leftColumn.appendChild(leftButton);
      });
      var rightPairs = matchPairs.slice().sort(function() {
        return 0.5 - Math.random();
      });
      rightPairs.forEach(function(pairItem) {
        var rightButton = document.createElement('button');
        rightButton.className = 'option-btn';
        rightButton.style.width = '100%';
        rightButton.innerText = pairItem[1];
        rightButton.onclick = function() {
          if (!selectedLeftButton || rightButton.disabled) {
            return;
          }
          var matchingPair = null;
          for (var pairIndex = 0; pairIndex < matchPairs.length; pairIndex++) {
            if (matchPairs[pairIndex][0] === selectedLeftButton.innerText) {
              matchingPair = matchPairs[pairIndex];
              break;
            }
          }
          if (matchingPair && matchingPair[1] === pairItem[1]) {
            selectedLeftButton.classList.add('correct');
            rightButton.classList.add('correct');
            selectedLeftButton.disabled = true;
            rightButton.disabled = true;
            selectedLeftButton = null;
            matchedCount++;
            if (matchedCount === matchPairs.length) {
              correct();
            }
          } else {
            wrong(rightButton);
          }
        };
        rightColumn.appendChild(rightButton);
      });
    }
    if (step.type === 'drag') {
      zone.innerHTML = '<div class="drag-zone" id="dragZone"><div class="target-zone">🪣</div></div>';
      var dragZone = document.getElementById('dragZone');
      var targetZone = dragZone.querySelector('.target-zone');
      var dragItems = ['🍦', '👟', '🌊'];
      dragItems.forEach(function(dragItemValue, dragItemIndex) {
        var dragItem = document.createElement('div');
        dragItem.className = 'drag-item';
        dragItem.innerText = dragItemValue;
        dragItem.style.left = (12 + dragItemIndex * 30) + '%';
        dragItem.style.top = '16%';
        dragZone.appendChild(dragItem);
        var isDragging = false;
        var startX = 0;
        var startY = 0;
        var initialX = 0;
        var initialY = 0;
        var originalLeft = dragItem.style.left;
        var originalTop = dragItem.style.top;
        function dragStart(event) {
          isDragging = true;
          startX = event.touches ? event.touches[0].clientX : event.clientX;
          startY = event.touches ? event.touches[0].clientY : event.clientY;
          initialX = dragItem.offsetLeft;
          initialY = dragItem.offsetTop;
          document.addEventListener('mousemove', dragMove);
          document.addEventListener('touchmove', dragMove);
          document.addEventListener('mouseup', dragEnd);
          document.addEventListener('touchend', dragEnd);
        }
        function dragMove(event) {
          if (!isDragging) {
            return;
          }
          event.preventDefault();
          var clientX = event.touches ? event.touches[0].clientX : event.clientX;
          var clientY = event.touches ? event.touches[0].clientY : event.clientY;
          dragItem.style.left = (initialX + clientX - startX) + 'px';
          dragItem.style.top = (initialY + clientY - startY) + 'px';
        }
        function dragEnd() {
          if (!isDragging) {
            return;
          }
          isDragging = false;
          document.removeEventListener('mousemove', dragMove);
          document.removeEventListener('touchmove', dragMove);
          document.removeEventListener('mouseup', dragEnd);
          document.removeEventListener('touchend', dragEnd);
          var itemRect = dragItem.getBoundingClientRect();
          var targetRect = targetZone.getBoundingClientRect();
          var isOverTarget = !(itemRect.right < targetRect.left || itemRect.left > targetRect.right || itemRect.bottom < targetRect.top || itemRect.top > targetRect.bottom);
          if (dragItemValue === step.target && isOverTarget) {
            correct();
            dragItem.style.pointerEvents = 'none';
          } else {
            wrong(dragItem);
            dragItem.style.left = originalLeft;
            dragItem.style.top = originalTop;
          }
        }
        dragItem.addEventListener('mousedown', dragStart);
        dragItem.addEventListener('touchstart', dragStart);
      });
    }
    if (step.type === 'build_icecream') {
      zone.innerHTML = '<div class="icecream-zone"><div class="cone-base" id="coneBase">🍧</div><div style="display:flex; gap:15px;" id="scoopBtns"></div></div>';
      var coneBase = document.getElementById('coneBase');
      var scoopBtns = document.getElementById('scoopBtns');
      var addedScoops = 0;
      var scoopColors = ['🍓', '🍫', '🍦'];
      scoopColors.forEach(function(scoopEmoji) {
        var btn = document.createElement('button');
        btn.className = 'scoop-btn';
        btn.innerText = scoopEmoji;
        btn.onclick = function() {
          if (addedScoops >= step.scoops) return;
          addedScoops++;
          var newScoop = document.createElement('div');
          newScoop.className = 'added-scoop';
          newScoop.innerText = scoopEmoji;
          newScoop.style.bottom = (40 + addedScoops * 35) + 'px';
          coneBase.appendChild(newScoop);
          btn.classList.add('disabled');
          if (addedScoops === step.scoops) {
            setTimeout(correct, 500);
          }
        };
        scoopBtns.appendChild(btn);
      });
    }
  }
};
SeasideQuestApp.init();
</script>
</body>
</html>

<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"Comic Sans MS","Segoe UI",Verdana,sans-serif;
    background:
      linear-gradient(180deg,#87ceeb 0%, #b8e0f0 40%, #f6efe0 70%, #fff8e8 100%);
    color:#2b3a4a;min-height:100vh;padding:16px 12px 50px;
  }
  .wrap{max-width:760px;margin:0 auto}

  .topbar{
    background:#fffdf8;border-radius:4px;padding:16px 16px 18px;
    border:3px solid #b89460;box-shadow:0 0 0 1px rgba(184,148,96,.3) inset, 5px 6px 0 rgba(26,74,108,.15);
    margin-bottom:18px;position:relative;
  }
  .topbar::before{
    content:'';position:absolute;top:-4px;left:-4px;right:-4px;bottom:-4px;
    border:1px solid #b89460;border-radius:6px;pointer-events:none;opacity:.4;
  }
  .topbar h1{font-size:clamp(1.1rem,4vw,1.5rem);color:#1a4a6c;text-align:center;line-height:1.3}
  .topbar h1::before{content:'⚓ ';}
  .bar-wrap{margin-top:14px}
  .bar-label{
    display:flex;justify-content:space-between;align-items:center;
    font-size:.8rem;color:#5a4228;margin-bottom:6px;font-weight:700;letter-spacing:.3px;
  }
  .bar-track{
    height:22px;background:#e8f4ff;border-radius:3px;overflow:hidden;
    border:2px solid #1a7abc;position:relative;
    background-image:repeating-linear-gradient(90deg, transparent 0 11%, rgba(26,122,188,.35) 11% 11.4%);
  }
  .bar-fill{
    height:100%;width:0%;border-radius:2px;
    background:linear-gradient(90deg,#1a7abc,#4ec97a);
    transition:width .5s cubic-bezier(.34,1.4,.64,1);
  }
  .bar-runner{
    position:absolute;top:-6px;left:0;font-size:1.4rem;
    transform:translateX(-50%);transition:left .5s cubic-bezier(.34,1.4,.64,1);
    filter:drop-shadow(0 2px 1px rgba(0,0,0,.25));
  }
  .stars{margin-top:9px;text-align:center;font-size:1.05rem;letter-spacing:2px;color:#b89460}

  .stage{
    background:#fffdf8;border-radius:4px;padding:24px 18px 26px;
    border:3px solid #b89460;box-shadow:0 0 0 1px rgba(184,148,96,.3) inset, 5px 6px 0 rgba(26,74,108,.15);
    animation:pop .35s ease;position:relative;
  }
  .stage::before{
    content:'';position:absolute;top:-4px;left:-4px;right:-4px;bottom:-4px;
    border:1px solid #b89460;border-radius:6px;pointer-events:none;opacity:.4;
  }
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .stage.shake{animation:shake .45s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-9px)}40%{transform:translateX(9px)}
    60%{transform:translateX(-6px)}80%{transform:translateX(6px)}
  }
  .step-tag{
    display:inline-block;background:#1a4a6c;color:#f5ecd8;
    font-size:.76rem;font-weight:700;padding:4px 12px;border-radius:3px;
    letter-spacing:.5px;margin-bottom:12px;
  }
  .mech-tag{
    display:inline-block;background:#f3ead6;color:#1a4a6c;
    font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:3px;
    border:1px solid #b89460;margin-left:6px;margin-bottom:12px;letter-spacing:.3px;
  }
  .hero{font-size:3.1rem;text-align:center;display:block;margin:2px 0 10px;line-height:1.15}
  .stage h2{font-size:clamp(1.05rem,3.8vw,1.4rem);color:#1a4a6c;text-align:center;margin-bottom:10px;line-height:1.35}
  .task-text{font-size:1rem;line-height:1.6;color:#5a4228;text-align:center;margin-bottom:16px}
  .en-inline{font-weight:700;color:#1a4a6c}

  .speak-line{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0 18px}
  .speak-big{
    background:#c0392b;color:#fff;border:2px double #fff;outline:2px solid #c0392b;
    border-radius:6px;padding:11px 20px;font-size:1rem;font-weight:700;cursor:pointer;
    font-family:inherit;box-shadow:0 4px 0 #8e2a1f;transition:.15s;
    display:inline-flex;align-items:center;gap:9px;letter-spacing:.3px;
  }
  .speak-big:hover{background:#a93226;transform:translateY(-2px)}
  .speak-big:active{transform:translateY(1px);box-shadow:0 2px 0 #8e2a1f}
  .speak-mini{
    width:36px;height:36px;border-radius:50%;border:none;background:#1a7abc;color:#fff;
    font-size:1rem;cursor:pointer;box-shadow:0 3px 0 #0f5c95;transition:.15s;
    display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .speak-mini:hover{background:#0f5c95;transform:scale(1.1)}
  .speak-mini:active{transform:scale(.92)}

  .opts{display:flex;flex-direction:column;gap:11px;margin-top:6px}
  .opts.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
  .opt{
    background:#fffdf8;border:2px solid #b89460;border-left:6px solid #1a4a6c;border-radius:4px;
    padding:13px 14px;cursor:pointer;font-family:inherit;font-size:1.02rem;
    color:#2b3a4a;text-align:left;display:flex;align-items:center;gap:10px;
    transition:.16s;font-weight:600;line-height:1.35;
  }
  .opt:hover{border-color:#1a4a6c;background:#f3ead6;transform:translateX(3px)}
  .opt .mark{
    flex:0 0 30px;height:30px;border:2px solid #1a4a6c;border-radius:3px;background:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem;color:#1a4a6c;
  }
  .opt.correct{background:#eafff0;border-color:#4ec97a;border-left-color:#4ec97a;animation:bounce .45s}
  .opt.wrong{background:#fff0f0;border-color:#c0392b;border-left-color:#c0392b;animation:shake .4s}
  @keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  .opt:disabled{cursor:default}

  .countbox{
    background:#f3ead6;border:2px dashed #b89460;border-radius:8px;
    padding:18px 12px;text-align:center;margin-bottom:16px;
  }
  .countbox .items{font-size:2.4rem;letter-spacing:7px;line-height:1.5;word-break:break-word}

  .match-area{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
  .mcol{display:flex;flex-direction:column;gap:10px}
  .mcol h4{text-align:center;font-size:.82rem;color:#5a4228;font-weight:700;margin-bottom:2px;letter-spacing:.5px}
  .mitem{
    background:#fffdf8;border:2px solid #b89460;border-radius:4px;padding:11px 8px;
    cursor:pointer;font-family:inherit;font-size:1rem;font-weight:700;color:#2b3a4a;
    text-align:center;transition:.16s;display:flex;align-items:center;justify-content:center;gap:7px;
    min-height:56px;
  }
  .mitem:hover{border-color:#1a4a6c;background:#f3ead6}
  .mitem.sel{border-color:#1a4a6c;background:#f3ead6;box-shadow:0 0 0 3px rgba(26,74,108,.15)}
  .mitem.done{background:#eafff0;border-color:#4ec97a;color:#1f6b41;cursor:default;opacity:.85}
  .mitem.bad{animation:shake .4s;border-color:#c0392b;background:#fff0f0}
  .mitem .pic{font-size:1.7rem}

  .order-pool,.order-slots{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
  .order-slots{
    min-height:66px;background:#f3ead6;border:2px dashed #b89460;border-radius:8px;
    padding:11px 9px;margin-bottom:16px;align-items:center;
  }
  .order-slots.empty-pool::after{content:'нажимайте на карточки ниже ⬇️';color:#a99a80;font-size:.88rem}
  .otile{
    background:#fffdf8;border:2px solid #1a4a6c;border-radius:4px;padding:10px 13px;
    cursor:pointer;font-family:inherit;font-size:.98rem;font-weight:700;color:#1a4a6c;
    transition:.15s;display:flex;align-items:center;gap:7px;box-shadow:0 3px 0 #0f5c95;
  }
  .otile:hover{transform:translateY(-2px);background:#f3ead6}
  .otile.placed{border-color:#4ec97a;background:#eafff0;color:#1f6b41;box-shadow:0 3px 0 #35a85f}
  .otile.bad{animation:shake .4s;border-color:#c0392b;background:#fff0f0}
  .otile.used{opacity:.3;pointer-events:none}
  .otile .num{font-size:1.4rem}

  .fb{
    margin-top:16px;padding:14px 16px;border-radius:6px;font-size:1rem;
    line-height:1.55;text-align:center;display:none;font-weight:600;
  }
  .fb.show{display:block;animation:pop .3s}
  .fb.good{background:#eafff0;border:3px double #4ec97a;color:#1f6b41}
  .fb.bad{background:#fff0f0;border:3px double #c0392b;color:#8e2a1f}
  .fb .again{
    margin-top:10px;background:#fffdf8;border:2px solid #c0392b;color:#8e2a1f;
    border-radius:4px;padding:7px 16px;font-family:inherit;font-weight:700;
    font-size:.9rem;cursor:pointer;
  }
  .fb .again:hover{background:#fff0f0}

  .nav{display:flex;gap:11px;justify-content:center;margin-top:20px;flex-wrap:wrap}
  .nav button{
    border:none;border-radius:4px;padding:13px 24px;font-family:inherit;
    font-size:1rem;font-weight:700;cursor:pointer;transition:.16s;
    display:inline-flex;align-items:center;gap:8px;letter-spacing:.3px;
  }
  .btn-next{background:#1a7abc;color:#fff;box-shadow:0 5px 0 #0f5c95}
  .btn-next:hover{background:#0f5c95;transform:translateY(-2px)}
  .btn-back{background:#fffdf8;color:#1a4a6c;border:2px solid #b89460 !important;box-shadow:0 5px 0 #b89460}
  .btn-back:hover{background:#f3ead6}
  .btn-back:disabled,.btn-next:disabled{opacity:.4;cursor:default;transform:none}
  .btn-replay{background:#b89460;color:#fffdf8;box-shadow:0 5px 0 #8a6f48}
  .btn-replay:hover{background:#a6844f}

  .final{text-align:center}
  .final .big{
    font-size:3.4rem;display:inline-block;margin-bottom:12px;
    border:5px double #b89460;color:#c0392b;border-radius:8px;padding:8px 22px;
    letter-spacing:3px;font-weight:700;background:#fffdf8;
    animation:float 2.4s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .final h2{font-size:clamp(1.25rem,4.5vw,1.8rem);color:#1a4a6c;margin-bottom:12px}
  .final p{font-size:1.02rem;line-height:1.65;color:#5a4228;margin-bottom:12px}
  .reward{
    background:#f3ead6;border:2px dashed #b89460;border-radius:8px;padding:18px 16px;margin:18px 0;
  }
  .reward .words{font-size:1.02rem;line-height:1.85;color:#5a4228;text-align:left}
  .reward .words b{color:#1a4a6c}
  .restart{background:#c0392b;color:#fff;box-shadow:0 5px 0 #8e2a1f}
  .restart:hover{background:#a93226}

  .start-screen{text-align:center}
  .start-screen .cast{font-size:2.6rem;letter-spacing:6px;margin:14px 0 6px}
  .start-screen ul{
    list-style:none;text-align:left;margin:16px auto;max-width:430px;
    background:#fffdf8;border:2px dashed #b89460;border-radius:8px;padding:16px 18px;
  }
  .start-screen li{
    padding:7px 0 7px 30px;position:relative;font-size:.97rem;color:#5a4228;line-height:1.45;
    border-bottom:1px dotted #b89460;
  }
  .start-screen li:last-child{border-bottom:none}
  .start-screen li::before{content:'⚓';position:absolute;left:0;top:7px;font-size:.95rem}
  .sound-note{
    background:#fffdf8;border:2px solid #b89460;border-radius:4px;padding:11px 14px;
    font-size:.88rem;color:#5a4228;margin-top:14px;line-height:1.5;
  }

  @media (max-width:520px){
    .match-area{grid-template-columns:1fr 1fr;gap:8px}
    .mitem{font-size:.88rem;min-height:50px;padding:9px 5px}
    .mitem .pic{font-size:1.4rem}
    .countbox .items{font-size:1.9rem;letter-spacing:4px}
    .hero{font-size:2.6rem}
    .nav button{padding:12px 18px;font-size:.95rem}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <h1>Путешествие по островам</h1>
    <div class="bar-wrap">
      <div class="bar-label">
        <span id="stepLabel">Остров 0 из 14</span>
        <span id="pctLabel">0%</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="barFill"></div>
        <div class="bar-runner" id="barRunner">⛵</div>
      </div>
      <div class="stars" id="stars"></div>
    </div>
  </div>

  <div id="stageHost"></div>

</div>

<script>
(function(){
  "use strict";

  var RATE = 0.85;
  var voices = [];

  function loadVoices(){
    if(!('speechSynthesis' in window)) return;
    voices = window.speechSynthesis.getVoices() || [];
  }
  loadVoices();
  if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = loadVoices;
    setTimeout(loadVoices, 350);
    setTimeout(loadVoices, 1400);
  }

  function pickVoice(){
    if(!voices.length) loadVoices();
    var v;
    v = voices.find(function(x){ return x.lang === 'en-GB'; });
    if(v) return v;
    v = voices.find(function(x){ return x.lang && x.lang.toLowerCase().indexOf('en-gb') === 0; });
    if(v) return v;
    v = voices.find(function(x){ return x.lang === 'en-US'; });
    if(v) return v;
    v = voices.find(function(x){ return x.lang && x.lang.toLowerCase().indexOf('en') === 0; });
    return v || null;
  }

  function speak(text, delay){
    if(!('speechSynthesis' in window)) return;
    var go = function(){
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      var v = pickVoice();
      if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'en-GB'; }
      u.rate = RATE; u.pitch = 1.06; u.volume = 1;
      window.speechSynthesis.speak(u);
    };
    if(delay){ setTimeout(go, delay); } else { go(); }
  }

  function speakSeq(arr){
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    arr.forEach(function(t, i){
      setTimeout(function(){
        var u = new SpeechSynthesisUtterance(t);
        var v = pickVoice();
        if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'en-GB'; }
        u.rate = RATE; u.pitch = 1.06;
        window.speechSynthesis.speak(u);
      }, i * 1500);
    });
  }

  var STEPS = [

  /* 1 */ {
    kind:'intro', emoji:'⚓', mech:'Поднять паруса',
    title:'Путешествие по островам',
    text:'Ты — капитан своего корабля, и за плечами у тебя целое плавание: ты считал карандаши, искал ластик, раскладывал вещи по местам, узнавал цвета и говорил, что тебе нравится. Сегодня корабль плывёт от острова к острову, чтобы вспомнить всё это ещё раз. Четырнадцать островов — и в конце тебя ждёт гавань!',
    say:"Let's sail!",
    sayRu:'Поплыли!',
    cta:'⚓ Поднять якорь!'
  },

  /* 2 */ {
    kind:'choice', emoji:'🎒', mech:'Выбор ответа',
    title:'Остров школьных вещей',
    text:'На берегу лежит предмет с длинными ушками и розовым носом. Кто это?',
    say:'pencil case',
    opts:[
      {t:'pencil case /ˈpensl keɪs/ — пенал', say:'pencil case'},
      {t:'schoolbag /ˈskuːlbæɡ/ — портфель', say:'schoolbag'},
      {t:'rubber /ˈrʌbə/ — ластик', say:'rubber'}
    ],
    correct:0,
    ok:'Верно! **pencil case** /ˈpensl keɪs/ — пенал. Первый остров позади!',
    no:'Послушай все три слова и выбери подходящее к картинке.'
  },

  /* 3 */ {
    kind:'count', emoji:'✏️', mech:'Считаем предметы',
    title:'Остров карандашей',
    text:'На острове растут карандаши вместо пальм. **How many pencils?** /haʊ ˈmeni ˈpenslz/ — сколько карандашей?',
    ask:'How many pencils?',
    items:'✏️✏️✏️✏️✏️✏️✏️',
    say:'How many pencils? One, two, three, four, five, six, seven. Seven pencils!',
    opts:[
      {t:'six /sɪks/ — шесть', say:'six'},
      {t:'seven /ˈsevən/ — семь', say:'seven'},
      {t:'eight /eɪt/ — восемь', say:'eight'}
    ],
    correct:1,
    ok:'Молодец! **Seven pencils!** /ˈsevən ˈpenslz/ — семь карандашей!',
    no:'Считаем по одному: one, two, three, four, five, six, seven.'
  },

  /* 4 */ {
    kind:'choice', emoji:'🎨', mech:'Выбор ответа',
    title:'Остров цветов',
    text:'Капитан видит что-то ярко-синее на берегу. Как он скажет?',
    say:'I see something blue!',
    opts:[
      {t:'I see something blue! /aɪ siː ˈsʌmθɪŋ bluː/ — я вижу что-то синее!', say:'I see something blue!'},
      {t:'I see something red! /aɪ siː ˈsʌmθɪŋ red/ — я вижу что-то красное!', say:'I see something red!'},
      {t:'I see something green! /aɪ siː ˈsʌmθɪŋ ɡriːn/ — я вижу что-то зелёное!', say:'I see something green!'}
    ],
    correct:0,
    ok:'Правильно! **I see something blue!** — я вижу что-то синее!',
    no:'Посмотри на цвет на картинке и выбери правильную фразу.'
  },

  /* 5 */ {
    kind:'match', emoji:'🎨', mech:'Найди пару',
    title:'Остров цветных слов',
    text:'Соедини слово-цвет с правильным кружком.',
    say:'red, blue, green, yellow, pink',
    pairs:[
      {left:'red', say:'red', right:'🔴'},
      {left:'blue', say:'blue', right:'🔵'},
      {left:'green', say:'green', right:'🟢'},
      {left:'yellow', say:'yellow', right:'🟡'},
      {left:'pink', say:'pink', right:'🌸'}
    ],
    ok:'Все цвета на своих местах: **red, blue, green, yellow, pink**!',
    no:'Не та пара. Послушай слово и найди подходящий цвет.'
  },

  /* 6 */ {
    kind:'count', emoji:'📖', mech:'Считаем предметы',
    title:'Остров книг',
    text:'В сундуке сокровищ лежат книги. **How many books?** /haʊ ˈmeni bʊks/ — сколько книг?',
    ask:'How many books?',
    items:'📖📖📖📖📖📖📖📖📖',
    say:'How many books? One, two, three, four, five, six, seven, eight, nine. Nine books!',
    opts:[
      {t:'eight /eɪt/ — восемь', say:'eight'},
      {t:'nine /naɪn/ — девять', say:'nine'},
      {t:'ten /ten/ — десять', say:'ten'}
    ],
    correct:1,
    ok:'Верно! **Nine books!** /naɪn bʊks/ — девять книг!',
    no:'Считаем по одной, не торопясь.'
  },

  /* 7 */ {
    kind:'choice', emoji:'📍', mech:'Выбор ответа',
    title:'Остров предлогов',
    text:'Чаклз сидит СВЕРХУ парты. Как сказать, где он?',
    say:"It's on the desk.",
    opts:[
      {t:"It's on the desk. /ɪts ɒn ðə desk/ — он на парте", say:"It's on the desk."},
      {t:"It's in the desk. /ɪts ɪn ðə desk/ — он в парте", say:"It's in the desk."},
      {t:"It's on the bus. /ɪts ɒn ðə bʌs/ — он в автобусе", say:"It's on the bus."}

  var TOTAL = STEPS.length;
  var idx = 0;
  var history = [];
  var score = 0;
  var stageHost = document.getElementById('stageHost');
  var barFill = document.getElementById('barFill');
  var barRunner = document.getElementById('barRunner');
  var stepLabel = document.getElementById('stepLabel');
  var pctLabel = document.getElementById('pctLabel');
  var starsBox = document.getElementById('stars');

  function bold(str){
    return String(str).replace(/\*\*(.+?)\*\*/g, '<span class="en-inline">$1</span>');
  }

  function updateBar(){
    var pct = Math.round((idx / (TOTAL - 1)) * 100);
    if(pct < 0) pct = 0; if(pct > 100) pct = 100;
    barFill.style.width = pct + '%';
    barRunner.style.left = pct + '%';
    stepLabel.textContent = idx === 0 ? 'Остров 0 из ' + (TOTAL - 1) : ('Остров ' + idx + ' из ' + (TOTAL - 1));
    pctLabel.textContent = pct + '%';
    var full = Math.floor(score / 3);
    var s = '';
    for(var i = 0; i < full && i < 6; i++){ s += '⚓'; }
    starsBox.textContent = s;
  }

  function shakeStage(){
    var st = stageHost.querySelector('.stage');
    if(!st) return;
    st.classList.remove('shake');
    void st.offsetWidth;
    st.classList.add('shake');
  }

  function speakerBtn(text, cls, title){
    var b = document.createElement('button');
    b.className = cls || 'speak-mini';
    b.innerHTML = '🔊';
    b.title = title || 'Прослушать';
    b.setAttribute('aria-label','Прослушать: ' + text);
    b.addEventListener('click', function(ev){ ev.stopPropagation(); speak(text); });
    return b;
  }

  function nextBtn(label, fn, cls){
    var b = document.createElement('button');
    b.className = cls || 'btn-next';
    b.textContent = label;
    b.addEventListener('click', fn);
    return b;
  }

  function goNext(){
    if(idx < TOTAL - 1){
      history.push(idx);
      idx++;
      render();
    }
  }
  function goBack(){
    if(history.length){
      idx = history.pop();
      render();
    }
  }

  function render(){
    window.scrollTo({top:0, behavior:'smooth'});
    updateBar();
    stageHost.innerHTML = '';
    var s = STEPS[idx];

    var stage = document.createElement('div');
    stage.className = 'stage';
    stageHost.appendChild(stage);

    if(s.kind === 'intro')   return renderIntro(stage, s);
    if(s.kind === 'final')   return renderFinal(stage, s);
    if(s.kind === 'choice')  return renderChoice(stage, s);
    if(s.kind === 'count')   return renderCount(stage, s);
    if(s.kind === 'match')   return renderMatch(stage, s);
    if(s.kind === 'order')   return renderOrder(stage, s);
  }

  function header(stage, s){
    var tag = document.createElement('span');
    tag.className = 'step-tag';
    tag.textContent = 'ОСТРОВ ' + (idx + 1) + ' / ' + TOTAL;
    stage.appendChild(tag);

    if(s.mech){
      var m = document.createElement('span');
      m.className = 'mech-tag';
      m.textContent = s.mech;
      stage.appendChild(m);
    }
    var hero = document.createElement('span');
    hero.className = 'hero';
    hero.textContent = s.emoji || '⚓';
    stage.appendChild(hero);

    var h2 = document.createElement('h2');
    h2.textContent = s.title;
    stage.appendChild(h2);

    var p = document.createElement('div');
    p.className = 'task-text';
    p.innerHTML = bold(s.text);
    stage.appendChild(p);
  }

  function speakBlock(stage, s){
    if(!s.say) return;
    var line = document.createElement('div');
    line.className = 'speak-line';
    var big = document.createElement('button');
    big.className = 'speak-big';
    big.innerHTML = '🔊 ' + s.say;
    big.addEventListener('click', function(){ speak(s.say); });
    line.appendChild(big);
    stage.appendChild(line);
    if(s.sayRu){
      var r = document.createElement('div');
      r.className = 'task-text';
      r.style.marginTop = '-10px';
      r.textContent = s.sayRu;
      stage.appendChild(r);
    }
  }

  function feedback(stage, s, onWin){
    var fb = document.createElement('div');
    fb.className = 'fb';
    stage.appendChild(fb);

    var nav = document.createElement('div');
    nav.className = 'nav';

    var back = nextBtn('⬅️ Назад', goBack, 'btn-back');
    if(!history.length) back.disabled = true;
    nav.appendChild(back);

    var replay = nextBtn('🔁 Ещё раз', function(){ render(); }, 'btn-replay');
    nav.appendChild(replay);

    var next = nextBtn('К следующему острову ➡️', goNext);
    next.style.display = 'none';
    nav.appendChild(next);

    stage.appendChild(nav);

    function showGood(){
      fb.className = 'fb good show';
      fb.innerHTML = bold(s.ok || 'Отлично!');
      next.style.display = '';
      speak('Well done!', 250);
      if(onWin) onWin();
    }
    function showBad(){
      fb.className = 'fb bad show';
      fb.innerHTML = bold(s.no || 'Попробуй ещё раз!') +
        '<br><button class="again" type="button">🔁 Попробовать снова</button>';
      var ag = fb.querySelector('.again');
      ag.addEventListener('click', function(){ render(); });
      shakeStage();
      speak('Try again!', 200);
    }
    return {good:showGood, bad:showBad, next:next, back:back};
  }

  function renderIntro(stage, s){
    header(stage, s);
    speakBlock(stage, s);

    var cast = document.createElement('div');
    cast.className = 'start-screen';
    cast.innerHTML = '<div class="cast">⚓ ⛵ 🏝️ 🏆</div>';
    stage.appendChild(cast);

    var list = document.createElement('ul');
    ['Вспомнить все школьные слова',
     'Называть цвета и числа от 1 до 10',
     'Говорить, где лежат вещи: in и on',
     'Рассказывать, что тебе нравится',
     'Пройти весь путь от острова к острову'
    ].forEach(function(t){
      var li = document.createElement('li');
      li.textContent = t;
      list.appendChild(li);
    });
    stage.appendChild(list);

    var note = document.createElement('div');
    note.className = 'sound-note';
    note.innerHTML = '🔈 Включите звук на устройстве. Все фразы озвучены британским голосом и звучат чуть медленнее обычной речи.';
    stage.appendChild(note);

    var nav = document.createElement('div');
    nav.className = 'nav';
    nav.appendChild(nextBtn(s.cta || 'Начать ➡️', goNext));
    stage.appendChild(nav);

    speak(s.say, 500);
  }

  function renderChoice(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score++; updateBar(); });
    speakBlock(stage, s);

    var box = document.createElement('div');
    box.className = 'opts' + (s.opts.length > 3 ? ' grid2' : '');
    var navEl = stage.querySelector('.nav');
    stage.insertBefore(box, navEl);

    var locked = false;
    s.opts.forEach(function(o, i){
      var b = document.createElement('button');
      b.className = 'opt';
      b.type = 'button';
      var mk = document.createElement('span');
      mk.className = 'mark';
      mk.textContent = String.fromCharCode(65 + i);
      b.appendChild(mk);
      var tx = document.createElement('span');
      tx.innerHTML = bold(o.t);
      b.appendChild(tx);
      b.appendChild(speakerBtn(o.say || o.t.replace(/\/.*?\//g,'').replace(/—.*$/,'').trim(), 'speak-mini'));

      b.addEventListener('click', function(){
        if(locked) return;
        if(i === s.correct){
          locked = true;
          b.classList.add('correct');
          Array.prototype.forEach.call(box.children, function(x){ x.disabled = true; });
          speak(o.say || o.t, 120);
          setTimeout(fb.good, 650);
        } else {
          b.classList.add('wrong');
          setTimeout(function(){ b.classList.remove('wrong'); }, 600);
          fb.bad();
        }
      });
      box.appendChild(b);
    });
  }

  function renderCount(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score++; updateBar(); });
    var navEl = stage.querySelector('.nav');

    var cb = document.createElement('div');
    cb.className = 'countbox';
    var q = document.createElement('div');
    q.className = 'task-text';
    q.style.marginBottom = '10px';
    q.innerHTML = '<span class="en-inline">' + s.ask + '</span>';
    cb.appendChild(q);
    var ql = document.createElement('div');
    ql.className = 'speak-line';
    ql.style.margin = '0 0 12px';
    ql.appendChild(speakerBtn(s.ask, 'speak-mini', 'Прослушать вопрос'));
    cb.appendChild(ql);
    var it = document.createElement('div');
    it.className = 'items';
    it.textContent = s.items;
    cb.appendChild(it);
    stage.insertBefore(cb, navEl);

    speak(s.say, 600);

    var box = document.createElement('div');
    box.className = 'opts grid2';
    stage.insertBefore(box, navEl);

    var locked = false;
    s.opts.forEach(function(o, i){
      var b = document.createElement('button');
      b.className = 'opt'; b.type = 'button';
      b.style.justifyContent = 'center';
      b.innerHTML = bold(o.t);
      b.appendChild(speakerBtn(o.say, 'speak-mini'));
      b.addEventListener('click', function(){
        if(locked) return;
        if(i === s.correct){
          locked = true;
          b.classList.add('correct');
          Array.prototype.forEach.call(box.children, function(x){ x.disabled = true; });
          speak(o.say, 120);
          setTimeout(fb.good, 650);
        } else {
          b.classList.add('wrong');
          setTimeout(function(){ b.classList.remove('wrong'); }, 600);
          fb.bad();
        }
      });
      box.appendChild(b);
    });
  }

  function renderMatch(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score += 2; updateBar(); });
    var navEl = stage.querySelector('.nav');

    speakBlock(stage, s);

    var area = document.createElement('div');
    area.className = 'match-area';
    stage.insertBefore(area, navEl);

    var leftCol = document.createElement('div');
    leftCol.className = 'mcol';
    leftCol.innerHTML = '<h4>СЛОВО</h4>';
    var rightCol = document.createElement('div');
    rightCol.className = 'mcol';
    rightCol.innerHTML = '<h4>КАРТИНКА</h4>';
    area.appendChild(leftCol);
    area.appendChild(rightCol);

    var pairs = s.pairs.slice();
    var lefts  = pairs.map(function(p,i){ return {p:p, i:i}; });
    var rights = pairs.map(function(p,i){ return {p:p, i:i}; });
    rights.sort(function(){ return Math.random() - 0.5; });

    var selected = null;
    var matched = 0;
    var busy = false;

    lefts.forEach(function(o){
      var b = document.createElement('button');
      b.className = 'mitem'; b.type = 'button';
      b.textContent = o.p.left;
      b.appendChild(speakerBtn(o.p.say, 'speak-mini'));
      b.addEventListener('click', function(){
        if(busy || b.classList.contains('done') || b.classList.contains('sel')) return;
        if(selected && selected.side === 'left'){ selected.el.classList.remove('sel'); }
        selected = {side:'left', el:b, i:o.i};
        b.classList.add('sel');
        speak(o.p.say);
      });
      leftCol.appendChild(b);
      o.el = b;
    });

    rights.forEach(function(o){
      var b = document.createElement('button');
      b.className = 'mitem'; b.type = 'button';
      var pic = document.createElement('span');
      pic.className = 'pic';
      pic.textContent = o.p.right;
      b.appendChild(pic);
      b.appendChild(speakerBtn(o.p.say, 'speak-mini'));
      b.addEventListener('click', function(){
        if(busy || b.classList.contains('done')) return;
        speak(o.p.say);
        if(selected && selected.side === 'left'){
          busy = true;
          if(selected.i === o.i){
            selected.el.classList.remove('sel');
            selected.el.classList.add('done');
            b.classList.add('done');
            selected = null;
            matched++;
            speak('Yes!', 250);
            busy = false;
            if(matched === pairs.length){ setTimeout(fb.good, 900); }
          } else {
            selected.el.classList.add('bad');
            b.classList.add('bad');
            var a1 = selected.el, a2 = b;
            setTimeout(function(){
              a1.classList.remove('bad','sel');
              a2.classList.remove('bad');
              selected = null; busy = false;
            }, 650);
            fb.bad();
            shakeStage();
          }
        } else {
          if(selected && selected.side === 'right'){ selected.el.classList.remove('sel'); }
          selected = {side:'right', el:b, i:o.i};
          b.classList.add('sel');
        }
      });
      rightCol.appendChild(b);
      o.el = b;
    });
  }

  function renderOrder(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score += 2; updateBar(); });
    var navEl = stage.querySelector('.nav');

    speakBlock(stage, s);

    var slots = document.createElement('div');
    slots.className = 'order-slots empty-pool';
    stage.insertBefore(slots, navEl);

    var pool = s.items.map(function(it, i){ return {it:it, i:i}; });
    var shuffled = pool.slice();
    shuffled.sort(function(){ return Math.random() - 0.5; });

    var poolBox = document.createElement('div');
    poolBox.className = 'order-pool';
    stage.insertBefore(poolBox, navEl);

    var placed = [];
    var busy = false;
    var correctOrder = pool.map(function(o){ return o.i; });

    shuffled.forEach(function(o){
      var b = document.createElement('button');
      b.className = 'otile'; b.type = 'button';
      var n = document.createElement('span');
      n.className = 'num';
      n.textContent = o.it.n || '';
      b.appendChild(n);
      var t = document.createElement('span');
      t.innerHTML = bold(o.it.t);
      b.appendChild(t);
      b.appendChild(speakerBtn(o.it.say, 'speak-mini'));

      b.addEventListener('click', function(){
        if(busy || b.classList.contains('used')) return;
        speak(o.it.say);
        var expect = correctOrder[placed.length];
        if(o.i === expect){
          b.classList.add('used');
          var clone = document.createElement('button');
          clone.className = 'otile placed';
          clone.type = 'button';
          clone.innerHTML = '<span class="num">' + (o.it.n || '') + '</span><span>' + o.it.t + '</span>';
          slots.appendChild(clone);
          slots.classList.remove('empty-pool');
          placed.push(o.i);
          if(placed.length === pool.length){
            busy = true;
            speakSeq(s.items.map(function(x){ return x.say; }));
            setTimeout(fb.good, 1200);
          }
        } else {
          b.classList.add('bad');
          setTimeout(function(){ b.classList.remove('bad'); }, 550);
          fb.bad();
          shakeStage();
        }
      });
      poolBox.appendChild(b);
    });
  }

  function renderFinal(stage, s){
    stage.innerHTML = '';
    var box = document.createElement('div');
    box.className = 'final';
    stage.appendChild(box);

    var big = document.createElement('span');
    big.className = 'big';
    big.textContent = '⚓';
    box.appendChild(big);

    var h = document.createElement('h2');
    h.textContent = s.title;
    box.appendChild(h);

    var p = document.createElement('p');
    p.textContent = s.text;
    box.appendChild(p);

    var line = document.createElement('div');
    line.className = 'speak-line';
    var big2 = document.createElement('button');
    big2.className = 'speak-big';
    big2.innerHTML = '🔊 ' + s.say;
    big2.addEventListener('click', function(){ speakSeq(['Welcome to the harbor, Captain!', 'Well done!']); });
    line.appendChild(big2);
    box.appendChild(line);

    var rw = document.createElement('div');
    rw.className = 'reward';
    var rt = document.createElement('div');
    rt.style.fontWeight = '700';
    rt.style.marginBottom = '10px';
    rt.style.color = '#1a4a6c';
    rt.textContent = '⚓ Бортовой журнал — весь словарь плавания:';
    rw.appendChild(rt);

    var wl = document.createElement('div');
    wl.className = 'words';
    s.allWords.forEach(function(w){
      var row = document.createElement('div');
      row.style.display = 'flex';
      row.style.alignItems = 'center';
      row.style.gap = '8px';
      row.style.padding = '3px 0';
      row.style.borderBottom = '1px dotted #b89460';
      var tx = document.createElement('span');
      tx.innerHTML = '<b>' + w.en + '</b> ' + w.ipa + ' — ' + w.ru;
      tx.style.flex = '1';
      row.appendChild(tx);
      row.appendChild(speakerBtn(w.en, 'speak-mini'));
      wl.appendChild(row);
    });
    rw.appendChild(wl);
    box.appendChild(rw);

    var st = document.createElement('p');
    st.innerHTML = '⚓ Островов пройдено: <b>' + score + '</b><br>Плавание можно повторить — хоть сегодня, хоть через неделю.';
    box.appendChild(st);

    var nav = document.createElement('div');
    nav.className = 'nav';
    var back = nextBtn('⬅️ Назад', goBack, 'btn-back');
    if(!history.length) back.disabled = true;
    nav.appendChild(back);
    nav.appendChild(nextBtn('🔁 Пройти заново', function(){
      idx = 0; history = []; score = 0; render();
    }, 'restart'));
    box.appendChild(nav);

    speakSeq(['Welcome to the harbor, Captain!', 'Well done!']);
  }

  render();

  if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = function(){ loadVoices(); };
  }
  document.addEventListener('click', function once(){
    loadVoices();
    document.removeEventListener('click', once);
  });

})();
</script>
</body>
</html>

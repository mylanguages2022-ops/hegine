<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"Comic Sans MS","Segoe UI",Verdana,sans-serif;
    background-color:#eaf7f2;
    background-image:radial-gradient(#cfeee2 2.2px, transparent 2.6px);
    background-size:28px 28px;
    color:#2a3a34;min-height:100vh;padding:16px 12px 50px;
  }
  .wrap{max-width:760px;margin:0 auto}

  /* ---------- СТАНЦИОННАЯ ТАБЛИЧКА ---------- */
  .topbar{
    background:#e2574c;border-radius:18px;padding:16px 16px 18px;
    border:4px solid #b03a30;box-shadow:0 6px 0 rgba(176,58,48,.4);

  }
  .topbar h1{

    text-shadow:0 2px 0 #b03a30;
  }
  .topbar h1::before{content:'🚂 ';}
  .bar-wrap{margin-top:14px}
  .bar-label{
    display:flex;justify-content:space-between;align-items:center;
    font-size:.8rem;color:#ffe0d8;margin-bottom:6px;font-weight:700;letter-spacing:.4px;
  }
  /* полотно со шпалами */
  .bar-track{
    height:24px;background:#8a5a2b;border-radius:4px;overflow:hidden;
    border:3px solid #6a4218;position:relative;
    background-image:repeating-linear-gradient(90deg, #6a4218 0 7px, #8a5a2b 7px 22px);
  }
  .bar-fill{
    height:100%;width:0%;
    background:linear-gradient(180deg, rgba(62,201,167,.85), rgba(42,122,102,.85));
    transition:width .5s cubic-bezier(.34,1.4,.64,1);
  }
  .bar-runner{
    position:absolute;top:-9px;left:0;font-size:1.5rem;
    transform:translateX(-50%);transition:left .5s cubic-bezier(.34,1.4,.64,1);
    filter:drop-shadow(0 2px 1px rgba(0,0,0,.3));
  }
  .stars{margin-top:9px;text-align:center;font-size:1.05rem;letter-spacing:3px;color:#ffcf4d}

  /* ---------- ВАГОНЧИК-КУБИК ---------- */
  .stage{
    background:#fff;border-radius:16px;padding:28px 18px 26px;
    border:3px solid #3ec9a7;box-shadow:0 6px 0 rgba(62,201,167,.45);
    animation:pop .35s ease;position:relative;
  }
  .stage::before{
    content:'';position:absolute;top:-10px;left:22px;right:22px;height:14px;
    background-image:radial-gradient(circle at 10px 7px, #3ec9a7 7px, transparent 8px);
    background-size:42px 14px;background-repeat:repeat-x;
  }
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .stage.shake{animation:shake .45s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-9px)}40%{transform:translateX(9px)}
    60%{transform:translateX(-6px)}80%{transform:translateX(6px)}
  }
  .step-tag{
    display:inline-block;background:#3ec9a7;color:#fff;
    font-size:.76rem;font-weight:700;padding:4px 14px;border-radius:999px;
    letter-spacing:.5px;margin-bottom:12px;
  }
  .mech-tag{
    display:inline-block;background:#fff8e4;color:#a07a10;
    font-size:.72rem;font-weight:700;padding:3px 11px;border-radius:999px;
    border:2px solid #ffcf4d;margin-left:6px;margin-bottom:12px;letter-spacing:.3px;
  }
  .hero{font-size:3.1rem;text-align:center;display:block;margin:2px 0 10px;line-height:1.15}
  .stage h2{font-size:clamp(1.05rem,3.8vw,1.4rem);color:#2a7a66;text-align:center;margin-bottom:10px;line-height:1.35}
  .task-text{font-size:1rem;line-height:1.6;color:#4a5a54;text-align:center;margin-bottom:16px}

  .speak-line{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0 18px}
  .speak-big{

    padding:12px 22px;font-size:1.02rem;font-weight:700;cursor:pointer;

  .speak-big:hover{background:#d0463b;transform:translateY(-2px)}
  .speak-big:active{transform:translateY(1px);box-shadow:0 2px 0 #b03a30}
  .speak-mini{

  .opts{display:flex;flex-direction:column;gap:11px;margin-top:6px}

    padding:13px 14px;cursor:pointer;font-family:inherit;font-size:1.02rem;

  .opt .mark{

  .opt.wrong{background:#fff0f0;border-color:#f28b8b;border-left-color:#f28b8b;animation:shake .4s}
  @keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  .opt:disabled{cursor:default}

  .countbox{
    background:#fff8e4;border:3px dashed #ffcf4d;border-radius:14px;
    padding:18px 12px;text-align:center;margin-bottom:16px;
  }
  .countbox .items{font-size:2.4rem;letter-spacing:7px;line-height:1.5;word-break:break-word}

  .match-area{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
  .mcol{display:flex;flex-direction:column;gap:10px}
  .mcol h4{text-align:center;font-size:.82rem;color:#7a8a84;font-weight:700;margin-bottom:2px;letter-spacing:.5px}
  .mitem{
    background:#fff;border:3px solid #cfeee2;border-radius:12px;padding:11px 8px;

  .mitem.sel{border-color:#3ec9a7;background:#f2fbf7;box-shadow:0 0 0 3px rgba(62,201,167,.25)}
  .mitem.done{background:#eafff0;border-color:#4ec97a;color:#1f6b41;cursor:default;opacity:.85}
  .mitem.bad{animation:shake .4s;border-color:#f28b8b;background:#fff0f0}
  .mitem .pic{font-size:1.7rem}

  .order-pool,.order-slots{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
  .order-slots{
    min-height:66px;background:#fff8e4;border:3px dashed #ffcf4d;border-radius:14px;
    padding:11px 9px;margin-bottom:16px;align-items:center;
  }
  .order-slots.empty-pool::after{content:'нажимайте на вагончики ниже ⬇️';color:#b0a080;font-size:.88rem}
  .otile{
    background:#fff;border:3px solid #9b8cff;border-radius:12px;padding:10px 13px;
    cursor:pointer;font-family:inherit;font-size:.98rem;font-weight:700;color:#5a4ac0;
    transition:.15s;display:flex;align-items:center;gap:7px;box-shadow:0 3px 0 #7a6ae0;
  }
  .otile:hover{transform:translateY(-2px);background:#f4f2ff}
  .otile.placed{border-color:#4ec97a;background:#eafff0;color:#1f6b41;box-shadow:0 3px 0 #35a85f}
  .otile.bad{animation:shake .4s;border-color:#f28b8b;background:#fff0f0}
  .otile.used{opacity:.3;pointer-events:none}
  .otile .num{font-size:1.4rem}

  .fb{
    margin-top:16px;padding:14px 16px;border-radius:12px;font-size:1rem;
    line-height:1.55;text-align:center;display:none;font-weight:600;
  }
  .fb.show{display:block;animation:pop .3s}
  .fb.good{background:#eafff0;border:3px solid #4ec97a;color:#256b3d}
  .fb.bad{background:#fff4f4;border:3px solid #f2b0b0;color:#9c3b3b}
  .fb .again{
    margin-top:10px;background:#fff;border:2px solid #f2b0b0;color:#9c3b3b;
    border-radius:999px;padding:7px 16px;font-family:inherit;font-weight:700;
    font-size:.9rem;cursor:pointer;

  .fb .again:hover{background:#ffeaea}

  .nav{display:flex;gap:11px;justify-content:center;margin-top:20px;flex-wrap:wrap}
  .nav button{
    border:none;border-radius:999px;padding:13px 26px;font-family:inherit;
    font-size:1.02rem;font-weight:700;cursor:pointer;transition:.16s;
    display:inline-flex;align-items:center;gap:8px;
  }
  .btn-next{background:#3ec9a7;color:#fff;box-shadow:0 5px 0 #2a9a80}
  .btn-next:hover{background:#2fb896;transform:translateY(-2px)}
  .btn-back{background:#fff;color:#2a7a66;border:3px solid #cfeee2 !important;box-shadow:0 5px 0 #cfeee2}
  .btn-back:hover{background:#f2fbf7}

  .btn-replay{background:#ffcf4d;color:#7a5a10;box-shadow:0 5px 0 #d8a828}
  .btn-replay:hover{background:#f5c335}

  .final{text-align:center}
  .final .big{font-size:4.2rem;display:block;margin-bottom:12px;animation:float 2.4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
  .final h2{font-size:clamp(1.25rem,4.5vw,1.8rem);color:#2a7a66;margin-bottom:12px}
  .final p{font-size:1.02rem;line-height:1.65;color:#4a5a54;margin-bottom:12px}
  .reward{
    background:#fff8e4;border:3px dashed #ffcf4d;border-radius:14px;padding:18px 16px;margin:18px 0;
  }
  .reward .words{font-size:1.02rem;line-height:1.85;color:#6a5a3a;text-align:left}
  .reward .words b{color:#a07a10}
  .restart{background:#e2574c;color:#fff;box-shadow:0 5px 0 #b03a30}
  .restart:hover{background:#d0463b}

  .start-screen{text-align:center}
  .start-screen .cast{font-size:2.6rem;letter-spacing:6px;margin:14px 0 6px}
  .start-screen ul{
    list-style:none;text-align:left;margin:16px auto;max-width:430px;
    background:#f2fbf7;border:3px dashed #9cc9b8;border-radius:14px;padding:16px 18px;
  }
  .start-screen li{
    padding:7px 0 7px 30px;position:relative;font-size:.97rem;color:#4a5a54;line-height:1.45;
    border-bottom:1px dotted #9cc9b8;
  }
  .start-screen li:last-child{border-bottom:none}
  .start-screen li::before{content:'🧸';position:absolute;left:0;top:7px;font-size:.95rem}
  .sound-note{
    background:#fff8e4;border:2px solid #ffcf4d;border-radius:12px;padding:11px 14px;
    font-size:.88rem;color:#7a5a10;margin-top:14px;line-height:1.5;
  }

  @media (max-width:520px){
    .match-area{grid-template-columns:1fr 1fr;gap:8px}
    .mitem{font-size:.88rem;min-height:50px;padding:9px 5px}
    .mitem .pic{font-size:1.4rem}
    .countbox .items{font-size:1.9rem;letter-spacing:4px}
    .hero{font-size:2.6rem}
    .nav button{padding:12px 19px;font-size:.95rem}
  }
</style>

<body>
<div class="wrap">

  <div class="topbar">
    <h1>Вечеринка игрушек</h1>
    <div class="bar-wrap">
      <div class="bar-label">
        <span id="stepLabel">Станция 0 из 14</span>
        <span id="pctLabel">0%</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="barFill"></div>
        <div class="bar-runner" id="barRunner">🚂</div>
      </div>
      <div class="stars" id="stars"></div>
    </div>
  </div>

  <div id="stageHost"></div>

</div>

<script>
(function(){
  "use strict";

  var RATE = 0.85;
  var voices = [];

  function loadVoices(){
    if(!('speechSynthesis' in window)) return;
    voices = window.speechSynthesis.getVoices() || [];
  }
  loadVoices();
  if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = loadVoices;
    setTimeout(loadVoices, 350);
    setTimeout(loadVoices, 1400);
  }

  function pickVoice(){
    if(!voices.length) loadVoices();
    var v;
    v = voices.find(function(x){ return x.lang === 'en-GB'; });
    if(v) return v;
    v = voices.find(function(x){ return x.lang && x.lang.toLowerCase().indexOf('en-gb') === 0; });
    if(v) return v;
    v = voices.find(function(x){ return x.lang === 'en-US'; });
    if(v) return v;
    v = voices.find(function(x){ return x.lang && x.lang.toLowerCase().indexOf('en') === 0; });
    return v || null;
  }

  function speak(text, delay){
    if(!('speechSynthesis' in window)) return;
    var go = function(){
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      var v = pickVoice();
      if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'en-GB'; }
      u.rate = RATE; u.pitch = 1.06; u.volume = 1;
      window.speechSynthesis.speak(u);
    };
    if(delay){ setTimeout(go, delay); } else { go(); }
  }

  function speakSeq(arr){
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    arr.forEach(function(t, i){
      setTimeout(function(){
        var u = new SpeechSynthesisUtterance(t);
        var v = pickVoice();
        if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'en-GB'; }
        u.rate = RATE; u.pitch = 1.06;
        window.speechSynthesis.speak(u);
      }, i * 1500);
    });
  }

  var STEPS = [

  /* 1 */ {

    title:'Вечеринка игрушек',
    text:'Лулу устраивает вечеринку игрушек! Но чтобы попасть на неё, каждый гость должен рассказать о себе: что у него есть и чего нет. Ты — проводник паровозика: проверяй билеты-фразы, считай игрушки и помогай всем добраться до праздника.',
    say:"I've got a teddy bear! Come to the party!",
    sayRu:'У меня есть плюшевый мишка! Приходите на вечеринку!',
    cta:'🚂 Отправить паровозик!'
  },

  /* 2 */ {

    opts:[
      {t:'kite /kaɪt/ — воздушный змей', say:'kite'},
      {t:'boat /bəʊt/ — лодка', say:'boat'},
      {t:'doll /dɒl/ — кукла', say:'doll'}
    ],
    correct:0,
    ok:'Верно! **kite** /kaɪt/ — воздушный змей. Первый билет проверен!',
    no:'Послушай все три слова и выбери подходящее к картинке.'
  },

  /* 3 */ {
    kind:'choice', emoji:'🎁', mech:'Выбор ответа',
    title:'Станция 2: билет змея',
    text:'Змей хочет сказать, что он есть у Лулу. Какая фраза подойдёт?',
    say:"I've got a kite.",
    opts:[
      {t:"I've got a kite. /aɪv ɡɒt ə kaɪt/ — у меня есть воздушный змей", say:"I've got a kite."},
      {t:"I haven't got a kite. /aɪ ˈhævnt ɡɒt ə kaɪt/ — у меня нет воздушного змея", say:"I haven't got a kite."},
      {t:"I've got a boat. /aɪv ɡɒt ə bəʊt/ — у меня есть лодка", say:"I've got a boat."}

    correct:0,
    ok:'Точно! **I\'ve got a kite** /aɪv ɡɒt ə kaɪt/ — у меня есть воздушный змей!',

  /* 4 */ {

    title:'Станция 3: мячи в корзине',

    ask:'How many balls?',
    items:'⚽⚽⚽⚽',

    opts:[
      {t:'four /fɔː/ — четыре', say:'four'},

  /* 6 */ {

    say:"I haven't got a boat.",
    opts:[
      {t:"I haven't got a boat. /aɪ ˈhævnt ɡɒt ə bəʊt/ — у меня нет лодки", say:"I haven't got a boat."},
      {t:"I've got a boat. /aɪv ɡɒt ə bəʊt/ — у меня есть лодка", say:"I've got a boat."},
      {t:"I've got a ball. /aɪv ɡɒt ə bɔːl/ — у меня есть мяч", say:"I've got a ball."}
    ],
    correct:0,
    ok:'Правильно! **I haven\'t got a boat** /aɪ ˈhævnt ɡɒt ə bəʊt/ — у меня нет лодки.',
    no:'Лодки НЕТ, значит нужна фраза с haven\'t got.'
  },

  /* 7 */ {
    kind:'count', emoji:'🧸', mech:'Считаем игрушки',
    title:'Станция 6: мишки на полке',
    text:'Посчитай плюшевых мишек, которые ждут вечеринку.',
    ask:'How many teddy bears?',
    items:'🧸🧸',
    say:'How many teddy bears? One, two, three. Three teddy bears!',
    opts:[
      {t:'two /tuː/ — два', say:'two'},
      {t:'three /θriː/ — три', say:'three'},
      {t:'four /fɔː/ — четыре', say:'four'}
    ],
    correct:1,
    ok:'Верно! **Three teddy bears!** /θriː ˈtedi beəz/ — три плюшевых мишки!',

  var TOTAL = STEPS.length;
  var idx = 0;
  var history = [];
  var score = 0;
  var stageHost = document.getElementById('stageHost');
  var barFill = document.getElementById('barFill');
  var barRunner = document.getElementById('barRunner');
  var stepLabel = document.getElementById('stepLabel');
  var pctLabel = document.getElementById('pctLabel');
  var starsBox = document.getElementById('stars');

  function bold(str){
    return String(str).replace(/\*\*(.+?)\*\*/g, '<span class="en-inline">$1</span>');
  }

  function updateBar(){
    var pct = Math.round((idx / (TOTAL - 1)) * 100);
    if(pct < 0) pct = 0; if(pct > 100) pct = 100;
    barFill.style.width = pct + '%';
    barRunner.style.left = pct + '%';
    stepLabel.textContent = idx === 0 ? 'Станция 0 из ' + (TOTAL - 1) : ('Станция ' + idx + ' из ' + (TOTAL - 1));
    pctLabel.textContent = pct + '%';
    var full = Math.floor(score / 3);
    var s = '';
    for(var i = 0; i < full && i < 6; i++){ s += '⭐'; }
    starsBox.textContent = s;
  }

  function shakeStage(){
    var st = stageHost.querySelector('.stage');
    if(!st) return;
    st.classList.remove('shake');
    void st.offsetWidth;
    st.classList.add('shake');
  }

  function speakerBtn(text, cls, title){
    var b = document.createElement('button');
    b.className = cls || 'speak-mini';
    b.innerHTML = '🔊';
    b.title = title || 'Прослушать';
    b.setAttribute('aria-label','Прослушать: ' + text);
    b.addEventListener('click', function(ev){ ev.stopPropagation(); speak(text); });
    return b;
  }

  function nextBtn(label, fn, cls){
    var b = document.createElement('button');
    b.className = cls || 'btn-next';
    b.textContent = label;
    b.addEventListener('click', fn);
    return b;
  }

  function goNext(){
    if(idx < TOTAL - 1){
      history.push(idx);
      idx++;
      render();
    }
  }
  function goBack(){
    if(history.length){
      idx = history.pop();
      render();
    }
  }

  function render(){
    window.scrollTo({top:0, behavior:'smooth'});
    updateBar();
    stageHost.innerHTML = '';
    var s = STEPS[idx];

    var stage = document.createElement('div');
    stage.className = 'stage';
    stageHost.appendChild(stage);

    if(s.kind === 'intro')   return renderIntro(stage, s);
    if(s.kind === 'final')   return renderFinal(stage, s);
    if(s.kind === 'choice')  return renderChoice(stage, s);
    if(s.kind === 'count')   return renderCount(stage, s);
    if(s.kind === 'match')   return renderMatch(stage, s);
    if(s.kind === 'order')   return renderOrder(stage, s);
  }

  function header(stage, s){
    var tag = document.createElement('span');
    tag.className = 'step-tag';
    tag.textContent = 'СТАНЦИЯ ' + (idx + 1) + ' / ' + TOTAL;
    stage.appendChild(tag);

    if(s.mech){
      var m = document.createElement('span');
      m.className = 'mech-tag';
      m.textContent = s.mech;
      stage.appendChild(m);
    }
    var hero = document.createElement('span');
    hero.className = 'hero';
    hero.textContent = s.emoji || '🧸';
    stage.appendChild(hero);

    var h2 = document.createElement('h2');
    h2.textContent = s.title;
    stage.appendChild(h2);

    var p = document.createElement('div');
    p.className = 'task-text';
    p.innerHTML = bold(s.text);
    stage.appendChild(p);
  }

  function speakBlock(stage, s){
    if(!s.say) return;
    var line = document.createElement('div');
    line.className = 'speak-line';
    var big = document.createElement('button');
    big.className = 'speak-big';
    big.innerHTML = '🔊 ' + s.say;
    big.addEventListener('click', function(){ speak(s.say); });
    line.appendChild(big);
    stage.appendChild(line);
    if(s.sayRu){
      var r = document.createElement('div');
      r.className = 'task-text';
      r.style.marginTop = '-10px';
      r.textContent = s.sayRu;
      stage.appendChild(r);
    }
  }

  function feedback(stage, s, onWin){
    var fb = document.createElement('div');
    fb.className = 'fb';
    stage.appendChild(fb);

    var nav = document.createElement('div');
    nav.className = 'nav';

    var back = nextBtn('⬅️ Назад', goBack, 'btn-back');
    if(!history.length) back.disabled = true;
    nav.appendChild(back);

    var replay = nextBtn('🔁 Ещё раз', function(){ render(); }, 'btn-replay');
    nav.appendChild(replay);

    var next = nextBtn('Следующая станция ➡️', goNext);
    next.style.display = 'none';
    nav.appendChild(next);

    stage.appendChild(nav);

    function showGood(){
      fb.className = 'fb good show';
      fb.innerHTML = bold(s.ok || 'Отлично!');
      next.style.display = '';
      speak('Well done!', 250);
      if(onWin) onWin();
    }
    function showBad(){
      fb.className = 'fb bad show';
      fb.innerHTML = bold(s.no || 'Попробуй ещё раз!') +
        '<br><button class="again" type="button">🔁 Попробовать снова</button>';
      var ag = fb.querySelector('.again');
      ag.addEventListener('click', function(){ render(); });
      shakeStage();
      speak('Try again!', 200);
    }
    return {good:showGood, bad:showBad, next:next, back:back};
  }

  function renderIntro(stage, s){
    header(stage, s);
    speakBlock(stage, s);

    var cast = document.createElement('div');
    cast.className = 'start-screen';
    cast.innerHTML = '<div class="cast">🧸 🪁 ⚽ 🚗 🎉</div>';
    stage.appendChild(cast);

    var list = document.createElement('ul');
    ['Называть игрушки: kite, ball, teddy bear, doll, car, boat',
     'Говорить, что есть: I\'ve got a...',
     'Говорить, чего нет: I haven\'t got a...',
     'Задавать вопрос Have you got...? и отвечать Yes, I have / No, I haven\'t',
     'Довезти всех гостей до вечеринки'
    ].forEach(function(t){
      var li = document.createElement('li');
      li.textContent = t;
      list.appendChild(li);
    });
    stage.appendChild(list);

    var note = document.createElement('div');
    note.className = 'sound-note';
    note.innerHTML = '🔈 Включите звук на устройстве. Все фразы озвучены британским голосом и звучат чуть медленнее обычной речи.';
    stage.appendChild(note);

    var nav = document.createElement('div');
    nav.className = 'nav';
    nav.appendChild(nextBtn(s.cta || 'Начать ➡️', goNext));
    stage.appendChild(nav);

    speak(s.say, 500);
  }

  function renderChoice(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score++; updateBar(); });
    speakBlock(stage, s);

    var box = document.createElement('div');
    box.className = 'opts' + (s.opts.length > 3 ? ' grid2' : '');
    var navEl = stage.querySelector('.nav');
    stage.insertBefore(box, navEl);

    var locked = false;
    s.opts.forEach(function(o, i){
      var b = document.createElement('button');
      b.className = 'opt';
      b.type = 'button';
      var mk = document.createElement('span');
      mk.className = 'mark';
      mk.textContent = String.fromCharCode(65 + i);
      b.appendChild(mk);
      var tx = document.createElement('span');
      tx.innerHTML = bold(o.t);
      b.appendChild(tx);
      b.appendChild(speakerBtn(o.say || o.t.replace(/\/.*?\//g,'').replace(/—.*$/,'').trim(), 'speak-mini'));

      b.addEventListener('click', function(){
        if(locked) return;
        if(i === s.correct){
          locked = true;
          b.classList.add('correct');
          Array.prototype.forEach.call(box.children, function(x){ x.disabled = true; });
          speak(o.say || o.t, 120);
          setTimeout(fb.good, 650);
        } else {
          b.classList.add('wrong');
          setTimeout(function(){ b.classList.remove('wrong'); }, 600);
          fb.bad();
        }
      });
      box.appendChild(b);
    });
  }

  function renderCount(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score++; updateBar(); });
    var navEl = stage.querySelector('.nav');

    var cb = document.createElement('div');
    cb.className = 'countbox';
    var q = document.createElement('div');
    q.className = 'task-text';
    q.style.marginBottom = '10px';
    q.innerHTML = '<span class="en-inline">' + s.ask + '</span>';
    cb.appendChild(q);
    var ql = document.createElement('div');
    ql.className = 'speak-line';
    ql.style.margin = '0 0 12px';
    ql.appendChild(speakerBtn(s.ask, 'speak-mini', 'Прослушать вопрос'));
    cb.appendChild(ql);
    var it = document.createElement('div');
    it.className = 'items';
    it.textContent = s.items;
    cb.appendChild(it);
    stage.insertBefore(cb, navEl);

    speak(s.say, 600);

    var box = document.createElement('div');
    box.className = 'opts grid2';
    stage.insertBefore(box, navEl);

    var locked = false;
    s.opts.forEach(function(o, i){
      var b = document.createElement('button');
      b.className = 'opt'; b.type = 'button';
      b.style.justifyContent = 'center';
      b.innerHTML = bold(o.t);
      b.appendChild(speakerBtn(o.say, 'speak-mini'));
      b.addEventListener('click', function(){
        if(locked) return;
        if(i === s.correct){
          locked = true;
          b.classList.add('correct');
          Array.prototype.forEach.call(box.children, function(x){ x.disabled = true; });
          speak(o.say, 120);
          setTimeout(fb.good, 650);
        } else {
          b.classList.add('wrong');
          setTimeout(function(){ b.classList.remove('wrong'); }, 600);
          fb.bad();
        }
      });
      box.appendChild(b);
    });
  }

  function renderMatch(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score += 2; updateBar(); });
    var navEl = stage.querySelector('.nav');

    speakBlock(stage, s);

    var area = document.createElement('div');
    area.className = 'match-area';
    stage.insertBefore(area, navEl);

    var leftCol = document.createElement('div');
    leftCol.className = 'mcol';
    leftCol.innerHTML = '<h4>ФРАЗА / СЛОВО</h4>';
    var rightCol = document.createElement('div');
    rightCol.className = 'mcol';
    rightCol.innerHTML = '<h4>КАРТИНКА / ОТВЕТ</h4>';
    area.appendChild(leftCol);
    area.appendChild(rightCol);

    var pairs = s.pairs.slice();
    var lefts  = pairs.map(function(p,i){ return {p:p, i:i}; });
    var rights = pairs.map(function(p,i){ return {p:p, i:i}; });
    rights.sort(function(){ return Math.random() - 0.5; });

    var selected = null;
    var matched = 0;
    var busy = false;

    lefts.forEach(function(o){
      var b = document.createElement('button');
      b.className = 'mitem'; b.type = 'button';
      b.textContent = o.p.left;
      b.appendChild(speakerBtn(o.p.say, 'speak-mini'));
      b.addEventListener('click', function(){
        if(busy || b.classList.contains('done') || b.classList.contains('sel')) return;
        if(selected && selected.side === 'left'){ selected.el.classList.remove('sel'); }
        selected = {side:'left', el:b, i:o.i};
        b.classList.add('sel');
        speak(o.p.say);
      });
      leftCol.appendChild(b);
      o.el = b;
    });

    rights.forEach(function(o){
      var b = document.createElement('button');
      b.className = 'mitem'; b.type = 'button';
      var pic = document.createElement('span');
      pic.className = 'pic';
      pic.textContent = o.p.right;
      b.appendChild(pic);
      b.appendChild(speakerBtn(o.p.say, 'speak-mini'));
      b.addEventListener('click', function(){
        if(busy || b.classList.contains('done')) return;
        speak(o.p.say);
        if(selected && selected.side === 'left'){
          busy = true;
          if(selected.i === o.i){
            selected.el.classList.remove('sel');
            selected.el.classList.add('done');
            b.classList.add('done');
            selected = null;
            matched++;
            speak('Yes!', 250);
            busy = false;
            if(matched === pairs.length){ setTimeout(fb.good, 900); }
          } else {
            selected.el.classList.add('bad');
            b.classList.add('bad');
            var a1 = selected.el, a2 = b;
            setTimeout(function(){
              a1.classList.remove('bad','sel');
              a2.classList.remove('bad');
              selected = null; busy = false;
            }, 650);
            fb.bad();
            shakeStage();
          }
        } else {
          if(selected && selected.side === 'right'){ selected.el.classList.remove('sel'); }
          selected = {side:'right', el:b, i:o.i};
          b.classList.add('sel');
        }
      });
      rightCol.appendChild(b);
      o.el = b;
    });
  }

  function renderOrder(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score += 2; updateBar(); });
    var navEl = stage.querySelector('.nav');

    speakBlock(stage, s);

    var slots = document.createElement('div');
    slots.className = 'order-slots empty-pool';
    stage.insertBefore(slots, navEl);

    var pool = s.items.map(function(it, i){ return {it:it, i:i}; });
    var shuffled = pool.slice();
    shuffled.sort(function(){ return Math.random() - 0.5; });

    var poolBox = document.createElement('div');
    poolBox.className = 'order-pool';
    stage.insertBefore(poolBox, navEl);

    var placed = [];
    var busy = false;
    var correctOrder = pool.map(function(o){ return o.i; });

    shuffled.forEach(function(o){
      var b = document.createElement('button');
      b.className = 'otile'; b.type = 'button';
      var n = document.createElement('span');
      n.className = 'num';
      n.textContent = o.it.n || '';
      b.appendChild(n);
      var t = document.createElement('span');
      t.innerHTML = bold(o.it.t);
      b.appendChild(t);
      b.appendChild(speakerBtn(o.it.say, 'speak-mini'));

      b.addEventListener('click', function(){
        if(busy || b.classList.contains('used')) return;
        speak(o.it.say);
        var expect = correctOrder[placed.length];
        if(o.i === expect){
          b.classList.add('used');
          var clone = document.createElement('button');
          clone.className = 'otile placed';
          clone.type = 'button';
          clone.innerHTML = '<span class="num">' + (o.it.n || '') + '</span><span>' + o.it.t + '</span>';
          slots.appendChild(clone);
          slots.classList.remove('empty-pool');
          placed.push(o.i);
          if(placed.length === pool.length){
            busy = true;
            speakSeq(s.items.map(function(x){ return x.say; }));
            setTimeout(fb.good, 1200);
          }
        } else {
          b.classList.add('bad');
          setTimeout(function(){ b.classList.remove('bad'); }, 550);
          fb.bad();
          shakeStage();
        }
      });
      poolBox.appendChild(b);
    });
  }

  function renderFinal(stage, s){
    stage.innerHTML = '';
    var box = document.createElement('div');
    box.className = 'final';
    stage.appendChild(box);

    var big = document.createElement('span');
    big.className = 'big';
    big.textContent = '🎉';
    box.appendChild(big);

    var h = document.createElement('h2');
    h.textContent = s.title;
    box.appendChild(h);

    var p = document.createElement('p');
    p.textContent = s.text;
    box.appendChild(p);

    var line = document.createElement('div');
    line.className = 'speak-line';
    var big2 = document.createElement('button');
    big2.className = 'speak-big';
    big2.innerHTML = '🔊 ' + s.say;
    big2.addEventListener('click', function(){ speakSeq(['Hooray!', "I've got a party!", 'Well done!']); });
    line.appendChild(big2);
    box.appendChild(line);

    var rw = document.createElement('div');
    rw.className = 'reward';
    var rt = document.createElement('div');
    rt.style.fontWeight = '700';
    rt.style.marginBottom = '10px';
    rt.style.color = '#a07a10';
    rt.textContent = '🧸 Список гостей вечеринки — весь словарь урока:';
    rw.appendChild(rt);

    var wl = document.createElement('div');
    wl.className = 'words';
    s.allWords.forEach(function(w){
      var row = document.createElement('div');
      row.style.display = 'flex';
      row.style.alignItems = 'center';
      row.style.gap = '8px';
      row.style.padding = '3px 0';
      row.style.borderBottom = '1px dotted #e6d5a8';
      var tx = document.createElement('span');
      tx.innerHTML = '<b>' + w.en + '</b> ' + w.ipa + ' — ' + w.ru;
      tx.style.flex = '1';
      row.appendChild(tx);
      row.appendChild(speakerBtn(w.en, 'speak-mini'));
      wl.appendChild(row);
    });
    rw.appendChild(wl);
    box.appendChild(rw);

    var st = document.createElement('p');
    st.innerHTML = '⭐ Станций пройдено: <b>' + score + '</b><br>Паровозик можно отправить ещё раз — хоть сегодня, хоть через неделю.';
    box.appendChild(st);

    var nav = document.createElement('div');
    nav.className = 'nav';
    var back = nextBtn('⬅️ Назад', goBack, 'btn-back');
    if(!history.length) back.disabled = true;
    nav.appendChild(back);
    nav.appendChild(nextBtn('🔁 Отправить заново', function(){
      idx = 0; history = []; score = 0; render();
    }, 'restart'));
    box.appendChild(nav);

    speakSeq(['Hooray!', "I've got a party!", 'Well done!']);
  }

  render();

  if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = function(){ loadVoices(); };
  }
  document.addEventListener('click', function once(){
    loadVoices();
    document.removeEventListener('click', once);
  });

})();
</script>
</body>
</html>

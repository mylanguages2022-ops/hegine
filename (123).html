<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seaside Quest</title>
<meta name="description" content="Квест по английскому языку: The Seaside.">
<style>
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  min-height: 100vh;
  font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", sans-serif;
  color: #3e2723;
  background: linear-gradient(to bottom, #4fc3f7 0%, #81d4fa 42%, #ffe082 68%, #d7ccc8 100%);
  background-attachment: fixed;
  overflow-x: hidden;
  touch-action: manipulation;
}

body {
  display: flex;
  flex-direction: column;
}

.scene-background {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
}

.scene-sun {
  position: absolute;
  top: 4%;
  right: 8%;
  font-size: 5.4em;
  animation: sunGlow 4s infinite alternate;
  filter: drop-shadow(0 0 25px rgba(255,235,59,0.85));
}

.scene-cloud {
  position: absolute;
  top: 12%;
  left: -18%;
  font-size: 4em;
  opacity: 0.75;
  animation: cloudDrift 60s linear infinite;
  filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1));
}

.scene-cloud-second {
  top: 26%;
  font-size: 3em;
  animation-duration: 75s;
  animation-delay: -22s;
}

.scene-lighthouse {
  position: absolute;
  bottom: 28%;
  left: 4%;
  font-size: 5.8em;
  filter: drop-shadow(4px 4px 0 rgba(0,0,0,0.18));
  animation: lighthouseBeam 5s ease-in-out infinite;
}

.scene-umbrella {
  position: absolute;
  bottom: 27%;
  right: 7%;
  font-size: 5em;
  filter: drop-shadow(4px 4px 0 rgba(0,0,0,0.18));
}

.scene-shell {
  position: absolute;
  bottom: 5%;
  left: 16%;
  font-size: 3em;
  opacity: 0.9;
}

.scene-crab-decor {
  position: absolute;
  bottom: 6%;
  right: 18%;
  font-size: 3em;
  animation: crabScurry 6s linear infinite alternate;
}

.scene-wave {
  position: absolute;
  bottom: 24%;
  left: 0;
  width: 200%;
  height: 38px;
  background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 20"><path d="M0,10 Q25,0 50,10 T100,10 L100,20 L0,20 Z" fill="%2329b6f6"/></svg>') repeat-x;
  background-size: 105px 38px;
  animation: waveRoll 7s linear infinite;
  opacity: 0.85;
}

.scene-wave-second {
  bottom: 22%;
  animation-duration: 10s;
  opacity: 0.55;
  background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 20"><path d="M0,10 Q25,20 50,10 T100,10 L100,20 L0,20 Z" fill="%230288d1"/></svg>') repeat-x;
  background-size: 125px 38px;
}

.scene-boardwalk {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 22%;
  background: repeating-linear-gradient(90deg, #8d6e63 0px, #8d6e63 46px, #5d4037 46px, #5d4037 50px);
  border-top: 8px solid #4e342e;
  box-shadow: inset 0 10px 20px rgba(0,0,0,0.25);
}

.top-bar {
  width: 100%;
  background: #6d4c41;
  color: white;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 6px 18px rgba(0,0,0,0.3);
  border-bottom: 6px solid #4e342e;
  min-height: 68px;
}

.quest-title {
  font-size: 1.28em;
  font-weight: bold;
  text-shadow: 2px 2px 0 #3e2723;
  white-space: nowrap;
}

.progress-wrap {
  flex: 1;
  height: 26px;
  background: #4e342e;
  border-radius: 13px;
  overflow: hidden;
  position: relative;
  border: 3px solid #3e2723;
  box-shadow: inset 0 3px 8px rgba(0,0,0,0.35);
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #ffca28, #ff8f00);
  position: relative;
  transition: width 0.65s cubic-bezier(0.4, 0, 0.2, 1);
}

.progress-bar::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(45deg, rgba(255,255,255,0.25) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.25) 50%, rgba(255,255,255,0.25) 75%, transparent 75%);
  background-size: 26px 26px;
  animation: progressGlow 1.2s linear infinite;
}

.progress-hero {
  position: absolute;
  top: 50%;
  left: 0;
  font-size: 1.95em;
  transform: translateY(-50%);
  transition: left 0.65s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 10;
  filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.35));
  animation: heroFloat 0.7s infinite alternate;
}

.stats-panel {
  text-align: right;
  min-width: 105px;
  font-weight: bold;
  font-size: 0.96em;
  text-shadow: 1px 1px 0 #3e2723;
}

.badges-row {
  display: flex;
  gap: 4px;
  justify-content: flex-end;
  margin-top: 3px;
}

.badge-icon {
  opacity: 0.3;
  filter: grayscale(1);
  transition: all 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  font-size: 1.18em;
}

.badge-icon.earned {
  opacity: 1;
  filter: grayscale(0);
  transform: scale(1.22);
  animation: starBurst 0.65s ease;
}

.container {
  width: 100%;
  max-width: 660px;
  margin: 0 auto;
  padding: 24px;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 10;
}

.card {
  width: 100%;
  background: #fff8e1;
  border: 7px solid #8d6e63;
  border-radius: 28px;
  box-shadow: 0 18px 40px rgba(0,0,0,0.26), 0 8px 15px rgba(0,0,0,0.14);
  padding: 30px 20px;
  text-align: center;
  animation: cardEnter 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  position: relative;
  overflow: hidden;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 14px;
  background: repeating-linear-gradient(90deg, #d7ccc8 0px, #d7ccc8 20px, #bcaaa4 20px, #bcaaa4 23px);
}

.card.exit {
  animation: cardExit 0.35s ease-in forwards;
}

.step-hero {
  font-size: 3.6em;
  margin: 8px 0 10px;
  filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.15));
  animation: heroWave 2.4s ease-in-out infinite;
}

.instruction-text {
  font-size: 1.55em;
  font-weight: bold;
  line-height: 1.38;
  margin-bottom: 20px;
  color: #4e342e;
  text-shadow: 1px 1px 0 rgba(255,255,255,0.55);
}

.sound-btn-main {
  background: #43a047;
  color: white;
  border: none;
  padding: 15px 28px;
  border-radius: 42px;
  font-size: 1.22em;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 7px 0 #2e7d32, 0 12px 25px rgba(0,0,0,0.18);
  margin-bottom: 22px;
  font-family: inherit;
  transition: transform 0.12s, box-shadow 0.12s;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  max-width: 100%;
}

.sound-btn-main:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 0 #2e7d32, 0 16px 30px rgba(0,0,0,0.22);
}

.sound-btn-main:active {
  transform: translateY(7px);
  box-shadow: 0 0 0 #2e7d32, 0 5px 10px rgba(0,0,0,0.2);
}

.sound-btn-main:focus {
  outline: 4px solid #1b5e20;
  outline-offset: 3px;
}

.sound-btn-main:disabled {
  opacity: 0.55;
  cursor: default;
  transform: none;
  box-shadow: none;
}

.sound-btn-main::before {
  content: "🔊";
  font-size: 1.15em;
}

.game-zone {
  min-height: 240px;
  background: #ffe082;
  border: 4px dashed #f57f17;
  border-radius: 20px;
  padding: 16px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 15px;
  margin-bottom: 18px;
  position: relative;
  box-shadow: inset 0 4px 12px rgba(0,0,0,0.08);
}

.option-btn {
  background: #fff3e0;
  color: #4e342e;
  border: 5px solid #ff9800;
  border-radius: 18px;
  padding: 14px 24px;
  font-size: 1.35em;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 6px 0 #e65100;
  transition: transform 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.18s, background 0.22s;
  font-family: inherit;
  min-width: 88px;
  position: relative;
  overflow: hidden;
}

.option-btn::before {
  content: "";
  position: absolute;
  top: 0;
  left: -120%;
  width: 120%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.38), transparent);
  transition: left 0.55s;
}

.option-btn:hover {
  transform: translateY(-4px) scale(1.05);
  background: #ffe0b2;
  box-shadow: 0 10px 0 #e65100, 0 15px 25px rgba(0,0,0,0.14);
}

.option-btn:hover::before {
  left: 120%;
}

.option-btn:active {
  transform: translateY(6px);
  box-shadow: 0 0 0 #e65100;
}

.option-btn:focus {
  outline: 4px solid #0288d1;
  outline-offset: 3px;
}

.option-btn:disabled {
  cursor: default;
  opacity: 0.62;
  transform: none;
  box-shadow: none;
}

.option-btn.correct {
  background: #c8e6c9;
  border-color: #43a047;
  color: #1b5e20;
  box-shadow: 0 6px 0 #2e7d32;
  animation: correctPop 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.option-btn.wrong {
  background: #ffcdd2;
  border-color: #e53935;
  color: #b71c1c;
  box-shadow: 0 6px 0 #c62828;
  animation: wrongShake 0.55s cubic-bezier(.36,.07,.19,.97) both;
}

.option-btn.selected {
  background: #ffcc80;
  outline: 4px solid #ef6c00;
}

.letter-btn {
  width: 58px;
  height: 58px;
  font-size: 1.85em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 15px;
  background: #fff9c4;
  border-color: #fbc02d;
  box-shadow: 0 6px 0 #f57f17;
  color: #f57f17;
  text-transform: uppercase;
}

.letter-btn.selected {
  background: #fbc02d;
  color: #4e342e;
  transform: translateY(6px);
  box-shadow: none;
}

.word-display {
  min-width: 225px;
  min-height: 66px;
  background: white;
  border-radius: 15px;
  border-bottom: 6px solid #8d6e63;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 2.25em;
  font-weight: bold;
  letter-spacing: 0.16em;
  padding: 8px 18px;
  margin-bottom: 16px;
  text-transform: uppercase;
  color: #3e2723;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.match-col {
  display: flex;
  flex-direction: column;
  gap: 14px;
  flex: 1;
  min-width: 185px;
}

.feedback {
  min-height: 48px;
  font-size: 1.55em;
  font-weight: bold;
  margin: 12px 0 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.feedback.success {
  color: #2e7d32;
  animation: feedbackSlide 0.45s ease;
}

.feedback.error {
  color: #c62828;
  animation: feedbackShake 0.45s ease;
}

.nav-btns {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 14px;
  margin-top: 8px;
}

.nav-btn {
  border: none;
  border-radius: 40px;
  padding: 13px 28px;
  font-size: 1.18em;
  font-weight: bold;
  cursor: pointer;
  color: white;
  font-family: inherit;
  box-shadow: 0 6px 0 rgba(0,0,0,0.28);
  transition: transform 0.12s, box-shadow 0.12s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.nav-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 9px 0 rgba(0,0,0,0.28);
}

.nav-btn:active {
  transform: translateY(6px);
  box-shadow: 0 0 0 rgba(0,0,0,0.28);
}

.nav-btn:focus {
  outline: 4px solid #4e342e;
  outline-offset: 3px;
}

.nav-btn:disabled {
  opacity: 0.45;
  cursor: default;
  transform: none;
  box-shadow: none;
}

.btn-back {
  background: #8d6e63;
}

.btn-retry {
  background: #ff9800;
  display: none;
}

.btn-next {
  background: #43a047;
  display: none;
}

.btn-start {
  background: #e53935;
  color: white;
  border: none;
  padding: 22px 46px;
  border-radius: 50px;
  font-size: 1.85em;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 10px 0 #b71c1c, 0 20px 40px rgba(229,57,53,0.35);
  animation: pulseStart 2.2s infinite;
  font-family: inherit;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.btn-start:hover {
  transform: translateY(-4px);
  box-shadow: 0 14px 0 #b71c1c, 0 25px 50px rgba(229,57,53,0.45);
}

.btn-start:active {
  transform: translateY(10px);
  box-shadow: 0 0 0 #b71c1c;
}

.btn-start:focus {
  outline: 5px solid #fff176;
  outline-offset: 4px;
}

.intro-screen {
  text-align: center;
  color: white;
  padding: 28px;
  z-index: 20;
  position: relative;
}

.intro-screen h1 {
  font-size: 3.2em;
  text-shadow: 5px 5px 0 #4e342e, 0 0 30px rgba(255,255,255,0.45);
  animation: titleFloat 3.5s ease-in-out infinite;
  margin-bottom: 18px;
  line-height: 1.18;
}

.heroes-row {
  font-size: 5em;
  display: flex;
  justify-content: center;
  gap: 22px;
  margin: 34px 0;
  filter: drop-shadow(5px 5px 0 rgba(0,0,0,0.28));
}

.heroes-row span {
  display: inline-block;
  animation: heroWave 2.2s ease-in-out infinite;
}

.heroes-row span:nth-child(2) {
  animation-delay: 0.28s;
}

.heroes-row span:nth-child(3) {
  animation-delay: 0.56s;
}

.final-screen {
  background: #fff8e1;
  border: 9px solid #ff9800;
  border-radius: 32px;
  padding: 30px 18px;
  text-align: center;
  box-shadow: 0 0 65px rgba(255,152,0,0.42), 0 22px 50px rgba(0,0,0,0.28);
  position: relative;
  overflow: hidden;
  max-width: 100%;
}

.final-screen::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: radial-gradient(circle at center, rgba(255,255,255,0.72) 0%, transparent 75%);
  pointer-events: none;
}

.final-screen h1 {
  color: #e65100;
  font-size: 2.7em;
  margin-bottom: 14px;
  text-shadow: 3px 3px 0 #ffe0b2;
  position: relative;
  z-index: 2;
}

.final-summary {
  font-size: 1.28em;
  font-weight: bold;
  color: #4e342e;
  max-width: 520px;
  margin: 0 auto 18px;
  line-height: 1.45;
  position: relative;
  z-index: 2;
}

.reward-icon {
  font-size: 6.2em;
  display: inline-block;
  margin: 18px 0;
  animation: rotateReward 5.5s linear infinite;
  filter: drop-shadow(0 10px 20px rgba(0,0,0,0.22));
  position: relative;
  z-index: 2;
}

.word-list-final {
  text-align: left;
  background: #fff3e0;
  border: 3px solid #ffb74d;
  border-radius: 18px;
  padding: 18px;
  margin: 24px 0;
  max-height: 350px;
  overflow-y: auto;
  box-shadow: inset 0 3px 10px rgba(0,0,0,0.07);
  position: relative;
  z-index: 2;
}

.word-row-final {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 12px 0;
  border-bottom: 2px dashed #ffcc80;
  font-size: 1.08em;
}

.word-row-final:last-child {
  border-bottom: none;
}

.mini-sound-btn {
  width: 42px;
  height: 42px;
  border: none;
  border-radius: 50%;
  background: #43a047;
  color: white;
  font-size: 1.05em;
  cursor: pointer;
  box-shadow: 0 4px 0 #2e7d32;
  flex: 0 0 auto;
  transition: transform 0.12s, box-shadow 0.12s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.mini-sound-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 0 #2e7d32;
}

.mini-sound-btn:active {
  transform: translateY(4px);
  box-shadow: none;
}

.mini-sound-btn:focus {
  outline: 3px solid #1b5e20;
  outline-offset: 2px;
}

.mini-sound-btn:disabled {
  opacity: 0.55;
  cursor: default;
  transform: none;
  box-shadow: none;
}

.drag-zone {
  width: 100%;
  height: 320px;
  position: relative;
  background: linear-gradient(to bottom, #81d4fa, #ffe082);
  border-radius: 22px;
  border: 5px dashed #f57f17;
  overflow: hidden;
  touch-action: none;
  box-shadow: inset 0 0 25px rgba(0,0,0,0.08);
}

.target-zone {
  position: absolute;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  font-size: 6.2em;
  animation: targetPulse 2.2s infinite;
  pointer-events: none;
  filter: drop-shadow(0 5px 10px rgba(0,0,0,0.18));
}

.drag-item {
  position: absolute;
  font-size: 3.7em;
  cursor: grab;
  user-select: none;
  touch-action: none;
  z-index: 20;
  filter: drop-shadow(4px 4px 6px rgba(0,0,0,0.28));
  transition: transform 0.15s;
}

.drag-item:active {
  cursor: grabbing;
  transform: scale(1.22);
  z-index: 25;
}

.sandcastle-zone {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}

.castle-base {
  font-size: 6.8em;
  position: relative;
  filter: drop-shadow(0 8px 15px rgba(0,0,0,0.18));
}

.sand-layer {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.72em;
  animation: sandFall 0.45s ease;
}

.build-btn,
.crab-counter-btn {
  background: #8d6e63;
  color: white;
  border: 4px solid #5d4037;
  padding: 13px 26px;
  border-radius: 30px;
  font-size: 1.25em;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 5px 0 #3e2723;
  font-family: inherit;
  transition: transform 0.12s, box-shadow 0.12s;
}

.build-btn:hover,
.crab-counter-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 7px 0 #3e2723;
}

.build-btn:active,
.crab-counter-btn:active {
  transform: translateY(5px);
  box-shadow: none;
}

.build-btn:focus,
.crab-counter-btn:focus {
  outline: 4px solid #3e2723;
  outline-offset: 3px;
}

.build-btn:disabled,
.crab-counter-btn:disabled {
  opacity: 0.55;
  cursor: default;
  transform: none;
  box-shadow: none;
}

.crab-zone {
  width: 100%;
  height: 280px;
  position: relative;
  background: linear-gradient(to bottom, #ffe082, #d7ccc8);
  border-radius: 22px;
  border: 5px solid #8d6e63;
  overflow: hidden;
}

.crab-target {
  position: absolute;
  font-size: 3.5em;
  cursor: pointer;
  transition: left 1.35s linear, top 1.35s linear;
  filter: drop-shadow(3px 3px 5px rgba(0,0,0,0.28));
}

.crab-target:hover {
  transform: scale(1.12);
}

.crab-target:active {
  transform: scale(0.95);
}

.confetti-piece {
  position: fixed;
  top: -60px;
  z-index: 1200;
  pointer-events: none;
  animation: confettiFall 3.2s linear forwards;
}

@media (max-width: 620px) {
  .container {
    padding: 14px;
  }

  .card {
    padding: 22px 12px;
    border-radius: 22px;
  }

  .step-hero {
    font-size: 2.9em;
  }

  .instruction-text {
    font-size: 1.24em;
  }

  .sound-btn-main {
    font-size: 1.05em;
    padding: 13px 18px;
  }

  .option-btn {
    padding: 12px 16px;
    font-size: 1.15em;
    min-width: 72px;
  }

  .letter-btn {
    width: 50px;
    height: 50px;
    font-size: 1.55em;
  }

  .word-display {
    min-width: 175px;
    font-size: 1.8em;
    letter-spacing: 0.1em;
  }

  .quest-title {
    font-size: 1em;
  }

  .stats-panel {

<div class="container" id="container"></div>

<script>
var SeasideQuestApplication = {
  applicationSteps: [

    { stepType: 'listen', stepHero: '👧', instructionText: 'Послушай и выбери картинку', speechPhrase: 'Let\'s get some ice cream', correctAnswer: '🍦', optionsList: ['🍦', '🏖️', '🥤', '🌊', '👟'] },
    { stepType: 'choice', stepHero: '👦', instructionText: 'Что мы любим?', speechPhrase: 'I like ice cream', correctAnswer: '🍦', optionsList: ['🍦', '🥶', '📚'] },
    { stepType: 'spell', stepHero: '🐒', instructionText: 'Собери слово', speechPhrase: 'eat', targetWord: 'EAT' },
    { stepType: 'yesno', stepHero: '👩', instructionText: 'Do you like sand?', speechPhrase: 'I like sand', correctAnswer: 'yes' },
    { stepType: 'count', stepHero: '👧', instructionText: 'Сколько мороженых? 🍦🍦🍦', speechPhrase: 'I don\'t like cold water', optionsList: ['2', '3', '4'], correctAnswer: '3' },
    { stepType: 'match', stepHero: '👦', instructionText: 'Соедини слово и картинку', speechPhrase: 'drink', pairsList: [['eat', '🍦'], ['drink', '🥤'], ['play', '🤸']] },
    { stepType: 'order', stepHero: '🐒', instructionText: 'Расставь слова по порядку', speechPhrase: 'Let\'s get some ice cream', wordsList: ['Let\'s', 'get', 'some', 'ice', 'cream'], correctAnswer: 'Let\'s get some ice cream' },
    { stepType: 'pick', stepHero: '👩', instructionText: 'Что лишнее?', speechPhrase: 'I don\'t like cold water', optionsList: ['🍦', '🥤', '👟'], correctAnswer: '👟' },
    { stepType: 'build_sandcastle', stepHero: '👧', instructionText: 'Построй замок из песка', speechPhrase: 'I like sand', requiredLayers: 3 },
    { stepType: 'catch_crab', stepHero: '👦', instructionText: 'Поймай краба три раза', speechPhrase: 'play', requiredClicks: 3 },
    { stepType: 'listen', stepHero: '🐒', instructionText: 'Послушай и выбери картинку', speechPhrase: 'I like sand', correctAnswer: '🏖️', optionsList: ['🍦', '🏖️', '🥤', '🌊', '👟'] },
    { stepType: 'choice', stepHero: '👩', instructionText: 'Что мы пьём?', speechPhrase: 'drink', correctAnswer: '🥤', optionsList: ['🥤', '👟', '🌊'] },
    { stepType: 'spell', stepHero: '👧', instructionText: 'Собери слово', speechPhrase: 'sand', targetWord: 'SAND' },
    { stepType: 'yesno', stepHero: '👦', instructionText: 'Do you like the seaside?', speechPhrase: 'I like the seaside', correctAnswer: 'yes' },
    { stepType: 'count', stepHero: '🐒', instructionText: 'Сколько стаканов сока? 🧃🧃', speechPhrase: 'Let\'s get some juice', optionsList: ['1', '2', '3'], correctAnswer: '2' },
    { stepType: 'match', stepHero: '👩', instructionText: 'Соедини фразу и картинку', speechPhrase: 'I don\'t like cold water', pairsList: [['I don\'t like', '🙅'], ['Let\'s get', '🤲']] },
    { stepType: 'order', stepHero: '👧', instructionText: 'Расставь слова по порядку', speechPhrase: 'I don\'t like cold water', wordsList: ['I', 'don\'t', 'like', 'cold', 'water'], correctAnswer: 'I don\'t like cold water' },
    { stepType: 'pick', stepHero: '👦', instructionText: 'Выбери море', speechPhrase: 'seaside', optionsList: ['🌊', '🍦', '👟'], correctAnswer: '🌊' },
    { stepType: 'listen', stepHero: '🐒', instructionText: 'Послушай и выбери действие', speechPhrase: 'Play in the sand', correctAnswer: '🤸', optionsList: ['🤸', '🥶', '📚'] },
    { stepType: 'choice', stepHero: '👩', instructionText: 'Что мы возьмём?', speechPhrase: 'Let\'s get some water', correctAnswer: '💧', optionsList: ['💧', '👟', '🌂'] },
    { stepType: 'final' }
  ],

  currentStepIndex: 0,
  totalScore: 0,
  completedSteps: {},
  historyStack: [],
  activeIntervalId: null,
  currentAudioUtterance: null,

  containerElement: document.getElementById('container'),
  topBarElement: document.getElementById('topBar'),
  progressBarElement: document.getElementById('progressBar'),
  progressHeroElement: document.getElementById('progressHero'),
  statsTextElement: document.getElementById('statsText'),
  badgesRowElements: document.getElementById('badgesRow').children,

  initializeApplication: function() {
    this.renderCurrentStepCard();
  },

  getTaskCount: function() {
    var taskCount = 0;
    for (var stepIndex = 0; stepIndex < this.applicationSteps.length; stepIndex++) {
      var currentStepType = this.applicationSteps[stepIndex].stepType;
      if (currentStepType !== 'intro' && currentStepType !== 'final') {
        taskCount++;
      }
    }
    return taskCount;
  },

  speakPhrase: function(phraseToSpeak) {
    if (this.currentAudioUtterance) {
      speechSynthesis.cancel();
    }
    var speechUtterance = new SpeechSynthesisUtterance(phraseToSpeak);
    speechUtterance.lang = 'en-GB';
    speechUtterance.rate = 0.85;
    speechSynthesis.speak(speechUtterance);
    this.currentAudioUtterance = speechUtterance;
  },

  speakPhraseThenWellDone: function(phraseToSpeak) {
    if (this.currentAudioUtterance) {
      speechSynthesis.cancel();
    }
    var appInstance = this;
    var phraseUtterance = new SpeechSynthesisUtterance(phraseToSpeak);
    phraseUtterance.lang = 'en-GB';
    phraseUtterance.rate = 0.85;
    phraseUtterance.onend = function() {
      var wellDoneUtterance = new SpeechSynthesisUtterance('Well done!');
      wellDoneUtterance.lang = 'en-GB';
      wellDoneUtterance.rate = 0.85;
      speechSynthesis.speak(wellDoneUtterance);
      appInstance.currentAudioUtterance = wellDoneUtterance;
    };
    speechSynthesis.speak(phraseUtterance);
    this.currentAudioUtterance = phraseUtterance;
  },

  speakTryAgain: function() {
    if (this.currentAudioUtterance) {
      speechSynthesis.cancel();
    }
    var tryAgainUtterance = new SpeechSynthesisUtterance('Try again!');
    tryAgainUtterance.lang = 'en-GB';
    tryAgainUtterance.rate = 0.85;
    speechSynthesis.speak(tryAgainUtterance);
    this.currentAudioUtterance = tryAgainUtterance;
  },

  updateTopPanel: function() {
    var taskCount = this.getTaskCount();
    var completionPercent = 0;
    if (taskCount > 0) {
      completionPercent = Math.round((this.totalScore / taskCount) * 100);
    }
    this.progressBarElement.style.width = completionPercent + '%';
    this.progressHeroElement.style.left = 'calc(' + completionPercent + '% - 18px)';
    this.statsTextElement.innerText = this.totalScore + '/' + taskCount + ' • ' + completionPercent + '%';

    var badgeCount = Math.floor(this.totalScore / 3);
    for (var badgeIndex = 0; badgeIndex < this.badgesRowElements.length; badgeIndex++) {
      if (badgeIndex < badgeCount && !this.badgesRowElements[badgeIndex].classList.contains('earned')) {
        this.badgesRowElements[badgeIndex].classList.add('earned');
      }
    }
  },

  generateConfettiAnimation: function() {
    var confettiEmojis = ['🎉', '✨', '🌟', '🍦', '🏖️', '🧃', '☀️', '🦀', '⛵'];
    for (var confettiIndex = 0; confettiIndex < 45; confettiIndex++) {
      var confettiPiece = document.createElement('div');
      confettiPiece.className = 'confetti-piece';
      confettiPiece.innerText = confettiEmojis[Math.floor(Math.random() * confettiEmojis.length)];
      confettiPiece.style.left = Math.random() * 100 + 'vw';
      confettiPiece.style.fontSize = (1.35 + Math.random() * 2.2) + 'em';
      document.body.appendChild(confettiPiece);
      setTimeout(function(pieceToRemove) {
        return function() {
          if (pieceToRemove.parentNode) {
            pieceToRemove.parentNode.removeChild(pieceToRemove);
          }
        };
      }(confettiPiece), 5400);
    }
  },

  clearActiveInterval: function() {
    if (this.activeIntervalId) {
      clearInterval(this.activeIntervalId);
      this.activeIntervalId = null;
    }
  },

  goToNextStep: function() {
    if (this.currentStepIndex < this.applicationSteps.length - 1) {
      this.historyStack.push({ stepIndex: this.currentStepIndex, score: this.totalScore });
      this.currentStepIndex++;
      this.renderCurrentStepCard();
    }
  },

  goToPreviousStep: function() {
    if (this.historyStack.length > 0) {
      var previousState = this.historyStack.pop();
      this.currentStepIndex = previousState.stepIndex;
      this.totalScore = previousState.score;
      this.renderCurrentStepCard();
    }
  },

  retryCurrentStep: function() {
    this.renderCurrentStepCard();
  },

  renderCurrentStepCard: function() {
    var appInstance = this;
    appInstance.clearActiveInterval();

    if (appInstance.currentStepIndex >= appInstance.applicationSteps.length) {
      return;
    }

    var currentStepData = appInstance.applicationSteps[appInstance.currentStepIndex];
    appInstance.updateTopPanel();

    if (currentStepData.stepType === 'intro') {
      appInstance.topBarElement.style.display = 'none';
      appInstance.containerElement.innerHTML =
        '<div class="intro-screen">' +
        '<h1>🌊 Seaside Quest</h1>' +
        '<div class="heroes-row"><span>👦</span><span>👧</span><span>🐒</span></div>' +
        '<button class="btn-start" id="startBtn">Start</button>' +
        '</div>';

      document.getElementById('startBtn').onclick = function() {
        appInstance.historyStack.push({ stepIndex: appInstance.currentStepIndex, score: appInstance.totalScore });
        appInstance.currentStepIndex++;
        appInstance.topBarElement.style.display = 'flex';
        appInstance.renderCurrentStepCard();
      };
      return;
    }

    if (currentStepData.stepType === 'final') {
      appInstance.topBarElement.style.display = 'none';
      appInstance.generateConfettiAnimation();

      var finalWordsList = [
        { en: 'eat', ipa: '/iːt/', ru: 'есть' },
        { en: 'drink', ipa: '/drɪŋk/', ru: 'пить' },
        { en: 'ice cream', ipa: '/ˌaɪs ˈkriːm/', ru: 'мороженое' },
        { en: 'play', ipa: '/pleɪ/', ru: 'играть' },
        { en: 'sand', ipa: '/sænd/', ru: 'песок' },
        { en: 'seaside', ipa: '/ˈsiːsaɪd/', ru: 'морской берег' },
        { en: 'Let\'s get some ice cream', ipa: '/lets ɡet sʌm ˌaɪs ˈkriːm/', ru: 'Давай возьмём мороженое' },
        { en: 'I like sand', ipa: '/aɪ laɪk sænd/', ru: 'Я люблю песок' },
        { en: 'I don\'t like cold water', ipa: '/aɪ dəʊnt laɪk kəʊld ˈwɔːtə/', ru: 'Я не люблю холодную воду' }
      ];

      var wordListHtml = '';
      for (var wordIndex = 0; wordIndex < finalWordsList.length; wordIndex++) {
        wordListHtml +=
          '<div class="word-row-final">' +
          '<span><b>' + finalWordsList[wordIndex].en + '</b> ' + finalWordsList[wordIndex].ipa + ' — ' + finalWordsList[wordIndex].ru + '</span>' +
          '<button class="mini-sound-btn" data-word="' + finalWordsList[wordIndex].en + '">🔊</button>' +
          '</div>';
      }

      appInstance.containerElement.innerHTML =
        '<div class="final-screen">' +
        '<h1>Great Job!</h1>' +
        '<div class="reward-icon">🏖️</div>' +
        '<p class="final-summary">You found the beach words. You can say what you like and what you don\'t like. Let\'s get some ice cream!</p>' +
        '<button class="sound-btn-main" id="finalAudioBtn">Let\'s get some ice cream</button>' +
        '<div class="word-list-final">' + wordListHtml + '</div>' +
        '<p style="font-size:1.35em; font-weight:bold; position:relative; z-index:2;">Score: ' + appInstance.totalScore + '</p>' +
        '<div class="nav-btns">' +
        '<button class="nav-btn btn-back" id="finalBackBtn">⬅️ Back</button>' +
        '<button class="nav-btn btn-start" id="restartBtn" style="font-size:1.2em; padding:18px 32px;">🔄 Play Again</button>' +
        '</div>' +
        '</div>';

      document.getElementById('finalAudioBtn').onclick = function() {
        appInstance.speakPhrase('Let\'s get some ice cream');
      };

      document.getElementById('finalBackBtn').onclick = function() {
        appInstance.goToPreviousStep();
      };

      document.getElementById('restartBtn').onclick = function() {
        appInstance.currentStepIndex = 0;
        appInstance.totalScore = 0;
        appInstance.completedSteps = {};
        appInstance.historyStack = [];
        appInstance.renderCurrentStepCard();
      };

      var miniSoundButtons = document.querySelectorAll('.mini-sound-btn');
      for (var miniSoundIndex = 0; miniSoundIndex < miniSoundButtons.length; miniSoundIndex++) {
        (function(buttonElement) {
          buttonElement.onclick = function() {
            appInstance.speakPhrase(buttonElement.getAttribute('data-word'));
          };
        })(miniSoundButtons[miniSoundIndex]);
      }
      return;
    }

    var cardHtml =
      '<div class="step-hero">' + currentStepData.stepHero + '</div>' +
      '<div class="instruction-text">' + currentStepData.instructionText + '</div>' +
      '<button class="sound-btn-main" id="keyAudioBtn">' + currentStepData.speechPhrase + '</button>' +
      '<div class="game-zone" id="gameZone"></div>' +
      '<div class="feedback" id="feedback"></div>' +
      '<div class="nav-btns">' +
      '<button class="nav-btn btn-back" id="backBtn">⬅️ Back</button>' +
      '<button class="nav-btn btn-retry" id="retryBtn">🔄 Again</button>' +
      '<button class="nav-btn btn-next" id="nextBtn">➡️ Next</button>' +
      '</div>';

    appInstance.containerElement.innerHTML = '<div class="card">' + cardHtml + '</div>';

    var zoneElement = document.getElementById('gameZone');
    var feedbackElement = document.getElementById('feedback');
    var backButton = document.getElementById('backBtn');
    var retryButton = document.getElementById('retryBtn');
    var nextButton = document.getElementById('nextBtn');

    document.getElementById('keyAudioBtn').onclick = function() {
      appInstance.speakPhrase(currentStepData.speechPhrase);
    };

    backButton.onclick = function() {
      appInstance.goToPreviousStep();
    };

    retryButton.onclick = function() {
      appInstance.retryCurrentStep();
    };

    nextButton.onclick = function() {
      appInstance.goToNextStep();
    };

    if (appInstance.completedSteps[appInstance.currentStepIndex]) {
      nextButton.style.display = 'inline-flex';
    }

    var handleCorrectAnswer = function() {
      if (!appInstance.completedSteps[appInstance.currentStepIndex]) {
        appInstance.completedSteps[appInstance.currentStepIndex] = true;
        appInstance.totalScore++;
      }
      feedbackElement.innerText = '✅ Correct!';
      feedbackElement.className = 'feedback success';
      appInstance.speakPhraseThenWellDone(currentStepData.speechPhrase);
      nextButton.style.display = 'inline-flex';
      retryButton.style.display = 'none';
      appInstance.updateTopPanel();
    };

    var handleIncorrectAnswer = function(elementToShake) {
      feedbackElement.innerText = '❌ Try again!';
      feedbackElement.className = 'feedback error';
      appInstance.speakTryAgain();
      if (elementToShake) {
        elementToShake.classList.add('wrong');
      }
      retryButton.style.display = 'inline-flex';
      setTimeout(function() {
        feedbackElement.className = 'feedback';
        if (elementToShake) {
          elementToShake.classList.remove('wrong');
        }
      }, 650);
    };

    if (currentStepData.stepType === 'listen' || currentStepData.stepType === 'choice' || currentStepData.stepType === 'yesno' || currentStepData.stepType === 'count' || currentStepData.stepType === 'pick') {
      var optionsList = [];
      var correctAnswer = '';

      if (currentStepData.stepType === 'yesno') {
        optionsList = ['Yes', 'No'];
        correctAnswer = currentStepData.correctAnswer === 'yes' ? 'Yes' : 'No';
      } else {
        optionsList = currentStepData.optionsList || [];
        correctAnswer = currentStepData.correctAnswer;
      }

      optionsList.forEach(function(optionValue) {
        var optionButton = document.createElement('button');
        optionButton.className = 'option-btn';
        optionButton.innerText = optionValue;

        optionButton.onclick = function() {
          if (optionValue === correctAnswer) {
            optionButton.classList.add('correct');
            handleCorrectAnswer();
            var allOptionButtons = zoneElement.querySelectorAll('.option-btn');
            for (var optionIndex = 0; optionIndex < allOptionButtons.length; optionIndex++) {
              allOptionButtons[optionIndex].disabled = true;
            }
          } else {
            handleIncorrectAnswer(optionButton);
          }
        };

        zoneElement.appendChild(optionButton);
      });
    }

    if (currentStepData.stepType === 'spell') {
      var targetLetters = currentStepData.targetWord.split('');
      var shuffledLetters = targetLetters.slice().sort(function() {
        return 0.5 - Math.random();
      });
      var selectedLetters = [];

      var wordDisplay = document.createElement('div');
      wordDisplay.className = 'word-display';
      zoneElement.appendChild(wordDisplay);

      shuffledLetters.forEach(function(letterValue) {
        var letterButton = document.createElement('button');
        letterButton.className = 'letter-btn option-btn';
        letterButton.innerText = letterValue;

        letterButton.onclick = function() {
          if (letterButton.disabled) {
            return;
          }

          selectedLetters.push(letterValue);
          letterButton.disabled = true;
          letterButton.classList.add('selected');
          wordDisplay.innerText = selectedLetters.join('');

          if (selectedLetters.length === targetLetters.length) {
            if (selectedLetters.join('') === currentStepData.targetWord) {
              handleCorrectAnswer();
            } else {
              handleIncorrectAnswer(wordDisplay);
              setTimeout(function() {
                selectedLetters = [];
                wordDisplay.innerText = '';
                var letterButtons = zoneElement.querySelectorAll('.letter-btn');
                for (var letterIndex = 0; letterIndex < letterButtons.length; letterIndex++) {
                  letterButtons[letterIndex].disabled = false;
                  letterButtons[letterIndex].classList.remove('selected');
                }
              }, 700);
            }
          }
        };

        zoneElement.appendChild(letterButton);
      });
    }

    if (currentStepData.stepType === 'order') {
      var targetWords = currentStepData.wordsList.slice();
      var shuffledWords = targetWords.slice().sort(function() {
        return 0.5 - Math.random();
      });
      var selectedWords = [];

      var sentenceDisplay = document.createElement('div');
      sentenceDisplay.className = 'word-display';
      sentenceDisplay.style.fontSize = '1.75em';
      sentenceDisplay.style.letterSpacing = 'normal';
      zoneElement.appendChild(sentenceDisplay);

      shuffledWords.forEach(function(wordValue) {
        var wordButton = document.createElement('button');
        wordButton.className = 'option-btn';
        wordButton.innerText = wordValue;

        wordButton.onclick = function() {
          if (wordButton.disabled) {
            return;
          }

          selectedWords.push(wordValue);
          wordButton.disabled = true;
          sentenceDisplay.innerText = selectedWords.join(' ');

          if (selectedWords.length === targetWords.length) {
            if (selectedWords.join(' ') === currentStepData.correctAnswer) {
              handleCorrectAnswer();
            } else {
              handleIncorrectAnswer(sentenceDisplay);
              setTimeout(function() {
                selectedWords = [];
                sentenceDisplay.innerText = '';
                var wordButtons = zoneElement.querySelectorAll('.option-btn');
                for (var wordIndex = 0; wordIndex < wordButtons.length; wordIndex++) {
                  wordButtons[wordIndex].disabled = false;
                }
              }, 700);
            }
          }
        };

        zoneElement.appendChild(wordButton);
      });
    }

    if (currentStepData.stepType === 'match') {
      var matchPairs = currentStepData.pairsList;
      var leftColumn = document.createElement('div');
      var rightColumn = document.createElement('div');
      leftColumn.className = 'match-col';
      rightColumn.className = 'match-col';
      zoneElement.appendChild(leftColumn);
      zoneElement.appendChild(rightColumn);

      var selectedLeftButton = null;
      var matchedCount = 0;

      matchPairs.forEach(function(pairItem) {
        var leftButton = document.createElement('button');
        leftButton.className = 'option-btn';
        leftButton.style.width = '100%';
        leftButton.innerText = pairItem[0];

        leftButton.onclick = function() {
          if (leftButton.disabled) {
            return;
          }
          if (selectedLeftButton) {
            selectedLeftButton.classList.remove('selected');
          }
          selectedLeftButton = leftButton;
          leftButton.classList.add('selected');
        };

        leftColumn.appendChild(leftButton);
      });

      var rightPairs = matchPairs.slice().sort(function() {
        return 0.5 - Math.random();
      });

      rightPairs.forEach(function(pairItem) {
        var rightButton = document.createElement('button');
        rightButton.className = 'option-btn';
        rightButton.style.width = '100%';
        rightButton.innerText = pairItem[1];

        rightButton.onclick = function() {
          if (!selectedLeftButton || rightButton.disabled) {
            return;
          }

          var matchingPair = null;
          for (var pairIndex = 0; pairIndex < matchPairs.length; pairIndex++) {
            if (matchPairs[pairIndex][0] === selectedLeftButton.innerText) {
              matchingPair = matchPairs[pairIndex];
              break;
            }
          }

          if (matchingPair && matchingPair[1] === pairItem[1]) {
            selectedLeftButton.classList.add('correct');
            rightButton.classList.add('correct');
            selectedLeftButton.disabled = true;
            rightButton.disabled = true;
            selectedLeftButton = null;
            matchedCount++;

            if (matchedCount === matchPairs.length) {
              handleCorrectAnswer();
            }
          } else {
            handleIncorrectAnswer(rightButton);
          }
        };

        rightColumn.appendChild(rightButton);
      });
    }

    if (currentStepData.stepType === 'drag') {
      zoneElement.innerHTML = '<div class="drag-zone" id="dragZone"><div class="target-zone">🪣</div></div>';
      var dragZone = document.getElementById('dragZone');
      var targetZone = dragZone.querySelector('.target-zone');
      var dragItems = ['🍦', '👟', '🌊'];

      dragItems.forEach(function(dragItemValue, dragItemIndex) {
        var dragItem = document.createElement('div');
        dragItem.className = 'drag-item';
        dragItem.innerText = dragItemValue;
        dragItem.style.left = (12 + dragItemIndex * 30) + '%';
        dragItem.style.top = '16%';
        dragZone.appendChild(dragItem);

        var isDragging = false;
        var startX = 0;
        var startY = 0;
        var initialX = 0;
        var initialY = 0;
        var originalLeft = dragItem.style.left;
        var originalTop = dragItem.style.top;

        function dragStart(event) {
          isDragging = true;
          startX = event.touches ? event.touches[0].clientX : event.clientX;
          startY = event.touches ? event.touches[0].clientY : event.clientY;
          initialX = dragItem.offsetLeft;
          initialY = dragItem.offsetTop;
          document.addEventListener('mousemove', dragMove);
          document.addEventListener('touchmove', dragMove);
          document.addEventListener('mouseup', dragEnd);
          document.addEventListener('touchend', dragEnd);
        }

        function dragMove(event) {
          if (!isDragging) {
            return;
          }
          event.preventDefault();
          var clientX = event.touches ? event.touches[0].clientX : event.clientX;
          var clientY = event.touches ? event.touches[0].clientY : event.clientY;
          dragItem.style.left = (initialX + clientX - startX) + 'px';
          dragItem.style.top = (initialY + clientY - startY) + 'px';
        }

        function dragEnd() {
          if (!isDragging) {
            return;
          }
          isDragging = false;
          document.removeEventListener('mousemove', dragMove);
          document.removeEventListener('touchmove', dragMove);
          document.removeEventListener('mouseup', dragEnd);
          document.removeEventListener('touchend', dragEnd);

          var itemRect = dragItem.getBoundingClientRect();
          var targetRect = targetZone.getBoundingClientRect();
          var isOverTarget = !(itemRect.right < targetRect.left || itemRect.left > targetRect.right || itemRect.bottom < targetRect.top || itemRect.top > targetRect.bottom);

          if (dragItemValue === currentStepData.targetItem && isOverTarget) {
            handleCorrectAnswer();
            dragItem.style.pointerEvents = 'none';
          } else {
            handleIncorrectAnswer(dragItem);
            dragItem.style.left = originalLeft;
            dragItem.style.top = originalTop;
          }
        }

        dragItem.addEventListener('mousedown', dragStart);
        dragItem.addEventListener('touchstart', dragStart);
      });
    }

    if (currentStepData.stepType === 'build_sandcastle') {
      zoneElement.innerHTML =
        '<div class="sandcastle-zone">' +
        '<div class="castle-base" id="castleBase">🏰</div>' +
        '<button class="build-btn" id="buildBtn">Add sand 🏖️</button>' +
        '</div>';

      var castleBase = document.getElementById('castleBase');
      var buildButton = document.getElementById('buildBtn');
      var addedLayers = 0;

      buildButton.onclick = function() {
        addedLayers++;
        var newLayer = document.createElement('div');
        newLayer.className = 'sand-layer';
        newLayer.innerText = '🏖️';
        newLayer.style.bottom = (18 + addedLayers * 28) + 'px';
        castleBase.appendChild(newLayer);

        if (addedLayers >= currentStepData.requiredLayers) {
          buildButton.disabled = true;
          setTimeout(handleCorrectAnswer, 450);
        }
      };
    }

    if (currentStepData.stepType === 'catch_crab') {
      zoneElement.innerHTML = '<div class="crab-zone" id="crabZone"><div class="crab-target" id="crabTarget">🦀</div></div>';
      var crabZone = document.getElementById('crabZone');
      var crabTarget = document.getElementById('crabTarget');
      var crabClickCount = 0;

      function moveCrabTarget() {
        var maxLeft = crabZone.clientWidth - 70;
        var maxTop = crabZone.clientHeight - 70;
        crabTarget.style.left = Math.random() * maxLeft + 'px';
        crabTarget.style.top = Math.random() * maxTop + 'px';
      }

      moveCrabTarget();
      appInstance.activeIntervalId = setInterval(moveCrabTarget, 1400);

      crabTarget.onclick = function() {
        crabClickCount++;
        moveCrabTarget();

        if (crabClickCount >= currentStepData.requiredClicks) {
          appInstance.clearActiveInterval();
          crabTarget.style.pointerEvents = 'none';
          handleCorrectAnswer();
        }
      };
    }
  }
};

SeasideQuestApplication.initializeApplication();
</script>
</body>
</html>

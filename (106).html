<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"Comic Sans MS","Segoe UI",Verdana,sans-serif;
    background:#f8ead8;
    background-image:
      radial-gradient(rgba(139,94,52,.08) 1px, transparent 1.5px);
    background-size:28px 28px;
    color:#4a2c18;min-height:100vh;padding:18px 12px 60px;
  }
  .wrap{max-width:780px;margin:0 auto}

  /* ---------- РАМА АТЕЛЬЕ ---------- */
  .topbar{
    background:#fffdf5;border-radius:14px;padding:16px 16px 20px;
    border:8px solid #8a5a2b;box-shadow:inset 0 0 0 3px #c08850, 0 8px 20px rgba(90,50,20,.3);
    margin-bottom:24px;position:relative;
  }
  .topbar::before,.topbar::after{
    content:'';position:absolute;width:22px;height:22px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffd23e 0 30%,#8a5a2b 70%);
    box-shadow:inset -2px -2px 3px rgba(0,0,0,.3);
  }
  .topbar::before{top:-11px;left:-11px}
  .topbar::after{top:-11px;right:-11px}
  .topbar h1{
    font-size:clamp(1.05rem,4vw,1.45rem);color:#8a4a2a;text-align:center;line-height:1.35;
    font-family:Georgia,serif;font-style:italic;letter-spacing:.5px;
  }
  .topbar h1::before{content:'📷 ';}
  .bar-wrap{margin-top:16px}
  .bar-label{
    display:flex;justify-content:space-between;align-items:center;
    font-size:.78rem;color:#8a5a2b;margin-bottom:8px;font-weight:700;letter-spacing:1px;
    font-family:Georgia,serif;
  }
  /* лента с плёнкой */
  .bar-track{
    height:30px;background:#2a2018;border-radius:4px;overflow:visible;
    border:2px solid #000;position:relative;
    background-image:
      repeating-linear-gradient(90deg, transparent 0 10px, rgba(255,255,255,.12) 10px 11px),
      repeating-linear-gradient(0deg, transparent 0 4px, rgba(255,255,255,.08) 4px 5px);
  }
  .bar-track::before,.bar-track::after{
    content:'';position:absolute;left:0;right:0;height:6px;
    background-image:repeating-linear-gradient(90deg, #f8ead8 0 6px, transparent 6px 14px);
  }
  .bar-track::before{top:1px}
  .bar-track::after{bottom:1px}
  .bar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,#c08850,#8a5a2b);
    transition:width .5s cubic-bezier(.34,1.4,.64,1);
  }
  .bar-runner{
    position:absolute;top:-12px;left:0;font-size:1.5rem;
    transform:translateX(-50%);transition:left .5s cubic-bezier(.34,1.4,.64,1);
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.5));
  }
  .stars{margin-top:12px;text-align:center;font-size:1.05rem;letter-spacing:3px;color:#8a5a2b}

  /* ---------- КАДР ---------- */
  .stage{
    background:#fffdf5;border-radius:10px;padding:32px 20px 34px;position:relative;
    border:3px solid #8a5a2b;
    box-shadow:0 8px 18px rgba(90,50,20,.25);
    animation:pop .35s ease;
  }
  .stage::before{
    content:'';position:absolute;top:6px;left:6px;right:6px;bottom:6px;
    border:1px dashed rgba(138,90,43,.3);border-radius:6px;pointer-events:none;
  }
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .stage.shake{animation:shake .45s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-9px)}40%{transform:translateX(9px)}
    60%{transform:translateX(-6px)}80%{transform:translateX(6px)}
  }
  .step-tag{
    display:inline-block;background:#8a5a2b;color:#fffdf5;
    font-family:Georgia,serif;
    font-size:.76rem;font-weight:700;padding:5px 14px;border-radius:3px;
    letter-spacing:1.5px;margin-bottom:14px;
  }
  .mech-tag{
    display:inline-block;background:#fff3d8;color:#8a5a2b;
    font-size:.72rem;font-weight:700;padding:3px 11px;border-radius:999px;
    border:2px solid #c08850;margin-left:6px;margin-bottom:14px;letter-spacing:.3px;
  }
  .hero{font-size:3.1rem;text-align:center;display:block;margin:2px 0 12px;line-height:1.15}
  .stage h2{font-size:clamp(1.05rem,3.8vw,1.4rem);color:#8a4a2a;text-align:center;margin-bottom:14px;line-height:1.35;font-family:Georgia,serif;font-style:italic}

  .task-text{
    font-size:1rem;line-height:1.6;color:#5a3a20;text-align:center;margin:0 auto 22px;
    max-width:540px;
  }
  .en-inline{font-weight:700;color:#8a2a20}

  .speak-line{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0 22px}
  .speak-big{
    background:#8a5a2b;color:#fffdf5;border:none;border-radius:6px;
    padding:12px 22px;font-size:1rem;font-weight:700;cursor:pointer;
    font-family:inherit;box-shadow:0 4px 0 #5a3a1a;transition:.15s;
    display:inline-flex;align-items:center;gap:9px;letter-spacing:.4px;
  }
  .speak-big:hover{background:#a07038;transform:translateY(-2px)}
  .speak-big:active{transform:translateY(1px);box-shadow:0 2px 0 #5a3a1a}
  .speak-mini{
    width:36px;height:36px;border-radius:50%;border:2px solid #8a5a2b;
    background:#fff3d8;color:#8a5a2b;font-size:.95rem;cursor:pointer;
    box-shadow:0 3px 0 #5a3a1a;transition:.15s;
    display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .speak-mini:hover{transform:scale(1.1) rotate(-8deg);background:#ffe4b8}
  .speak-mini:active{transform:scale(.94)}

  .opts{display:flex;flex-direction:column;gap:12px;margin-top:8px}
  .opts.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .opt{
    background:#fffdf5;border:2px solid #c08850;border-left:8px solid #8a5a2b;border-radius:6px;
    padding:14px 15px;cursor:pointer;font-family:inherit;font-size:1.02rem;
    color:#4a2c18;text-align:left;display:flex;align-items:center;gap:10px;
    transition:.16s;font-weight:600;line-height:1.4;box-shadow:0 2px 0 rgba(138,90,43,.3);
  }
  .opt:hover{border-color:#8a5a2b;background:#fff3d8;transform:translateX(3px)}
  .opt .mark{
    flex:0 0 30px;height:30px;border-radius:4px;background:#8a5a2b;color:#ffd23e;
    font-family:Georgia,serif;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem;
  }
  .opt.correct{background:#eafff0;border-color:#5a8a40;border-left-color:#5a8a40;animation:bounce .45s}
  .opt.wrong{background:#ffe8e0;border-color:#c0392b;border-left-color:#c0392b;animation:shake .4s}
  @keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  .opt:disabled{cursor:default}

  .yesno-scene{
    background:#fff3d8;border:3px dashed #8a5a2b;border-radius:12px;
    padding:20px 14px;text-align:center;margin-bottom:20px;
  }
  .yesno-scene .big{font-size:2.6rem;letter-spacing:6px;display:block;margin-bottom:8px}
  .yesno-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .yesno-btn{
    flex:1 1 140px;max-width:220px;border-radius:10px;padding:14px 10px;
    font-family:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;transition:.15s;
    border:2.5px solid;letter-spacing:.5px;
  }
  .yesno-btn.yes{background:#eafff0;border-color:#5a8a40;color:#3a6a20;box-shadow:0 4px 0 #3a6a20}
  .yesno-btn.no{background:#ffe8e0;border-color:#c0392b;color:#8e2a1f;box-shadow:0 4px 0 #8e2a1f}
  .yesno-btn:hover{transform:translateY(-2px)}
  .yesno-btn.correct{animation:bounce .45s}
  .yesno-btn.wrong{animation:shake .4s}

  /* зеркало: я или Томми */
  .mirror-scene{
    background:#fff3d8;border:3px dashed #8a5a2b;border-radius:12px;
    padding:22px 14px;text-align:center;margin-bottom:20px;
  }
  .mirror-row{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:6px}
  .mirror-btn{
    width:118px;padding:14px 10px;border-radius:50%;background:#fffdf5;
    border:4px double #8a5a2b;cursor:pointer;transition:.15s;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    box-shadow:0 4px 0 rgba(138,90,43,.35);
  }
  .mirror-btn .em{font-size:2.4rem}
  .mirror-btn .lbl{font-size:.82rem;font-weight:700;color:#8a5a2b}
  .mirror-btn:hover{background:#ffe4b8;transform:translateY(-2px)}
  .mirror-btn.correct{background:#eafff0;border-color:#5a8a40;animation:bounce .45s}
  .mirror-btn.wrong{background:#ffe8e0;border-color:#c0392b;animation:shake .4s}

  /* собери лицо */
  .face-scene{
    background:#fff3d8;border:3px dashed #8a5a2b;border-radius:12px;
    padding:22px 14px;text-align:center;margin-bottom:20px;
  }
  .face-instruction{
    font-size:1.05rem;color:#5a3a20;font-weight:700;margin-bottom:16px;
    font-family:Georgia,serif;font-style:italic;
  }
  .face-canvas{
    display:inline-block;width:170px;height:200px;background:#fffdf5;
    border:3px solid #8a5a2b;border-radius:50% 50% 45% 45%/55% 55% 45% 45%;
    position:relative;margin-bottom:16px;box-shadow:inset 0 -10px 18px rgba(138,90,43,.15);
  }
  .face-canvas .placed{
    position:absolute;font-size:2.2rem;transition:.25s;
  }
  .face-pool{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .face-btn{
    width:62px;height:62px;border-radius:12px;border:2.5px solid #8a5a2b;
    background:#fffdf5;cursor:pointer;transition:.14s;font-size:2rem;
    box-shadow:0 3px 0 rgba(138,90,43,.4);
    display:flex;align-items:center;justify-content:center;
  }
  .face-btn:hover{transform:translateY(-3px);background:#ffe4b8}
  .face-btn.used{opacity:.3;pointer-events:none}
  .face-btn.wrong{animation:shake .4s;border-color:#c0392b;background:#ffe8e0}

  .countbox{
    background:#fff3d8;border:3px dashed #8a5a2b;border-radius:12px;
    padding:22px 14px;text-align:center;margin-bottom:20px;
  }
  .countbox .items{font-size:2.4rem;letter-spacing:9px;line-height:1.6;word-break:break-word}

  .match-area{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
  .mcol{display:flex;flex-direction:column;gap:12px}
  .mcol h4{text-align:center;font-size:.82rem;color:#8a5a2b;font-weight:700;margin-bottom:2px;letter-spacing:1px;font-family:Georgia,serif}
  .mitem{
    background:#fffdf5;border:2px solid #c08850;border-radius:8px;padding:12px 8px;
    cursor:pointer;font-family:inherit;font-size:1rem;font-weight:700;color:#4a2c18;
    text-align:center;transition:.16s;display:flex;align-items:center;justify-content:center;gap:7px;
    min-height:58px;box-shadow:0 2px 0 rgba(138,90,43,.25);
  }
  .mitem:hover{border-color:#8a5a2b;background:#ffe4b8}
  .mitem.sel{background:#ffe4b8;box-shadow:0 0 0 3px rgba(192,136,80,.4)}
  .mitem.done{background:#eafff0;border-color:#5a8a40;color:#3a6a20;cursor:default;opacity:.85}
  .mitem.bad{animation:shake .4s;border-color:#c0392b;background:#ffe8e0}
  .mitem .pic{font-size:1.6rem}

  .order-pool,.order-slots{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .order-slots{
    min-height:70px;background:#fff3d8;border:3px dashed #8a5a2b;border-radius:12px;
    padding:14px 10px;margin-bottom:20px;align-items:center;
  }
  .order-slots.empty-pool::after{content:'раскладывайте карточки ниже ⬇️';color:#8a7050;font-size:.88rem}
  .otile{
    background:#fffdf5;border:2px solid #8a5a2b;border-radius:8px;padding:10px 14px;
    cursor:pointer;font-family:inherit;font-size:.98rem;font-weight:700;color:#5a3a20;
    transition:.15s;display:flex;align-items:center;gap:7px;box-shadow:0 3px 0 rgba(138,90,43,.4);
  }
  .otile:hover{transform:translateY(-2px);background:#ffe4b8}
  .otile.placed{border-color:#5a8a40;background:#eafff0;color:#3a6a20;box-shadow:0 3px 0 #3a6a20}
  .otile.bad{animation:shake .4s;border-color:#c0392b;background:#ffe8e0}
  .otile.used{opacity:.3;pointer-events:none}
  .otile .num{font-size:1.4rem}

  .spell-slots{display:flex;gap:10px;justify-content:center;margin:8px 0 22px;flex-wrap:wrap}
  .slot{
    width:52px;height:60px;border-radius:8px;background:#fff3d8;
    border:3px dashed #8a5a2b;display:flex;align-items:center;justify-content:center;
    font-size:1.75rem;font-weight:700;color:#8a5a2b;text-transform:uppercase;
    font-family:Georgia,serif;
  }
  .slot.filled{border-style:solid;border-color:#5a8a40;background:#eafff0}
  .slot.bad{border-color:#c0392b;background:#ffe8e0;animation:shake .4s}
  .letter-pool{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .letter{
    width:54px;height:60px;border-radius:8px;border:3px solid #c08850;background:#fff3d8;
    font-family:Georgia,serif;font-size:1.7rem;font-weight:700;color:#8a5a2b;cursor:pointer;
    text-transform:uppercase;box-shadow:0 4px 0 #8a5a2b;transition:.14s;
  }
  .letter:hover{transform:translateY(-3px);background:#ffe4b8}
  .letter.used{opacity:.25;pointer-events:none;box-shadow:none;transform:none}

  .drag-zone{
    background:#fff3d8;border:3px dashed #8a5a2b;border-radius:12px;
    padding:22px 14px;text-align:center;margin-bottom:20px;min-height:130px;
  }
  .drag-item{
    display:inline-block;background:#fffdf5;border:2px solid #8a5a2b;border-radius:8px;
    padding:10px 16px;margin:6px;cursor:pointer;font-family:inherit;font-size:1.02rem;
    font-weight:700;color:#5a3a20;box-shadow:0 3px 0 rgba(138,90,43,.4);transition:.15s;
  }
  .drag-item:hover{transform:translateY(-3px);background:#ffe4b8}
  .drag-item.chosen{background:#eafff0;border-color:#5a8a40;color:#3a6a20;box-shadow:0 3px 0 #3a6a20}
  .drag-item.bad{animation:shake .4s;border-color:#c0392b;background:#ffe8e0}

  .fb{
    margin-top:22px;padding:16px 18px;border-radius:10px;font-size:1rem;
    line-height:1.6;text-align:center;display:none;font-weight:600;
  }
  .fb.show{display:block;animation:pop .3s}
  .fb.good{background:#eafff0;border:3px double #5a8a40;color:#3a6a20;transform:rotate(-.5deg)}
  .fb.bad{background:#ffe8e0;border:3px double #c0392b;color:#8e2a1f}
  .fb .again{
    margin-top:12px;background:#fffdf5;border:2px solid #c0392b;color:#8e2a1f;
    border-radius:6px;padding:7px 16px;font-family:inherit;font-weight:700;
    font-size:.9rem;cursor:pointer;
  }
  .fb .again:hover{background:#ffeaea}

  .nav{display:flex;gap:12px;justify-content:center;margin-top:28px;flex-wrap:wrap}
  .nav button{
    border:none;border-radius:6px;padding:13px 26px;font-family:inherit;
    font-size:1rem;font-weight:700;cursor:pointer;transition:.16s;
    display:inline-flex;align-items:center;gap:8px;letter-spacing:.3px;
  }
  .btn-next{background:#8a5a2b;color:#fffdf5;box-shadow:0 5px 0 #5a3a1a}
  .btn-next:hover{background:#a07038;transform:translateY(-2px)}
  .btn-back{background:#fffdf5;color:#8a5a2b;border:3px dashed #c08850 !important;box-shadow:0 5px 0 #c08850}
  .btn-back:hover{background:#fff3d8}
  .btn-back:disabled,.btn-next:disabled{opacity:.4;cursor:default;transform:none}
  .btn-replay{background:#c08850;color:#fffdf5;box-shadow:0 5px 0 #8a5a2b}
  .btn-replay:hover{background:#d09860}

  .final{text-align:center}
  .final .big{
    font-size:3.4rem;display:inline-block;margin-bottom:16px;
    background:#fffdf5;border-radius:50%;width:110px;height:110px;line-height:110px;
    border:5px double #8a5a2b;animation:float 2.4s ease-in-out infinite;
    box-shadow:0 8px 0 rgba(138,90,43,.4);
  }
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .final h2{font-size:clamp(1.25rem,4.5vw,1.8rem);color:#8a4a2a;margin-bottom:14px;font-family:Georgia,serif;font-style:italic}
  .final p{font-size:1.02rem;line-height:1.7;color:#5a3a20;margin-bottom:16px}
  .reward{
    background:#fff3d8;border:3px dashed #8a5a2b;border-radius:12px;
    padding:24px 20px 28px;margin:24px 0 28px;
  }
  .reward .words{font-size:1.02rem;line-height:2;color:#5a3a20;text-align:left;padding-bottom:4px}
  .reward .words b{color:#8a2a20}
  .reward .words div{padding:5px 0;border-bottom:1px dotted #c08850;margin-bottom:5px}
  .reward .words div:last-child{border-bottom:none;margin-bottom:0}
  .restart{background:#8a5a2b;color:#fffdf5;box-shadow:0 5px 0 #5a3a1a}
  .restart:hover{background:#a07038}

  .start-screen{text-align:center}
  .start-screen .cast{font-size:2.6rem;letter-spacing:6px;margin:16px 0 8px}
  .start-screen ul{
    list-style:none;text-align:left;margin:18px auto;max-width:440px;
    background:#fff3d8;border:3px dashed #8a5a2b;border-radius:12px;padding:18px 20px;
  }
  .start-screen li{
    padding:8px 0 8px 32px;position:relative;font-size:.97rem;color:#5a3a20;line-height:1.5;
    border-bottom:1px dotted #c08850;
  }
  .start-screen li:last-child{border-bottom:none}
  .start-screen li::before{content:'📷';position:absolute;left:0;top:8px;font-size:.95rem}
  .sound-note{
    background:#fffdf5;border:2px solid #c08850;border-radius:8px;padding:12px 16px;
    font-size:.88rem;color:#8a5a2b;margin-top:18px;line-height:1.55;
  }

  @media (max-width:560px){
    .match-area{grid-template-columns:1fr 1fr;gap:8px}
    .mitem{font-size:.88rem;min-height:52px;padding:9px 5px}
    .mitem .pic{font-size:1.3rem}
    .slot,.letter{width:44px;height:52px;font-size:1.4rem}
    .countbox .items{font-size:1.9rem;letter-spacing:5px}
    .hero{font-size:2.6rem}
    .nav button{padding:12px 18px;font-size:.95rem}
    .stage{padding:26px 14px 30px}
    .mirror-btn{width:96px;padding:10px 8px}
    .mirror-btn .em{font-size:1.9rem}
    .face-canvas{width:140px;height:168px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <h1>Портретное ателье Томми</h1>
    <div class="bar-wrap">
      <div class="bar-label">
        <span id="stepLabel">КАДР 0 ИЗ 16</span>
        <span id="pctLabel">0%</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="barFill"></div>
        <div class="bar-runner" id="barRunner">📷</div>
      </div>
      <div class="stars" id="stars"></div>
    </div>
  </div>

  <div id="stageHost"></div>

</div>

<script>
(function(){
  "use strict";

  var RATE = 0.85;
  var voices = [];

  function loadVoices(){
    if(!('speechSynthesis' in window)) return;
    voices = window.speechSynthesis.getVoices() || [];
  }
  loadVoices();
  if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = loadVoices;
    setTimeout(loadVoices, 350);
    setTimeout(loadVoices, 1400);
  }

  function pickVoice(){
    if(!voices.length) loadVoices();
    var v;
    v = voices.find(function(x){ return x.lang === 'en-GB'; });
    if(v) return v;
    v = voices.find(function(x){ return x.lang && x.lang.toLowerCase().indexOf('en-gb') === 0; });
    if(v) return v;
    v = voices.find(function(x){ return x.lang === 'en-US'; });
    if(v) return v;
    v = voices.find(function(x){ return x.lang && x.lang.toLowerCase().indexOf('en') === 0; });
    return v || null;
  }

  function speak(text, delay){
    if(!('speechSynthesis' in window)) return;
    var go = function(){
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      var v = pickVoice();
      if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'en-GB'; }
      u.rate = RATE; u.pitch = 1.06; u.volume = 1;
      window.speechSynthesis.speak(u);
    };
    if(delay){ setTimeout(go, delay); } else { go(); }
  }

  function speakSeq(arr){
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    arr.forEach(function(t, i){
      setTimeout(function(){
        var u = new SpeechSynthesisUtterance(t);
        var v = pickVoice();
        if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'en-GB'; }
        u.rate = RATE; u.pitch = 1.06;
        window.speechSynthesis.speak(u);
      }, i * 1500);
    });
  }

  var TOTAL = STEPS.length;
  var idx = 0;
  var history = [];
  var score = 0;
  var stageHost = document.getElementById('stageHost');
  var barFill = document.getElementById('barFill');
  var barRunner = document.getElementById('barRunner');
  var stepLabel = document.getElementById('stepLabel');
  var pctLabel = document.getElementById('pctLabel');
  var starsBox = document.getElementById('stars');

  function bold(str){
    return String(str).replace(/\*\*(.+?)\*\*/g, '<span class="en-inline">$1</span>');
  }

  function updateBar(){
    var pct = Math.round((idx / (TOTAL - 1)) * 100);
    if(pct < 0) pct = 0; if(pct > 100) pct = 100;
    barFill.style.width = pct + '%';
    barRunner.style.left = pct + '%';
    stepLabel.textContent = idx === 0 ? 'КАДР 0 ИЗ ' + (TOTAL - 1) : ('КАДР ' + idx + ' ИЗ ' + (TOTAL - 1));
    pctLabel.textContent = pct + '%';
    var full = Math.floor(score / 3);
    var s = '';
    for(var i = 0; i < full && i < 6; i++){ s += '📷'; }
    starsBox.textContent = s;
  }

  function shakeStage(){
    var st = stageHost.querySelector('.stage');
    if(!st) return;
    st.classList.remove('shake');
    void st.offsetWidth;
    st.classList.add('shake');
  }

  function speakerBtn(text, cls, title){
    var b = document.createElement('button');
    b.className = cls || 'speak-mini';
    b.innerHTML = '🔊';
    b.title = title || 'Прослушать';
    b.setAttribute('aria-label','Прослушать: ' + text);
    b.addEventListener('click', function(ev){ ev.stopPropagation(); speak(text); });
    return b;
  }

  function nextBtn(label, fn, cls){
    var b = document.createElement('button');
    b.className = cls || 'btn-next';
    b.textContent = label;
    b.addEventListener('click', fn);
    return b;
  }

  function goNext(){
    if(idx < TOTAL - 1){
      history.push(idx);
      idx++;
      render();
    }
  }
  function goBack(){
    if(history.length){
      idx = history.pop();
      render();
    }
  }

  function render(){
    window.scrollTo({top:0, behavior:'smooth'});
    updateBar();
    stageHost.innerHTML = '';
    var s = STEPS[idx];

    var stage = document.createElement('div');
    stage.className = 'stage';
    stageHost.appendChild(stage);

    if(s.kind === 'intro')   return renderIntro(stage, s);
    if(s.kind === 'final')   return renderFinal(stage, s);
    if(s.kind === 'choice')  return renderChoice(stage, s);
    if(s.kind === 'yesno')   return renderYesNo(stage, s);
    if(s.kind === 'mirror')  return renderMirror(stage, s);
    if(s.kind === 'face')    return renderFace(stage, s);
    if(s.kind === 'count')   return renderCount(stage, s);
    if(s.kind === 'spell')   return renderSpell(stage, s);
    if(s.kind === 'match')   return renderMatch(stage, s);
    if(s.kind === 'order')   return renderOrder(stage, s);
    if(s.kind === 'pick')    return renderPick(stage, s);
  }

  function header(stage, s){
    var tag = document.createElement('span');
    tag.className = 'step-tag';
    tag.textContent = 'КАДР ' + (idx + 1) + '/' + TOTAL;
    stage.appendChild(tag);

    if(s.mech){
      var m = document.createElement('span');
      m.className = 'mech-tag';
      m.textContent = s.mech;
      stage.appendChild(m);
    }
    var hero = document.createElement('span');
    hero.className = 'hero';
    hero.textContent = s.emoji || '📷';
    stage.appendChild(hero);

    var h2 = document.createElement('h2');
    h2.textContent = s.title;
    stage.appendChild(h2);

    var p = document.createElement('div');
    p.className = 'task-text';
    p.innerHTML = bold(s.text);
    stage.appendChild(p);
  }

  function speakBlock(stage, s){
    if(!s.say) return;
    var line = document.createElement('div');
    line.className = 'speak-line';
    var big = document.createElement('button');
    big.className = 'speak-big';
    big.innerHTML = '🔊 ' + s.say;
    big.addEventListener('click', function(){ speak(s.say); });
    line.appendChild(big);
    stage.appendChild(line);
    if(s.sayRu){
      var r = document.createElement('div');
      r.className = 'task-text';
      r.style.marginTop = '-8px';
      r.style.fontSize = '.92rem';
      r.textContent = s.sayRu;
      stage.appendChild(r);
    }
  }

  function feedback(stage, s, onWin){
    var fb = document.createElement('div');
    fb.className = 'fb';
    stage.appendChild(fb);

    var nav = document.createElement('div');
    nav.className = 'nav';

    var back = nextBtn('⬅️ Назад', goBack, 'btn-back');
    if(!history.length) back.disabled = true;
    nav.appendChild(back);

    var replay = nextBtn('🔁 Переснять', function(){ render(); }, 'btn-replay');
    nav.appendChild(replay);

    var next = nextBtn('Следующий кадр ➡️', goNext);
    next.style.display = 'none';
    nav.appendChild(next);

    stage.appendChild(nav);

    function showGood(){
      fb.className = 'fb good show';
      fb.innerHTML = bold(s.ok || 'Кадр в точку!');
      next.style.display = '';
      speak('Well done!', 250);
      if(onWin) onWin();
    }
    function showBad(){
      fb.className = 'fb bad show';
      fb.innerHTML = bold(s.no || 'Переснимем кадр!') +
        '<br><button class="again" type="button">🔁 Попробовать снова</button>';
      var ag = fb.querySelector('.again');
      ag.addEventListener('click', function(){ render(); });
      shakeStage();
      speak('Try again!', 200);
    }
    return {good:showGood, bad:showBad, next:next, back:back};
  }

  function renderIntro(stage, s){
    header(stage, s);
    speakBlock(stage, s);

    var cast = document.createElement('div');
    cast.className = 'start-screen';
    cast.innerHTML = '<div class="cast">📷 🐢 👀 👃 👄 👂</div>';
    stage.appendChild(cast);

    var list = document.createElement('ul');
    ['Называть части лица: eyes, ears, nose, mouth, face',
     'Говорить о себе: I\'ve got two eyes',
     'Говорить о Томми: Tommy\'s got a mouth',
     'Собирать лица из частей на портрете',
     'Снять шестнадцать кадров для альбома'
    ].forEach(function(t){
      var li = document.createElement('li');
      li.textContent = t;
      list.appendChild(li);
    });
    stage.appendChild(list);

    var note = document.createElement('div');
    note.className = 'sound-note';
    note.innerHTML = '🔈 Включите звук. Все фразы озвучены британским голосом. В задании «Зеркало» — два круглых «зеркала» на выбор: «Я» и «Томми».';
    stage.appendChild(note);

    var nav = document.createElement('div');
    nav.className = 'nav';
    nav.appendChild(nextBtn(s.cta || 'Начать ➡️', goNext));
    stage.appendChild(nav);

    speak(s.say, 500);
  }

  function renderMirror(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score++; updateBar(); });
    speakBlock(stage, s);

    var scene = document.createElement('div');
    scene.className = 'mirror-scene';
    var label = document.createElement('div');
    label.style.color = '#5a3a20';
    label.style.fontWeight = '700';
    label.style.marginBottom = '10px';
    label.textContent = 'Кто это говорит?';
    scene.appendChild(label);

    var row = document.createElement('div');
    row.className = 'mirror-row';
    scene.appendChild(row);
    stage.insertBefore(scene, stage.querySelector('.nav'));

    var locked = false;
    [['me','🙋','Я'], ['tommy','🐢','Томми']].forEach(function(pair){
      var val = pair[0];
      var b = document.createElement('button');
      b.className = 'mirror-btn';
      b.type = 'button';
      var em = document.createElement('span');
      em.className = 'em';
      em.textContent = pair[1];
      var lbl = document.createElement('span');
      lbl.className = 'lbl';
      lbl.textContent = pair[2];
      b.appendChild(em); b.appendChild(lbl);

      b.addEventListener('click', function(){
        if(locked) return;
        speak(val === 'me' ? 'me' : 'Tommy');
        if(val === s.answer){
          locked = true;
          b.classList.add('correct');
          setTimeout(fb.good, 600);
        } else {
          b.classList.add('wrong');
          setTimeout(function(){ b.classList.remove('wrong'); }, 600);
          fb.bad();
        }
      });
      row.appendChild(b);
    });
  }

  function renderFace(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score += 2; updateBar(); });
    speakBlock(stage, s);

    var scene = document.createElement('div');
    scene.className = 'face-scene';

    var inst = document.createElement('div');
    inst.className = 'face-instruction';
    inst.textContent = s.instruction;
    scene.appendChild(inst);

    var canvas = document.createElement('div');
    canvas.className = 'face-canvas';
    scene.appendChild(canvas);

    var pool = document.createElement('div');
    pool.className = 'face-pool';
    scene.appendChild(pool);

    stage.insertBefore(scene, stage.querySelector('.nav'));

    var spots = {
      eyes:  {top:'30%', left:'50%', transform:'translateX(-50%)'},
      ears:  {top:'42%', left:'50%', transform:'translateX(-50%)'},
      nose:  {top:'52%', left:'50%', transform:'translateX(-50%)'},
      mouth: {top:'68%', left:'50%', transform:'translateX(-50%)'}
    };
    // уши по бокам
    var earOffset = [
      {top:'42%', left:'14%'},
      {top:'42%', left:'82%'}
    ];

    var placed = 0;
    var placedParts = [];

    // перемешать части
    var shuffled = s.parts.slice();
    shuffled.sort(function(){ return Math.random() - 0.5; });

    shuffled.forEach(function(part){
      var b = document.createElement('button');
      b.className = 'face-btn';
      b.type = 'button';
      b.textContent = part.emoji;
      b.addEventListener('click', function(){
        if(b.classList.contains('used')) return;
        speak(part.spot);
        // проверка: эта часть ещё не размещена?
        var notPlaced = placedParts.indexOf(part.spot) === -1;
        if(notPlaced){
          b.classList.add('used');
          placedParts.push(part.spot);
          if(part.spot === 'ears'){
            earOffset.forEach(function(pos){
              var el = document.createElement('span');
              el.className = 'placed';
              el.textContent = part.emoji;
              el.style.top = pos.top;
              el.style.left = pos.left;
              el.style.transform = 'translateX(-50%)';
              canvas.appendChild(el);
            });
          } else {
            var el = document.createElement('span');
            el.className = 'placed';
            el.textContent = part.emoji;
            var sp = spots[part.spot];
            el.style.top = sp.top;
            el.style.left = sp.left;
            el.style.transform = sp.transform;
            canvas.appendChild(el);
          }
          placed++;
          var targetCount = s.parts.length + 1; // ears = 2 визуальных
          if(placed >= s.parts.length){
            setTimeout(function(){ speak(s.say); }, 300);
            setTimeout(fb.good, 1000);
          }
        } else {
          b.classList.add('wrong');
          setTimeout(function(){ b.classList.remove('wrong'); }, 600);
          fb.bad();
        }
      });
      pool.appendChild(b);
    });
  }

  function renderChoice(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score++; updateBar(); });
    speakBlock(stage, s);

    var box = document.createElement('div');
    box.className = 'opts' + (s.opts.length > 3 ? ' grid2' : '');
    var navEl = stage.querySelector('.nav');
    stage.insertBefore(box, navEl);

    var locked = false;
    s.opts.forEach(function(o, i){
      var b = document.createElement('button');
      b.className = 'opt';
      b.type = 'button';
      var mk = document.createElement('span');
      mk.className = 'mark';
      mk.textContent = String.fromCharCode(65 + i);
      b.appendChild(mk);
      var tx = document.createElement('span');
      tx.innerHTML = bold(o.t);
      b.appendChild(tx);
      b.appendChild(speakerBtn(o.say || o.t.replace(/\/.*?\//g,'').replace(/—.*$/,'').trim(), 'speak-mini'));

      b.addEventListener('click', function(){
        if(locked) return;
        if(i === s.correct){
          locked = true;
          b.classList.add('correct');
          Array.prototype.forEach.call(box.children, function(x){ x.disabled = true; });
          speak(o.say || o.t, 120);
          setTimeout(fb.good, 650);
        } else {
          b.classList.add('wrong');
          setTimeout(function(){ b.classList.remove('wrong'); }, 600);
          fb.bad();
        }
      });
      box.appendChild(b);
    });
  }

  function renderYesNo(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score++; updateBar(); });

    var box = document.createElement('div');
    box.className = 'yesno-scene';
    var big = document.createElement('span');
    big.className = 'big';
    big.textContent = s.scene || '❓';

        if(val === s.answer){
          locked = true;

  function renderCount(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score++; updateBar(); });
    var navEl = stage.querySelector('.nav');

    var cb = document.createElement('div');
    cb.className = 'countbox';
    var q = document.createElement('div');
    q.className = 'task-text';
    q.style.marginBottom = '12px';

    var it = document.createElement('div');

    cb.appendChild(it);

          speak(o.say, 120);

          setTimeout(function(){ b.classList.remove('wrong'); }, 600);

  function renderSpell(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score++; updateBar(); });
    var navEl = stage.querySelector('.nav');

    var hintLine = document.createElement('div');
    hintLine.className = 'speak-line';
    var hb = document.createElement('button');
    hb.className = 'speak-big';
    hb.innerHTML = s.hint + ' 🔊 Прослушать слово';
    hb.addEventListener('click', function(){ speak(s.word); });
    hintLine.appendChild(hb);
    stage.insertBefore(hintLine, navEl);
    speak(s.word, 600);

    var slots = document.createElement('div');
    slots.className = 'spell-slots';
    var slotEls = [];
    for(var i = 0; i < s.word.length; i++){
      var sl = document.createElement('div');
      sl.className = 'slot';
      slots.appendChild(sl);
      slotEls.push(sl);
    }
    stage.insertBefore(slots, navEl);

    var letters = s.word.split('');
    var extra = 'abcdefghijklmnopqrstuvwxyz'.split('');
    var pool = letters.slice();
    var need = Math.max(0, 6 - pool.length);
    for(var k = 0; k < need; k++){
      pool.push(extra[Math.floor(Math.random() * extra.length)]);
    }
    pool.sort(function(){ return Math.random() - 0.5; });

    var poolBox = document.createElement('div');
    poolBox.className = 'letter-pool';
    stage.insertBefore(poolBox, navEl);

    var pos = 0;
    var done = false;

    pool.forEach(function(ch){
      var b = document.createElement('button');
      b.className = 'letter'; b.type = 'button';
      b.textContent = ch;
      b.addEventListener('click', function(){
        if(done) return;
        if(ch === s.word[pos]){
          slotEls[pos].textContent = ch;
          slotEls[pos].classList.add('filled');
          b.classList.add('used');
          pos++;
          speak(ch, 0);
          if(pos === s.word.length){
            done = true;
            speak(s.word, 500);
            setTimeout(fb.good, 1200);
          }
        } else {
          slotEls[pos].classList.add('bad');
          b.classList.add('bad');
          (function(el, bt){
            setTimeout(function(){ el.classList.remove('bad'); bt.classList.remove('bad'); }, 500);
          })(slotEls[pos], b);
          fb.bad();
        }
      });
      poolBox.appendChild(b);
    });
  }

  function renderMatch(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score += 2; updateBar(); });
    var navEl = stage.querySelector('.nav');

    speakBlock(stage, s);

    var area = document.createElement('div');
    area.className = 'match-area';
    stage.insertBefore(area, navEl);

    var leftCol = document.createElement('div');
    leftCol.className = 'mcol';
    leftCol.innerHTML = '<h4>КАРТИНКА</h4>';
    var rightCol = document.createElement('div');
    rightCol.className = 'mcol';
    rightCol.innerHTML = '<h4>СЛОВО</h4>';
    area.appendChild(leftCol);
    area.appendChild(rightCol);

    var pairs = s.pairs.slice();
    var lefts  = pairs.map(function(p,i){ return {p:p, i:i}; });
    var rights = pairs.map(function(p,i){ return {p:p, i:i}; });
    rights.sort(function(){ return Math.random() - 0.5; });

    var selected = null;
    var matched = 0;
    var busy = false;

    lefts.forEach(function(o){
      var b = document.createElement('button');
      b.className = 'mitem'; b.type = 'button';
      var pic = document.createElement('span');
      pic.className = 'pic';
      pic.textContent = o.p.left;
      b.appendChild(pic);
      b.appendChild(speakerBtn(o.p.say, 'speak-mini'));
      b.addEventListener('click', function(){
        if(busy || b.classList.contains('done') || b.classList.contains('sel')) return;
        if(selected && selected.side === 'left'){ selected.el.classList.remove('sel'); }
        selected = {side:'left', el:b, i:o.i};
        b.classList.add('sel');
        speak(o.p.say);
      });
      leftCol.appendChild(b);
      o.el = b;
    });

    rights.forEach(function(o){
      var b = document.createElement('button');
      b.className = 'mitem'; b.type = 'button';
      b.textContent = o.p.right;
      b.appendChild(speakerBtn(o.p.say, 'speak-mini'));
      b.addEventListener('click', function(){
        if(busy || b.classList.contains('done')) return;
        speak(o.p.say);
        if(selected && selected.side === 'left'){
          busy = true;
          if(selected.i === o.i){
            selected.el.classList.remove('sel');
            selected.el.classList.add('done');
            b.classList.add('done');
            selected = null;
            matched++;
            speak('Yes!', 250);
            busy = false;
            if(matched === pairs.length){ setTimeout(fb.good, 900); }
          } else {
            selected.el.classList.add('bad');
            b.classList.add('bad');
            var a1 = selected.el, a2 = b;
            setTimeout(function(){
              a1.classList.remove('bad','sel');
              a2.classList.remove('bad');
              selected = null; busy = false;
            }, 650);
            fb.bad();
            shakeStage();
          }
        } else {
          if(selected && selected.side === 'right'){ selected.el.classList.remove('sel'); }
          selected = {side:'right', el:b, i:o.i};
          b.classList.add('sel');
        }
      });
      rightCol.appendChild(b);
      o.el = b;
    });
  }

  function renderOrder(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score += 2; updateBar(); });
    var navEl = stage.querySelector('.nav');

    speakBlock(stage, s);

    var slots = document.createElement('div');
    slots.className = 'order-slots empty-pool';
    stage.insertBefore(slots, navEl);

    var pool = s.items.map(function(it, i){ return {it:it, i:i}; });
    var shuffled = pool.slice();
    shuffled.sort(function(){ return Math.random() - 0.5; });

    var poolBox = document.createElement('div');
    poolBox.className = 'order-pool';
    stage.insertBefore(poolBox, navEl);

    var placed = [];
    var busy = false;
    var correctOrder = pool.map(function(o){ return o.i; });

    shuffled.forEach(function(o){
      var b = document.createElement('button');
      b.className = 'otile'; b.type = 'button';
      var n = document.createElement('span');
      n.className = 'num';
      n.textContent = o.it.n || '';
      b.appendChild(n);
      var t = document.createElement('span');
      t.innerHTML = bold(o.it.t);
      b.appendChild(t);
      b.appendChild(speakerBtn(o.it.say, 'speak-mini'));

      b.addEventListener('click', function(){
        if(busy || b.classList.contains('used')) return;
        speak(o.it.say);
        var expect = correctOrder[placed.length];
        if(o.i === expect){
          b.classList.add('used');
          var clone = document.createElement('button');
          clone.className = 'otile placed';
          clone.type = 'button';
          clone.innerHTML = '<span class="num">' + (o.it.n || '') + '</span><span>' + o.it.t + '</span>';
          slots.appendChild(clone);
          slots.classList.remove('empty-pool');
          placed.push(o.i);
          if(placed.length === pool.length){
            busy = true;
            speakSeq(s.items.map(function(x){ return x.say; }));
            setTimeout(fb.good, 1200);
          }
        } else {
          b.classList.add('bad');
          setTimeout(function(){ b.classList.remove('bad'); }, 550);
          fb.bad();
          shakeStage();
        }
      });
      poolBox.appendChild(b);
    });
  }

  function renderPick(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score += 2; updateBar(); });
    var navEl = stage.querySelector('.nav');

    speakBlock(stage, s);

    var zone = document.createElement('div');
    zone.className = 'drag-zone';
    stage.insertBefore(zone, navEl);

    var chosenCount = 0;
    var correctCount = s.pool.filter(function(p){ return p.good; }).length;
    var busy = false;

    s.pool.forEach(function(item){
      var el = document.createElement('button');
      el.className = 'drag-item';
      el.type = 'button';
      el.innerHTML = bold(item.t);
      el.appendChild(speakerBtn(item.say, 'speak-mini'));

      el.addEventListener('click', function(){
        if(busy || el.classList.contains('chosen')) return;
        speak(item.say);
        if(item.good){
          el.classList.add('chosen');
          chosenCount++;
          if(chosenCount === correctCount){
            busy = true;
            setTimeout(fb.good, 800);
          }
        } else {
          el.classList.add('bad');
          setTimeout(function(){ el.classList.remove('bad'); }, 600);
          fb.bad();
          shakeStage();
        }
      });
      zone.appendChild(el);
    });
  }

  function renderFinal(stage, s){
    stage.innerHTML = '';
    var box = document.createElement('div');
    box.className = 'final';
    stage.appendChild(box);

    var big = document.createElement('span');
    big.className = 'big';
    big.textContent = '📷';
    box.appendChild(big);

    var h = document.createElement('h2');
    h.textContent = s.title;
    box.appendChild(h);

    var p = document.createElement('p');
    p.textContent = s.text;
    box.appendChild(p);

    var line = document.createElement('div');
    line.className = 'speak-line';
    var big2 = document.createElement('button');
    big2.className = 'speak-big';
    big2.innerHTML = '🔊 ' + s.say;
    big2.addEventListener('click', function(){ speakSeq(['Album ready!', 'Well done, photographer!']); });
    line.appendChild(big2);
    box.appendChild(line);

    var rw = document.createElement('div');
    rw.className = 'reward';
    var rt = document.createElement('div');
    rt.style.fontWeight = '700';
    rt.style.marginBottom = '12px';
    rt.style.color = '#8a5a2b';
    rt.textContent = '📷 Содержание альбома — весь словарь:';
    rw.appendChild(rt);

    var wl = document.createElement('div');
    wl.className = 'words';
    s.allWords.forEach(function(w){
      var row = document.createElement('div');
      row.style.display = 'flex';
      row.style.alignItems = 'center';
      row.style.gap = '8px';
      var tx = document.createElement('span');
      tx.innerHTML = '<b>' + w.en + '</b> ' + w.ipa + ' — ' + w.ru;
      tx.style.flex = '1';
      row.appendChild(tx);
      row.appendChild(speakerBtn(w.en, 'speak-mini'));
      wl.appendChild(row);
    });
    rw.appendChild(wl);
    box.appendChild(rw);

    var st = document.createElement('p');
    st.innerHTML = '📷 Кадров снято: <b>' + score + '</b><br>Ателье можно открыть ещё раз: Томми всегда ждёт новых моделей.';
    box.appendChild(st);

    var nav = document.createElement('div');
    nav.className = 'nav';
    var back = nextBtn('⬅️ Назад', goBack, 'btn-back');
    if(!history.length) back.disabled = true;
    nav.appendChild(back);
    nav.appendChild(nextBtn('🔁 Новая фотосессия', function(){
      idx = 0; history = []; score = 0; render();
    }, 'restart'));
    box.appendChild(nav);

    speakSeq(['Album ready!', 'Well done, photographer!']);
  }

  render();

  if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = function(){ loadVoices(); };
  }
  document.addEventListener('click', function once(){
    loadVoices();
    document.removeEventListener('click', once);
  });

})();

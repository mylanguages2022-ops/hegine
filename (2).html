<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Treasure Map Quest</title>
<meta name="description" content="Финальный квест: повторение модуля 3.">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; min-height: 100vh; font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", sans-serif; color: #3e2723; background: linear-gradient(to bottom, #fff9c4 0%, #ffe082 50%, #d7ccc8 100%); background-attachment: fixed; overflow-x: hidden; touch-action: manipulation; }
body { display: flex; flex-direction: column; }
.scene-background { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.scene-compass { position: absolute; top: 5%; right: 7%; font-size: 5.8em; animation: compassSpin 8s linear infinite; filter: drop-shadow(0 8px 18px rgba(0,0,0,0.15)); }
.scene-palm { position: absolute; bottom: 28%; font-size: 5.5em; filter: drop-shadow(4px 4px 0 rgba(0,0,0,0.18)); transform-origin: bottom center; }
.scene-palm:nth-child(2) { left: 3%; animation: palmSway 5s ease-in-out infinite alternate; }
.scene-palm:nth-child(3) { right: 5%; bottom: 30%; font-size: 5em; animation: palmSway 6s ease-in-out infinite alternate-reverse; }
.scene-wave { position: absolute; bottom: 22%; left: 0; width: 200%; height: 35px; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 20"><path d="M0,10 Q25,0 50,10 T100,10 L100,20 L0,20 Z" fill="%2329b6f6"/></svg>') repeat-x; background-size: 105px 35px; animation: waveRoll 7s linear infinite; opacity: 0.75; }
.scene-wave-second { bottom: 20%; animation-duration: 10s; opacity: 0.5; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 20"><path d="M0,10 Q25,20 50,10 T100,10 L100,20 L0,20 Z" fill="%230288d1"/></svg>') repeat-x; background-size: 125px 35px; }
.scene-sand { position: absolute; bottom: 0; left: 0; width: 100%; height: 20%; background: linear-gradient(to bottom, #ffe082, #d7ccc8); border-top: 6px solid #8d6e63; }
.top-bar { width: 100%; background: #8d6e63; color: #fff3e0; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 14px; position: sticky; top: 0; z-index: 100; box-shadow: 0 6px 18px rgba(0,0,0,0.18); border-bottom: 6px solid #5d4037; min-height: 70px; }
.quest-title { font-size: 1.25em; font-weight: bold; text-shadow: 2px 2px 0 #3e2723; white-space: nowrap; }
.progress-wrap { flex: 1; height: 26px; background: #5d4037; border-radius: 14px; overflow: hidden; position: relative; border: 3px solid #3e2723; box-shadow: inset 0 3px 8px rgba(0,0,0,0.22); }
.progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #ffca28, #ff9800); transition: width 0.65s cubic-bezier(0.4, 0, 0.2, 1); position: relative; }
.progress-bar::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent); animation: shineSweep 1.8s linear infinite; }
.progress-hero { position: absolute; top: 50%; left: 0; font-size: 1.95em; transform: translateY(-50%); transition: left 0.65s cubic-bezier(0.4, 0, 0.2, 1); z-index: 10; filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.22)); animation: heroFloat 1s infinite alternate; }
.stats-panel { text-align: right; min-width: 105px; font-weight: bold; font-size: 0.96em; color: #fff3e0; }
.badges-row { display: flex; gap: 4px; justify-content: flex-end; margin-top: 3px; }
.badge-icon { opacity: 0.3; filter: grayscale(1); transition: all 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275); font-size: 1.18em; }
.badge-icon.earned { opacity: 1; filter: grayscale(0); transform: scale(1.22); animation: starBurst 0.65s ease; }
.container { width: 100%; max-width: 700px; margin: 0 auto; padding: 24px; flex: 1; display: flex; align-items: center; justify-content: center; position: relative; z-index: 10; }
.card { width: 100%; background: #fffde7; border: 6px solid #ffca28; border-radius: 28px; box-shadow: 0 18px 40px rgba(0,0,0,0.16), 0 8px 15px rgba(0,0,0,0.08); padding: 28px 20px; animation: cardEnter 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden; display: grid; grid-template-columns: 110px 1fr; grid-template-areas: "hero instruction" "sound sound" "game game" "feedback feedback" "nav nav"; gap: 14px; }
.card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 16px; background: repeating-linear-gradient(90deg, #ffca28 0px, #ffca28 22px, #ffe082 22px, #ffe082 44px); }
.card.exit { animation: cardExit 0.35s ease-in forwards; }
.step-hero { grid-area: hero; width: 92px; height: 92px; display: flex; align-items: center; justify-content: center; font-size: 3.2em; background: #fff3e0; border: 4px solid #ff9800; border-radius: 24px; box-shadow: 0 8px 18px rgba(0,0,0,0.12); animation: heroWave 2.5s ease-in-out infinite; }
.instruction-text { grid-area: instruction; align-self: center; font-size: 1.55em; font-weight: bold; line-height: 1.35; color: #4e342e; }
.sound-btn-main { grid-area: sound; justify-self: start; background: #66bb6a; color: white; border: none; padding: 14px 26px; border-radius: 40px; font-size: 1.15em; font-weight: bold; cursor: pointer; box-shadow: 0 7px 0 #388e3c; margin-bottom: 4px; font-family: inherit; transition: transform 0.12s, box-shadow 0.12s; display: inline-flex; align-items: center; gap: 10px; max-width: 100%; }
.sound-btn-main:hover { transform: translateY(-3px); box-shadow: 0 10px 0 #388e3c; }
.sound-btn-main:active { transform: translateY(7px); box-shadow: none; }
.sound-btn-main:focus { outline: 4px solid #e65100; outline-offset: 3px; }
.sound-btn-main:disabled { opacity: 0.55; cursor: default; transform: none; box-shadow: none; }
.sound-btn-main::before { content: "🔊"; font-size: 1.15em; }
.game-zone { grid-area: game; min-height: 250px; background: #fff8e1; border: 4px dashed #ffca28; border-radius: 24px; padding: 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 15px; position: relative; box-shadow: inset 0 0 25px rgba(255,202,40,0.12); }
.option-btn { background: #fff3e0; color: #4e342e; border: 4px solid #ff9800; border-radius: 18px; padding: 14px 24px; font-size: 1.35em; font-weight: bold; cursor: pointer; box-shadow: 0 6px 0 #e65100; transition: transform 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.18s, background 0.22s; font-family: inherit; min-width: 88px; position: relative; overflow: hidden; }
.option-btn:hover { transform: translateY(-4px) scale(1.05); background: #ffe0b2; box-shadow: 0 10px 0 #e65100, 0 15px 25px rgba(0,0,0,0.12); }
.option-btn:active { transform: translateY(6px); box-shadow: none; }
.option-btn:focus { outline: 4px solid #e65100; outline-offset: 3px; }
.option-btn:disabled { cursor: default; opacity: 0.62; transform: none; box-shadow: none; }
.option-btn.correct { background: #c8e6c9; border-color: #43a047; color: #1b5e20; box-shadow: 0 6px 0 #2e7d32; animation: correctPop 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.option-btn.wrong { background: #ffcdd2; border-color: #e53935; color: #b71c1c; box-shadow: 0 6px 0 #c62828; animation: wrongShake 0.55s cubic-bezier(.36,.07,.19,.97) both; }
.option-btn.selected { background: #fff59d; outline: 4px solid #fbc02d; }
.letter-btn { width: 58px; height: 58px; font-size: 1.85em; display: inline-flex; align-items: center; justify-content: center; border-radius: 15px; background: #fff9c4; border-color: #fbc02d; box-shadow: 0 6px 0 #f57f17; color: #f57f17; text-transform: uppercase; }
.letter-btn.selected { background: #fbc02d; color: #4e342e; transform: translateY(6px); box-shadow: none; }
.word-display { min-width: 225px; min-height: 66px; background: white; border-radius: 15px; border-bottom: 6px solid #ffca28; display: inline-flex; align-items: center; justify-content: center; font-size: 2.2em; font-weight: bold; letter-spacing: 0.16em; padding: 8px 18px; margin-bottom: 16px; text-transform: uppercase; color: #4e342e; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
.match-col { display: flex; flex-direction: column; gap: 14px; flex: 1; min-width: 185px; }
.feedback { grid-area: feedback; min-height: 48px; font-size: 1.55em; font-weight: bold; margin: 4px 0 8px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.feedback.success { color: #2e7d32; animation: feedbackSlide 0.45s ease; }
.feedback.error { color: #c62828; animation: feedbackShake 0.45s ease; }
.nav-btns { grid-area: nav; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 14px; margin-top: 4px; }
.nav-btn { border: none; border-radius: 40px; padding: 13px 26px; font-size: 1.15em; font-weight: bold; cursor: pointer; color: white; font-family: inherit; box-shadow: 0 6px 0 rgba(0,0,0,0.22); transition: transform 0.12s, box-shadow 0.12s; display: inline-flex; align-items: center; gap: 8px; }
.nav-btn:hover { transform: translateY(-3px); box-shadow: 0 9px 0 rgba(0,0,0,0.22); }
.nav-btn:active { transform: translateY(6px); box-shadow: 0 0 0 rgba(0,0,0,0.22); }
.nav-btn:focus { outline: 4px solid #4e342e; outline-offset: 3px; }
.nav-btn:disabled { opacity: 0.45; cursor: default; transform: none; box-shadow: none; }
.btn-back { background: #8d6e63; }
.btn-retry { background: #ff9800; display: none; }
.btn-next { background: #66bb6a; display: none; }
.btn-start { background: #e53935; color: white; border: none; padding: 22px 46px; border-radius: 50px; font-size: 1.8em; font-weight: bold; cursor: pointer; box-shadow: 0 10px 0 #b71c1c, 0 20px 40px rgba(229,57,53,0.25); animation: pulseStart 2.2s infinite; font-family: inherit; letter-spacing: 0.06em; text-transform: uppercase; }
.btn-start:hover { transform: translateY(-4px); box-shadow: 0 14px 0 #b71c1c, 0 25px 50px rgba(229,57,53,0.35); }
.btn-start:active { transform: translateY(10px); box-shadow: 0 0 0 #b71c1c; }
.btn-start:focus { outline: 5px solid #ffca28; outline-offset: 4px; }
.intro-screen { text-align: center; color: #4e342e; padding: 28px; z-index: 20; position: relative; }
.intro-screen h1 { font-size: 3.2em; color: #e65100; text-shadow: 4px 4px 0 rgba(255,255,255,0.85), 0 0 25px rgba(255,152,0,0.25); animation: titleFloat 3.5s ease-in-out infinite; margin-bottom: 18px; line-height: 1.18; }
.heroes-row { font-size: 5em; display: flex; justify-content: center; gap: 22px; margin: 34px 0; filter: drop-shadow(5px 5px 0 rgba(0,0,0,0.12)); }
.heroes-row span { display: inline-block; animation: heroWave 2.2s ease-in-out infinite; }
.heroes-row span:nth-child(2) { animation-delay: 0.28s; }
.heroes-row span:nth-child(3) { animation-delay: 0.56s; }
.final-screen { background: #fffde7; border: 9px solid #ffca28; border-radius: 32px; padding: 30px 18px; text-align: center; box-shadow: 0 0 65px rgba(255,202,40,0.35), 0 22px 50px rgba(0,0,0,0.18); position: relative; overflow: hidden; max-width: 100%; }
.final-screen::before { content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(circle at center, rgba(255,255,255,0.75) 0%, transparent 75%); pointer-events: none; }
.final-screen h1 { color: #e65100; font-size: 2.7em; margin-bottom: 14px; text-shadow: 3px 3px 0 #ffe0b2; position: relative; z-index: 2; }
.final-summary { font-size: 1.28em; font-weight: bold; color: #4e342e; max-width: 530px; margin: 0 auto 18px; line-height: 1.45; position: relative; z-index: 2; }
.reward-icon { font-size: 6.2em; display: inline-block; margin: 18px 0; animation: rotateReward 5.5s linear infinite; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.15)); position: relative; z-index: 2; }
.word-list-final { text-align: left; background: #fff3e0; border: 3px solid #ffca28; border-radius: 18px; padding: 18px; margin: 24px 0; max-height: 350px; overflow-y: auto; box-shadow: inset 0 3px 10px rgba(0,0,0,0.05); position: relative; z-index: 2; }
.word-row-final { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 2px dashed #ffe082; font-size: 1.08em; }
.word-row-final:last-child { border-bottom: none; }
.mini-sound-btn { width: 42px; height: 42px; border: none; border-radius: 50%; background: #66bb6a; color: white; font-size: 1.05em; cursor: pointer; box-shadow: 0 4px 0 #388e3c; flex: 0 0 auto; transition: transform 0.12s, box-shadow 0.12s; display: inline-flex; align-items: center; justify-content: center; }
.mini-sound-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #388e3c; }
.mini-sound-btn:active { transform: translateY(4px); box-shadow: none; }
.mini-sound-btn:focus { outline: 3px solid #2e7d32; outline-offset: 2px; }
.mini-sound-btn:disabled { opacity: 0.55; cursor: default; transform: none; box-shadow: none; }
.treasure-zone { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.treasure-chest { font-size: 5.5em; position: relative; animation: chestWiggle 2s ease-in-out infinite; }
.treasure-items { min-height: 48px; font-size: 2.2em; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.gem-btn { width: 82px; height: 82px; border: 4px solid #ffca28; border-radius: 20px; background: #fff3e0; font-size: 2.2em; cursor: pointer; box-shadow: 0 6px 0 #f57f17; transition: transform 0.16s, box-shadow 0.16s, background 0.2s; display: inline-flex; align-items: center; justify-content: center; }
.gem-btn:hover { transform: translateY(-4px) scale(1.05); background: #ffe0b2; }
.gem-btn:active { transform: translateY(6px); box-shadow: none; }
.gem-btn:disabled { opacity: 0.55; cursor: default; transform: none; box-shadow: none; }
.confetti-piece { position: fixed; top: -60px; z-index: 1200; pointer-events: none; animation: confettiFall 3.2s linear forwards; }
@media (max-width: 620px) {
  .card { grid-template-columns: 1fr; grid-template-areas: "hero" "instruction" "sound" "game" "feedback" "nav"; padding: 22px 14px; }
  .step-hero { margin: 0 auto; width: 78px; height: 78px; font-size: 2.7em; }
  .instruction-text { text-align: center; font-size: 1.28em; }
  .sound-btn-main { justify-self: center; font-size: 1.02em; padding: 13px 18px; }
  .option-btn { padding: 12px 16px; font-size: 1.15em; min-width: 72px; }
  .letter-btn { width: 50px; height: 50px; font-size: 1.55em; }
  .word-display { min-width: 175px; font-size: 1.8em; letter-spacing: 0.1em; }
  .quest-title { font-size: 1em; }
  .stats-panel { min-width: 82px; font-size: 0.78em; }
  .progress-hero { font-size: 1.45em; }
  .intro-screen h1 { font-size: 2.3em; }
  .heroes-row { font-size: 3.6em; gap: 14px; }
  .btn-start { font-size: 1.45em; padding: 17px 30px; }
  .final-screen h1 { font-size: 2em; }
  .final-summary { font-size: 1.1em; }
  .reward-icon { font-size: 4.8em; }
  .treasure-chest { font-size: 4.4em; }
  .gem-btn { width: 68px; height: 68px; font-size: 1.9em; }
}
@media (min-width: 621px) {
  .container { max-width: 780px; }
  .card { padding: 36px 28px; }
  .instruction-text { font-size: 1.68em; }
  .game-zone { min-height: 285px; gap: 22px; }
  .option-btn { font-size: 1.48em; padding: 17px 30px; }
  .intro-screen h1 { font-size: 3.65em; }
  .heroes-row { font-size: 5.8em; }
  .final-screen { padding: 40px 28px; }
  .final-summary { font-size: 1.4em; }
}
@keyframes compassSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes palmSway { 0% { transform: rotate(-3deg); } 100% { transform: rotate(3deg); } }
@keyframes waveRoll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@keyframes shineSweep { from { transform: translateX(-120%); } to { transform: translateX(120%); } }
@keyframes heroFloat { 0% { transform: translateY(-52%) rotate(-2deg); } 100% { transform: translateY(-48%) rotate(2deg); } }
@keyframes starBurst { 0% { transform: scale(0.4) rotate(-30deg); opacity: 0; } 60% { transform: scale(1.45) rotate(8deg); opacity: 1; } 100% { transform: scale(1.22) rotate(0deg); opacity: 1; } }
@keyframes cardEnter { from { opacity: 0; transform: translateY(40px) scale(0.93); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes cardExit { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(-35px) scale(0.93); } }
@keyframes correctPop { 0% { transform: scale(1); } 45% { transform: scale(1.14); } 100% { transform: scale(1); } }
@keyframes wrongShake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-6px, 0, 0); } 40%, 60% { transform: translate3d(6px, 0, 0); } }
@keyframes feedbackSlide { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes feedbackShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
@keyframes pulseStart { 0%, 100% { box-shadow: 0 10px 0 #b71c1c, 0 20px 40px rgba(229,57,53,0.25); } 50% { box-shadow: 0 10px 0 #b71c1c, 0 20px 65px rgba(229,57,53,0.5); } }
@keyframes titleFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
@keyframes heroWave { 0%, 100% { transform: translateY(0) rotate(0deg); } 30% { transform: translateY(-10px) rotate(-5deg); } 70% { transform: translateY(-5px) rotate(5deg); } }
@keyframes rotateReward { from { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.12); } to { transform: rotate(360deg) scale(1); } }
@keyframes chestWiggle { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(3deg); } }
@keyframes confettiFall { 0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(760deg); opacity: 0; } }
</style>
</head>

<div class="container" id="container"></div>

<script>
var TreasureMapQuestApplication = {
  applicationSteps: [
    { stepType: 'intro' },
    { stepType: 'listen', stepHero: '👧', instructionText: 'Listen and choose', speechPhrase: 'I like ice cream', correctAnswer: '🍦', optionsList: ['🍦', '🍕', '🧀', '🍎', '🍌'] },

    { stepType: 'match', stepHero: '👦', instructionText: 'Match', speechPhrase: 'I like', pairsList: [['I like', '😊'], ['I love', '❤️'], ['I don\'t like', '🙅']] },

    { stepType: 'listen', stepHero: '👦', instructionText: 'Listen and choose', speechPhrase: 'Where\'s the cat?', correctAnswer: '🐱', optionsList: ['🐱', '🦢', '🐟', '🐥', '👟'] },

    { stepType: 'count', stepHero: '👦', instructionText: 'How many swans? 🦢🦢🦢', speechPhrase: 'three swans', optionsList: ['2', '3', '4'], correctAnswer: '3' },
    { stepType: 'match', stepHero: '🐒', instructionText: 'Match', speechPhrase: 'swim', pairsList: [['fly', '🕊️'], ['swim', '🏊'], ['run', '🏃']] },
    { stepType: 'order', stepHero: '👩', instructionText: 'Put the words in order', speechPhrase: 'Look at the swans', wordsList: ['Look', 'at', 'the', 'swans'], correctAnswer: 'Look at the swans' },
    { stepType: 'pick', stepHero: '👧', instructionText: 'Choose the drink', speechPhrase: 'juice', optionsList: ['🧃', '🍦', '🍕'], correctAnswer: '🧃' },
    { stepType: 'listen', stepHero: '👦', instructionText: 'Listen and choose', speechPhrase: 'I don\'t like eggs', correctAnswer: '🥚', optionsList: ['🥚', '🍎', '🍌', '🍫', '🧀'] },
    { stepType: 'choice', stepHero: '🐒', instructionText: 'What can the fish do?', speechPhrase: 'swim', correctAnswer: '🏊', optionsList: ['🏊', '🕊️', '🏃'] },
    { stepType: 'final' }
  ],

  currentStepIndex: 0,
  totalScore: 0,
  completedSteps: {},
  historyStack: [],
  currentAudioUtterance: null,

  containerElement: document.getElementById('container'),
  topBarElement: document.getElementById('topBar'),
  progressBarElement: document.getElementById('progressBar'),
  progressHeroElement: document.getElementById('progressHero'),
  statsTextElement: document.getElementById('statsText'),
  badgesRowElements: document.getElementById('badgesRow').children,

  initializeApplication: function() {
    this.renderCurrentStepCard();
  },

  getTaskCount: function() {
    var taskCount = 0;
    for (var stepIndex = 0; stepIndex < this.applicationSteps.length; stepIndex++) {
      var currentStepType = this.applicationSteps[stepIndex].stepType;
      if (currentStepType !== 'intro' && currentStepType !== 'final') {
        taskCount++;
      }
    }
    return taskCount;
  },

  speakPhrase: function(phraseToSpeak) {
    if (this.currentAudioUtterance) {
      speechSynthesis.cancel();
    }
    var speechUtterance = new SpeechSynthesisUtterance(phraseToSpeak);
    speechUtterance.lang = 'en-GB';
    speechUtterance.rate = 0.85;
    speechSynthesis.speak(speechUtterance);
    this.currentAudioUtterance = speechUtterance;
  },

  speakPhraseThenWellDone: function(phraseToSpeak) {
    if (this.currentAudioUtterance) {
      speechSynthesis.cancel();
    }
    var appInstance = this;
    var phraseUtterance = new SpeechSynthesisUtterance(phraseToSpeak);
    phraseUtterance.lang = 'en-GB';
    phraseUtterance.rate = 0.85;
    phraseUtterance.onend = function() {
      var wellDoneUtterance = new SpeechSynthesisUtterance('Well done!');
      wellDoneUtterance.lang = 'en-GB';
      wellDoneUtterance.rate = 0.85;
      speechSynthesis.speak(wellDoneUtterance);
      appInstance.currentAudioUtterance = wellDoneUtterance;
    };
    speechSynthesis.speak(phraseUtterance);
    this.currentAudioUtterance = phraseUtterance;
  },

  speakTryAgain: function() {
    if (this.currentAudioUtterance) {
      speechSynthesis.cancel();
    }
    var tryAgainUtterance = new SpeechSynthesisUtterance('Try again!');
    tryAgainUtterance.lang = 'en-GB';
    tryAgainUtterance.rate = 0.85;
    speechSynthesis.speak(tryAgainUtterance);
    this.currentAudioUtterance = tryAgainUtterance;
  },

  updateTopPanel: function() {
    var taskCount = this.getTaskCount();
    var completionPercent = 0;
    if (taskCount > 0) {
      completionPercent = Math.round((this.totalScore / taskCount) * 100);
    }
    this.progressBarElement.style.width = completionPercent + '%';
    this.progressHeroElement.style.left = 'calc(' + completionPercent + '% - 18px)';
    this.statsTextElement.innerText = this.totalScore + '/' + taskCount + ' • ' + completionPercent + '%';

    var badgeCount = Math.floor(this.totalScore / 3);
    for (var badgeIndex = 0; badgeIndex < this.badgesRowElements.length; badgeIndex++) {
      if (badgeIndex < badgeCount && !this.badgesRowElements[badgeIndex].classList.contains('earned')) {
        this.badgesRowElements[badgeIndex].classList.add('earned');
      }
    }
  },

  generateConfettiAnimation: function() {
    var confettiEmojis = ['🎉', '✨', '💎', '🗺️', '⛵', '🏆', '🌟'];
    for (var confettiIndex = 0; confettiIndex < 45; confettiIndex++) {
      var confettiPiece = document.createElement('div');
      confettiPiece.className = 'confetti-piece';
      confettiPiece.innerText = confettiEmojis[Math.floor(Math.random() * confettiEmojis.length)];
      confettiPiece.style.left = Math.random() * 100 + 'vw';
      confettiPiece.style.fontSize = (1.35 + Math.random() * 2.2) + 'em';
      document.body.appendChild(confettiPiece);
      setTimeout(function(pieceToRemove) {
        return function() {
          if (pieceToRemove.parentNode) {
            pieceToRemove.parentNode.removeChild(pieceToRemove);
          }
        };
      }(confettiPiece), 5400);
    }
  },

  goToNextStep: function() {
    if (this.currentStepIndex < this.applicationSteps.length - 1) {
      this.historyStack.push({ stepIndex: this.currentStepIndex, score: this.totalScore });
      this.currentStepIndex++;
      this.renderCurrentStepCard();
    }
  },

  goToPreviousStep: function() {
    if (this.historyStack.length > 0) {
      var previousState = this.historyStack.pop();
      this.currentStepIndex = previousState.stepIndex;
      this.totalScore = previousState.score;
      this.renderCurrentStepCard();
    }
  },

  retryCurrentStep: function() {
    this.renderCurrentStepCard();
  },

  renderCurrentStepCard: function() {
    var appInstance = this;

    if (appInstance.currentStepIndex >= appInstance.applicationSteps.length) {
      return;
    }

    var currentStepData = appInstance.applicationSteps[appInstance.currentStepIndex];
    appInstance.updateTopPanel();

    if (currentStepData.stepType === 'intro') {
      appInstance.topBarElement.style.display = 'none';
      appInstance.containerElement.innerHTML =
        '<div class="intro-screen">' +
        '<h1>🗺️ Treasure Map</h1>' +
        '<div class="heroes-row"><span>👦</span><span>👧</span><span>🐒</span></div>' +
        '<button class="btn-start" id="startBtn">Start</button>' +
        '</div>';

      document.getElementById('startBtn').onclick = function() {
        appInstance.historyStack.push({ stepIndex: appInstance.currentStepIndex, score: appInstance.totalScore });
        appInstance.currentStepIndex++;
        appInstance.topBarElement.style.display = 'flex';
        appInstance.renderCurrentStepCard();
      };
      return;
    }

    if (currentStepData.stepType === 'final') {
      appInstance.topBarElement.style.display = 'none';
      appInstance.generateConfettiAnimation();

      var finalWordsList = [
        { en: 'pizza', ipa: '/ˈpiːtsə/', ru: 'пицца' },
        { en: 'ice cream', ipa: '/ˌaɪs ˈkriːm/', ru: 'мороженое' },
        { en: 'cheese', ipa: '/tʃiːz/', ru: 'сыр' },
        { en: 'apples', ipa: '/ˈæpəlz/', ru: 'яблоки' },
        { en: 'bananas', ipa: '/bəˈnɑːnəz/', ru: 'бананы' },
        { en: 'chocolate', ipa: '/ˈtʃɒklət/', ru: 'шоколад' },
        { en: 'swan', ipa: '/swɒn/', ru: 'лебедь' },
        { en: 'duckling', ipa: '/ˈdʌklɪŋ/', ru: 'утёнок' },
        { en: 'fish', ipa: '/fɪʃ/', ru: 'рыба' },
        { en: 'eat', ipa: '/iːt/', ru: 'есть' },
        { en: 'drink', ipa: '/drɪŋk/', ru: 'пить' },
        { en: 'play', ipa: '/pleɪ/', ru: 'играть' },
        { en: 'fly', ipa: '/flaɪ/', ru: 'летать' },
        { en: 'swim', ipa: '/swɪm/', ru: 'плавать' },
        { en: 'I like', ipa: '/aɪ laɪk/', ru: 'я люблю' },
        { en: 'I love', ipa: '/aɪ lʌv/', ru: 'я обожаю' },
        { en: 'I don\'t like', ipa: '/aɪ dəʊnt laɪk/', ru: 'я не люблю' },
        { en: 'I\'ve got', ipa: '/aɪv ɡɒt/', ru: 'у меня есть' },
        { en: 'Can you...?', ipa: '/kæn juː/', ru: 'ты умеешь...?' },
        { en: 'Where\'s...?', ipa: '/weəz/', ru: 'где...?' }
      ];

      var wordListHtml = '';
      for (var wordIndex = 0; wordIndex < finalWordsList.length; wordIndex++) {
        wordListHtml +=
          '<div class="word-row-final">' +
          '<span><b>' + finalWordsList[wordIndex].en + '</b> ' + finalWordsList[wordIndex].ipa + ' — ' + finalWordsList[wordIndex].ru + '</span>' +
          '<button class="mini-sound-btn" data-word="' + finalWordsList[wordIndex].en + '">🔊</button>' +
          '</div>';
      }

      appInstance.containerElement.innerHTML =
        '<div class="final-screen">' +
        '<h1>You Found the Treasure!</h1>' +
        '<div class="reward-icon">🏆</div>' +
        '<p class="final-summary">You remembered all the words. You can talk about food, animals, and what you can do. Now you know so much!</p>' +
        '<button class="sound-btn-main" id="finalAudioBtn">I know so much!</button>' +
        '<div class="word-list-final">' + wordListHtml + '</div>' +
        '<p style="font-size:1.35em; font-weight:bold; position:relative; z-index:2;">Score: ' + appInstance.totalScore + '</p>' +
        '<div class="nav-btns">' +
        '<button class="nav-btn btn-back" id="finalBackBtn">⬅️ Back</button>' +
        '<button class="nav-btn btn-start" id="restartBtn" style="font-size:1.2em; padding:18px 32px;">🔄 Play Again</button>' +
        '</div>' +
        '</div>';

      document.getElementById('finalAudioBtn').onclick = function() {
        appInstance.speakPhrase('I know so much!');
      };

      document.getElementById('finalBackBtn').onclick = function() {
        appInstance.goToPreviousStep();
      };

      document.getElementById('restartBtn').onclick = function() {
        appInstance.currentStepIndex = 0;
        appInstance.totalScore = 0;
        appInstance.completedSteps = {};
        appInstance.historyStack = [];
        appInstance.renderCurrentStepCard();
      };

      var miniSoundButtons = document.querySelectorAll('.mini-sound-btn');
      for (var miniSoundIndex = 0; miniSoundIndex < miniSoundButtons.length; miniSoundIndex++) {
        (function(buttonElement) {
          buttonElement.onclick = function() {
            appInstance.speakPhrase(buttonElement.getAttribute('data-word'));
          };
        })(miniSoundButtons[miniSoundIndex]);
      }
      return;
    }

    var cardHtml =
      '<div class="step-hero">' + currentStepData.stepHero + '</div>' +
      '<div class="instruction-text">' + currentStepData.instructionText + '</div>' +
      '<button class="sound-btn-main" id="keyAudioBtn">' + currentStepData.speechPhrase + '</button>' +
      '<div class="game-zone" id="gameZone"></div>' +
      '<div class="feedback" id="feedback"></div>' +
      '<div class="nav-btns">' +
      '<button class="nav-btn btn-back" id="backBtn">⬅️ Back</button>' +
      '<button class="nav-btn btn-retry" id="retryBtn">🔄 Again</button>' +
      '<button class="nav-btn btn-next" id="nextBtn">➡️ Next</button>' +
      '</div>';

    appInstance.containerElement.innerHTML = '<div class="card">' + cardHtml + '</div>';

    var zoneElement = document.getElementById('gameZone');
    var feedbackElement = document.getElementById('feedback');
    var backButton = document.getElementById('backBtn');
    var retryButton = document.getElementById('retryBtn');
    var nextButton = document.getElementById('nextBtn');

    document.getElementById('keyAudioBtn').onclick = function() {
      appInstance.speakPhrase(currentStepData.speechPhrase);
    };

    backButton.onclick = function() {
      appInstance.goToPreviousStep();
    };

    retryButton.onclick = function() {
      appInstance.retryCurrentStep();
    };

    nextButton.onclick = function() {
      appInstance.goToNextStep();
    };

    if (appInstance.completedSteps[appInstance.currentStepIndex]) {
      nextButton.style.display = 'inline-flex';
    }

    var handleCorrectAnswer = function() {
      if (!appInstance.completedSteps[appInstance.currentStepIndex]) {
        appInstance.completedSteps[appInstance.currentStepIndex] = true;
        appInstance.totalScore++;
      }
      feedbackElement.innerText = '✅ Correct!';
      feedbackElement.className = 'feedback success';
      appInstance.speakPhraseThenWellDone(currentStepData.speechPhrase);
      nextButton.style.display = 'inline-flex';
      retryButton.style.display = 'none';
      appInstance.updateTopPanel();
    };

    var handleIncorrectAnswer = function(elementToShake) {
      feedbackElement.innerText = '❌ Try again!';
      feedbackElement.className = 'feedback error';
      appInstance.speakTryAgain();
      if (elementToShake) {
        elementToShake.classList.add('wrong');
      }
      retryButton.style.display = 'inline-flex';
      setTimeout(function() {
        feedbackElement.className = 'feedback';
        if (elementToShake) {
          elementToShake.classList.remove('wrong');
        }
      }, 650);
    };

    if (currentStepData.stepType === 'listen' || currentStepData.stepType === 'choice' || currentStepData.stepType === 'yesno' || currentStepData.stepType === 'count' || currentStepData.stepType === 'pick') {
      var optionsList = [];
      var correctAnswer = '';

      if (currentStepData.stepType === 'yesno') {
        optionsList = ['Yes', 'No'];
        correctAnswer = currentStepData.correctAnswer === 'yes' ? 'Yes' : 'No';
      } else {
        optionsList = currentStepData.optionsList || [];
        correctAnswer = currentStepData.correctAnswer;
      }

      optionsList.forEach(function(optionValue) {
        var optionButton = document.createElement('button');
        optionButton.className = 'option-btn';
        optionButton.innerText = optionValue;

        optionButton.onclick = function() {
          if (optionValue === correctAnswer) {
            optionButton.classList.add('correct');
            handleCorrectAnswer();
            var allOptionButtons = zoneElement.querySelectorAll('.option-btn');
            for (var optionIndex = 0; optionIndex < allOptionButtons.length; optionIndex++) {
              allOptionButtons[optionIndex].disabled = true;
            }
          } else {
            handleIncorrectAnswer(optionButton);
          }
        };

        zoneElement.appendChild(optionButton);
      });
    }

    if (currentStepData.stepType === 'spell') {
      var targetLetters = currentStepData.targetWord.split('');
      var shuffledLetters = targetLetters.slice().sort(function() {
        return 0.5 - Math.random();
      });
      var selectedLetters = [];

      var wordDisplay = document.createElement('div');
      wordDisplay.className = 'word-display';
      zoneElement.appendChild(wordDisplay);

      shuffledLetters.forEach(function(letterValue) {
        var letterButton = document.createElement('button');
        letterButton.className = 'letter-btn option-btn';
        letterButton.innerText = letterValue;

        letterButton.onclick = function() {
          if (letterButton.disabled) {
            return;
          }

          selectedLetters.push(letterValue);
          letterButton.disabled = true;
          letterButton.classList.add('selected');
          wordDisplay.innerText = selectedLetters.join('');

          if (selectedLetters.length === targetLetters.length) {
            if (selectedLetters.join('') === currentStepData.targetWord) {
              handleCorrectAnswer();
            } else {
              handleIncorrectAnswer(wordDisplay);
              setTimeout(function() {
                selectedLetters = [];
                wordDisplay.innerText = '';
                var letterButtons = zoneElement.querySelectorAll('.letter-btn');
                for (var letterIndex = 0; letterIndex < letterButtons.length; letterIndex++) {
                  letterButtons[letterIndex].disabled = false;
                  letterButtons[letterIndex].classList.remove('selected');
                }
              }, 700);
            }
          }
        };

        zoneElement.appendChild(letterButton);
      });
    }

    if (currentStepData.stepType === 'order') {
      var targetWords = currentStepData.wordsList.slice();
      var shuffledWords = targetWords.slice().sort(function() {
        return 0.5 - Math.random();
      });
      var selectedWords = [];

      var sentenceDisplay = document.createElement('div');
      sentenceDisplay.className = 'word-display';
      sentenceDisplay.style.fontSize = '1.7em';
      sentenceDisplay.style.letterSpacing = 'normal';
      zoneElement.appendChild(sentenceDisplay);

      shuffledWords.forEach(function(wordValue) {
        var wordButton = document.createElement('button');
        wordButton.className = 'option-btn';
        wordButton.innerText = wordValue;

        wordButton.onclick = function() {
          if (wordButton.disabled) {
            return;
          }

          selectedWords.push(wordValue);
          wordButton.disabled = true;
          sentenceDisplay.innerText = selectedWords.join(' ');

          if (selectedWords.length === targetWords.length) {
            if (selectedWords.join(' ') === currentStepData.correctAnswer) {
              handleCorrectAnswer();
            } else {
              handleIncorrectAnswer(sentenceDisplay);
              setTimeout(function() {
                selectedWords = [];
                sentenceDisplay.innerText = '';
                var wordButtons = zoneElement.querySelectorAll('.option-btn');
                for (var wordIndex = 0; wordIndex < wordButtons.length; wordIndex++) {
                  wordButtons[wordIndex].disabled = false;
                }
              }, 700);
            }
          }
        };

        zoneElement.appendChild(wordButton);
      });
    }

    if (currentStepData.stepType === 'match') {
      var matchPairs = currentStepData.pairsList;
      var leftColumn = document.createElement('div');
      var rightColumn = document.createElement('div');
      leftColumn.className = 'match-col';
      rightColumn.className = 'match-col';
      zoneElement.appendChild(leftColumn);
      zoneElement.appendChild(rightColumn);

      var selectedLeftButton = null;
      var matchedCount = 0;

      matchPairs.forEach(function(pairItem) {
        var leftButton = document.createElement('button');
        leftButton.className = 'option-btn';
        leftButton.style.width = '100%';
        leftButton.innerText = pairItem[0];

        leftButton.onclick = function() {
          if (leftButton.disabled) {
            return;
          }
          if (selectedLeftButton) {
            selectedLeftButton.classList.remove('selected');
          }
          selectedLeftButton = leftButton;
          leftButton.classList.add('selected');
        };

        leftColumn.appendChild(leftButton);
      });

      var rightPairs = matchPairs.slice().sort(function() {
        return 0.5 - Math.random();
      });

      rightPairs.forEach(function(pairItem) {
        var rightButton = document.createElement('button');
        rightButton.className = 'option-btn';
        rightButton.style.width = '100%';
        rightButton.innerText = pairItem[1];

        rightButton.onclick = function() {
          if (!selectedLeftButton || rightButton.disabled) {
            return;
          }

          var matchingPair = null;
          for (var pairIndex = 0; pairIndex < matchPairs.length; pairIndex++) {
            if (matchPairs[pairIndex][0] === selectedLeftButton.innerText) {
              matchingPair = matchPairs[pairIndex];
              break;
            }
          }

          if (matchingPair && matchingPair[1] === pairItem[1]) {
            selectedLeftButton.classList.add('correct');
            rightButton.classList.add('correct');
            selectedLeftButton.disabled = true;
            rightButton.disabled = true;
            selectedLeftButton = null;
            matchedCount++;

            if (matchedCount === matchPairs.length) {
              handleCorrectAnswer();
            }
          } else {
            handleIncorrectAnswer(rightButton);
          }
        };

        rightColumn.appendChild(rightButton);
      });
    }

    if (currentStepData.stepType === 'collect_treasure') {
      zoneElement.innerHTML =
        '<div class="treasure-zone">' +
        '<div class="treasure-chest">🏴‍☠️</div>' +
        '<div class="treasure-items" id="treasureItems"></div>' +
        '<div id="gemButtons" style="display:flex; flex-wrap:wrap; gap:14px; justify-content:center;"></div>' +
        '</div>';

      var treasureItems = document.getElementById('treasureItems');
      var gemButtons = document.getElementById('gemButtons');
      var gemSymbols = ['💎', '💰', '🗝️', '👟'];
      var collectedGems = 0;

      gemSymbols.forEach(function(gemSymbol) {
        var gemButton = document.createElement('button');
        gemButton.className = 'gem-btn';
        gemButton.innerText = gemSymbol;

        gemButton.onclick = function() {
          if (gemButton.disabled) {
            return;
          }

          if (gemSymbol === '👟') {
            handleIncorrectAnswer(gemButton);
            return;
          }

          gemButton.disabled = true;
          collectedGems++;

          var addedGem = document.createElement('span');
          addedGem.innerText = gemSymbol;
          treasureItems.appendChild(addedGem);

          if (collectedGems >= currentStepData.requiredGems) {
            var allGemButtons = gemButtons.querySelectorAll('.gem-btn');
            for (var gemIndex = 0; gemIndex < allGemButtons.length; gemIndex++) {
              allGemButtons[gemIndex].disabled = true;
            }
            handleCorrectAnswer();
          }
        };

        gemButtons.appendChild(gemButton);
      });
    }
  }
};

TreasureMapQuestApplication.initializeApplication();
</script>
</body>
</html>

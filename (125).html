<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 3 Lesson 5 Dictionary</title>
<meta name="description" content="Interactive dictionary for Spotlight 2 Module 3 Lesson 5 - food and basket vocabulary">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Comic Sans MS', 'Marker Felt', sans-serif;
  background: linear-gradient(135deg, #fff8e7 0%, #ffe4b5 100%);
  min-height: 100vh;
  padding: 20px;
  color: #3a2e1f;
}
.container { max-width: 1200px; margin: 0 auto; }
.header {
  text-align: center;
  margin-bottom: 30px;
  padding: 20px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 12px rgba(139, 69, 19, 0.15);
}
.header h1 {
  font-size: 2.2em;
  color: #8b4513;
  margin-bottom: 8px;
  text-shadow: 2px 2px 0 #fff;
}
.header .subtitle {
  font-size: 1.1em;
  color: #a0522d;
  font-style: italic;
}
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin-bottom: 25px;
}
.filter-btn {
  padding: 10px 18px;
  border: 3px solid #8b4513;
  background: #fff;
  color: #8b4513;
  font-family: inherit;
  font-size: 1em;
  font-weight: bold;
  border-radius: 25px;
  cursor: pointer;
  transition: all 0.3s ease;
}
.filter-btn:hover, .filter-btn.active {
  background: #8b4513;
  color: #fff;
  transform: translateY(-2px);
}
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}
.card {
  background: white;
  border-radius: 18px;
  padding: 20px 15px;
  text-align: center;
  box-shadow: 0 4px 10px rgba(139, 69, 19, 0.12);
  border: 3px solid #d2691e;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 6px;
  background: repeating-linear-gradient(
    45deg,
    #d2691e,
    #d2691e 10px,
    #fff 10px,
    #fff 20px
  );
}
.card.speaking {
  border-color: #ff6b35;
  box-shadow: 0 0 20px rgba(255, 107, 53, 0.4);
  transform: scale(1.03);
}
.card-emoji {
  font-size: 3em;
  margin-bottom: 10px;
  display: block;
}
.card-en {
  font-size: 1.4em;
  font-weight: bold;
  color: #8b4513;
  margin-bottom: 6px;
}
.card-ipa {
  font-size: 0.95em;
  color: #a0522d;
  font-family: 'Segoe UI', sans-serif;
  margin-bottom: 6px;
}
.card-ru {
  font-size: 1em;
  color: #6b4423;
  margin-bottom: 12px;
}
.sound-btn {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #ff6b35, #f7931e);
  color: white;
  font-size: 1.5em;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 3px 8px rgba(255, 107, 53, 0.4);
}
.sound-btn:hover {
  transform: scale(1.1) rotate(5deg);
}
.sound-btn:active {
  transform: scale(0.95);
}
.footer {
  text-align: center;
  padding: 15px;
  color: #8b4513;
  font-style: italic;
  font-size: 0.95em;
}
@media (max-width: 600px) {
  .header h1 { font-size: 1.6em; }
  .cards-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .card { padding: 15px 10px; }
  .card-emoji { font-size: 2.4em; }
  .card-en { font-size: 1.2em; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>👨‍🍳 Кулинарная книга </h1>
    <div class="subtitle">Module 3 · Lesson 5 · What's in the basket?</div>
  </div>
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="fruit">Fruits</button>
    <button class="filter-btn" data-filter="drinks">Drinks</button>
    <button class="filter-btn" data-filter="snacks">Snacks</button>
    <button class="filter-btn" data-filter="phrases">Phrases</button>
  </div>
  <div class="cards-grid" id="cardsGrid"></div>
  <div class="footer">Spotlight Starter · Module 3 · Lesson 5</div>
</div>
<script>
var vocabulary = [
  { emoji: '🍎', en: 'apple', ipa: '/ˈæp(ə)l/', ru: 'яблоко', cat: 'fruit' },
  { emoji: '🍌', en: 'banana', ipa: '/bəˈnɑːnə/', ru: 'банан', cat: 'fruit' },
  { emoji: '🍪', en: 'biscuits', ipa: '/ˈbɪskɪts/', ru: 'печенье', cat: 'snacks' },
  { emoji: '🥛', en: 'milk', ipa: '/mɪlk/', ru: 'молоко', cat: 'drinks' },
  { emoji: '🧃', en: 'juice', ipa: '/dʒuːs/', ru: 'сок', cat: 'drinks' },
  { emoji: '🧺', en: 'basket', ipa: '/ˈbɑːskɪt/', ru: 'корзинка', cat: 'snacks' },
  { emoji: '😋', en: 'yummy', ipa: '/ˈjʌmi/', ru: 'вкусно', cat: 'snacks' },
  { emoji: '❓', en: "What's in your basket?", ipa: '/wɒts ɪn jɔː ˈbɑːskɪt/', ru: 'Что в твоей корзинке?', cat: 'phrases' },
  { emoji: '🎒', en: "I've got apples.", ipa: '/aɪv ɡɒt ˈæp(ə)lz/', ru: 'У меня есть яблоки.', cat: 'phrases' },
  { emoji: '❤️', en: 'I like biscuits.', ipa: '/aɪ laɪk ˈbɪskɪts/', ru: 'Я люблю печенье.', cat: 'phrases' },
  { emoji: '👍', en: 'Yes, I do.', ipa: '/jɛs aɪ duː/', ru: 'Да, люблю.', cat: 'phrases' },
  { emoji: '👎', en: 'No, I don\'t.', ipa: '/nəʊ aɪ dəʊnt/', ru: 'Нет, не люблю.', cat: 'phrases' },
  { emoji: '🙋', en: 'Do you like...?', ipa: '/duː juː laɪk/', ru: 'Ты любишь...?', cat: 'phrases' },
  { emoji: '👀', en: 'Look!', ipa: '/lʊk/', ru: 'Смотри!', cat: 'phrases' },
  { emoji: '🍽️', en: 'Let\'s eat!', ipa: '/lɛts iːt/', ru: 'Давай есть!', cat: 'phrases' },
  { emoji: '😊', en: 'Thank you!', ipa: '/θæŋk juː/', ru: 'Спасибо!', cat: 'phrases' }
];
var synth = window.speechSynthesis;
var currentUtterance = null;
var currentCard = null;
function speak(text, card) {
  if (synth.speaking) synth.cancel();
  if (currentCard) currentCard.classList.remove('speaking');
  var utter = new SpeechSynthesisUtterance(text);
  var voices = synth.getVoices();
  var gbVoice = null;
  for (var i = 0; i < voices.length; i++) {
    if (voices[i].lang === 'en-GB') { gbVoice = voices[i]; break; }
  }
  if (gbVoice) utter.voice = gbVoice;
  utter.rate = 0.85;
  utter.onstart = function() { card.classList.add('speaking'); currentCard = card; };
  utter.onend = function() { card.classList.remove('speaking'); currentCard = null; };
  utter.onerror = function() { card.classList.remove('speaking'); };
  currentUtterance = utter;
  synth.speak(utter);
}
function renderCards(filter) {
  var grid = document.getElementById('cardsGrid');
  grid.innerHTML = '';
  var items = filter === 'all' ? vocabulary : vocabulary.filter(function(v) { return v.cat === filter; });
  items.forEach(function(item) {
    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = 
      '<span class="card-emoji">' + item.emoji + '</span>' +
      '<div class="card-en">' + item.en + '</div>' +
      '<div class="card-ipa">' + item.ipa + '</div>' +
      '<div class="card-ru">' + item.ru + '</div>' +
      '<button class="sound-btn">🔊</button>';
    var btn = card.querySelector('.sound-btn');
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      speak(item.en, card);
    });
    card.addEventListener('click', function() { speak(item.en, card); });
    grid.appendChild(card);
  });
}
var filterBtns = document.querySelectorAll('.filter-btn');
filterBtns.forEach(function(btn) {
  btn.addEventListener('click', function() {
    filterBtns.forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    renderCards(btn.getAttribute('data-filter'));
  });
});
if (synth.onvoiceschanged !== undefined) {
  synth.onvoiceschanged = function() {};
}
renderCards('all');
</script>
</body>
</html>

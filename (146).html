<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Словарик: Playtime! Surprise</title>
<meta name="description" content="Интерактивный словарик к уроку Playtime! Surprise.">
<style>
body {
  font-family: "Comic Sans MS", "Marker Felt", sans-serif;
  background: linear-gradient(to bottom, #c62828 0%, #ef5350 35%, #ffe082 100%);
  margin: 0;
  padding: 20px;
  color: #3e2723;
  min-height: 100vh;
}

.header {
  text-align: center;
  margin-bottom: 25px;
}

.header h1 {
  font-size: 2.2em;
  margin: 0;
  color: #fff59d;
  text-shadow: 3px 3px 0 #8e0000;
}

.header p {
  font-size: 1.1em;
  color: #fff9c4;
  margin: 8px 0;
  text-shadow: 1px 1px 0 #8e0000;
}

.filters {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 30px;
}

.filter-btn {
  background: #fbc02d;
  color: #5d4037;
  border: none;
  padding: 12px 24px;
  border-radius: 25px;
  font-size: 1em;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.3s;
  box-shadow: 0 4px 0 #f57f17;
  font-weight: bold;
}

.filter-btn.active,
.filter-btn:hover {
  background: #7c4dff;
  color: white;
  box-shadow: 0 4px 0 #512da8;
  transform: translateY(-2px);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 28px;
  max-width: 1100px;
  margin: 0 auto;
}

.card {
  background: #fffdf7;
  border: 5px solid #fbc02d;
  border-radius: 45% 45% 18px 18px / 58% 58% 18px 18px;
  padding: 28px 18px 18px;
  text-align: center;
  position: relative;
  box-shadow: 0 10px 22px rgba(0,0,0,0.2);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 230px;
  transition: transform 0.3s;
}

.card::before {
  content: "";
  position: absolute;
  top: -16px;
  left: 50%;
  transform: translateX(-50%);
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #fbc02d;
  border: 4px solid #f57f17;
}

.card::after {
  content: "";
  position: absolute;
  bottom: -22px;
  left: 50%;
  transform: translateX(-50%);
  width: 48px;
  height: 24px;
  background: #c62828;
  border-radius: 0 0 18px 18px;
  z-index: -1;
}

.card:hover {
  transform: translateY(-6px);
}

.emoji {
  font-size: 3.4em;
  margin-bottom: 10px;
  filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.2));
}

.en {
  font-size: 1.35em;
  font-weight: bold;
  color: #c62828;
  margin: 8px 0;
}

.ipa {
  font-size: 0.95em;
  color: #5d6d7e;
  font-family: "Courier New", monospace;
  margin-bottom: 8px;
}

.ru {
  font-size: 1.12em;
  color: #3e2723;
  margin-bottom: 18px;
}

.sound-btn {
  background: #4caf50;
  color: white;
  border: none;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  font-size: 1.55em;
  cursor: pointer;
  box-shadow: 0 5px 0 #2e7d32;
  transition: 0.1s;
}

.sound-btn:active {
  transform: translateY(5px);
  box-shadow: none;
}

.card.playing {
  border-color: #7c4dff;
  background: #ede7f6;
  transform: scale(1.04);
}

.footer {
  text-align: center;
  margin-top: 55px;
  font-size: 0.95em;
  color: #fff59d;
  font-weight: bold;
  text-shadow: 1px 1px 0 #8e0000;
}

@media (max-width: 600px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }

  .header h1 {
    font-size: 1.7em;
  }

  .card {
    min-height: 210px;
    padding: 24px 14px 14px;
  }

  .emoji {
    font-size: 2.9em;
  }
}
</style>
</head>
<body>
<div class="header">
  <h1>🎭 Playtime! Surprise</h1>
  <p>Нажми на кукольную перчатку, чтобы услышать слово</p>
</div>
<div class="filters">
  <button class="filter-btn active" data-cat="all">Все</button>
  <button class="filter-btn" data-cat="words">Слова</button>
  <button class="filter-btn" data-cat="characters">Персонажи</button>
  <button class="filter-btn" data-cat="theatre">Театр</button>
  <button class="filter-btn" data-cat="phrases">Фразы</button>
</div>
<div class="grid" id="grid"></div>
<div class="footer">Spotlight Starter • Урок 63</div>
<script>
var words = [
  { en: "surprise", ipa: "/səˈpraɪz/", ru: "сюрприз", emoji: "🎁", cat: "words" },
  { en: "Punch", ipa: "/pʌntʃ/", ru: "Панч", emoji: "🤡", cat: "characters" },
  { en: "Judy", ipa: "/ˈdʒuːdi/", ru: "Джуди", emoji: "👧", cat: "characters" },
  { en: "puppet", ipa: "/ˈpʌpɪt/", ru: "кукла", emoji: "🎭", cat: "theatre" },
  { en: "theatre", ipa: "/ˈθɪətə/", ru: "театр", emoji: "🎪", cat: "theatre" },
  { en: "say", ipa: "/seɪ/", ru: "говорить", emoji: "💬", cat: "words" },
  { en: "got", ipa: "/ɡɒt/", ru: "есть, имеется", emoji: "🤲", cat: "words" },
  { en: "for", ipa: "/fɔː/", ru: "для", emoji: "🎯", cat: "words" },
  { en: "you", ipa: "/juː/", ru: "тебе", emoji: "👉", cat: "words" },
  { en: "I've got", ipa: "/aɪv ɡɒt/", ru: "у меня есть", emoji: "🤲", cat: "phrases" },
  { en: "a surprise", ipa: "/ə səˈpraɪz/", ru: "сюрприз", emoji: "🎁", cat: "phrases" },
  { en: "for you", ipa: "/fɔː juː/", ru: "для тебя", emoji: "👉", cat: "phrases" },
  { en: "for me?", ipa: "/fɔː miː/", ru: "для меня?", emoji: "🙋", cat: "phrases" },
  { en: "I've got a surprise for you", ipa: "/aɪv ɡɒt ə səˈpraɪz fɔː juː/", ru: "У меня есть для тебя сюрприз", emoji: "🎁", cat: "phrases" },
  { en: "What does Punch say?", ipa: "/wɒt dʌz pʌntʃ seɪ/", ru: "Что говорит Панч?", emoji: "🤡", cat: "phrases" },
  { en: "Ta-daa!", ipa: "/tɑːˈdɑː/", ru: "Та-даа!", emoji: "🎉", cat: "phrases" }
];

var grid = document.getElementById("grid");
var currentAudio = null;
var playingCard = null;

function renderWords(filterName) {
  grid.innerHTML = "";
  words.forEach(function(wordItem) {
    if (filterName !== "all" && wordItem.cat !== filterName) {
      return;
    }

    var card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      '<div class="emoji">' + wordItem.emoji + "</div>" +
      '<div class="en">' + wordItem.en + "</div>" +
      '<div class="ipa">' + wordItem.ipa + "</div>" +
      '<div class="ru">' + wordItem.ru + "</div>" +
      '<button class="sound-btn">🔊</button>';

    var soundButton = card.querySelector(".sound-btn");
    soundButton.onclick = function() {
      if (currentAudio) {
        speechSynthesis.cancel();
        if (playingCard) {
          playingCard.classList.remove("playing");
        }
      }

      var utterance = new SpeechSynthesisUtterance(wordItem.en);
      utterance.lang = "en-GB";
      utterance.rate = 0.85;
      card.classList.add("playing");
      playingCard = card;

      utterance.onend = function() {
        card.classList.remove("playing");
        playingCard = null;
      };

      speechSynthesis.speak(utterance);
      currentAudio = utterance;
    };

    grid.appendChild(card);
  });
}

document.querySelectorAll(".filter-btn").forEach(function(filterButton) {
  filterButton.onclick = function() {
    document.querySelectorAll(".filter-btn").forEach(function(otherButton) {
      otherButton.classList.remove("active");
    });
    filterButton.classList.add("active");
    renderWords(filterButton.getAttribute("data-cat"));
  };
});

renderWords("all");
</script>
</body>
</html>

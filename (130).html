<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>London Zoo Dictionary - Spotlight Starter</title>
    <meta property="og:title" content="London Zoo Dictionary - Spotlight Starter">
    <meta property="og:description" content="Интерактивный словарик с озвучкой для урока London Zoo.">
    <meta property="og:image" content="https://missanytka1994-ops.github.io/spotlightstarter/images/lesson-3-2-og.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://missanytka1994-ops.github.io/spotlightstarter/lesson-3-2-dictionary.html">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:site_name" content="Spotlight Starter">
    <meta name="twitter:card" content="summary_large_image">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f8ff; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        .filter-btn { background: #3498db; color: white; border: none; padding: 10px 20px; margin: 5px; border-radius: 20px; cursor: pointer; font-size: 16px; }
        .filter-btn.active { background: #2980b9; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; transition: transform 0.2s, border 0.2s; border: 2px solid transparent; }
        .card:hover { transform: translateY(-3px); }
        .card.speaking { border-color: #2ecc71; background-color: #eafaf1; }
        .emoji { font-size: 40px; margin-bottom: 10px; display: block; }
        .en-word { font-size: 22px; font-weight: bold; color: #2c3e50; margin: 5px 0; }
        .ipa { font-size: 16px; color: #7f8c8d; font-family: 'Lucida Sans Unicode', 'Arial Unicode MS', sans-serif; }
        .ru-word { font-size: 18px; color: #34495e; margin-top: 5px; }
        .speak-btn { background: #e74c3c; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 18px; cursor: pointer; margin-top: 15px; display: inline-flex; align-items: center; justify-content: center; }
        .speak-btn:hover { background: #c0392b; }
        @media (max-width: 600px) {
            .cards-grid { grid-template-columns: 1fr; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦁 London Zoo Dictionary</h1>
        <div style="text-align: center; margin-bottom: 20px;">
            <button class="filter-btn active" onclick="filterCards('all')">All</button>
            <button class="filter-btn" onclick="filterCards('animals')">Animals</button>
            <button class="filter-btn" onclick="filterCards('transport')">Transport</button>
            <button class="filter-btn" onclick="filterCards('phrases')">Phrases</button>
        </div>
        <div class="cards-grid" id="cardsContainer"></div>
    </div>

    <script>
        const vocabulary = [
            { en: "cat", ipa: "/kæt/", ru: "кошка", emoji: "🐱", category: "animals" },
            { en: "dog", ipa: "/dɒɡ/", ru: "собака", emoji: "🐶", category: "animals" },
            { en: "rabbit", ipa: "/ˈræb.ɪt/", ru: "кролик", emoji: "🐰", category: "animals" },
            { en: "tortoise", ipa: "/ˈtɔː.təs/", ru: "черепаха", emoji: "🐢", category: "animals" },
            { en: "penguin", ipa: "/ˈpeŋ.ɡwɪn/", ru: "пингвин", emoji: "🐧", category: "animals" },
            { en: "bird", ipa: "/bɜːd/", ru: "птица", emoji: "🐦", category: "animals" },
            { en: "duck", ipa: "/dʌk/", ru: "утка", emoji: "🦆", category: "animals" },
            { en: "mouse", ipa: "/maʊs/", ru: "мышь", emoji: "🐭", category: "animals" },
            { en: "train", ipa: "/treɪn/", ru: "поезд", emoji: "🚂", category: "transport" },
            { en: "plane", ipa: "/pleɪn/", ru: "самолёт", emoji: "✈️", category: "transport" },
            { en: "boat", ipa: "/bəʊt/", ru: "лодка", emoji: "🚤", category: "transport" },
            { en: "car", ipa: "/kɑːr/", ru: "машина", emoji: "🚗", category: "transport" },
            { en: "Look! A penguin!", ipa: "/lʊk! ə ˈpeŋ.ɡwɪn!/", ru: "Смотри! Пингвин!", emoji: "👀", category: "phrases" },
            { en: "I see a rabbit!", ipa: "/aɪ siː ə ˈræb.ɪt!/", ru: "Я вижу кролика!", emoji: "👁️", category: "phrases" },
            { en: "Look at the penguin!", ipa: "/lʊk æt ðə ˈpeŋ.ɡwɪn!/", ru: "Посмотри на пингвина!", emoji: "👉", category: "phrases" },
            { en: "What animals can you see?", ipa: "/wɒt ˈæn.ɪ.məlz kæn juː siː?/", ru: "Каких животных ты видишь?", emoji: "❓", category: "phrases" },
            { en: "I have got a...", ipa: "/aɪ hæv ɡɒt ə.../", ru: "У меня есть...", emoji: "🎒", category: "phrases" }
        ];

        const container = document.getElementById("cardsContainer");

        function renderCards(filter) {
            container.innerHTML = "";
            vocabulary.forEach(item => {
                if (filter === "all" || item.category === filter) {
                    const card = document.createElement("div");
                    card.className = "card";
                    card.dataset.category = item.category;
                    card.innerHTML = `
                        <span class="emoji">${item.emoji}</span>
                        <div class="en-word">${item.en}</div>
                        <div class="ipa">${item.ipa}</div>
                        <div class="ru-word">${item.ru}</div>
                        <button class="speak-btn" onclick="speak('${item.en.replace(/'/g, "\\'")}', this)">🔊</button>
                    `;
                    container.appendChild(card);
                }
            });
        }

        function filterCards(category) {
            document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.remove("active"));
            event.target.classList.add("active");
            renderCards(category);
        }

        function speak(text, btn) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "en-GB";
            utterance.rate = 0.85;
            
            const voices = window.speechSynthesis.getVoices();
            const gbVoice = voices.find(v => v.lang === "en-GB") || voices.find(v => v.lang.startsWith("en"));
            if (gbVoice) utterance.voice = gbVoice;

            const card = btn.parentElement;
            card.classList.add("speaking");
            utterance.onend = () => card.classList.remove("speaking");
            
            window.speechSynthesis.speak(utterance);
        }

        window.speechSynthesis.onvoiceschanged = () => {};
        renderCards("all");
    </script>
</body>
</html>

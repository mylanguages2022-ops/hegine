<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"Comic Sans MS","Segoe UI",Verdana,sans-serif;
    background-color:#f6f0e4;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(184,134,11,.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(122,31,46,.05) 0%, transparent 50%);
    color:#3a2e1f;min-height:100vh;padding:16px 12px 50px;
  }
  .wrap{max-width:760px;margin:0 auto}

  .topbar{
    background:#fffdf8;border-radius:4px;padding:16px 16px 18px;
    border:3px solid #b89460;box-shadow:0 0 0 1px rgba(184,148,96,.3) inset, 5px 6px 0 rgba(122,31,46,.15);
    margin-bottom:18px;position:relative;
  }
  .topbar::before{
    content:'';position:absolute;top:-4px;left:-4px;right:-4px;bottom:-4px;
    border:1px solid #b89460;border-radius:6px;pointer-events:none;opacity:.4;
  }
  .topbar h1{font-size:clamp(1.1rem,4vw,1.5rem);color:#7a1f2e;text-align:center;line-height:1.3}
  .topbar h1::before{content:'🖼️ ';}
  .bar-wrap{margin-top:14px}
  .bar-label{
    display:flex;justify-content:space-between;align-items:center;
    font-size:.8rem;color:#6b5a42;margin-bottom:6px;font-weight:700;letter-spacing:.3px;
  }
  .bar-track{
    height:20px;background:#f3ead6;border-radius:3px;overflow:hidden;
    border:2px solid #b89460;position:relative;
  }
  .bar-fill{
    height:100%;width:0%;border-radius:2px;
    background:linear-gradient(90deg,#7a1f2e,#b89460);
    transition:width .5s cubic-bezier(.34,1.4,.64,1);
  }
  .bar-runner{
    position:absolute;top:-5px;left:0;font-size:1.3rem;
    transform:translateX(-50%);transition:left .5s cubic-bezier(.34,1.4,.64,1);
    filter:drop-shadow(0 2px 1px rgba(0,0,0,.2));
  }
  .stars{margin-top:9px;text-align:center;font-size:1.05rem;letter-spacing:2px;color:#b89460}

  .stage{
    background:#fffdf8;border-radius:4px;padding:24px 18px 26px;
    border:3px solid #b89460;box-shadow:0 0 0 1px rgba(184,148,96,.3) inset, 5px 6px 0 rgba(122,31,46,.15);
    animation:pop .35s ease;position:relative;
  }
  .stage::before{
    content:'';position:absolute;top:-4px;left:-4px;right:-4px;bottom:-4px;
    border:1px solid #b89460;border-radius:6px;pointer-events:none;opacity:.4;
  }
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .stage.shake{animation:shake .45s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-9px)}40%{transform:translateX(9px)}
    60%{transform:translateX(-6px)}80%{transform:translateX(6px)}
  }
  .step-tag{
    display:inline-block;background:#7a1f2e;color:#f5ecd8;
    font-size:.76rem;font-weight:700;padding:4px 12px;border-radius:3px;
    letter-spacing:.5px;margin-bottom:12px;
  }
  .mech-tag{
    display:inline-block;background:#f3ead6;color:#7a1f2e;
    font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:3px;
    border:1px solid #b89460;margin-left:6px;margin-bottom:12px;letter-spacing:.3px;
  }
  .hero{font-size:3.1rem;text-align:center;display:block;margin:2px 0 10px;line-height:1.15}
  .stage h2{font-size:clamp(1.05rem,3.8vw,1.4rem);color:#7a1f2e;text-align:center;margin-bottom:10px;line-height:1.35}
  .task-text{font-size:1rem;line-height:1.6;color:#5a4228;text-align:center;margin-bottom:16px}
  .en-inline{font-weight:700;color:#7a1f2e}

  .speak-line{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0 18px}
  .speak-big{
    background:#7a1f2e;color:#f5ecd8;border:none;border-radius:3px;
    padding:12px 22px;font-size:1.02rem;font-weight:700;cursor:pointer;
    font-family:inherit;box-shadow:0 4px 0 #4d1320;transition:.15s;
    display:inline-flex;align-items:center;gap:9px;letter-spacing:.3px;
  }
  .speak-big:hover{background:#5d1623;transform:translateY(-2px)}
  .speak-big:active{transform:translateY(1px);box-shadow:0 2px 0 #4d1320}
  .speak-mini{
    width:36px;height:36px;border-radius:50%;border:none;background:#2e8b57;color:#fff;
    font-size:1rem;cursor:pointer;box-shadow:0 3px 0 #1f6b41;transition:.15s;
    display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .speak-mini:hover{background:#27794c;transform:scale(1.1)}
  .speak-mini:active{transform:scale(.92)}

  .opts{display:flex;flex-direction:column;gap:11px;margin-top:6px}
  .opts.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
  .opt{
    background:#fffdf8;border:2px solid #b89460;border-radius:4px;
    padding:13px 14px;cursor:pointer;font-family:inherit;font-size:1.02rem;
    color:#3a2e1f;text-align:left;display:flex;align-items:center;gap:10px;
    transition:.16s;font-weight:600;line-height:1.35;
  }
  .opt:hover{border-color:#7a1f2e;background:#f3ead6;transform:translateX(3px)}
  .opt .mark{
    flex:0 0 30px;height:30px;border-radius:50%;background:#f3ead6;color:#7a1f2e;border:2px solid #b89460;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem;
  }
  .opt.correct{background:#eafff0;border-color:#2e8b57;animation:bounce .45s}
  .opt.wrong{background:#fff0f0;border-color:#c0392b;animation:shake .4s}
  @keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  .opt:disabled{cursor:default}

  .countbox{
    background:#f3ead6;border:2px dashed #b89460;border-radius:8px;
    padding:18px 12px;text-align:center;margin-bottom:16px;
  }
  .countbox .items{font-size:2.4rem;letter-spacing:7px;line-height:1.5;word-break:break-word}

  .match-area{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
  .mcol{display:flex;flex-direction:column;gap:10px}
  .mcol h4{text-align:center;font-size:.82rem;color:#6b5a42;font-weight:700;margin-bottom:2px;letter-spacing:.5px}
  .mitem{
    background:#fffdf8;border:2px solid #b89460;border-radius:4px;padding:11px 8px;
    cursor:pointer;font-family:inherit;font-size:1rem;font-weight:700;color:#3a2e1f;
    text-align:center;transition:.16s;display:flex;align-items:center;justify-content:center;gap:7px;
    min-height:56px;
  }
  .mitem:hover{border-color:#7a1f2e;background:#f3ead6}
  .mitem.sel{border-color:#7a1f2e;background:#f3ead6;box-shadow:0 0 0 3px rgba(122,31,46,.15)}
  .mitem.done{background:#eafff0;border-color:#2e8b57;color:#1f6b41;cursor:default;opacity:.85}
  .mitem.bad{animation:shake .4s;border-color:#c0392b;background:#fff0f0}
  .mitem .pic{font-size:1.7rem}

  .spell-slots{display:flex;gap:9px;justify-content:center;margin:6px 0 18px;flex-wrap:wrap}
  .slot{
    width:52px;height:60px;border-radius:4px;background:#f3ead6;
    border:2px dashed #b89460;display:flex;align-items:center;justify-content:center;
    font-size:1.75rem;font-weight:700;color:#7a1f2e;text-transform:uppercase;
  }
  .slot.filled{border-style:solid;border-color:#2e8b57;background:#eafff0}
  .slot.bad{border-color:#c0392b;background:#fff0f0;animation:shake .4s}
  .letter-pool{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
  .letter{
    width:54px;height:60px;border-radius:4px;border:2px solid #b89460;background:#fffdf8;
    font-family:inherit;font-size:1.7rem;font-weight:700;color:#7a1f2e;cursor:pointer;
    text-transform:uppercase;box-shadow:0 4px 0 #b89460;transition:.14s;
  }
  .letter:hover{transform:translateY(-3px);background:#f3ead6}
  .letter.used{opacity:.25;pointer-events:none;box-shadow:none;transform:none}

  .drag-zone{
    background:#f3ead6;border:2px dashed #b89460;border-radius:8px;
    padding:18px 12px;text-align:center;margin-bottom:16px;min-height:120px;
  }
  .drag-item{
    display:inline-block;background:#fffdf8;border:2px solid #b89460;border-radius:4px;
    padding:10px 16px;margin:5px;cursor:pointer;font-family:inherit;font-size:1.05rem;
    font-weight:700;color:#7a1f2e;box-shadow:0 3px 0 #b89460;transition:.15s;
  }
  .drag-item:hover{transform:translateY(-3px);background:#f3ead6}
  .drag-item.chosen{background:#eafff0;border-color:#2e8b57;color:#1f6b41;box-shadow:0 3px 0 #1f6b41}
  .drag-item.bad{animation:shake .4s;border-color:#c0392b;background:#fff0f0}

  .fb{
    margin-top:16px;padding:14px 16px;border-radius:6px;font-size:1rem;
    line-height:1.55;text-align:center;display:none;font-weight:600;
  }
  .fb.show{display:block;animation:pop .3s}
  .fb.good{background:#eafff0;border:3px double #2e8b57;color:#1f6b41}
  .fb.bad{background:#fff0f0;border:3px double #c0392b;color:#8e2a1f}
  .fb .again{
    margin-top:10px;background:#fffdf8;border:2px solid #c0392b;color:#8e2a1f;
    border-radius:4px;padding:7px 16px;font-family:inherit;font-weight:700;
    font-size:.9rem;cursor:pointer;
  }
  .fb .again:hover{background:#fff0f0}

  .nav{display:flex;gap:11px;justify-content:center;margin-top:20px;flex-wrap:wrap}
  .nav button{
    border:none;border-radius:4px;padding:13px 24px;font-family:inherit;
    font-size:1rem;font-weight:700;cursor:pointer;transition:.16s;
    display:inline-flex;align-items:center;gap:8px;letter-spacing:.3px;
  }
  .btn-next{background:#7a1f2e;color:#f5ecd8;box-shadow:0 5px 0 #4d1320}
  .btn-next:hover{background:#5d1623;transform:translateY(-2px)}
  .btn-back{background:#fffdf8;color:#7a1f2e;border:2px solid #b89460 !important;box-shadow:0 5px 0 #b89460}
  .btn-back:hover{background:#f3ead6}
  .btn-back:disabled,.btn-next:disabled{opacity:.4;cursor:default;transform:none}
  .btn-replay{background:#b89460;color:#fffdf8;box-shadow:0 5px 0 #8a6f48}
  .btn-replay:hover{background:#a6844f}

  .final{text-align:center}
  .final .big{
    font-size:3.4rem;display:inline-block;margin-bottom:12px;
    border:5px double #b89460;color:#7a1f2e;border-radius:8px;padding:8px 22px;
    letter-spacing:3px;font-weight:700;background:#fffdf8;
    animation:float 2.4s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .final h2{font-size:clamp(1.25rem,4.5vw,1.8rem);color:#7a1f2e;margin-bottom:12px}
  .final p{font-size:1.02rem;line-height:1.65;color:#5a4228;margin-bottom:12px}
  .reward{
    background:#f3ead6;border:2px dashed #b89460;border-radius:8px;padding:18px 16px;margin:18px 0;
  }
  .reward .words{font-size:1.02rem;line-height:1.85;color:#5a4228;text-align:left}
  .reward .words b{color:#7a1f2e}
  .restart{background:#7a1f2e;color:#f5ecd8;box-shadow:0 5px 0 #4d1320}
  .restart:hover{background:#5d1623}

  .start-screen{text-align:center}
  .start-screen .cast{font-size:2.6rem;letter-spacing:6px;margin:14px 0 6px}
  .start-screen ul{
    list-style:none;text-align:left;margin:16px auto;max-width:430px;
    background:#fffdf8;border:2px dashed #b89460;border-radius:8px;padding:16px 18px;
  }
  .start-screen li{
    padding:7px 0 7px 30px;position:relative;font-size:.97rem;color:#5a4228;line-height:1.45;
    border-bottom:1px dotted #b89460;
  }
  .start-screen li:last-child{border-bottom:none}
  .start-screen li::before{content:'🖼️';position:absolute;left:0;top:7px;font-size:.95rem}
  .sound-note{
    background:#fffdf8;border:2px solid #b89460;border-radius:4px;padding:11px 14px;
    font-size:.88rem;color:#6b5a42;margin-top:14px;line-height:1.5;
  }

  @media (max-width:520px){
    .match-area{grid-template-columns:1fr 1fr;gap:8px}
    .mitem{font-size:.88rem;min-height:50px;padding:9px 5px}
    .mitem .pic{font-size:1.4rem}
    .slot,.letter{width:44px;height:52px;font-size:1.4rem}
    .countbox .items{font-size:1.9rem;letter-spacing:4px}
    .hero{font-size:2.6rem}
    .nav button{padding:12px 18px;font-size:.95rem}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <h1>Открытие выставки</h1>
    <div class="bar-wrap">
      <div class="bar-label">
        <span id="stepLabel">Экспонат 0 из 14</span>
        <span id="pctLabel">0%</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="barFill"></div>
        <div class="bar-runner" id="barRunner">🖼️</div>
      </div>
      <div class="stars" id="stars"></div>
    </div>
  </div>

  <div id="stageHost"></div>

</div>

<script>
(function(){
  "use strict";

  var RATE = 0.85;
  var voices = [];

  function loadVoices(){
    if(!('speechSynthesis' in window)) return;
    voices = window.speechSynthesis.getVoices() || [];
  }
  loadVoices();
  if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = loadVoices;
    setTimeout(loadVoices, 350);
    setTimeout(loadVoices, 1400);
  }

  function pickVoice(){
    if(!voices.length) loadVoices();
    var v;
    v = voices.find(function(x){ return x.lang === 'en-GB'; });
    if(v) return v;
    v = voices.find(function(x){ return x.lang && x.lang.toLowerCase().indexOf('en-gb') === 0; });
    if(v) return v;
    v = voices.find(function(x){ return x.lang === 'en-US'; });
    if(v) return v;
    v = voices.find(function(x){ return x.lang && x.lang.toLowerCase().indexOf('en') === 0; });
    return v || null;
  }

  function speak(text, delay){
    if(!('speechSynthesis' in window)) return;
    var go = function(){
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      var v = pickVoice();
      if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'en-GB'; }
      u.rate = RATE; u.pitch = 1.06; u.volume = 1;
      window.speechSynthesis.speak(u);
    };
    if(delay){ setTimeout(go, delay); } else { go(); }
  }

  function speakSeq(arr){
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    arr.forEach(function(t, i){
      setTimeout(function(){
        var u = new SpeechSynthesisUtterance(t);
        var v = pickVoice();
        if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = 'en-GB'; }
        u.rate = RATE; u.pitch = 1.06;
        window.speechSynthesis.speak(u);
      }, i * 1500);
    });
  }

  var STEPS = [

  /* 1 */ {
    kind:'intro', emoji:'🖼️', mech:'Открытие галереи',
    title:'Добро пожаловать в галерею!',
    text:'Сегодня ты — куратор своей первой выставки. Тебе нужно развесить экспонаты, подписать каждый цветом и количеством, и встретить первых посетителей. Четырнадцать залов — и в конце тебя ждёт торжественное открытие!',
    say:"Welcome to my gallery!",
    sayRu:'Добро пожаловать в мою галерею!',
    cta:'🖼️ Открыть двери!'
  },

  /* 2 */ {
    kind:'choice', emoji:'🎨', mech:'Выбор ответа',
    title:'Зал первый: школьные вещи',
    text:'Посетитель показывает на ручку и спрашивает: **What\'s this?** /wɒts ðɪs/ — что это? Как ты ответишь?',
    say:"This is my pen.",
    opts:[
      {t:'This is my pen. /ðɪs ɪz maɪ pen/ — это моя ручка', say:'This is my pen.'},
      {t:'This is my pencil. /ðɪs ɪz maɪ ˈpensl/ — это мой карандаш', say:'This is my pencil.'},
      {t:'This is my rubber. /ðɪs ɪz maɪ ˈrʌbə/ — это мой ластик', say:'This is my rubber.'}
    ],
    correct:0,
    ok:'Отлично! **This is my pen** /ðɪs ɪz maɪ pen/ — это моя ручка. Первый экспонат подписан!',
    no:'Послушай все три фразы и выбери ту, где говорится про ручку.'
  },

  /* 3 */ {
    kind:'choice', emoji:'🔴', mech:'Выбор ответа',
    title:'Зал второй: цвет пенала',
    text:'Посетитель смотрит на твой красный пенал. Как ты опишешь его цвет?',
    say:"It is red.",
    opts:[
      {t:'It is red. /ɪt ɪz red/ — он красный', say:'It is red.'},
      {t:'It is blue. /ɪt ɪz bluː/ — он синий', say:'It is blue.'},
      {t:'It is green. /ɪt ɪz ɡriːn/ — он зелёный', say:'It is green.'}
    ],
    correct:0,
    ok:'Верно! **It is red** /ɪt ɪz red/ — он красный. Этикетка готова!',
    no:'Посмотри внимательно на цвет пенала и выбери правильный.'
  },

  /* 4 */ {
    kind:'spell', emoji:'🔵', mech:'Собери слово',
    title:'Зал третий: собери «синий»',
    text:'Собери слово **blue** /bluː/ из букв — цвет твоей книги.',
    word:'blue', hint:'🔵', say:'blue',
    ok:'Здорово! **blue** /bluː/ — синий. **This is my book. It is blue.**',
    no:'Буква не та. Слушай: b-l-u-e.'
  },

  /* 5 */ {
    kind:'count', emoji:'✏️', mech:'Считаем предметы',
    title:'Зал четвёртый: карандаши в пенале',
    text:'Посетитель спрашивает: **How many pencils?** /haʊ ˈmeni ˈpenslz/ — сколько карандашей? Посчитай!',
    ask:'How many pencils?',
    items:'✏️✏️✏️✏️✏️✏️',
    say:'How many pencils? One, two, three, four, five, six. Six pencils!',
    opts:[
      {t:'five /faɪv/ — пять', say:'five'},
      {t:'six /sɪks/ — шесть', say:'six'},
      {t:'seven /ˈsevən/ — семь', say:'seven'}
    ],
    correct:1,
    ok:'Верно! **Six pencils!** /sɪks ˈpenslz/ — шесть карандашей!',
    no:'Считаем по одному: one, two, three, four, five, six.'
  },

  /* 6 */ {
    kind:'match', emoji:'🎨', mech:'Найди пару',
    title:'Зал пятый: цвета и слова',
    text:'Соедини цвет-кружок с английским словом. Сначала нажми на слово, потом на цвет.',
    say:'red, blue, green, yellow, pink',
    pairs:[
      {left:'red', say:'red', right:'🔴'},
      {left:'blue', say:'blue', right:'🔵'},
      {left:'green', say:'green', right:'🟢'},
      {left:'yellow', say:'yellow', right:'🟡'},
      {left:'pink', say:'pink', right:'🌸'}
    ],
    ok:'Все цвета на своих местах: **red, blue, green, yellow, pink**!',
    no:'Не та пара. Послушай слово и найди подходящий цвет.'
  },

  /* 7 */ {
    kind:'spell', emoji:'🟢', mech:'Собери слово',
    title:'Зал шестой: собери «зелёный»',
    text:'Собери слово **green** /ɡriːn/ из букв.',

  var TOTAL = STEPS.length;
  var idx = 0;
  var history = [];
  var score = 0;
  var stageHost = document.getElementById('stageHost');
  var barFill = document.getElementById('barFill');
  var barRunner = document.getElementById('barRunner');
  var stepLabel = document.getElementById('stepLabel');
  var pctLabel = document.getElementById('pctLabel');
  var starsBox = document.getElementById('stars');

  function bold(str){
    return String(str).replace(/\*\*(.+?)\*\*/g, '<span class="en-inline">$1</span>');
  }

  function updateBar(){
    var pct = Math.round((idx / (TOTAL - 1)) * 100);
    if(pct < 0) pct = 0; if(pct > 100) pct = 100;
    barFill.style.width = pct + '%';
    barRunner.style.left = pct + '%';
    stepLabel.textContent = idx === 0 ? 'Экспонат 0 из ' + (TOTAL - 1) : ('Экспонат ' + idx + ' из ' + (TOTAL - 1));
    pctLabel.textContent = pct + '%';
    var full = Math.floor(score / 3);
    var s = '';
    for(var i = 0; i < full && i < 6; i++){ s += '🖼️'; }
    starsBox.textContent = s;
  }

  function shakeStage(){
    var st = stageHost.querySelector('.stage');
    if(!st) return;
    st.classList.remove('shake');
    void st.offsetWidth;
    st.classList.add('shake');
  }

  function speakerBtn(text, cls, title){
    var b = document.createElement('button');
    b.className = cls || 'speak-mini';
    b.innerHTML = '🔊';
    b.title = title || 'Прослушать';
    b.setAttribute('aria-label','Прослушать: ' + text);
    b.addEventListener('click', function(ev){ ev.stopPropagation(); speak(text); });
    return b;
  }

  function nextBtn(label, fn, cls){
    var b = document.createElement('button');
    b.className = cls || 'btn-next';
    b.textContent = label;
    b.addEventListener('click', fn);
    return b;
  }

  function goNext(){
    if(idx < TOTAL - 1){
      history.push(idx);
      idx++;
      render();
    }
  }
  function goBack(){
    if(history.length){
      idx = history.pop();
      render();
    }
  }

  function render(){
    window.scrollTo({top:0, behavior:'smooth'});
    updateBar();
    stageHost.innerHTML = '';
    var s = STEPS[idx];

    var stage = document.createElement('div');
    stage.className = 'stage';
    stageHost.appendChild(stage);

    if(s.kind === 'intro')   return renderIntro(stage, s);
    if(s.kind === 'final')   return renderFinal(stage, s);
    if(s.kind === 'choice')  return renderChoice(stage, s);
    if(s.kind === 'count')   return renderCount(stage, s);
    if(s.kind === 'spell')   return renderSpell(stage, s);
    if(s.kind === 'match')   return renderMatch(stage, s);
    if(s.kind === 'pick')    return renderPick(stage, s);
  }

  function header(stage, s){
    var tag = document.createElement('span');
    tag.className = 'step-tag';
    tag.textContent = 'ЗАЛ ' + (idx + 1) + ' / ' + TOTAL;
    stage.appendChild(tag);

    if(s.mech){
      var m = document.createElement('span');
      m.className = 'mech-tag';
      m.textContent = s.mech;
      stage.appendChild(m);
    }
    var hero = document.createElement('span');
    hero.className = 'hero';
    hero.textContent = s.emoji || '🖼️';
    stage.appendChild(hero);

    var h2 = document.createElement('h2');
    h2.textContent = s.title;
    stage.appendChild(h2);

    var p = document.createElement('div');
    p.className = 'task-text';
    p.innerHTML = bold(s.text);
    stage.appendChild(p);
  }

  function speakBlock(stage, s){
    if(!s.say) return;
    var line = document.createElement('div');
    line.className = 'speak-line';
    var big = document.createElement('button');
    big.className = 'speak-big';
    big.innerHTML = '🔊 ' + s.say;
    big.addEventListener('click', function(){ speak(s.say); });
    line.appendChild(big);
    stage.appendChild(line);
    if(s.sayRu){
      var r = document.createElement('div');
      r.className = 'task-text';
      r.style.marginTop = '-10px';
      r.textContent = s.sayRu;
      stage.appendChild(r);
    }
  }

  function feedback(stage, s, onWin){
    var fb = document.createElement('div');
    fb.className = 'fb';
    stage.appendChild(fb);

    var nav = document.createElement('div');
    nav.className = 'nav';

    var back = nextBtn('⬅️ Назад', goBack, 'btn-back');
    if(!history.length) back.disabled = true;
    nav.appendChild(back);

    var replay = nextBtn('🔁 Ещё раз', function(){ render(); }, 'btn-replay');
    nav.appendChild(replay);

    var next = nextBtn('Следующий зал ➡️', goNext);
    next.style.display = 'none';
    nav.appendChild(next);

    stage.appendChild(nav);

    function showGood(){
      fb.className = 'fb good show';
      fb.innerHTML = bold(s.ok || 'Отлично!');
      next.style.display = '';
      speak('Well done!', 250);
      if(onWin) onWin();
    }
    function showBad(){
      fb.className = 'fb bad show';
      fb.innerHTML = bold(s.no || 'Попробуй ещё раз!') +
        '<br><button class="again" type="button">🔁 Попробовать снова</button>';
      var ag = fb.querySelector('.again');
      ag.addEventListener('click', function(){ render(); });
      shakeStage();
      speak('Try again!', 200);
    }
    return {good:showGood, bad:showBad, next:next, back:back};
  }

  function renderIntro(stage, s){
    header(stage, s);
    speakBlock(stage, s);

    var cast = document.createElement('div');
    cast.className = 'start-screen';
    cast.innerHTML = '<div class="cast">🖼️ 🎨 🖊️ ✏️</div>';
    stage.appendChild(cast);

    var list = document.createElement('ul');
    ['Называть школьные вещи по-английски',
     'Описывать их цвет пятью словами',
     'Считать предметы от одного до десяти',
     'Строить полные фразы This is my... It is...',
     'Открыть свою первую выставку для посетителей'
    ].forEach(function(t){
      var li = document.createElement('li');
      li.textContent = t;
      list.appendChild(li);
    });
    stage.appendChild(list);

    var note = document.createElement('div');
    note.className = 'sound-note';
    note.innerHTML = '🔈 Включите звук на устройстве. Все фразы озвучены британским голосом и звучат чуть медленнее обычной речи.';
    stage.appendChild(note);

    var nav = document.createElement('div');
    nav.className = 'nav';
    nav.appendChild(nextBtn(s.cta || 'Начать ➡️', goNext));
    stage.appendChild(nav);

    speak(s.say, 500);
  }

  function renderChoice(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score++; updateBar(); });
    speakBlock(stage, s);

    var box = document.createElement('div');
    box.className = 'opts' + (s.opts.length > 3 ? ' grid2' : '');
    var navEl = stage.querySelector('.nav');
    stage.insertBefore(box, navEl);

    var locked = false;
    s.opts.forEach(function(o, i){
      var b = document.createElement('button');
      b.className = 'opt';
      b.type = 'button';
      var mk = document.createElement('span');
      mk.className = 'mark';
      mk.textContent = String.fromCharCode(65 + i);
      b.appendChild(mk);
      var tx = document.createElement('span');
      tx.innerHTML = bold(o.t);
      b.appendChild(tx);
      b.appendChild(speakerBtn(o.say || o.t.replace(/\/.*?\//g,'').replace(/—.*$/,'').trim(), 'speak-mini'));

      b.addEventListener('click', function(){
        if(locked) return;
        if(i === s.correct){
          locked = true;
          b.classList.add('correct');
          Array.prototype.forEach.call(box.children, function(x){ x.disabled = true; });
          speak(o.say || o.t, 120);
          setTimeout(fb.good, 650);
        } else {
          b.classList.add('wrong');
          setTimeout(function(){ b.classList.remove('wrong'); }, 600);
          fb.bad();
        }
      });
      box.appendChild(b);
    });
  }

  function renderCount(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score++; updateBar(); });
    var navEl = stage.querySelector('.nav');

    var cb = document.createElement('div');
    cb.className = 'countbox';
    var q = document.createElement('div');
    q.className = 'task-text';
    q.style.marginBottom = '10px';
    q.innerHTML = '<span class="en-inline">' + s.ask + '</span>';
    cb.appendChild(q);
    var ql = document.createElement('div');
    ql.className = 'speak-line';
    ql.style.margin = '0 0 12px';
    ql.appendChild(speakerBtn(s.ask, 'speak-mini', 'Прослушать вопрос'));
    cb.appendChild(ql);
    var it = document.createElement('div');
    it.className = 'items';
    it.textContent = s.items;
    cb.appendChild(it);
    stage.insertBefore(cb, navEl);

    speak(s.say, 600);

    var box = document.createElement('div');
    box.className = 'opts grid2';
    stage.insertBefore(box, navEl);

    var locked = false;
    s.opts.forEach(function(o, i){
      var b = document.createElement('button');
      b.className = 'opt'; b.type = 'button';
      b.style.justifyContent = 'center';
      b.innerHTML = bold(o.t);
      b.appendChild(speakerBtn(o.say, 'speak-mini'));
      b.addEventListener('click', function(){
        if(locked) return;
        if(i === s.correct){
          locked = true;
          b.classList.add('correct');
          Array.prototype.forEach.call(box.children, function(x){ x.disabled = true; });
          speak(o.say, 120);
          setTimeout(fb.good, 650);
        } else {
          b.classList.add('wrong');
          setTimeout(function(){ b.classList.remove('wrong'); }, 600);
          fb.bad();
        }
      });
      box.appendChild(b);
    });
  }

  function renderSpell(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score++; updateBar(); });
    var navEl = stage.querySelector('.nav');

    var hintLine = document.createElement('div');
    hintLine.className = 'speak-line';
    var hb = document.createElement('button');
    hb.className = 'speak-big';
    hb.innerHTML = s.hint + ' 🔊 Прослушать слово';
    hb.addEventListener('click', function(){ speak(s.word); });
    hintLine.appendChild(hb);
    stage.insertBefore(hintLine, navEl);
    speak(s.word, 600);

    var slots = document.createElement('div');
    slots.className = 'spell-slots';
    var slotEls = [];
    for(var i = 0; i < s.word.length; i++){
      var sl = document.createElement('div');
      sl.className = 'slot';
      slots.appendChild(sl);
      slotEls.push(sl);
    }
    stage.insertBefore(slots, navEl);

    var letters = s.word.split('');
    var extra = 'abcdefghijklmnopqrstuvwxyz'.split('');
    var pool = letters.slice();
    var need = Math.max(0, 6 - pool.length);
    for(var k = 0; k < need; k++){
      pool.push(extra[Math.floor(Math.random() * extra.length)]);
    }
    pool.sort(function(){ return Math.random() - 0.5; });

    var poolBox = document.createElement('div');
    poolBox.className = 'letter-pool';
    stage.insertBefore(poolBox, navEl);

    var pos = 0;
    var done = false;

    pool.forEach(function(ch){
      var b = document.createElement('button');
      b.className = 'letter'; b.type = 'button';
      b.textContent = ch;
      b.addEventListener('click', function(){
        if(done) return;
        if(ch === s.word[pos]){
          slotEls[pos].textContent = ch;
          slotEls[pos].classList.add('filled');
          b.classList.add('used');
          pos++;
          speak(ch, 0);
          if(pos === s.word.length){
            done = true;
            speak(s.word, 500);
            setTimeout(fb.good, 1200);
          }
        } else {
          slotEls[pos].classList.add('bad');
          b.classList.add('bad');
          (function(el, bt){
            setTimeout(function(){ el.classList.remove('bad'); bt.classList.remove('bad'); }, 500);
          })(slotEls[pos], b);
          fb.bad();
        }
      });
      poolBox.appendChild(b);
    });
  }

  function renderMatch(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score += 2; updateBar(); });
    var navEl = stage.querySelector('.nav');

    speakBlock(stage, s);

    var area = document.createElement('div');
    area.className = 'match-area';
    stage.insertBefore(area, navEl);

    var leftCol = document.createElement('div');
    leftCol.className = 'mcol';
    leftCol.innerHTML = '<h4>СЛОВО</h4>';
    var rightCol = document.createElement('div');
    rightCol.className = 'mcol';
    rightCol.innerHTML = '<h4>ЦВЕТ / ПРЕДМЕТ</h4>';
    area.appendChild(leftCol);
    area.appendChild(rightCol);

    var pairs = s.pairs.slice();
    var lefts  = pairs.map(function(p,i){ return {p:p, i:i}; });
    var rights = pairs.map(function(p,i){ return {p:p, i:i}; });
    rights.sort(function(){ return Math.random() - 0.5; });

    var selected = null;
    var matched = 0;
    var busy = false;

    lefts.forEach(function(o){
      var b = document.createElement('button');
      b.className = 'mitem'; b.type = 'button';
      b.textContent = o.p.left;
      b.appendChild(speakerBtn(o.p.say, 'speak-mini'));
      b.addEventListener('click', function(){
        if(busy || b.classList.contains('done') || b.classList.contains('sel')) return;
        if(selected && selected.side === 'left'){ selected.el.classList.remove('sel'); }
        selected = {side:'left', el:b, i:o.i};
        b.classList.add('sel');
        speak(o.p.say);
      });
      leftCol.appendChild(b);
      o.el = b;
    });

    rights.forEach(function(o){
      var b = document.createElement('button');
      b.className = 'mitem'; b.type = 'button';
      var pic = document.createElement('span');
      pic.className = 'pic';
      pic.textContent = o.p.right;
      b.appendChild(pic);
      b.appendChild(speakerBtn(o.p.say, 'speak-mini'));
      b.addEventListener('click', function(){
        if(busy || b.classList.contains('done')) return;
        speak(o.p.say);
        if(selected && selected.side === 'left'){
          busy = true;
          if(selected.i === o.i){
            selected.el.classList.remove('sel');
            selected.el.classList.add('done');
            b.classList.add('done');
            selected = null;
            matched++;
            speak('Yes!', 250);
            busy = false;
            if(matched === pairs.length){ setTimeout(fb.good, 900); }
          } else {
            selected.el.classList.add('bad');
            b.classList.add('bad');
            var a1 = selected.el, a2 = b;
            setTimeout(function(){
              a1.classList.remove('bad','sel');
              a2.classList.remove('bad');
              selected = null; busy = false;
            }, 650);
            fb.bad();
            shakeStage();
          }
        } else {
          if(selected && selected.side === 'right'){ selected.el.classList.remove('sel'); }
          selected = {side:'right', el:b, i:o.i};
          b.classList.add('sel');
        }
      });
      rightCol.appendChild(b);
      o.el = b;
    });
  }

  function renderPick(stage, s){
    header(stage, s);

    var fb = feedback(stage, s, function(){ score += 2; updateBar(); });
    var navEl = stage.querySelector('.nav');

    speakBlock(stage, s);

    var zone = document.createElement('div');
    zone.className = 'drag-zone';
    stage.insertBefore(zone, navEl);

    var chosenCount = 0;
    var correctCount = s.pool.filter(function(p){ return p.good; }).length;
    var busy = false;

    s.pool.forEach(function(item){
      var el = document.createElement('button');
      el.className = 'drag-item';
      el.type = 'button';
      el.innerHTML = bold(item.t);
      el.appendChild(speakerBtn(item.say, 'speak-mini'));

      el.addEventListener('click', function(){
        if(busy || el.classList.contains('chosen')) return;
        speak(item.say);
        if(item.good){
          el.classList.add('chosen');
          chosenCount++;
          if(chosenCount === correctCount){
            busy = true;
            setTimeout(fb.good, 800);
          }
        } else {
          el.classList.add('bad');
          setTimeout(function(){ el.classList.remove('bad'); }, 600);
          fb.bad();
          shakeStage();
        }
      });
      zone.appendChild(el);
    });
  }

  function renderFinal(stage, s){
    stage.innerHTML = '';
    var box = document.createElement('div');
    box.className = 'final';
    stage.appendChild(box);

    var big = document.createElement('span');
    big.className = 'big';
    big.textContent = 'OPEN';
    box.appendChild(big);

    var h = document.createElement('h2');
    h.textContent = s.title;
    box.appendChild(h);

    var p = document.createElement('p');
    p.textContent = s.text;
    box.appendChild(p);

    var line = document.createElement('div');
    line.className = 'speak-line';
    var big2 = document.createElement('button');
    big2.className = 'speak-big';
    big2.innerHTML = '🔊 ' + s.say;
    big2.addEventListener('click', function(){ speakSeq(['This is my gallery!', 'Welcome!', 'Well done, curator!']); });
    line.appendChild(big2);
    box.appendChild(line);

    var rw = document.createElement('div');
    rw.className = 'reward';
    var rt = document.createElement('div');
    rt.style.fontWeight = '700';
    rt.style.marginBottom = '10px';
    rt.style.color = '#7a1f2e';
    rt.textContent = '🖼️ Каталог выставки — весь словарь куратора:';
    rw.appendChild(rt);

    var wl = document.createElement('div');
    wl.className = 'words';
    s.allWords.forEach(function(w){
      var row = document.createElement('div');
      row.style.display = 'flex';
      row.style.alignItems = 'center';
      row.style.gap = '8px';
      row.style.padding = '3px 0';
      row.style.borderBottom = '1px dotted #b89460';
      var tx = document.createElement('span');
      tx.innerHTML = '<b>' + w.en + '</b> ' + w.ipa + ' — ' + w.ru;
      tx.style.flex = '1';
      row.appendChild(tx);
      row.appendChild(speakerBtn(w.en, 'speak-mini'));
      wl.appendChild(row);
    });
    rw.appendChild(wl);
    box.appendChild(rw);

    var st = document.createElement('p');
    st.innerHTML = '🖼️ Экспонатов развешено: <b>' + score + '</b><br>Выставку можно открыть ещё раз — хоть сегодня, хоть через неделю.';
    box.appendChild(st);

    var nav = document.createElement('div');
    nav.className = 'nav';
    var back = nextBtn('⬅️ Назад', goBack, 'btn-back');
    if(!history.length) back.disabled = true;
    nav.appendChild(back);
    nav.appendChild(nextBtn('🔁 Открыть заново', function(){
      idx = 0; history = []; score = 0; render();
    }, 'restart'));
    box.appendChild(nav);

    speakSeq(['This is my gallery!', 'Welcome!', 'Well done, curator!']);
  }

  render();

  if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = function(){ loadVoices(); };
  }
  document.addEventListener('click', function once(){
    loadVoices();
    document.removeEventListener('click', once);
  });

})();
</script>
</body>
</html>
